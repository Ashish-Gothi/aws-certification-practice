><strong>Same AZ</strong> traffic using private IPs is generally free or cheapest. Traffic <strong>between AZs</strong> costs a little. Traffic <strong>between Regions</strong> costs more.</li>\n<li>Putting Amazon CloudFront in front of content often lowers data-out costs, and traffic from an AWS origin to CloudFront is free.</li>\n</ul>\n<blockquote class=\"tip\">Exam shortcut: in is free, out is charged, and the farther the data travels, the more it costs.</blockquote>\n<h3 id=\"s-storage-costs\">Thinking about storage cost</h3>\n<p>The cheapest storage is the one that matches how often you read the data. S3 Standard is for frequently used data. Infrequent Access classes cost less to store but charge to retrieve. Glacier classes are very cheap for archives but slow or fee-based to retrieve. S3 Intelligent-Tiering moves objects for you when you cannot predict access. Lifecycle rules move data to cheaper classes automatically. Also remember EBS volumes you forgot to delete and unattached IPs still cost money.</p>\n<h3 id=\"s-org-billing\">Organizations and consolidated billing</h3>\n<ul>\n<li><strong>What it is:</strong> AWS Organizations lets you group many accounts under one management account with one bill.</li>\n<li><strong>Use it when:</strong> PulseWire has separate accounts for dev, prod and the video team.</li>\n<li><strong>Remember for the exam:</strong> Consolidated billing combines usage across accounts, so you reach volume discounts sooner, and unused Reserved Instance or Savings Plans discounts can be shared across accounts. It is free.</li>\n</ul>\n<h3 id=\"s-cost-tools\">Cost management tools</h3>\n<p>Many tools sound alike. Match each to its job.</p>\n<ul>\n<li><strong>Cost allocation tags.</strong> Labels such as <code>team=video</code> that you attach to resources. Activate them in billing and your reports can split costs by team or project. Two kinds: AWS-generated and user-defined.</li>\n<li><strong>AWS Budgets.</strong> Set a spending or usage target and get <strong>alerts</strong> when you are forecast to exceed it. It can also trigger actions.</li>\n<li><strong>AWS Cost Explorer.</strong> A visual tool to <strong>see and analyze</strong> past spending and forecast future spending, filtered by service, tag or account.</li>\n<li><strong>AWS Cost and Usage Report (CUR).</strong> The most detailed data, delivered as files to S3, for deep analysis.</li>\n<li><strong>AWS Pricing Calculator.</strong> <strong>Estimate</strong> the cost of a design <em>before</em> you build it.</li>\n<li><strong>AWS Billing Conductor.</strong> Lets you customize billing data to show back or charge back groups (for resellers or internal chargeback). Just recognize the name.</li>\n<li><strong>AWS Compute Optimizer.</strong> Uses usage data to recommend right-sized EC2, EBS, Lambda and similar resources.</li>\n<li><strong>AWS Trusted Advisor.</strong> Checks for idle or underused resources and other cost savings. Cost optimization is one of its categories; the full set of checks needs a Business or higher support plan.</li>\n<li><strong>AWS Marketplace.</strong> A catalog for buying third-party software that you can launch in AWS, with the charges added to your AWS bill.</li>\n</ul>\n<h3 id=\"s-common-traps\">Common traps</h3>\n<ul>\n<li><strong>Budgets vs Cost Explorer.</strong> Alert you when you cross a limit means Budgets. Look at and chart your spending means Cost Explorer.</li>\n<li><strong>Pricing Calculator vs Cost Explorer.</strong> Calculator is for future designs; Cost Explorer is for what you already spent.</li>\n<li><strong>Spot for critical databases.</strong> Spot can be interrupted, so it is wrong for workloads that cannot stop.</li>\n<li><strong>Capacity Reservation is not a discount.</strong> It only guarantees availability.</li>\n<li><strong>Standard vs Convertible RI.</strong> Convertible gives flexibility; Standard gives the deepest discount.</li>\n<li><strong>Data in is free.</strong> A question asking what is free often points to inbound data.</li>\n</ul>\n<h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>If the question says...                         -&gt; pick\nSteady workload, lowest price, 1-3 yr commit    -&gt; Reserved Instances / Savings Plans\nNeeds flexibility across families or Regions    -&gt; Compute Savings Plans\nInterruptible batch work, cheapest              -&gt; Spot Instances\nUnpredictable, short-term, no commitment        -&gt; On-Demand\nOwn physical server for licensing               -&gt; Dedicated Hosts\nGuarantee capacity in an AZ                     -&gt; Capacity Reservations\nAlert me before I overspend                     -&gt; AWS Budgets\nVisualize and forecast past costs               -&gt; Cost Explorer\nEstimate cost before building                   -&gt; Pricing Calculator\nSplit costs by team or project                  -&gt; Cost allocation tags\nRight-size underused instances                  -&gt; Compute Optimizer</code></pre>", "toc": [{"id": "pricing-basics", "text": "Pricing fundamentals"}, {"id": "ec2-purchasing", "text": "EC2 purchasing options"}, {"id": "data-transfer", "text": "Data transfer rules"}, {"id": "storage-costs", "text": "Thinking about storage cost"}, {"id": "org-billing", "text": "Organizations and consolidated billing"}, {"id": "cost-tools", "text": "Cost management tools"}, {"id": "common-traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch15", "ch": 15, "title": "Chapter 15: Getting Help (Support and Resources)", "short": "Who do we call at 2 a.m.?", "topic": "Support plans and AWS help resources", "d": 4, "focus": false, "mins": 6, "html": "<p>At 2 a.m. the video pipeline stopped working, and Kabir was staring at an error he had never seen. \"Can we just call someone?\" Meera asked, already worried about the morning's launch.</p>\n<p>You can, but who answers, and how fast, depends on the support plan you chose. This chapter covers the ways to get help from AWS and from the community.</p>\n<h3 id=\"s-support-plans\">AWS Support plans</h3>\n<p>There are five plans. At CLF depth, memorize who gets what.</p><div class=\"tw\"><table><thead><tr><th>Plan</th><th>Who it fits</th><th>Key features</th></tr></thead><tbody><tr><td><strong>Basic</strong></td><td>Everyone, free</td><td>Documentation, whitepapers, re:Post, Health Dashboard, limited Trusted Advisor checks. No technical support cases (billing and account cases only).</td></tr><tr><td><strong>Developer</strong></td><td>Testing and early development</td><td>Business-hours email access to Cloud Support Associates. General guidance (first response within 24 business hours); system impaired within 12 business hours.</td></tr><tr><td><strong>Business</strong></td><td>Production workloads</td><td>24/7 phone, chat and email with engineers. Production system impaired within 4 hours; production system down within 1 hour. <strong>Full Trusted Advisor checks.</strong></td></tr><tr><td><strong>Enterprise On-Ramp</strong></td><td>Important production, business-critical starters</td><td>Everything in Business, plus a pool of Technical Account Managers, a Concierge-style billing and account team, and business-critical system down within 30 minutes.</td></tr><tr><td><strong>Enterprise</strong></td><td>Business-critical, large scale</td><td>Everything above, plus a <strong>designated Technical Account Manager</strong>, and business-critical system down within 15 minutes.</td></tr></tbody></table></div>\n<ul>\n<li><strong>Remember for the exam:</strong> The Technical Account Manager is available on Enterprise On-Ramp (a pool) and Enterprise (designated). Full Trusted Advisor checks start at Business. 24/7 engineer access starts at Business. Business-critical response times belong to the Enterprise plans.</li>\n<li><strong>Who can open cases:</strong> On Basic, only account and billing cases. On Developer, one primary contact (and other users with permission) can open technical cases; Business and above allow unlimited contacts to open cases.</li>\n<li>Exact response times can change, so for the exam, remember the pattern: faster plans cost more and have faster response for more critical problems.</li>\n</ul>\n<h3 id=\"s-tam-and-support-center\">Technical Account Manager and Support Center</h3>\n<ul>\n<li><strong>Technical Account Manager (TAM).</strong> <strong>What it is:</strong> a named AWS expert who knows your environment. <strong>Use it when:</strong> you want proactive guidance, architecture reviews and a single point of contact for escalation. <strong>Remember:</strong> Enterprise level plans only.</li>\n<li><strong>AWS Support Center.</strong> <strong>What it is:</strong> the console page where you create and manage support cases and view your plan. <strong>Remember:</strong> this is where you open a technical case.</li>\n</ul>\n<h3 id=\"s-partners\">Partners and Marketplace</h3>\n<ul>\n<li><strong>AWS Partner Network (APN).</strong> A global community of consulting and technology companies that build on and sell AWS. <strong>Use it when:</strong> PulseWire wants an outside company to design or migrate a system.</li>\n<li><strong>AWS Marketplace.</strong> A digital catalog to find, try and buy third-party software and data, billed through AWS.</li>\n<li><strong>Remember for the exam:</strong> Partners are companies; Marketplace is the store.</li>\n</ul>\n<h3 id=\"s-expert-help\">Expert help from AWS</h3>\n<ul>\n<li><strong>AWS Professional Services.</strong> A team of AWS experts you can hire to help reach specific business outcomes, such as a cloud migration.</li>\n<li><strong>AWS IQ.</strong> A marketplace to hire AWS-certified freelance experts for a project. Think of it as finding a certified expert on demand.</li>\n<li><strong>Trusted Advisor.</strong> Gives best-practice checks across cost, performance, security, fault tolerance, service limits and operational excellence.</li>\n</ul>\n<h3 id=\"s-self-service\">Self-service learning and community</h3>\n<ul>\n<li><strong>AWS re:Post.</strong> A community question-and-answer site, free for everyone, where people and AWS experts answer questions.</li>\n<li><strong>AWS Knowledge Center.</strong> Articles answering the most common support questions, from real support cases.</li>\n<li><strong>Documentation and whitepapers.</strong> Official guides and deep technical papers, including the Well-Architected material. Free for all plans.</li>\n<li><strong>AWS Health Dashboard.</strong> Shows the status of AWS services and events that affect <em>your</em> resources. Use it when something is broken and you wonder if AWS is the cause.</li>\n</ul>\n<h3 id=\"s-abuse\">Reporting abuse</h3>\n<p>If you believe AWS resources are being used for spam, attacks or other illegal activity, report it to the <strong>AWS Trust and Safety</strong> team (the abuse report form or the abuse email address). It is not a support plan feature and is not a security tool; it is the place to report misuse.</p>\n<h3 id=\"s-common-traps\">Common traps</h3>\n<ul>\n<li><strong>Basic is not technical support.</strong> Basic offers account and billing help only.</li>\n<li><strong>TAM is not on Business.</strong> Look for Enterprise On-Ramp or Enterprise.</li>\n<li><strong>Professional Services vs IQ vs Partner.</strong> AWS's own experts, freelance certified experts, outside consulting companies.</li>\n<li><strong>re:Post vs Knowledge Center.</strong> Community Q and A versus curated support articles.</li>\n<li><strong>Health Dashboard vs Trusted Advisor.</strong> Events and outages versus best-practice recommendations.</li>\n</ul>\n<h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>If the question says...                        -&gt; pick\nFree, billing questions only                   -&gt; Basic support\nTesting, business-hours email                  -&gt; Developer support\nProduction workload, 24/7 phone and chat       -&gt; Business support\nFull Trusted Advisor checks, lowest plan       -&gt; Business support\nNamed expert who knows my account              -&gt; TAM (Enterprise)\nHire AWS experts for a migration               -&gt; Professional Services\nHire a certified freelancer                    -&gt; AWS IQ\nAsk the community                              -&gt; AWS re:Post\nIs AWS having an outage that affects me        -&gt; AWS Health Dashboard\nReport spam or abuse from AWS IPs              -&gt; AWS Trust and Safety\nFind third-party software to buy               -&gt; AWS Marketplace</code></pre>", "toc": [{"id": "support-plans", "text": "AWS Support plans"}, {"id": "tam-and-support-center", "text": "Technical Account Manager and Support Center"}, {"id": "partners", "text": "Partners and Marketplace"}, {"id": "expert-help", "text": "Expert help from AWS"}, {"id": "self-service", "text": "Self-service learning and community"}, {"id": "abuse", "text": "Reporting abuse"}, {"id": "common-traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "appendix", "ch": null, "title": "Appendix: Exam reflexes", "short": "Exam reflexes", "topic": "", "d": 0, "focus": false, "mins": 6, "html": "<p>Use this as your last review before the exam. Each row is a trigger phrase and the answer the exam usually wants. Read the tables, then test yourself by covering the right column.</p><h3 id=\"s-cloud-concepts\">Cloud Concepts</h3><div class=\"tw\"><table><thead><tr><th>When the question says...</th><th>Think...</th></tr></thead><tbody><tr><td>Trade upfront cost for variable cost</td><td>Benefit of cloud (pay as you go)</td></tr><tr><td>Scale up and down automatically to match demand</td><td>Elasticity</td></tr><tr><td>Handle growth by adding resources</td><td>Scalability</td></tr><tr><td>Deploy worldwide in minutes</td><td>Global reach and speed (Regions)</td></tr><tr><td>Survive the failure of one data center</td><td>Multiple Availability Zones, high availability</td></tr><tr><td>Survive the failure of a whole Region</td><td>Multi-Region, disaster recovery</td></tr><tr><td>Reduce guessing about capacity</td><td>Stop guessing capacity (cloud benefit)</td></tr><tr><td>Six pillars, design best practices</td><td>AWS Well-Architected Framework</td></tr><tr><td>Move out of a data center, plan the journey</td><td>AWS Cloud Adoption Framework / migration strategies (6 Rs)</td></tr><tr><td>Move as is without changes</td><td>Rehost (lift and shift)</td></tr><tr><td>Move to a managed service, replace the database</td><td>Replatform or refactor</td></tr><tr><td>Mix of on-premises and cloud</td><td>Hybrid cloud</td></tr><tr><td>Hardware you manage vs the provider manages</td><td>IaaS, PaaS, SaaS levels of responsibility</td></tr><tr><td>Fast to launch, low risk of experiments</td><td>Agility, innovate faster</td></tr><tr><td>Cost drops as AWS grows</td><td>Economies of scale</td></tr></tbody></table></div><h3 id=\"s-security-and-compliance\">Security and Compliance</h3><div class=\"tw\"><table><thead><tr><th>When the question says...</th><th>Think...</th></tr></thead><tbody><tr><td>Who secures the hardware and data centers</td><td>AWS (security OF the cloud)</td></tr><tr><td>Who configures access, data and firewalls</td><td>Customer (security IN the cloud)</td></tr><tr><td>Control who can do what</td><td>IAM policies, least privilege</td></tr><tr><td>Extra proof at sign-in</td><td>Multi-factor authentication (MFA)</td></tr><tr><td>Temporary credentials for services or apps</td><td>IAM roles</td></tr><tr><td>Single sign-on for many accounts and apps</td><td>IAM Identity Center</td></tr><tr><td>Manage keys for encryption</td><td>AWS KMS</td></tr><tr><td>Hardware keys dedicated to me</td><td>AWS CloudHSM</td></tr><tr><td>Store and rotate passwords and API keys</td><td>AWS Secrets Manager</td></tr><tr><td>Download compliance reports on demand</td><td>AWS Artifact</td></tr><tr><td>Block common web exploits like SQL injection</td><td>AWS WAF</td></tr><tr><td>Protect against DDoS attacks</td><td>AWS Shield (Advanced for extra support)</td></tr><tr><td>Find threats by analyzing logs and traffic</td><td>Amazon GuardDuty</td></tr><tr><td>Find sensitive data like personal information in S3</td><td>Amazon Macie</td></tr><tr><td>Scan servers and containers for vulnerabilities</td><td>Amazon Inspector</td></tr><tr><td>Who made this API call</td><td>AWS CloudTrail</td></tr><tr><td>Central security findings across accounts</td><td>AWS Security Hub</td></tr></tbody></table></div><h3 id=\"s-cloud-technology-and-services\">Cloud Technology and Services</h3><div class=\"tw\"><table><thead><tr><th>When the question says...</th><th>Think...</th></tr></thead><tbody><tr><td>Virtual servers</td><td>Amazon EC2</td></tr><tr><td>Run code without servers, pay per use</td><td>AWS Lambda</td></tr><tr><td>Run containers</td><td>Amazon ECS / EKS (Fargate for serverless)</td></tr><tr><td>Easiest way to deploy a web app</td><td>AWS Elastic Beanstalk</td></tr><tr><td>Simple, fixed-price starter servers</td><td>Amazon Lightsail</td></tr><tr><td>Object storage, unlimited, static website</td><td>Amazon S3</td></tr><tr><td>Hard drive attached to one EC2 instance</td><td>Amazon EBS</td></tr><tr><td>Shared file system for many Linux servers</td><td>Amazon EFS</td></tr><tr><td>Cheap archive for years</td><td>S3 Glacier classes</td></tr><tr><td>Managed relational (SQL) database</td><td>Amazon RDS / Aurora</td></tr><tr><td>Key-value NoSQL, single-digit millisecond</td><td>Amazon DynamoDB</td></tr><tr><td>Data warehouse, analytics queries</td><td>Amazon Redshift</td></tr><tr><td>In-memory cache</td><td>Amazon ElastiCache</td></tr><tr><td>Private network in AWS</td><td>Amazon VPC</td></tr><tr><td>DNS and routing</td><td>Amazon Route 53</td></tr><tr><td>Cache content close to users</td><td>Amazon CloudFront</td></tr><tr><td>Dedicated private line to AWS</td><td>AWS Direct Connect</td></tr><tr><td>Encrypted tunnel over the internet to AWS</td><td>Site-to-Site VPN</td></tr><tr><td>Monitor metrics and alarms</td><td>Amazon CloudWatch</td></tr><tr><td>Record resource configuration changes</td><td>AWS Config</td></tr><tr><td>Distribute traffic across servers</td><td>Elastic Load Balancing</td></tr><tr><td>Add or remove servers automatically</td><td>EC2 Auto Scaling</td></tr><tr><td>Build, train and deploy ML models</td><td>Amazon SageMaker AI</td></tr><tr><td>Foundation models and generative AI apps</td><td>Amazon Bedrock</td></tr></tbody></table></div><h3 id=\"s-billing-pricing-and-support\">Billing, Pricing and Support</h3><div class=\"tw\"><table><thead><tr><th>When the question says...</th><th>Think...</th></tr></thead><tbody><tr><td>Steady workload, big discount for commitment</td><td>Reserved Instances or Savings Plans</td></tr><tr><td>Interruptible, cheapest compute</td><td>Spot Instances</td></tr><tr><td>No commitment, unpredictable</td><td>On-Demand</td></tr><tr><td>Own physical server for licenses</td><td>Dedicated Hosts</td></tr><tr><td>Alert when spending passes a limit</td><td>AWS Budgets</td></tr><tr><td>Chart and forecast past spending</td><td>AWS Cost Explorer</td></tr><tr><td>Estimate cost of a new design</td><td>AWS Pricing Calculator</td></tr><tr><td>Most detailed billing data</td><td>Cost and Usage Report</td></tr><tr><td>Split costs by team or project</td><td>Cost allocation tags</td></tr><tr><td>Combine bills, share volume discounts</td><td>AWS Organizations consolidated billing</td></tr><tr><td>Right-size recommendations</td><td>AWS Compute Optimizer</td></tr><tr><td>Best-practice checks including cost</td><td>AWS Trusted Advisor</td></tr><tr><td>Data into AWS</td><td>Free</td></tr><tr><td>Named expert for my account</td><td>TAM (Enterprise On-Ramp and Enterprise)</td></tr><tr><td>24/7 engineer support in production, lowest plan</td><td>Business support</td></tr><tr><td>Hire AWS experts for a project</td><td>Professional Services</td></tr><tr><td>Hire a certified freelancer</td><td>AWS IQ</td></tr><tr><td>Buy third-party software through AWS</td><td>AWS Marketplace</td></tr></tbody></table></div><h3 id=\"s-common-look-alikes\">Common look-alikes</h3><div class=\"tw\"><table><thead><tr><th>Pair or group</th><th>How to tell them apart</th></tr></thead><tbody><tr><td>Security group vs network ACL</td><td>Security group is stateful and sits at the instance (allow rules only). NACL is stateless and sits at the subnet (allow and deny).</td></tr><tr><td>CloudWatch vs CloudTrail vs Config</td><td>CloudWatch: how is it performing (metrics, alarms). CloudTrail: who did what (API calls). Config: what changed and is it compliant (resource configuration).</td></tr><tr><td>Inspector vs GuardDuty vs Macie</td><td>Inspector scans for vulnerabilities. GuardDuty detects threats. Macie finds sensitive data in S3.</td></tr><tr><td>Shield vs WAF</td><td>Shield stops DDoS floods. WAF filters web requests (SQL injection, cross-site scripting).</td></tr><tr><td>Budgets vs Cost Explorer</td><td>Budgets sets limits and alerts. Cost Explorer analyzes and forecasts.</td></tr><tr><td>SQS vs SNS vs EventBridge</td><td>SQS is a queue (pull). SNS is publish and subscribe (push). EventBridge routes events between services by rules.</td></tr><tr><td>EBS vs EFS vs S3</td><td>EBS is a disk for one instance. EFS is a shared file system. S3 is object storage over the web.</td></tr><tr><td>Reserved vs Savings Plans</td><td>Reserved Instances commit to specific instance configuration. Savings Plans commit to dollars per hour and are more flexible.</td></tr><tr><td>Direct Connect vs VPN</td><td>Direct Connect is a private physical line. VPN is encrypted over the public internet.</td></tr><tr><td>IAM user vs role</td><td>User is a long-term identity for a person. Role gives temporary permissions to be assumed.</td></tr><tr><td>Professional Services vs IQ vs Partner Network</td><td>AWS own experts vs freelance certified experts vs outside consulting companies.</td></tr><tr><td>Region vs AZ vs edge location</td><td>Region is a geographic area. AZ is a data center group in a Region. Edge locations cache content for CloudFront.</td></tr></tbody></table></div><h3 id=\"s-exam-day-tips\">Exam day tips</h3>\n<ul>\n<li><strong>65 questions in 90 minutes.</strong> That gives about 80 seconds per question, so keep moving.</li>\n<li><strong>Some questions are unscored.</strong> AWS includes unscored questions to test new ones, and you cannot tell which. Treat every question as if it counts.</li>\n<li><strong>Flag and return.</strong> If you are unsure, pick your best answer, flag it and move on. Use leftover time to review.</li>\n<li><strong>Eliminate wrong answers.</strong> Remove options you know are wrong; with two left, the odds are much better.</li>\n<li><strong>Read the keywords.</strong> Look for words like cheapest, most secure, least operational effort, highly available and fault tolerant. They point to the answer.</li>\n<li><strong>Do not skip.</strong> There is no penalty for guessing, so answer every question.</li>\n<li><strong>Think concept, not configuration.</strong> This exam asks what a service is for, not how to set it up.</li>\n</ul>", "toc": [{"id": "cloud-concepts", "text": "Cloud Concepts"}, {"id": "security-and-compliance", "text": "Security and Compliance"}, {"id": "cloud-technology-and-services", "text": "Cloud Technology and Services"}, {"id": "billing-pricing-and-support", "text": "Billing, Pricing and Support"}, {"id": "common-look-alikes", "text": "Common look-alikes"}, {"id": "exam-day-tips", "text": "Exam day tips"}]}];

/* ---------- question rendering ---------- */
const ORD={}; // qid -> option order for instant mode
function optOrder(q,fixed){ if(fixed) return fixed; if(!ORD[q.id]) ORD[q.id]=perm(q.o.length); return ORD[q.id]; }
function qHTML(q,o){
  // o: {order, sel:[orig idx], reveal:bool, num, total, mode:'instant'|'exam'|'review', flagged}
  const multi=q.a.length>1, ord=o.order, sel=o.sel||[];
  const opts=ord.map((oi,pos)=>{
    const isSel=sel.includes(oi), isAns=q.a.includes(oi);
    let cls="opt"+(multi?" multi":"");
    if(o.reveal){ if(isAns) cls+=" right"; else if(isSel) cls+=" wrong"; }
    const why=o.reveal?`<span class="why"><b>${isAns?"Correct.":"Incorrect."}</b> ${esc(q.w[oi])}</span>`:"";
    return `<button type="button" class="${cls}" role="${multi?"checkbox":"radio"}" aria-checked="${isSel}" data-oi="${oi}" ${o.reveal?"disabled":""}><span class="ltr">${"ABCDE"[pos]}</span><span>${esc(q.o[oi])}${why}</span></button>`;
  }).join("");
  const meta=`<div class="qmeta">${o.num?`<span class="mono">Question ${o.num}${o.total?" of "+o.total:""}</span>`:""}${o.showDomain!==false?dtag(q.d):""}${o.flagged?'<span style="color:var(--amber)">Flagged</span>':""}</div>`;
  let after="";
  if(o.reveal){
    const ok=same(sel,q.a);
    if(o.mode!=="review") after+=`<div class="verdict ${ok?"ok":"bad"}">${ok?"Correct":sel.length?"Not quite":"Not answered"}</div>`;
    else after+=`<div class="verdict ${ok?"ok":"bad"}">${ok?"You answered correctly":sel.length?"You answered incorrectly":"You did not answer"}</div>`;
    after+=`<div class="reflex"><b>Exam reflex:</b> ${esc(q.k)}</div>`;
  }
  return `<div class="qcard" data-qid="${q.id}">${meta}<p class="qtext">${esc(q.q)}</p>${multi?`<p class="qsel">Select ${NUMW[q.a.length]}.</p>`:'<div style="height:12px"></div>'}<div class="opts" role="${multi?"group":"radiogroup"}" aria-label="Answer options">${opts}</div>${o.reveal?`<div style="margin-top:16px">${after}</div>`:""}${o.actions?`<div class="qact">${o.actions}</div>`:""}</div>`;
}
function toggleSel(q,sel,oi){
  sel=sel.slice();
  if(q.a.length>1){ const i=sel.indexOf(oi); if(i>=0) sel.splice(i,1); else { if(sel.length>=q.a.length) sel.shift(); sel.push(oi);} }
  else sel=[oi];
  return sel;
}

/* ---------- instant-check question widget (lessons, practice) ---------- */
function mountInstant(container,q,opts){
  let sel=[], revealed=false; const ord=optOrder(q);
  const draw=()=>{
    const need=q.a.length;
    const actions=revealed
      ? (opts.next?`<button class="btn primary" data-act="next">${opts.nextLabel||"Next question"}</button>`:"")
      : `<button class="btn primary" data-act="check" ${sel.length===need?"":"disabled"}>Check answer</button>${need>1?`<span class="muted" style="font-size:14px">${sel.length} of ${need} selected</span>`:""}`;
    container.innerHTML=qHTML(q,{order:ord,sel,reveal:revealed,num:opts.num,total:opts.total,mode:"instant",actions});
  };
  container.addEventListener("click",e=>{
    const b=e.target.closest(".opt"); if(b&&!revealed){ sel=toggleSel(q,sel,+b.dataset.oi); draw(); const nb=container.querySelector(`.opt[data-oi="${b.dataset.oi}"]`); nb&&nb.focus(); return; }
    const a=e.target.closest("[data-act]"); if(!a) return;
    if(a.dataset.act==="check"){ revealed=true; S.prac[q.id]={c:same(sel,q.a),t:Date.now()}; save(); draw(); opts.onCheck&&opts.onCheck(same(sel,q.a)); }
    if(a.dataset.act==="next"){ opts.next(); }
  });
  container._key=k=>{
    if(!revealed){ const n="12345".indexOf(k)>=0?"12345".indexOf(k):"abcde".indexOf(k.toLowerCase()); if(n>=0&&n<ord.length){ sel=toggleSel(q,sel,ord[n]); draw(); return true;} if(k==="Enter"&&sel.length===q.a.length){ revealed=true; S.prac[q.id]={c:same(sel,q.a),t:Date.now()}; save(); draw(); opts.onCheck&&opts.onCheck(same(sel,q.a)); return true;} }
    else if(k==="Enter"&&opts.next){ opts.next(); return true; }
    return false;
  };
  draw();
}

    const fl=R.order.filter(id=>R.flag[id]).length;
    body=`<h1 style="font-size:28px;font-weight:600;margin-bottom:8px">Review before you submit</h1><p class="muted" style="margin:0 0 20px">${answered} answered, ${n-answered} unanswered, ${fl} flagged. Select a number to go back to it.</p>
    <div class="grid-nav">${R.order.map((id,i)=>`<button class="${(R.ans[id]||[]).length?"ans":""} ${R.flag[id]?"flg":""}" data-goto="${i}" aria-label="Question ${i+1}${R.flag[id]?", flagged":""}${(R.ans[id]||[]).length?", answered":", unanswered"}">${i+1}</button>`).join("")}</div>
    <div class="legend"><span><i style="background:var(--accent-soft);border-color:var(--accent)"></i>Answered</span><span><i></i>Unanswered</span><span><i style="background:var(--amber);border-color:var(--amber);border-radius:50%;width:8px;height:8px"></i>Flagged</span></div>
    <div class="qact" style="margin-top:28px">${n-answered?`<button class="btn" data-act="first-un">Go to first unanswered</button>`:""}${fl?`<button class="btn" data-act="first-fl">Go to first flagged</button>`:""}<button class="btn primary" data-act="submit">Submit exam</button></div>`;
  } else {
    body=`<div id="eq"></div><details class="navpanel"><summary class="muted" style="cursor:pointer;font-size:14px">Question navigator</summary><div style="margin-top:12px" class="grid-nav">${R.order.map((id,i)=>`<button class="${(R.ans[id]||[]).length?"ans":""} ${R.flag[id]?"flg":""} ${i===R.i?"cur":""}" data-goto="${i}">${i+1}</button>`).join("")}</div></details>`;
  }
  const foot=rev?"":`<div class="efoot"><div class="wrap"><button class="btn" data-act="prev" ${R.i===0?"disabled":""}>Previous</button><button class="btn flagbtn" data-act="flag" aria-pressed="${!!R.flag[q.id]}">${R.flag[q.id]?"Flagged":"Flag for review"}</button><span class="sp"></span>${R.i===n-1?`<button class="btn primary" data-act="review">Review and submit</button>`:`<button class="btn primary" data-act="next">Next</button>`}</div></div>`;
  return `<div class="exam">${head}<div class="ebody"><div class="wrap">${body}</div></div>${foot}</div>
  <dialog id="dlg"><div class="db"><h2>Submit your exam?</h2><p class="muted" id="dlgt" style="margin:0"></p></div><div class="da"><button class="btn" data-act="cancel">Keep working</button><button class="btn primary" data-act="confirm">Submit exam</button></div></dialog>`;
}
function afterExam(){
  const R=S.run; if(!R) return;
  const tEl=$("#timer");
  const tick=()=>{const left=R.start+R.dur-Date.now(); if(tEl){tEl.textContent=fmtT(left); tEl.classList.toggle("low",left<10*60000);} if(left<=0){ submitMock(true);} };
  tick(); TICK=setInterval(tick,1000); cleanup.push(()=>clearInterval(TICK));
  const eq=$("#eq");
  if(eq){
    const q=ALLQ[R.order[R.i]];
    const draw=()=>{eq.innerHTML=qHTML(q,{order:R.opt[q.id],sel:R.ans[q.id]||[],num:R.i+1,total:R.order.length,showDomain:false,flagged:R.flag[q.id]}); };
    draw();
    eq.onclick=e=>{const b=e.target.closest(".opt"); if(!b) return; R.ans[q.id]=toggleSel(q,R.ans[q.id]||[],+b.dataset.oi); save(); draw(); const nb=eq.querySelector(`.opt[data-oi="${b.dataset.oi}"]`); nb&&nb.focus(); refreshNav();};
    eq._key=k=>{const ix="12345".indexOf(k)>=0?"12345".indexOf(k):"abcde".indexOf(k.toLowerCase()); if(ix>=0&&ix<q.o.length){R.ans[q.id]=toggleSel(q,R.ans[q.id]||[],R.opt[q.id][ix]);save();draw();refreshNav();return true;} return false;};
  }
  const go=i=>{R.i=i;R.review=false;save();render(true);};
  $("#app").addEventListener("click",examClick); cleanup.push(()=>$("#app").removeEventListener("click",examClick));
  function examClick(e){
    const g=e.target.closest("[data-goto]"); if(g){go(+g.dataset.goto);return;}
    const a=e.target.closest("[data-act]"); if(!a) return;
    const act=a.dataset.act, n=R.order.length;
    if(act==="next"&&R.i<n-1) go(R.i+1);
    if(act==="prev"&&R.i>0) go(R.i-1);
    if(act==="flag"){const id=R.order[R.i]; R.flag[id]=!R.flag[id]; save(); render(true);}
    if(act==="review"){R.review=!R.review; save(); render(true);}
    if(act==="first-un"){const i=R.order.findIndex(id=>!(R.ans[id]||[]).length); if(i>=0) go(i);}
    if(act==="first-fl"){const i=R.order.findIndex(id=>R.flag[id]); if(i>=0) go(i);}
    if(act==="submit"){ const un=R.order.filter(id=>!(R.ans[id]||[]).length).length, fl=R.order.filter(id=>R.flag[id]).length;
      $("#dlgt").textContent=(un?`${un} question${un>1?"s are":" is"} unanswered and will score zero. `:"All questions are answered. ")+(fl?`${fl} still flagged. `:"")+"You can’t change answers after submitting.";
      const dl=$("#dlg"); dl.showModal?dl.showModal():(confirm($("#dlgt").textContent)&&submitMock()); }
    if(act==="cancel") $("#dlg").close();
    if(act==="confirm"){ $("#dlg").close(); submitMock(); }
  }
  function refreshNav(){ $$(".grid-nav button").forEach(b=>{const id=R.order[+b.dataset.goto]; b.classList.toggle("ans",!!(R.ans[id]||[]).length);}); const c=$(".count"); if(c) c.textContent=`Question ${R.i+1} of ${R.order.length} · ${R.order.filter(id=>(R.ans[id]||[]).length).length} answered`; }
}
function submitMock(timeout){
  const R=S.run; if(!R) return;
  const by={1:{c:0,t:0},2:{c:0,t:0},3:{c:0,t:0},4:{c:0,t:0}}; let c=0;
  R.order.forEach(id=>{const q=ALLQ[id]; by[q.d].t++; if(same(R.ans[id]||[],q.a)){by[q.d].c++;c++;}});
  const t=R.order.length, sc=scaled(c,t);
  S.attempts.push({id:R.id,date:Date.now(),c,t,scaled:sc,pass:sc>=PASS,by,ans:R.ans,flag:R.flag,order:R.order,opt:R.opt,used:Math.min(R.dur,Date.now()-R.start),timeout:!!timeout});
  S.run=null; save(); location.hash="result-"+(S.attempts.length-1);
}
let RF="all";
function vResult(i){
  const a=S.attempts[i]; if(!a) return vMock();
  const pct=(a.scaled-100)/900*100, pm=(PASS-100)/900*100;
  const items=a.order.map((id,k)=>({id,k,q:ALLQ[id],sel:a.ans[id]||[],ok:same(a.ans[id]||[],ALLQ[id].a),fl:!!a.flag[id]}));
  const shown=items.filter(x=>RF==="all"||(RF==="wrong"&&!x.ok)||(RF==="flag"&&x.fl));
  const wrongN=items.filter(x=>!x.ok).length, flN=items.filter(x=>x.fl).length;
  const weak=[1,2,3,4].filter(d=>a.by[d].c/a.by[d].t<.7).sort((x,y)=>a.by[x].c/a.by[x].t-a.by[y].c/a.by[y].t).slice(0,2);
  return chrome("mock",`<div class="wrap"><div class="phead"><div class="crumb"><a href="#mock">CLF-C02 / Mock exam</a> / <b>Result</b></div><h1>${a.pass?"You passed this mock":"Not a pass yet"}</h1><p>${a.timeout?"Time ran out and the exam was submitted automatically. ":""}${a.pass?(a.scaled>=800?"A comfortable margin. Review your misses, and you’re in good shape to book.":"You cleared the bar, but the margin is thin. Review every miss and retake before booking."):"Use the domain report to pick what to study, review each miss below, then retake."}</p></div>
  <div class="score"><div><div class="big">${a.scaled}<small> / 1,000</small></div><div style="margin-top:8px"><span class="pill ${a.pass?"ok":"bad"}">${a.pass?"Pass":"Fail"}</span> <span class="muted" style="font-size:14px;margin-left:6px">${a.c} of ${a.t} correct · ${fmtT(a.used)} used</span></div></div>
   <div><div class="scale"><i style="width:${pct}%;background:${a.pass?"var(--ok)":"var(--bad)"}"></i><span class="pm" style="left:${pm}%" title="Pass mark 700"></span></div><div class="scale-l"><span style="left:0">100</span><span style="left:${pm}%;transform:translateX(-50%)">700 to pass</span><span style="right:0">1,000</span></div></div></div>
  <h2 style="font-size:22px;margin:40px 0 6px">Domain report</h2><p class="muted" style="margin:0 0 16px">Like the real score report: 70% or more in a domain meets competencies.</p>
  <div class="panel"><div class="dbars">${[1,2,3,4].map(d=>{const p=a.by[d].c/a.by[d].t;return `<div class="dbar"><div class="lb"><span>${DOMAINS[d].name} <span class="pill ${p>=.7?"ok":"bad"}" style="margin-left:6px">${p>=.7?"Meets competencies":"Needs improvement"}</span></span><span>${a.by[d].c} / ${a.by[d].t}</span></div><div class="bar"><i style="width:${p*100}%;background:${DCOL(d)}"></i></div></div>`;}).join("")}</div>
  ${weak.length?`<p style="margin:20px 0 0;font-size:15px">Study next, starting with your weakest ${weak.length>1?"domains":"domain"}: ${L.filter(l=>weak.includes(l.d)&&l.ch).map(l=>`<a href="#learn-${l.id}">Ch ${l.ch}</a>`).join(", ")}, then <a href="#practice">drill those domains</a>.</p>`:""}</div>
  <h2 style="font-size:22px;margin:40px 0 14px">Review answers</h2>
  <div class="toolbar"><button class="chip" aria-pressed="${RF==="all"}" data-rf="all">All ${items.length}</button><button class="chip" aria-pressed="${RF==="wrong"}" data-rf="wrong">Incorrect ${wrongN}</button><button class="chip" aria-pressed="${RF==="flag"}" data-rf="flag">Flagged ${flN}</button></div>
  <div class="rv">${shown.length?shown.map(x=>`<details><summary><span class="n">${x.k+1}</span><span class="q">${esc(x.q.q)}</span><span class="pill ${x.ok?"ok":"bad"}">${x.ok?"Correct":x.sel.length?"Incorrect":"Unanswered"}</span></summary>${qHTML(x.q,{order:a.opt[x.id],sel:x.sel,reveal:true,mode:"review",flagged:x.fl})}</details>`).join(""):`<div class="empty">Nothing in this filter.</div>`}</div>
  <div class="qact" style="margin-top:28px"><a class="btn primary" href="#mock">Back to mock exam</a></div></div>`);
}
function afterResult(){ $$("[data-rf]").forEach(b=>b.addEventListener("click",()=>{RF=b.dataset.rf;render(true);})); }

/* ---------- router ---------- */
let cleanup=[];
function render(keepScroll){
  cleanup.forEach(f=>f()); cleanup=[];
  const h=decodeURIComponent(location.hash.slice(1));
  const y=window.scrollY;
  let html, after=()=>{};
  if(h===""||h==="home"){html=vHome();}
  else if(h==="learn"){html=vLearn();}
  else if(h.startsWith("learn-")){const id=h.slice(6); html=vLesson(id); after=()=>afterLesson(id);}
  else if(h==="diagnostic"){html=vDiag(); after=afterDiag;}
  else if(h==="practice"){html=vPractice(); after=afterPractice;}
  else if(h==="mock"){html=vMock(); after=afterMock;}
  else if(h==="exam"){ if(S.run){html=vExam(); after=afterExam;} else {html=vMock(); after=afterMock;} }
  else if(h.startsWith("result-")){RF=RF||"all"; html=vResult(+h.slice(7)); after=afterResult;}
  else {html=vHome();}
  $("#app").innerHTML=html; after();
  window.scrollTo(0,keepScroll?y:0);
  const t=$("h1"); document.title=(t&&h?t.textContent.trim()+" — ":"")+"CLF-C02 Path";
}
let lastHash=null;
window.addEventListener("hashchange",()=>{ const h=location.hash; if(!h.startsWith("#result-")) RF="all"; if(h==="#diagnostic"&&DG&&DG.done) {} render(); lastHash=h; });
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return; const tg=e.target.tagName; if(tg==="INPUT"||tg==="TEXTAREA") return;
  if(document.querySelector("dialog[open]")) return;
  const host=$("#eq")||$("#pq")||$("#dq");
  if(host&&host._key&&host._key(e.key)){e.preventDefault();return;}
  if($("#eq")){ if(e.key==="ArrowRight"){const b=$('[data-act="next"]');b&&b.click();} if(e.key==="ArrowLeft"){const b=$('[data-act="prev"]');b&&b.click();} if(e.key==="f"||e.key==="F"){const b=$('[data-act="flag"]');b&&b.click();} }
});
document.addEventListener("click",e=>{const d=document.querySelector(".certsw[open]");if(d&&!d.contains(e.target))d.removeAttribute("open");});
(function(){try{const t=localStorage.getItem("saa-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}})();
document.addEventListener("click",e=>{
  const t=e.target.closest('[data-act="theme"]');
  if(t){const r=document.documentElement;const cur=r.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");const nx=cur==="dark"?"light":"dark";r.dataset.theme=nx;try{localStorage.setItem("saa-theme",nx);}catch(_){}}
  const sb=e.target.closest('[data-act="sb"]'); if(sb){SBC=!SBC;const sh=$(".shell");sh&&sh.classList.toggle("collapsed",SBC);sb.setAttribute("aria-label",(SBC?"Show":"Hide")+" curriculum");}
});
render();
})();
</script>
</body>
