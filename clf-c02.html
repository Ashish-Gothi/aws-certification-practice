ay we're secure?\" Because auditors want evidence. This chapter covers the tools that watch for trouble and the ones that prove compliance.</p><h3 id=\"s-threat-detection\">Spotting trouble: the detection services</h3><p><strong>Amazon GuardDuty</strong></p><ul><li><strong>What it is:</strong> a threat detection service that watches your account activity, network traffic and DNS logs, using machine learning to flag suspicious behavior.</li><li><strong>Use it when:</strong> you want always-on detection of compromised accounts, odd logins or crypto-mining without installing agents.</li><li><strong>Remember for the exam:</strong> Keywords: \"intelligent threat detection\", \"malicious activity\".</li></ul><p><strong>Amazon Inspector</strong></p><ul><li><strong>What it is:</strong> an automated vulnerability scanner for EC2 instances, container images and Lambda functions.</li><li><strong>Use it when:</strong> you want to find known software flaws and unintended network exposure.</li><li><strong>Remember for the exam:</strong> Keyword: \"vulnerabilities\" in your workloads.</li></ul><p><strong>Amazon Macie</strong></p><ul><li><strong>What it is:</strong> uses machine learning to discover and protect sensitive data, such as personal information, in S3.</li><li><strong>Use it when:</strong> you must know where PII lives in your buckets.</li><li><strong>Remember for the exam:</strong> Keyword: \"sensitive data in S3\".</li></ul><p><strong>AWS Security Hub</strong></p><ul><li><strong>What it is:</strong> a central dashboard that collects findings from GuardDuty, Inspector, Macie and others, and checks your setup against security standards.</li><li><strong>Use it when:</strong> you want one view of your security posture across accounts.</li><li><strong>Remember for the exam:</strong> Keywords: \"central view\", \"aggregate findings\".</li></ul><p><strong>Amazon Detective</strong></p><ul><li><strong>What it is:</strong> helps you investigate the root cause of a security finding by linking logs and activity into easy visuals.</li><li><strong>Use it when:</strong> GuardDuty flagged something and you need to dig into what happened.</li><li><strong>Remember for the exam:</strong> Keyword: \"investigate\" or \"root cause\".</li></ul><h3 id=\"s-logging-config\">Recording what happened: CloudTrail, Config, CloudWatch</h3><p><strong>AWS CloudTrail</strong></p><ul><li><strong>What it is:</strong> records API calls and actions in your account: who did what, when and from where.</li><li><strong>Use it when:</strong> you need an audit trail, or must find out who deleted a resource.</li><li><strong>Remember for the exam:</strong> Think \"who did it\". It is enabled by default with 90 days of event history. Create a trail to keep logs longer in S3.</li></ul><p><strong>AWS Config</strong></p><ul><li><strong>What it is:</strong> tracks the configuration of your resources over time and checks them against rules.</li><li><strong>Use it when:</strong> you want to know what changed and whether resources follow policy, such as \"all buckets must be encrypted\".</li><li><strong>Remember for the exam:</strong> Think \"what changed and is it compliant\".</li></ul><p><strong>Amazon CloudWatch</strong> (a mention): monitors performance metrics, logs and alarms. It answers \"how is it running\", not \"who did it\".</p><h3 id=\"s-proving-compliance\">Proving compliance: Audit Manager and Artifact</h3><p><strong>AWS Audit Manager</strong></p><ul><li><strong>What it is:</strong> continuously collects evidence from your AWS usage and helps build audit-ready reports.</li><li><strong>Use it when:</strong> you must prepare for your own audit and gather proof that your controls work.</li><li><strong>Remember for the exam:</strong> Think \"automate evidence collection for audits\".</li></ul><p><strong>AWS Artifact</strong></p><ul><li><strong>What it is:</strong> a self-service portal to download AWS's own compliance reports (such as SOC and ISO reports) and to review and accept agreements (such as a BAA for HIPAA).</li><li><strong>Use it when:</strong> an auditor or customer wants proof that AWS itself is compliant.</li><li><strong>Remember for the exam:</strong> Artifact is about AWS's compliance documents. Audit Manager is about your own evidence.</li></ul><h3 id=\"s-compliance-residency\">Compliance programs, data residency and Trusted Advisor</h3><p>AWS supports many compliance programs, including SOC, ISO 27001, PCI DSS, HIPAA eligibility and GDPR-related support. Passing them is a shared job: AWS certifies its infrastructure, but you must configure your own workloads correctly.</p><p><strong>Data residency:</strong> data stays in the Region you choose and AWS does not move it elsewhere unless you tell it to. This helps meet local laws about where data may be stored.</p><p><strong>AWS Trusted Advisor</strong> inspects your account against best practices in categories like cost optimization, performance, security, fault tolerance, service limits and operational excellence. Security checks include open security group ports, public S3 buckets, missing MFA on root and exposed access keys. The full set of checks needs a Business, Enterprise On-Ramp or Enterprise support plan. Basic and Developer plans get a limited set of core checks.</p><h3 id=\"s-support-policies\">Security resources, pen testing and abuse reporting</h3><ul><li><strong>AWS Security Blog:</strong> news, announcements and guidance from AWS security teams.</li><li><strong>AWS Knowledge Center:</strong> answers to common support questions, including security ones.</li><li><strong>AWS Support:</strong> open a case for help. Higher plans give faster responses.</li><li><strong>Penetration testing:</strong> you may test your own resources for eight listed services (such as EC2 and RDS) <em>without prior approval</em>, but you may not run DDoS simulation or flooding attacks unless you follow AWS's DDoS simulation testing policy.</li><li><strong>Reporting abuse:</strong> if you think AWS resources are being used for spam, malware or attacks, report it to the AWS Trust &amp; Safety team using the abuse form or email.</li></ul><h3 id=\"s-common-traps\">Common traps</h3><ul><li><strong>CloudTrail vs Config:</strong> CloudTrail is who did what. Config is how resources changed and whether they comply.</li><li><strong>CloudTrail vs CloudWatch:</strong> trail is audit of API calls. CloudWatch is performance and alarms.</li><li><strong>GuardDuty vs Inspector:</strong> GuardDuty finds active threats. Inspector finds software vulnerabilities.</li><li><strong>Macie vs GuardDuty:</strong> Macie is about sensitive data in S3.</li><li><strong>Artifact vs Audit Manager:</strong> Artifact gives AWS's reports. Audit Manager gathers your evidence.</li><li><strong>Security Hub vs Detective:</strong> Hub aggregates findings. Detective investigates one.</li></ul><h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>If the question says...                          -&gt; pick\nDetect threats using ML on logs and traffic      -&gt; GuardDuty\nScan EC2, containers or Lambda for flaws         -&gt; Inspector\nFind personal data in S3                         -&gt; Macie\nOne dashboard of security findings               -&gt; Security Hub\nInvestigate the root cause of a finding          -&gt; Detective\nWho made this API call, and when                 -&gt; CloudTrail\nTrack resource configuration changes and rules   -&gt; AWS Config\nCollect evidence for our audit                   -&gt; Audit Manager\nDownload AWS SOC or ISO reports                  -&gt; AWS Artifact\nCheck for open ports or root MFA missing         -&gt; Trusted Advisor\nReport spam or malware from AWS resources        -&gt; AWS Trust &amp; Safety abuse report</code></pre>", "toc": [{"id": "threat-detection", "text": "Spotting trouble: the detection services"}, {"id": "logging-config", "text": "Recording what happened: CloudTrail, Config, CloudWatch"}, {"id": "proving-compliance", "text": "Proving compliance: Audit Manager and Artifact"}, {"id": "compliance-residency", "text": "Compliance programs, data residency and Trusted Advisor"}, {"id": "support-policies", "text": "Security resources, pen testing and abuse reporting"}, {"id": "common-traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch7", "ch": 7, "title": "Chapter 7: Where in the world is your app? (The AWS global infrastructure and ways to use AWS)", "short": "Where in the world is your app?", "topic": "The AWS global infrastructure and ways to use AWS", "d": 3, "focus": false, "mins": 7, "html": "<p>Meera opens the laptop on a Monday. &quot;Readers in Singapore say our site is slow, and our lawyers say EU subscriber data must stay in Europe. Where does PulseWire actually <em>live</em>?&quot; Kabir shrugs: &quot;Why can't we just put everything in one data centre?&quot;</p><p>As the new cloud lead, you need the map of AWS first. Once you can read the map, the questions about speed, law and outages answer themselves. This chapter also covers how people operate AWS: clicking, typing commands, or writing code that builds everything for you.</p><h3 id=\"s-regions-azs\">Regions and Availability Zones</h3><p>A <strong>Region</strong> is a physical area of the world where AWS has clusters of data centres, such as <code>us-east-1</code> (N. Virginia), <code>eu-west-1</code> (Ireland) or <code>ap-southeast-1</code> (Singapore). Regions are completely independent of each other. Your data does not leave a Region unless you decide to move it.</p><p>Inside each Region there are multiple <strong>Availability Zones (AZs)</strong>. An AZ is one or more separate data centres with their own power, cooling and networking. AZs in a Region are far enough apart to avoid sharing a disaster, yet close enough to be connected by very fast, low-latency links.</p><ul><li><strong>What it is:</strong> Region = a geographic area; AZ = an isolated data-centre group inside a Region (every Region has at least three).</li><li><strong>Use it when:</strong> you want resilience: spread your app across two or more AZs so one failed data centre does not take you down.</li><li><strong>Remember for the exam:</strong> Highly available = multiple AZs. Fault tolerant against a whole-Region problem = multiple Regions. Most services are Regional; IAM, Route 53 and CloudFront are global.</li></ul><pre class=\"diagram\"><code>AWS Global Infrastructure\n\n  Region (eu-west-1)\n  +--------------------------------------+\n  |  AZ-a        AZ-b        AZ-c        |\n  | [DC][DC]    [DC][DC]    [DC]         |\n  +--------------------------------------+\n         ^ fast private links between AZs ^</code></pre><h3 id=\"s-choose-region\">How to choose a Region</h3><p>Four factors decide which Region to use, and the exam loves asking which one matters most. The answer is usually <strong>compliance first</strong>.</p><div class=\"tw\"><table><thead><tr><th>Factor</th><th>Question to ask</th><th>Example</th></tr></thead><tbody><tr><td>Compliance / data residency</td><td>Does law or policy say where data must stay?</td><td>EU subscriber data stays in an EU Region</td></tr><tr><td>Latency</td><td>Where are most of my users?</td><td>Singapore readers: pick Singapore</td></tr><tr><td>Price</td><td>Costs differ by Region</td><td>US Regions are often cheaper than some others</td></tr><tr><td>Service availability</td><td>Is the new service offered there yet?</td><td>New features launch in some Regions first</td></tr></tbody></table></div><blockquote class=\"tip\">Rule of thumb: if a rule says the data must stay in a country, that decides the Region. Only after that do you weigh latency, price and available services.</blockquote><h3 id=\"s-edge-special\">Edge locations and special zones</h3><p>Not every location is a full Region. AWS also puts smaller sites closer to people and to special buildings.</p><ul><li><strong>Edge locations (points of presence):</strong> hundreds of small sites around the world. <strong>Amazon CloudFront</strong>, the content delivery network (CDN), caches copies of your images and videos there so readers get them from nearby. Route 53 and Global Accelerator also use them.</li><li><strong>AWS Local Zones:</strong> small extensions of a Region placed in a big city, giving single-digit-millisecond latency for things like live video editing or gaming.</li><li><strong>AWS Wavelength:</strong> AWS compute inside 5G telecom networks, for ultra-low latency to mobile devices.</li><li><strong>AWS Outposts:</strong> AWS-owned racks installed in <em>your own</em> data centre. Use it when you need AWS services but the workload must stay on premises (hybrid cloud).</li></ul><blockquote class=\"voice\"><span class=\"who\">Kabir</span>So the CDN is basically a local newsstand stocking copies of our front page?</blockquote><p>Exactly, Kabir. That is caching at the edge.</p><h3 id=\"s-access-aws\">Ways to access AWS</h3><p>You can talk to AWS in several ways. Under the hood they all call the same <strong>AWS APIs</strong>.</p><ul><li><strong>AWS Management Console:</strong> the web interface. Best for learning and one-off tasks.</li><li><strong>AWS CLI (Command Line Interface):</strong> type commands in a terminal; good for scripts and automation.</li><li><strong>SDKs (Software Development Kits):</strong> libraries for Python, JavaScript, Java and more, so your application code can use AWS.</li><li><strong>AWS CloudShell:</strong> a browser-based terminal inside the Console with the CLI already installed and your credentials loaded. No setup required.</li><li><strong>APIs:</strong> every action is an API call. Console, CLI and SDKs are friendly wrappers around them.</li></ul><p>Programmatic access (CLI and SDK) uses <strong>access keys</strong>, which are long-term credentials you must protect. Console users sign in with a username, password and ideally MFA.</p><h3 id=\"s-iac\">Infrastructure as code and deployment models</h3><p>Clicking in the Console is fine once, but not for rebuilding a whole environment ten times. <strong>Infrastructure as code (IaC)</strong> means you describe your servers, networks and databases in a file and let a tool build them. The result is repeatable, reviewable and easy to copy.</p><ul><li><strong>What it is:</strong> <strong>AWS CloudFormation</strong> builds resources from JSON or YAML templates, grouped as a <em>stack</em>. <strong>AWS CDK</strong> (Cloud Development Kit) lets you write the same thing in a programming language like Python or TypeScript; it generates CloudFormation for you.</li><li><strong>Use it when:</strong> you want identical test, staging and production environments, or you want to delete everything in one go by deleting the stack.</li><li><strong>Remember for the exam:</strong> IaC = CloudFormation (templates) or CDK (code). Both are free; you pay only for the resources they create.</li></ul><p>There are also three <strong>cloud deployment models</strong>: <strong>cloud</strong> (all in AWS), <strong>on-premises</strong> (all in your own building, sometimes called private cloud), and <strong>hybrid</strong> (a mix, connected together). Outposts and Direct Connect are common hybrid tools.</p><h3 id=\"s-high-availability\">High availability across AZs</h3><p>PulseWire's fear is a single outage taking the site down. <strong>High availability</strong> means the app keeps working when one part fails. On AWS the basic recipe is to run copies of your app in at least two AZs, with a load balancer in front, and a database that can fail over. If AZ-a burns down, AZ-b keeps serving readers.</p><p>Going one level up, <strong>multi-Region</strong> designs protect against a whole Region failing and also bring the app closer to far-away users. It costs more, so use it only when the business needs it.</p><h3 id=\"s-common-traps\">Common traps</h3><ul><li><strong>AZ vs Region:</strong> an AZ is a data centre group <em>inside</em> a Region. Multi-AZ is not multi-Region.</li><li><strong>Edge location vs AZ:</strong> edge locations cache content (CloudFront); you do not run your normal servers or databases in them.</li><li><strong>Outposts vs Local Zones vs Wavelength:</strong> Outposts is in <em>your</em> data centre; Local Zones is in a city near users; Wavelength is inside a 5G network.</li><li><strong>CloudFormation vs CDK:</strong> both are IaC. If the question says &quot;using a programming language&quot;, pick CDK.</li><li><strong>CloudShell vs CLI:</strong> CloudShell is a browser terminal with no installation; the CLI is installed on your own computer.</li><li><strong>Cheapest Region is not always the answer:</strong> compliance beats price.</li></ul><h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>If the question says...                        -&gt; pick\n-----------------------------------------------------------\nData must stay in a specific country               -&gt; that Region (compliance)\nSurvive one data-centre failure                    -&gt; Multi-AZ\nSurvive a whole Region outage                      -&gt; Multi-Region\nCache content close to users worldwide             -&gt; CloudFront (edge locations)\nRun AWS services in my own data centre             -&gt; AWS Outposts\nUltra-low latency inside a 5G network              -&gt; AWS Wavelength\nLow latency in a big city, extend a Region         -&gt; Local Zones\nBrowser terminal, no install                       -&gt; AWS CloudShell\nBuild identical environments from templates        -&gt; CloudFormation\nDefine infrastructure in Python or TypeScript      -&gt; AWS CDK</code></pre>", "toc": [{"id": "regions-azs", "text": "Regions and Availability Zones"}, {"id": "choose-region", "text": "How to choose a Region"}, {"id": "edge-special", "text": "Edge locations and special zones"}, {"id": "access-aws", "text": "Ways to access AWS"}, {"id": "iac", "text": "Infrastructure as code and deployment models"}, {"id": "high-availability", "text": "High availability across AZs"}, {"id": "common-traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch8", "ch": 8, "title": "Chapter 8: Where does the code actually run? (Compute services)", "short": "Where does the code actually run?", "topic": "Compute services", "d": 3, "focus": false, "mins": 8, "html": "<p>Meera: &quot;Last week's election night, traffic jumped ten times and the site crawled. Then at 3 a.m. we were paying for servers nobody used.&quot; Kabir: &quot;Why can't we just buy a bunch of big machines?&quot; Because then you pay for them when idle and drown when busy.</p><p>Compute is the &quot;where does the code run&quot; part of AWS. The exam wants you to pick the right style: a virtual server, a container, a serverless function, or a managed platform. Each trades control for convenience.</p><h3 id=\"s-ec2\">Amazon EC2: virtual servers</h3><ul><li><strong>What it is:</strong> Elastic Compute Cloud gives you virtual machines (instances) in the cloud. You choose the operating system, size and software, and you manage the OS, patches and apps (your side of shared responsibility).</li><li><strong>Use it when:</strong> you need full control, a custom OS, or you are moving an existing server application (lift and shift).</li><li><strong>Remember for the exam:</strong> EC2 is IaaS. Billing is per second for Linux (per hour for some others). Pricing options appear in the cost chapter.</li></ul><p>Three things to know about EC2:</p><ul><li><strong>Instance families</strong> match hardware to the job: general purpose (balanced, e.g. M, T), compute optimised (C, for busy CPUs), memory optimised (R, for big in-memory data), storage optimised (I, D, for fast disk), and accelerated computing (P, G, for GPUs and machine learning).</li><li><strong>AMI (Amazon Machine Image):</strong> a template with the OS and software, used to launch identical instances.</li><li><strong>User data:</strong> a script that runs the first time an instance starts, to install software automatically.</li></ul><h3 id=\"s-scaling-lb\">Auto Scaling and Elastic Load Balancing</h3><p>These two pair up to solve election night.</p><ul><li><strong>What it is:</strong> <strong>EC2 Auto Scaling</strong> adds instances when demand rises and removes them when it falls, within minimum and maximum limits you set. <strong>Elastic Load Balancing (ELB)</strong> spreads incoming traffic across many targets and only sends it to healthy ones.</li><li><strong>Use it when:</strong> traffic is unpredictable, or you want high availability across AZs.</li><li><strong>Remember for the exam:</strong> Auto Scaling = elasticity (right amount of capacity). ELB = distribution and health checks. Application Load Balancer handles web (HTTP/HTTPS) traffic; Network Load Balancer handles extreme performance for TCP/UDP.</li></ul><pre class=\"diagram\"><code>  Readers --&gt; [Load Balancer]\n                 /      |      \\\n            [EC2-a]  [EC2-b]  [EC2-c]   &lt;- Auto Scaling group\n             AZ-a     AZ-b     AZ-a</code></pre><h3 id=\"s-lambda\">AWS Lambda: serverless functions</h3><ul><li><strong>What it is:</strong> You upload code; AWS runs it only when triggered (a file lands in S3, an API call, a schedule). There are no servers for you to manage, and scaling is automatic.</li><li><strong>Use it when:</strong> work is short, event-driven and spiky, such as resizing an uploaded image or sending a notification.</li><li><strong>Remember for the exam:</strong> You pay only for the number of requests and the run time, and nothing when idle. Maximum run time is 15 minutes, so Lambda is not for long jobs.</li></ul><blockquote class=\"voice\"><span class=\"who\">Kabir</span>So &quot;serverless&quot; still has servers, we just never see them?</blockquote><p>Exactly. Someone else runs them.</p><h3 id=\"s-containers\">Containers: ECS, EKS, Fargate, ECR</h3><p>A <strong>container</strong> packages your app plus everything it needs so it runs the same everywhere. It is lighter than a full virtual machine. Running many containers needs an orchestrator.</p><ul><li><strong>Amazon ECS (Elastic Container Service):</strong> AWS's own container orchestrator. Simple and deeply integrated with AWS.</li><li><strong>Amazon EKS (Elastic Kubernetes Service):</strong> managed Kubernetes, the popular open-source orchestrator. Choose it if you already use Kubernetes or want portability.</li><li><strong>AWS Fargate:</strong> serverless compute for containers. It works with ECS and EKS so you do not manage the servers underneath.</li><li><strong>Amazon ECR (Elastic Container Registry):</strong> a place to store and share your container images.</li></ul><blockquote class=\"tip\">Memory trick: ECS = Amazon's way; EKS = Kubernetes; Fargate = no servers to run; ECR = image storage (like a library for images).</blockquote><h3 id=\"s-easier-paas\">Easier options: Beanstalk, Lightsail, App Runner, Batch</h3><ul><li><strong>AWS Elastic Beanstalk (PaaS):</strong> upload your web application code and Beanstalk handles provisioning, load balancing, scaling and monitoring. You keep control of the underlying resources. Good for developers who want to deploy fast without learning each service.</li><li><strong>Amazon Lightsail:</strong> simple virtual servers, databases and storage at a low, predictable monthly price. Aimed at small websites, blogs and beginners.</li><li><strong>AWS App Runner:</strong> deploy a web app or API from source code or a container image with almost no infrastructure work.</li><li><strong>AWS Batch:</strong> run large numbers of batch computing jobs, such as nightly data processing, and AWS provisions the right amount of compute.</li></ul><h3 id=\"s-which\">When to use which</h3><p>Think of it as a ladder: the higher you go, the less you manage, and the less control you have.</p><div class=\"tw\"><table><thead><tr><th>Style</th><th>Example</th><th>You manage</th><th>Best for</th></tr></thead><tbody><tr><td>Virtual server</td><td>EC2</td><td>OS, patches, app</td><td>Full control, legacy apps</td></tr><tr><td>Container</td><td>ECS, EKS (Fargate)</td><td>Containers and images</td><td>Microservices, portable apps</td></tr><tr><td>Serverless</td><td>Lambda</td><td>Only your code</td><td>Event-driven, spiky work</td></tr><tr><td>PaaS</td><td>Elastic Beanstalk</td><td>Application code</td><td>Quick web app deployment</td></tr></tbody></table></div><h3 id=\"s-common-traps\">Common traps</h3><ul><li><strong>EC2 vs Lambda:</strong> long-running, full-control workloads go to EC2; short event-driven code goes to Lambda.</li><li><strong>Auto Scaling vs Load Balancing:</strong> scaling changes <em>how many</em> servers; balancing decides <em>which</em> server gets each request.</li><li><strong>ECS vs EKS vs Fargate:</strong> Fargate is not an orchestrator; it is the serverless engine under them.</li><li><strong>ECR is storage:</strong> it does not run containers.</li><li><strong>Beanstalk vs Lightsail:</strong> Beanstalk deploys your code with AWS services behind it; Lightsail is a simple, fixed-price bundle for small projects.</li><li><strong>Shared responsibility:</strong> with EC2 you patch the guest OS; with Lambda and Fargate AWS handles more.</li></ul><h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>If the question says...                        -&gt; pick\n-----------------------------------------------------------\nVirtual machine, full control of the OS            -&gt; EC2\nAdd or remove servers automatically                -&gt; EC2 Auto Scaling\nSpread traffic across healthy servers              -&gt; Elastic Load Balancing\nRun code on an event, no servers to manage         -&gt; Lambda\nRun containers, AWS-native                         -&gt; ECS\nRun containers with Kubernetes                     -&gt; EKS\nContainers without managing servers                -&gt; Fargate\nStore container images                             -&gt; ECR\nUpload code, AWS handles the rest (PaaS)           -&gt; Elastic Beanstalk\nSimple, cheap, predictable small website           -&gt; Lightsail\nLarge scale batch jobs                             -&gt; AWS Batch</code></pre>", "toc": [{"id": "ec2", "text": "Amazon EC2: virtual servers"}, {"id": "scaling-lb", "text": "Auto Scaling and Elastic Load Balancing"}, {"id": "lambda", "text": "AWS Lambda: serverless functions"}, {"id": "containers", "text": "Containers: ECS, EKS, Fargate, ECR"}, {"id": "easier-paas", "text": "Easier options: Beanstalk, Lightsail, App Runner, Batch"}, {"id": "which", "text": "When to use which"}, {"id": "common-traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch9", "ch": 9, "title": "Chapter 9: Where do the photos and files live? (Storage services)", "short": "Where do the photos and files live?", "topic": "Storage services", "d": 3, "focus": true, "mins": 8, "html": "<p>PulseWire creators upload thousands of photos and videos every day. Meera: &quot;Storage is eating the budget, but I also need old footage kept for seven years for audits.&quot; Kabir: &quot;Why can't we just put it all on one big hard drive?&quot;</p><p>Because different data needs different homes: some is read all day, some once a year, some must be shared between servers. AWS offers three kinds of storage (object, block, file) and many tools to move and protect data. S3 is the star of this chapter and of the exam.</p><h3 id=\"s-s3\">Amazon S3: object storage</h3><ul><li><strong>What it is:</strong> Simple Storage Service stores <strong>objects</strong> (files plus metadata, up to 5 TB each) inside <strong>buckets</strong>. Bucket names are globally unique; the bucket lives in one Region. Capacity is effectively unlimited, and you access objects over the web with a URL or API.</li><li><strong>Use it when:</strong> you store photos, videos, backups, logs, website files or a data lake.</li><li><strong>Remember for the exam:</strong> S3 offers <strong>11 nines (99.999999999%) durability</strong>: data is copied across multiple AZs. S3 is not a disk you attach to a server. New buckets are private by default.</li></ul><p>Useful S3 features:</p><ul><li><strong>Versioning:</strong> keeps every version of an object, so you can recover from accidental deletes or overwrites.</li><li><strong>Static website hosting:</strong> serve plain HTML, images and scripts straight from a bucket, often fronted by CloudFront.</li><li><strong>Lifecycle rules:</strong> automatically move objects to cheaper classes after N days, or delete them after a set time.</li><li><strong>Encryption:</strong> objects are encrypted at rest by default; you can also use your own keys with KMS.</li></ul><h3 id=\"s-classes\">S3 storage classes</h3><p>Pick a class by <em>how often</em> you read the data and <em>how fast</em> you need it back. The less you touch it, the cheaper it is to store, but retrieval costs more or takes longer.</p><div class=\"tw\"><table><thead><tr><th>Class</th><th>Access pattern</th><th>Retrieval</th><th>Note</th></tr></thead><tbody><tr><td>Standard</td><td>Frequent</td><td>Instant</td><td>Default, highest storage price</td></tr><tr><td>Intelligent-Tiering</td><td>Unknown or changing</td><td>Instant</td><td>Moves objects between tiers for you</td></tr><tr><td>Standard-IA</td><td>Infrequent, needs rapid access</td><td>Instant</td><td>Lower storage, per-GB retrieval fee, multi-AZ</td></tr><tr><td>One Zone-IA</td><td>Infrequent, re-creatable data</td><td>Instant</td><td>Stored in a single AZ, cheaper, less resilient</td></tr><tr><td>Glacier Instant Retrieval</td><td>Rare, e.g. quarterly</td><td>Milliseconds</td><td>Archive with instant access</td></tr><tr><td>Glacier Flexible Retrieval</td><td>Rare, archive</td><td>Minutes to hours</td><td>Cheap, for backups</td></tr><tr><td>Glacier Deep Archive</td><td>Almost never, 7+ years</td><td>Hours (up to about 12 or more)</td><td>Cheapest class</td></tr></tbody></table></div><blockquote class=\"tip\">PulseWire plan: new uploads in Standard, then a lifecycle rule moves them to Standard-IA after 30 days and Glacier Deep Archive after a year for audit footage.</blockquote><h3 id=\"s-block-file\">EBS, EFS and FSx</h3><p>S3 is object storage. Servers sometimes need something that behaves like a disk or a shared folder.</p><ul><li><strong>What it is:</strong> <strong>Amazon EBS (Elastic Block Store)</strong> is a virtual hard drive for one EC2 instance. It lives in one AZ, persists after the instance stops, and supports snapshots (backups, stored in S3).</li><li><strong>Use it when:</strong> you need a boot volume or a fast database disk for an EC2 server.</li><li><strong>Remember for the exam:</strong> Block storage. EBS is attached to EC2 (in the same AZ). Instance store is temporary and lost when the instance stops.</li></ul><ul><li><strong>What it is:</strong> <strong>Amazon EFS (Elastic File System)</strong> is a shared network file system for Linux. Many EC2 instances, even across AZs, can use it at once; it grows and shrinks automatically.</li><li><strong>Use it when:</strong> several servers need to share the same files.</li><li><strong>Remember for the exam:</strong> File storage, Linux, pay for what you use.</li></ul><ul><li><strong>What it is:</strong> <strong>Amazon FSx</strong> is a family of fully managed file systems: FSx for Windows File Server, Lustre (high-performance computing), NetApp ONTAP and OpenZFS.</li><li><strong>Use it when:</strong> you need Windows file shares (SMB), Active Directory integration, or specialist file systems.</li><li><strong>Remember for the exam:</strong> Windows file share = FSx for Windows. High-performance computing = FSx for Lustre.</li></ul><h3 id=\"s-compare\">Block vs file vs object</h3><div class=\"tw\"><table><thead><tr><th></th><th>Block (EBS)</th><th>File (EFS, FSx)</th><th>Object (S3)</th></tr></thead><tbody><tr><td>Looks like</td><td>A hard drive</td><td>A shared folder</td><td>A bucket of files via web</td></tr><tr><td>Shared by</td><td>One instance (usually)</td><td>Many servers</td><td>Anyone with permission</td></tr><tr><td>Best for</td><td>Operating systems, databases</td><td>Shared content, home folders</td><td>Media, backups, data lakes, websites</td></tr><tr><td>Scale</td><td>Provisioned size</td><td>Grows automatically</td><td>Virtually unlimited</td></tr></tbody></table></div><h3 id=\"s-hybrid-move\">Backup, hybrid and moving data</h3><ul><li><strong>AWS Backup:</strong> one central place to set backup policies across EBS, RDS, EFS, DynamoDB and more. Use it for automated, compliance-friendly backups.</li><li><strong>AWS Storage Gateway:</strong> a bridge between on-premises systems and AWS storage (file, volume and tape gateways). Use it for hybrid storage.</li><li><strong>AWS DataSync:</strong> automated, fast online transfer of large amounts of data between on-premises and AWS storage.</li><li><strong>AWS Transfer Family:</strong> managed SFTP, FTPS and FTP into S3 or EFS, for partners who still send files that way.</li><li><strong>AWS Snow family:</strong> physical devices for moving data offline when the network is too slow or none exists. <strong>Snowcone</strong> is small and portable, <strong>Snowball Edge</strong> holds terabytes to petabytes and can do edge computing; the larger Snowmobile truck has been retired.</li></ul><p>Rule of thumb: terabytes over a good network, use DataSync; petabytes or poor networks, use Snow.</p><h3 id=\"s-common-traps\">Common traps</h3><ul><li><strong>S3 is not a file system or disk:</strong> you cannot install an OS on it. Use EBS for that.</li><li><strong>EBS vs EFS:</strong> EBS = one server, one AZ; EFS = many servers sharing files.</li><li><strong>Glacier retrieval speeds differ:</strong> Instant is milliseconds; Flexible takes minutes to hours; Deep Archive takes hours.</li><li><strong>One Zone-IA is not multi-AZ:</strong> do not pick it for data you cannot lose.</li><li><strong>Storage Gateway vs DataSync:</strong> Gateway is an ongoing hybrid bridge; DataSync is a bulk transfer tool.</li><li><strong>Versioning vs lifecycle:</strong> versioning keeps old copies; lifecycle moves or expires objects.</li></ul><h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>If the question says...                        -&gt; pick\n-----------------------------------------------------------\nUnlimited objects, photos, backups, websites       -&gt; S3\nUnknown or changing access pattern                 -&gt; S3 Intelligent-Tiering\nCheapest archive, accessed once a year or less     -&gt; Glacier Deep Archive\nDisk for one EC2 instance                          -&gt; EBS\nShared Linux file system for many servers          -&gt; EFS\nWindows file share (SMB)                           -&gt; FSx for Windows File Server\nCentral backup policies across services            -&gt; AWS Backup\nOn-premises app using cloud storage                -&gt; Storage Gateway\nMove large data online                             -&gt; DataSync\nMove petabytes offline                             -&gt; Snow family (Snowball Edge)\nPartners upload via SFTP                           -&gt; Transfer Family</code></pre>", "toc": [{"id": "s3", "text": "Amazon S3: object storage"}, {"id": "classes", "text": "S3 storage classes"}, {"id": "block-file", "text": "EBS, EFS and FSx"}, {"id": "compare", "text": "Block vs file vs object"}, {"id": "hybrid-move", "text": "Backup, hybrid and moving data"}, {"id": "common-traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch10", "ch": 10, "title": "Chapter 10: Where does the data go to be remembered? (Database services)", "short": "Where does the data go to be remembered?", "topic": "Database services", "d": 3, "focus": false, "mins": 8, "html": "<p>PulseWire needs to keep subscribers, articles and comments. Kabir wants to install a database on an EC2 server himself. Meera: &quot;Who will patch it, back it up and wake up when it breaks?&quot; The answer is: you, unless you pick a managed database.</p><p>AWS has a purpose-built database for almost every need. For the exam you only need to match the need to the service. The big split is relational (tables with fixed structure) versus NoSQL (flexible, built for scale).</p><h3 id=\"s-managed\">Managed databases and the big split</h3><p>With a <strong>managed database</strong>, AWS handles hardware, OS installation, database patching, backups and failover. You still own your data, who can access it, and the design of the tables. If you install a database yourself on EC2, all of the admin is yours.</p><div class=\"tw\"><table><thead><tr><th></th><th>Relational (SQL)</th><th>NoSQL</th></tr></thead><tbody><tr><td>Structure</td><td>Tables, rows, fixed schema</td><td>Flexible: key-value, document, graph</td></tr><tr><td>Strength</td><td>Complex queries, joins, transactions</td><td>Huge scale, fast, simple access</td></tr><tr><td>AWS examples</td><td>RDS, Aurora, Redshift</td><td>DynamoDB, DocumentDB, Neptune</td></tr></tbody></table></div><p>Under shared responsibility, AWS secures and operates the database service itself. You decide who may connect (IAM and security groups), whether data is encrypted, and what the data contains. The exam often asks who patches the database engine: for RDS and Aurora, AWS does; for a database you installed on EC2, you do.</p><p>Remember the purpose-built idea: AWS does not push one database for everything. Pick the engine whose strengths match the access pattern, and you get better speed and lower cost than forcing every workload into one product.</p><h3 id=\"s-rds-aurora\">Amazon RDS and Aurora</h3><ul><li><strong>What it is:</strong> <strong>Amazon RDS (Relational Database Service)</strong> runs familiar engines for you: MySQL, PostgreSQL, MariaDB, Oracle, SQL Server and Db2. <strong>Amazon Aurora</strong> is AWS's own cloud-built MySQL- and PostgreSQL-compatible engine, with higher performance and storage that automatically grows and is copied across three AZs.</li><li><strong>Use it when:</strong> you need a traditional relational database for an app, with less admin work. Choose Aurora for higher performance and availability.</li><li><strong>Remember for the exam:</strong> You cannot log in to the underlying OS of RDS. Aurora is up to about five times faster than standard MySQL and three times faster than PostgreSQL. Aurora Serverless adjusts capacity automatically.</li></ul><p><strong>Multi-AZ vs read replicas</strong> is a favourite exam contrast:</p><div class=\"tw\"><table><thead><tr><th></th><th>Multi-AZ</th><th>Read replica</th></tr></thead><tbody><tr><td>Purpose</td><td>High availability and failover</td><td>Performance: spread read traffic</td></tr><tr><td>How it works</td><td>A standby copy in another AZ takes over automatically</td><td>Extra copies that serve reads only</td></tr><tr><td>Use when</td><td>You cannot afford downtime</td><td>Reports and readers overload the database</td></tr></tbody></table></div><h3 id=\"s-dynamo-cache\">DynamoDB and caching</h3><ul><li><strong>What it is:</strong> <strong>Amazon DynamoDB</strong> is a serverless NoSQL key-value and document database. It delivers single-digit-millisecond performance at any scale, with multi-AZ copies by default and optional global tables.</li><li><strong>Use it when:</strong> you need very fast, massive-scale lookups such as shopping carts, sessions or leaderboards.</li><li><strong>Remember for the exam:</strong> Fully managed and serverless; no servers to choose. Not for complex joins.</li></ul><ul><li><strong>What it is:</strong> <strong>Amazon ElastiCache</strong> is a managed in-memory cache (Redis OSS or Valkey, and Memcached). <strong>Amazon MemoryDB</strong> is a durable, Redis-compatible in-memory database.</li><li><strong>Use it when:</strong> you want microsecond responses, for example caching the front-page query so the main database is not hit every time.</li><li><strong>Remember for the exam:</strong> In-memory = very fast. ElastiCache is a cache; MemoryDB is used as a primary database.</li></ul><h3 id=\"s-special\">Analytics and specialised databases</h3><ul><li><strong>Amazon Redshift:</strong> a managed data warehouse for analytics across huge amounts of data (OLAP, not day-to-day transactions).</li><li><strong>Amazon DocumentDB:</strong> JSON document database compatible with MongoDB.</li><li><strong>Amazon Neptune:</strong> graph database for highly connected data, like social networks or fraud detection.</li><li><strong>Amazon Keyspaces:</strong> managed Apache Cassandra-compatible wide-column database.</li><li><strong>Amazon Timestream:</strong> time-series database for IoT and metrics data.</li><li><strong>Amazon QLDB:</strong> a ledger database with an unchangeable history. AWS has announced it is ending support, so treat it as a legacy item; Amazon Aurora PostgreSQL is the suggested route for ledger-style needs.</li></ul><h3 id=\"s-migration\">Moving databases: DMS and SCT</h3><ul><li><strong>What it is:</strong> <strong>AWS Database Migration Service (DMS)</strong> moves data from one database to another quickly and securely, with the source staying live. The <strong>AWS Schema Conversion Tool (SCT)</strong> converts the schema and code when the engines differ, for example Oracle to PostgreSQL.</li><li><strong>Use it when:</strong> you move an on-premises database to AWS, or switch engines (heterogeneous migration).</li><li><strong>Remember for the exam:</strong> Same engine: DMS alone is enough. Different engine: SCT plus DMS.</li></ul><h3 id=\"s-common-traps\">Common traps</h3><ul><li><strong>Multi-AZ vs read replica:</strong> Multi-AZ is for availability; read replicas are for read performance.</li><li><strong>RDS vs Aurora:</strong> Aurora is the AWS-built, higher-performing option; RDS offers many familiar engines.</li><li><strong>DynamoDB vs RDS:</strong> key-value at huge scale = DynamoDB; joins and SQL = RDS or Aurora.</li><li><strong>Redshift is not a transactional app database:</strong> it is for analytics.</li><li><strong>ElastiCache vs DynamoDB:</strong> a cache speeds up another database; DynamoDB is itself the database.</li><li><strong>DocumentDB vs DynamoDB:</strong> DocumentDB mimics MongoDB; DynamoDB is key-value and serverless.</li></ul><h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>If the question says...                        -&gt; pick\n-----------------------------------------------------------\nManaged MySQL, PostgreSQL, Oracle, SQL Server      -&gt; RDS\nCloud-built, high-performance relational           -&gt; Aurora\nKey-value, single-digit millisecond, serverless    -&gt; DynamoDB\nMicrosecond cache in front of a database           -&gt; ElastiCache\nData warehouse, analytics, petabytes               -&gt; Redshift\nMongoDB-compatible                                 -&gt; DocumentDB\nGraph, relationships between data                  -&gt; Neptune\nAutomatic failover to another AZ                   -&gt; RDS Multi-AZ\nOffload read traffic                               -&gt; Read replica\nMove a database to AWS, keep it online             -&gt; DMS\nConvert schema between different engines           -&gt; Schema Conversion Tool</code></pre>", "toc": [{"id": "managed", "text": "Managed databases and the big split"}, {"id": "rds-aurora", "text": "Amazon RDS and Aurora"}, {"id": "dynamo-cache", "text": "DynamoDB and caching"}, {"id": "special", "text": "Analytics and specialised databases"}, {"id": "migration", "text": "Moving databases: DMS and SCT"}, {"id": "common-traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch11", "ch": 11, "title": "Chapter 11: Networking and Delivery (VPC, Route 53, CloudFront)", "short": "How do we build roads and deliver fast?", "topic": "Networking and content delivery", "d": 3, "focus": false, "mins": 8, "html": "<p>PulseWire's video traffic is growing, and Meera has a simple demand: \"Readers in Mumbai and Madrid should see our site load fast, and nobody outside the company should be able to touch our database.\" Kabir shrugs: \"Why can't we just put everything on the internet and add a password?\"</p><p>As the new cloud lead, you need to know how AWS draws private rooms, builds doors between them, and then speeds up delivery to readers worldwide. This chapter is the plumbing of the cloud.</p><h3 id=\"s-vpc-basics\">VPC, subnets and gateways</h3><p>Think of a <strong>Virtual Private Cloud (VPC)</strong> as your own fenced-off office building inside AWS. Nobody gets in unless you build a door. Inside the building you create floors called <strong>subnets</strong>.</p><p><strong>Amazon VPC</strong></p><ul><li><strong>What it is:</strong> a logically isolated private network that you define in an AWS Region. You choose the IP address range and how things connect.</li><li><strong>Use it when:</strong> you launch EC2 instances, databases or other resources that need a network.</li><li><strong>Remember for the exam:</strong> a VPC lives in one Region and spans all its Availability Zones; a subnet lives in exactly one Availability Zone. Every account gets a default VPC so beginners can launch things straight away.</li></ul><p>A subnet is <strong>public</strong> if it has a route to the internet, and <strong>private</strong> if it does not. Web servers usually sit in public subnets; databases sit in private ones.</p><div class=\"tw\"><table><thead><tr><th>Piece</th><th>What it does</th><th>Think of it when</th></tr></thead><tbody><tr><td>Internet gateway (IGW)</td><td>The front door of the VPC. Lets resources in public subnets talk to the internet in both directions.</td><td>Public subnets that must be reachable from the internet.</td></tr><tr><td>NAT gateway</td><td>A one-way exit. Lets private resources reach out (for example to download updates) but blocks outsiders from starting a connection in. It sits in a public subnet.</td><td>Private subnets that need outbound internet only.</td></tr><tr><td>Route table</td><td>The set of signposts that says where traffic for each destination goes. Each subnet is linked to one.</td><td>Deciding whether a subnet is public (route to the IGW) or private.</td></tr><tr><td>Security group</td><td>A firewall at the instance level; allow rules only; stateful.</td><td>Controlling who can reach one server.</td></tr><tr><td>Network ACL</td><td>A firewall at the subnet level; allow and deny rules; stateless.</td><td>An extra subnet-wide layer, or blocking a specific address.</td></tr></tbody></table></div><blockquote class=\"tip\">A subnet is public only because its route table points to an internet gateway. The word \"public\" is not a setting you tick; it comes from the route.</blockquote><h3 id=\"s-connect-private\">Connecting privately: endpoints, peering, Transit Gateway</h3><p>Sometimes traffic should never touch the public internet. AWS gives you several ways to link networks and services privately.</p><p><strong>VPC endpoints and AWS PrivateLink</strong></p><ul><li><strong>What it is:</strong> a private doorway from your VPC to an AWS service (or another company's service) without going through the internet gateway or NAT. A <em>gateway endpoint</em> covers S3 and DynamoDB and is free; an <em>interface endpoint</em> is powered by PrivateLink and covers many other services.</li><li><strong>Use it when:</strong> private servers must reach S3 or another service but must not use the internet.</li><li><strong>Remember for the exam:</strong> the keyword is \"keep traffic on the AWS network\" or \"no internet access\".</li></ul><p><strong>VPC peering</strong></p><ul><li><strong>What it is:</strong> a direct private link between two VPCs, in the same or different accounts or Regions.</li><li><strong>Use it when:</strong> you need to connect a small number of VPCs.</li><li><strong>Remember for the exam:</strong> peering is not transitive: if A peers with B and B peers with C, A still cannot reach C. Address ranges must not overlap.</li></ul><p><strong>AWS Transit Gateway</strong></p><ul><li><strong>What it is:</strong> a central hub; every VPC and on-premises network plugs into the hub once.</li><li><strong>Use it when:</strong> you have many VPCs and want a hub-and-spoke design instead of a tangle of peering links.</li><li><strong>Remember for the exam:</strong> \"hub\", \"many VPCs\" or \"simplify network connections\" points to Transit Gateway.</li></ul><h3 id=\"s-hybrid\">Linking your office to AWS: VPN and Direct Connect</h3><p>Many companies keep some systems in their own building (on premises). Two services connect that building to a VPC.</p><p><strong>AWS Site-to-Site VPN</strong></p><ul><li><strong>What it is:</strong> an encrypted tunnel over the public internet between your office network and your VPC.</li><li><strong>Use it when:</strong> you need a connection quickly and cheaply, and internet variability is acceptable.</li><li><strong>Remember for the exam:</strong> fast to set up, encrypted, but runs over the internet so speed can vary.</li></ul><p><strong>AWS Direct Connect</strong></p><ul><li><strong>What it is:</strong> a dedicated physical network line from your premises to AWS, bypassing the public internet.</li><li><strong>Use it when:</strong> you need steady speed, low latency, or large data transfers.</li><li><strong>Remember for the exam:</strong> private and consistent, but takes weeks to install and is not encrypted by default. Cost and set-up time are higher than VPN.</li></ul><p>A simple memory trick: <strong>VPN is the quick tunnel; Direct Connect is the private highway.</strong></p><h3 id=\"s-route53\">Route 53: the cloud's phone book</h3><p>Computers find each other by number (IP address), but people type names like <code>pulsewire.com</code>. <strong>DNS</strong> (Domain Name System) translates names into numbers.</p><p><strong>Amazon Route 53</strong></p><ul><li><strong>What it is:</strong> AWS's highly available DNS service. It registers domain names, answers DNS questions, and checks the health of your endpoints.</li><li><strong>Use it when:</strong> you want to point your domain at your website, or fail over to a backup when the main site breaks.</li><li><strong>Remember for the exam:</strong> Route 53 can register domains, route traffic and run health checks. The name comes from DNS using port 53.</li></ul><p>Route 53 can answer differently depending on the <strong>routing policy</strong> you choose. At exam depth you only need the idea:</p><ul><li><strong>Simple:</strong> one answer for one name.</li><li><strong>Weighted:</strong> split traffic by percentage, for example 10 percent to a new version.</li><li><strong>Latency-based:</strong> send each user to the Region that responds fastest for them.</li><li><strong>Failover:</strong> use a primary, switch to a backup if health checks fail.</li><li><strong>Geolocation:</strong> answer based on where the user is, for example local-language sites or legal rules.</li></ul><p><strong>Health checks</strong> let Route 53 stop sending people to a broken endpoint.</p><h3 id=\"s-delivery\">Delivering fast worldwide: CloudFront, Global Accelerator, API Gateway</h3><p>Distance causes delay. These services bring your content closer to readers.</p><p><strong>Amazon CloudFront</strong></p><ul><li><strong>What it is:</strong> a content delivery network (CDN). It keeps copies (a cache) of your pictures, videos and pages in hundreds of <strong>edge locations</strong> around the world and serves each reader from the nearest one.</li><li><strong>Use it when:</strong> you serve websites, images or video to a global audience, or want to protect an origin with AWS WAF and Shield.</li><li><strong>Remember for the exam:</strong> edge locations make static content fast; the original source (such as an S3 bucket) is called the <em>origin</em>.</li></ul><p><strong>AWS Global Accelerator</strong></p><ul><li><strong>What it is:</strong> gives your application fixed entry IP addresses and routes users over the AWS global network to the nearest healthy endpoint.</li><li><strong>Use it when:</strong> you need faster, more reliable access for non-cacheable traffic such as games, voice or APIs, or need static IPs.</li><li><strong>Remember for the exam:</strong> CloudFront caches content; Global Accelerator speeds up the path but does not cache.</li></ul><p><strong>Amazon API Gateway</strong></p><ul><li><strong>What it is:</strong> a managed front door for building and publishing APIs that other apps call.</li><li><strong>Use it when:</strong> you want to expose a back end such as Lambda functions as a secure, scalable API.</li><li><strong>Remember for the exam:</strong> it handles traffic, authorization and throttling for you; it is commonly paired with Lambda.</li></ul><h3 id=\"s-common-traps\">Common traps</h3><ul><li><strong>Internet gateway vs NAT gateway.</strong> IGW is two-way for public subnets; NAT is outbound-only for private subnets.</li><li><strong>Security group vs network ACL.</strong> Security group: instance level, stateful, allow only. NACL: subnet level, stateless, allow and deny.</li><li><strong>VPN vs Direct Connect.</strong> Quick and encrypted over the internet is VPN. Dedicated and consistent is Direct Connect.</li><li><strong>CloudFront vs Global Accelerator.</strong> Caching content at the edge is CloudFront; static IPs and a faster network path is Global Accelerator.</li><li><strong>Peering vs Transit Gateway.</strong> Two or three VPCs: peering. Many VPCs and offices: Transit Gateway.</li><li><strong>Route 53 is DNS, not a load balancer.</strong> It chooses where a name points; it does not spread each request across servers like Elastic Load Balancing.</li></ul><h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>Private network of my own in AWS               -&gt; VPC\nServer in a subnet must be reachable by anyone -&gt; Internet gateway + public subnet\nPrivate server needs outbound updates only     -&gt; NAT gateway\nReach S3 / AWS service without the internet    -&gt; VPC endpoint (PrivateLink)\nConnect two VPCs directly                      -&gt; VPC peering\nHub for many VPCs and offices                  -&gt; Transit Gateway\nEncrypted link to office, quick and cheap      -&gt; Site-to-Site VPN\nDedicated private line, steady performance     -&gt; Direct Connect\nDomain names, DNS, health checks, failover     -&gt; Route 53\nCache content near users worldwide (CDN)       -&gt; CloudFront\nStatic IPs and faster global network path      -&gt; Global Accelerator\nPublish an API in front of Lambda              -&gt; API Gateway</code></pre>", "toc": [{"id": "vpc-basics", "text": "VPC, subnets and gateways"}, {"id": "connect-private", "text": "Connecting privately: endpoints, peering, Transit Gateway"}, {"id": "hybrid", "text": "Linking your office to AWS: VPN and Direct Connect"}, {"id": "route53", "text": "Route 53: the cloud's phone book"}, {"id": "delivery", "text": "Delivering fast worldwide: CloudFront, Global Accelerator, API Gateway"}, {"id": "common-traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch12", "ch": 12, "title": "Chapter 12: Connecting and Running the Platform (Integration, DevOps, Governance)", "short": "Who did what, and how is it running?", "topic": "Integration, developer tools, management and governance", "d": 3, "focus": false, "mins": 8, "html": "<p>It is 2 a.m. and PulseWire's site is slow. Meera messages: \"Who changed what, and why didn't we know sooner?\" Kabir replies, \"Why can't we just look at the server?\" You explain there are tools for that, and each answers a different question.</p><p>This chapter covers three groups: services that let parts of an app talk to each other, tools that help developers ship code, and tools that help you watch, audit and govern the whole platform.</p><h3 id=\"s-integration\">Integration: passing messages between parts</h3><p>Big systems work better when pieces are <strong>decoupled</strong>, meaning one piece can fail or slow down without breaking the others.</p><p><strong>Amazon SQS (Simple Queue Service)</strong></p><ul><li><strong>What it is:</strong> a queue. Senders drop messages in; receivers pick them up when ready.</li><li><strong>Use it when:</strong> a burst of work arrives faster than workers can handle, for example video uploads waiting to be processed.</li><li><strong>Remember for the exam:</strong> one message is generally handled by one consumer; the queue holds messages so none are lost.</li></ul><p><strong>Amazon SNS (Simple Notification Service)</strong></p><ul><li><strong>What it is:</strong> a publish and subscribe notification service. One message goes out to many subscribers (email, text, queues, Lambda).</li><li><strong>Use it when:</strong> you want to alert people or fan one event out to many systems.</li><li><strong>Remember for the exam:</strong> SNS pushes; SQS holds. They are often used together.</li></ul><p><strong>Amazon EventBridge</strong></p><ul><li><strong>What it is:</strong> an event bus that routes events from AWS services, your apps and partner software to targets based on rules.</li><li><strong>Use it when:</strong> something should happen automatically when an event occurs, or on a schedule.</li><li><strong>Remember for the exam:</strong> think \"if this happens, then run that\".</li></ul><p><strong>AWS Step Functions</strong></p><ul><li><strong>What it is:</strong> a visual workflow builder that links steps (often Lambda functions) in order with branching and retries.</li><li><strong>Use it when:</strong> a process has several steps, such as publish article, resize images, then notify subscribers.</li><li><strong>Remember for the exam:</strong> coordinates steps; serverless.</li></ul><p><strong>Amazon AppFlow</strong> (mention only) moves data between SaaS apps such as Salesforce and AWS services without code.</p><h3 id=\"s-devtools\">Developer tools: from code to running app</h3><p>Developers need a pipeline that turns code into a live product safely.</p><ul><li><strong>AWS CodeCommit:</strong> managed Git code storage. It is closed to new customers, so newer teams use other Git hosts; you may still see it named in questions as the AWS service for storing source code.</li><li><strong>AWS CodeBuild:</strong> compiles code and runs tests; no build servers to manage.</li><li><strong>AWS CodeDeploy:</strong> automates putting new versions onto EC2, Lambda or on-premises servers.</li><li><strong>AWS CodePipeline:</strong> the conveyor belt that connects source, build, test and deploy steps into one automated release flow (continuous delivery).</li><li><strong>AWS X-Ray:</strong> traces a request as it travels through your app so you can see where it slows down or fails.</li></ul><blockquote class=\"tip\">Order to remember: Commit (store) then Build then Deploy, all orchestrated by Pipeline. X-Ray is for debugging, not for releasing.</blockquote><h3 id=\"s-watching\">Watching and auditing: CloudWatch, CloudTrail, Config</h3><p>These three are the most confused trio on the exam. Each answers a different question.</p><div class=\"tw\"><table><thead><tr><th>Service</th><th>Question it answers</th><th>What you get</th></tr></thead><tbody><tr><td>Amazon CloudWatch</td><td>How is it performing right now?</td><td>Metrics (CPU, traffic), logs, dashboards, <strong>alarms</strong> that notify or trigger actions.</td></tr><tr><td>AWS CloudTrail</td><td>Who did what, and when?</td><td>Records API calls and console actions: user, time, source address. An audit trail.</td></tr><tr><td>AWS Config</td><td>What does it look like, and did it change from the rules?</td><td>Records resource configuration over time and checks it against rules for compliance.</td></tr></tbody></table></div><p><strong>Amazon CloudWatch</strong></p><ul><li><strong>What it is:</strong> monitoring for resources and apps: <strong>metrics</strong> (numbers over time), <strong>logs</strong> (text records) and <strong>alarms</strong> (alerts when a number crosses a line).</li><li><strong>Use it when:</strong> you want to know when CPU is too high, or want to collect app logs in one place.</li><li><strong>Remember for the exam:</strong> performance and health monitoring.</li></ul><p><strong>AWS CloudTrail</strong></p><ul><li><strong>What it is:</strong> a recorder of account activity and API calls.</li><li><strong>Use it when:</strong> someone deleted a server and you need to find out who; or you must prove activity for an audit.</li><li><strong>Remember for the exam:</strong> \"who\", \"when\", \"which user\" means CloudTrail.</li></ul><p><strong>AWS Config</strong></p><ul><li><strong>What it is:</strong> tracks the configuration of your resources and judges them against rules.</li><li><strong>Use it when:</strong> you must show that every storage bucket stayed encrypted, or see what a setting was last month.</li><li><strong>Remember for the exam:</strong> \"compliance\" and \"configuration history\" mean Config.</li></ul><h3 id=\"s-operate\">Operating and advising: Systems Manager, Trusted Advisor, Health</h3><ul><li><strong>AWS Systems Manager:</strong> one place to see and operate your servers: patching, running commands and storing configuration values (Parameter Store), often without logging in directly. Use it to manage fleets of EC2 and on-premises machines.</li><li><strong>AWS Trusted Advisor:</strong> automated checks and recommendations across cost, performance, security, fault tolerance, service limits and operational excellence. The full set of checks needs a Business, Enterprise On-Ramp or Enterprise Support plan.</li><li><strong>AWS Health Dashboard:</strong> shows the status of AWS services overall (service health) and the <strong>Personal Health Dashboard</strong> view shows events that affect <em>your</em> resources, such as scheduled maintenance or an outage in your Region.</li><li><strong>AWS Compute Optimizer</strong> (mention): looks at your usage and recommends right-sized EC2 and similar compute.</li></ul><h3 id=\"s-governance\">Governing many accounts</h3><p>As PulseWire grows, it will use several AWS accounts (one per team or environment).</p><p><strong>AWS Organizations</strong></p><ul><li><strong>What it is:</strong> groups many accounts under one structure with consolidated billing and Service Control Policies (SCPs) that set maximum permissions.</li><li><strong>Use it when:</strong> you want one bill, volume discounts, or guardrails across accounts.</li><li><strong>Remember for the exam:</strong> SCPs restrict what accounts can do; they do not grant permissions.</li></ul><p><strong>AWS Control Tower</strong></p><ul><li><strong>What it is:</strong> sets up a secure multi-account environment (a landing zone) quickly using best-practice guardrails.</li><li><strong>Use it when:</strong> you want a ready-made, governed account structure without building it by hand.</li><li><strong>Remember for the exam:</strong> built on top of Organizations; automated set-up plus guardrails.</li></ul><p><strong>AWS Service Catalog</strong></p><ul><li><strong>What it is:</strong> a menu of pre-approved products (templates) that teams can launch themselves.</li><li><strong>Use it when:</strong> you want teams to self-serve while staying inside company standards.</li><li><strong>Remember for the exam:</strong> approved catalog of products.</li></ul><ul><li><strong>AWS License Manager</strong> (mention): tracks software licenses across AWS and on-premises.</li><li><strong>AWS Well-Architected Tool:</strong> a free review tool that compares your workload to the Well-Architected Framework pillars and suggests improvements.</li></ul><h3 id=\"s-common-traps\">Common traps</h3><ul><li><strong>CloudWatch vs CloudTrail.</strong> Performance and alarms is CloudWatch; who made an API call is CloudTrail.</li><li><strong>CloudTrail vs Config.</strong> CloudTrail is the action log; Config is the state-of-resources history and compliance check.</li><li><strong>SQS vs SNS.</strong> Queue that holds work is SQS; broadcast to many subscribers is SNS.</li><li><strong>Trusted Advisor vs Compute Optimizer vs Well-Architected Tool.</strong> Broad best-practice checks, right-sizing compute, and a questionnaire-style review.</li><li><strong>Health Dashboard vs the status of your own app.</strong> Health Dashboard is about AWS services and events affecting your account; CloudWatch is about your app.</li><li><strong>Organizations vs Control Tower.</strong> Organizations manages accounts and policies; Control Tower automates a best-practice set-up on top of it.</li></ul><h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>Hold work in a line until workers are ready      -&gt; SQS\nSend one alert to many subscribers               -&gt; SNS\nReact to an event or run on a schedule           -&gt; EventBridge\nMulti-step workflow with branching               -&gt; Step Functions\nBuild and test code / deploy it / full pipeline  -&gt; CodeBuild / CodeDeploy / CodePipeline\nTrace a slow request through the app             -&gt; X-Ray\nCPU graph, logs, alarm                           -&gt; CloudWatch\nWho deleted that resource?                       -&gt; CloudTrail\nIs it configured per our rules? History?         -&gt; Config\nPatch and run commands on many servers           -&gt; Systems Manager\nCost/security/limits best-practice checks        -&gt; Trusted Advisor\nEvents affecting MY resources                    -&gt; Personal Health Dashboard\nMany accounts, one bill, guardrails              -&gt; Organizations / Control Tower</code></pre>", "toc": [{"id": "integration", "text": "Integration: passing messages between parts"}, {"id": "devtools", "text": "Developer tools: from code to running app"}, {"id": "watching", "text": "Watching and auditing: CloudWatch, CloudTrail, Config"}, {"id": "operate", "text": "Operating and advising: Systems Manager, Trusted Advisor, Health"}, {"id": "governance", "text": "Governing many accounts"}, {"id": "common-traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch13", "ch": 13, "title": "Chapter 13: Smart Services and Data (AI/ML, Analytics, Business Apps)", "short": "Can AWS read, speak and predict?", "topic": "AI/ML, analytics and business applications", "d": 3, "focus": false, "mins": 8, "html": "<p>Meera has a new idea: \"Can we caption every video automatically, translate stories into five languages, and let readers ask a chatbot for a summary?\" Kabir groans: \"Why can't we just hire more people?\" Not at PulseWire's budget.</p><p>AWS has ready-made smart services so you do not need a team of scientists. This chapter also covers analytics (finding insights in data) and a few business applications.</p><h3 id=\"s-ml\">Machine learning and AI services</h3><p><strong>Machine learning (ML)</strong> means computers learning patterns from examples instead of following hand-written rules. AWS offers it in two layers: build-your-own tools, and ready-to-use services you simply call.</p><p><strong>Amazon SageMaker</strong></p><ul><li><strong>What it is:</strong> a platform to build, train and deploy your own ML models.</li><li><strong>Use it when:</strong> your data scientists want to create custom models.</li><li><strong>Remember for the exam:</strong> the \"build your own\" ML service.</li></ul><p>Below are the ready-made AI services. Match the job to the name:</p><div class=\"tw\"><table><thead><tr><th>Service</th><th>Job</th></tr></thead><tbody><tr><td>Amazon Rekognition</td><td>Finds objects, faces and text in images and video.</td></tr><tr><td>Amazon Comprehend</td><td>Understands text: sentiment, key phrases, language (natural language processing).</td></tr><tr><td>Amazon Lex</td><td>Builds chatbots and voice bots (the technology behind Alexa).</td></tr><tr><td>Amazon Polly</td><td>Turns text into spoken audio (text to speech).</td></tr><tr><td>Amazon Transcribe</td><td>Turns speech into text (speech to text), for captions and call notes.</td></tr><tr><td>Amazon Translate</td><td>Translates text between languages.</td></tr><tr><td>Amazon Textract</td><td>Pulls text and tables out of scanned documents and forms.</td></tr><tr><td>Amazon Kendra</td><td>Intelligent search across company documents using natural language questions.</td></tr></tbody></table></div><blockquote class=\"tip\">Polly speaks (P for pronounce); Transcribe writes down what was said.</blockquote><h3 id=\"s-genai\">Generative AI, Bedrock and Amazon Q</h3><p><strong>Generative AI</strong> creates new content such as text, images or code. It is powered by <strong>foundation models (FMs)</strong>: very large models trained on huge amounts of data that can be adapted to many tasks.</p><p><strong>Amazon Bedrock</strong></p><ul><li><strong>What it is:</strong> a managed service that gives access to foundation models from several providers through one API, with no servers to run.</li><li><strong>Use it when:</strong> you want to add text generation, summarization or a chatbot to your app using a ready model, and to customize it with your own data safely.</li><li><strong>Remember for the exam:</strong> \"foundation models\" and \"generative AI\" without managing infrastructure point to Bedrock. Your data is not used to train the base models.</li></ul><p><strong>Amazon Q</strong></p><ul><li><strong>What it is:</strong> a generative-AI assistant. Amazon Q Business answers questions about your company's data; Amazon Q Developer helps write and understand code and work with AWS.</li><li><strong>Use it when:</strong> you want an assistant for employees or developers.</li><li><strong>Remember for the exam:</strong> Q is the assistant; Bedrock is the platform for building your own generative apps.</li></ul><p>A few concepts to know at this depth:</p><ul><li><strong>Prompt:</strong> the instruction or question you give the model. Better prompts give better answers (prompt engineering).</li><li><strong>Hallucination:</strong> when a model confidently states something untrue, so people should verify important answers.</li><li><strong>Responsible AI:</strong> building AI that is fair, explainable, private, safe and transparent. Watch for bias in training data, protect personal data, and keep a human in the loop for important decisions.</li></ul><h3 id=\"s-analytics\">Analytics: turning data into answers</h3><p>PulseWire stores lots of raw data in S3. These services help you ask questions of it.</p><p><strong>Amazon Athena</strong></p><ul><li><strong>What it is:</strong> runs SQL queries directly on files in S3. Serverless, pay per query.</li><li><strong>Use it when:</strong> you want a quick answer from data in S3 without loading it elsewhere.</li><li><strong>Remember for the exam:</strong> \"query S3 with SQL\" means Athena.</li></ul><p><strong>AWS Glue</strong></p><ul><li><strong>What it is:</strong> a serverless ETL service (extract, transform, load) with a data catalog that cleans and prepares data.</li><li><strong>Use it when:</strong> data must be reshaped before it can be analyzed.</li><li><strong>Remember for the exam:</strong> ETL means Glue.</li></ul><p><strong>Amazon EMR</strong></p><ul><li><strong>What it is:</strong> managed big-data clusters running tools like Apache Spark and Hadoop.</li><li><strong>Use it when:</strong> you have huge data-processing jobs using open-source big-data frameworks.</li><li><strong>Remember for the exam:</strong> \"Hadoop\" or \"Spark\" means EMR.</li></ul><p><strong>Amazon Kinesis</strong></p><ul><li><strong>What it is:</strong> handles streaming data: many small records arriving continuously, such as clicks or sensor readings.</li><li><strong>Use it when:</strong> you need real-time collection and processing of live data.</li><li><strong>Remember for the exam:</strong> \"real-time streaming\" means Kinesis.</li></ul><p><strong>Amazon OpenSearch Service</strong></p><ul><li><strong>What it is:</strong> search and log analytics engine.</li><li><strong>Use it when:</strong> you need fast text search or dashboards over logs.</li><li><strong>Remember for the exam:</strong> search and log analytics.</li></ul><p><strong>Amazon QuickSight</strong></p><ul><li><strong>What it is:</strong> business intelligence: dashboards and charts for non-technical users.</li><li><strong>Use it when:</strong> Meera wants a visual dashboard of readership.</li><li><strong>Remember for the exam:</strong> \"BI\" or \"dashboard\" means QuickSight.</li></ul><ul><li><strong>Amazon Redshift</strong> (mention): a data warehouse for fast analysis of large structured data.</li><li><strong>AWS Lake Formation</strong> (mention): helps set up and secure a data lake in S3.</li></ul><h3 id=\"s-business\">Business apps and IoT</h3><ul><li><strong>Amazon Connect:</strong> a cloud contact centre (customer-service phone and chat system). Use it to run support without buying phone hardware.</li><li><strong>Amazon SES (Simple Email Service):</strong> sends bulk and transactional email such as newsletters and receipts. PulseWire's newsletter would use it.</li><li><strong>Amazon WorkSpaces:</strong> virtual desktops in the cloud for employees (desktop as a service).</li><li><strong>Amazon AppStream 2.0</strong> (mention): streams individual desktop applications to a browser.</li><li><strong>AWS IoT Core</strong> (mention): securely connects Internet of Things devices such as sensors to the cloud.</li></ul><h3 id=\"s-common-traps\">Common traps</h3><ul><li><strong>Polly vs Transcribe.</strong> Polly turns text into speech; Transcribe turns speech into text.</li><li><strong>Comprehend vs Textract vs Rekognition.</strong> Comprehend understands text meaning; Textract extracts text from documents; Rekognition analyses images and video.</li><li><strong>SageMaker vs Bedrock.</strong> SageMaker builds and trains your own models; Bedrock uses ready foundation models.</li><li><strong>Kendra vs OpenSearch.</strong> Kendra answers natural-language questions over documents; OpenSearch is a general search and log engine.</li><li><strong>Athena vs Redshift vs QuickSight.</strong> Athena queries S3 files; Redshift is a warehouse; QuickSight draws dashboards.</li><li><strong>Kinesis vs SQS.</strong> Kinesis streams live data for real-time analysis; SQS queues messages between parts of an app.</li></ul><h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>Build and train my own ML model                 -&gt; SageMaker\nFind faces or objects in a photo or video       -&gt; Rekognition\nSentiment or key phrases in text                -&gt; Comprehend\nChatbot or voice bot                            -&gt; Lex\nText to spoken audio                            -&gt; Polly\nSpeech to text, captions                        -&gt; Transcribe\nTranslate between languages                     -&gt; Translate\nExtract text and tables from scanned forms      -&gt; Textract\nSmart search of company documents               -&gt; Kendra\nFoundation models, generative AI via one API    -&gt; Bedrock\nAI assistant for staff or coders                -&gt; Amazon Q\nSQL on S3 / ETL / Spark / live streams          -&gt; Athena / Glue / EMR / Kinesis\nBI dashboard                                    -&gt; QuickSight\nContact centre / bulk email / virtual desktops  -&gt; Connect / SES / WorkSpaces</code></pre>", "toc": [{"id": "ml", "text": "Machine learning and AI services"}, {"id": "genai", "text": "Generative AI, Bedrock and Amazon Q"}, {"id": "analytics", "text": "Analytics: turning data into answers"}, {"id": "business", "text": "Business apps and IoT"}, {"id": "common-traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch14", "ch": 14, "title": "Chapter 14: The Bill (Pricing and Cost Management)", "short": "Why did the bill double?", "topic": "Pricing, purchasing options and cost tools", "d": 4, "focus": true, "mins": 8, "html": "<p>Meera walked into the room holding a printout. \"The bill doubled last month and nobody can tell me why. Before we ship anything else, I want to understand what we pay for.\"</p>\n<p>Kabir shrugged. \"Some of that is the test servers I forgot to stop.\" As PulseWire's new cloud lead, you now own the bill. This chapter is the heart of Domain 4, so read it slowly.</p>\n<h3 id=\"s-pricing-basics\">Pricing fundamentals</h3>\n<p>AWS pricing rests on three ideas that show up constantly on the exam.</p>\n<ul>\n<li><strong>Pay as you go.</strong> No upfront contract. You pay for what you use, by the second, hour or gigabyte, and stop paying when you stop using.</li>\n<li><strong>Pay less when you reserve.</strong> Commit to a steady amount of usage for one or three years and the price per hour drops, often by up to about 70 percent or more.</li>\n<li><strong>Pay less per unit as you use more.</strong> Volume discounts. For example, S3 gets cheaper per gigabyte at higher storage tiers.</li>\n</ul>\n<p>The <strong>AWS Free Tier</strong> comes in three types:</p>\n<ul>\n<li><strong>Always free:</strong> never expires, with monthly limits (for example a small amount of Lambda requests and DynamoDB storage).</li>\n<li><strong>12 months free:</strong> starts when you open the account (for example limited EC2 and S3 usage).</li>\n<li><strong>Short-term trials:</strong> a trial period that starts when you first use the service.</li>\n</ul>\n<h3 id=\"s-ec2-purchasing\">EC2 purchasing options</h3>\n<p>The exam loves this table. Same server, different ways to pay.</p><div class=\"tw\"><table><thead><tr><th>Option</th><th>Pay how</th><th>Best for</th></tr></thead><tbody><tr><td><strong>On-Demand</strong></td><td>Per second or hour, no commitment</td><td>Unpredictable or short-term workloads, first-time testing</td></tr><tr><td><strong>Reserved Instances (RI)</strong></td><td>1 or 3 year commitment, big discount</td><td>Steady, predictable workloads</td></tr><tr><td><strong>Savings Plans</strong></td><td>Commit to a dollar amount per hour for 1 or 3 years</td><td>Steady usage with flexibility to change</td></tr><tr><td><strong>Spot Instances</strong></td><td>Spare capacity at up to about 90 percent off; AWS can take it back with short notice</td><td>Fault-tolerant, flexible jobs (batch, rendering, analysis)</td></tr><tr><td><strong>Dedicated Hosts</strong></td><td>A whole physical server for you</td><td>Bring-your-own server-bound licenses, compliance rules</td></tr><tr><td><strong>Dedicated Instances</strong></td><td>Instances on hardware used only by your account</td><td>Isolation from other customers, less control than a Host</td></tr><tr><td><strong>Capacity Reservations</strong></td><td>Reserve capacity in one AZ, billed at On-Demand rates</td><td>Guaranteeing that servers are available when you need them</td></tr></tbody></table></div>\n<ul>\n<li><strong>Reserved Instances</strong> come as <strong>Standard</strong> (largest discount, limited changes) and <strong>Convertible</strong> (smaller discount, you can swap to a different instance family).</li>\n<li><strong>Savings Plans</strong> come as <strong>Compute</strong> (most flexible: applies across instance families, Regions, and even Fargate and Lambda) and <strong>EC2 Instance</strong> (a bigger discount, tied to one instance family in one Region).</li>\n<li><strong>Remember for the exam:</strong> Spot is cheapest but can be interrupted. A Capacity Reservation guarantees capacity, not a discount. Reserved and Savings Plans give the discount for steady use.</li>\n</ul>\n<h3 id=\"s-data-transfer\">Data transfer rules</h3>\n<p>Kabir's favorite question: \"Why are we paying just to move data?\" Here is the pattern.</p>\n<ul>\n<li><strong>Data in</strong> to AWS from the internet is free.</li>\n<li><strong>Data out</strong> to the internet is charged, with volume discounts.</li>\n<li
