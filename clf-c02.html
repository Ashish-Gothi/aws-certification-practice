
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLF-C02 Study Path — AWS Certified Cloud Practitioner practice and mock exam</title>
<meta name="description" content="Free study path for the AWS Certified Cloud Practitioner (CLF-C02) exam: a diagnostic, domain practice drills with every option explained, and a timed 65-question mock exam.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FA; --bg2:#FFFFFF; --surface:#FFFFFF; --surface2:#F0F3F7; --sunk:#EBEFF4;
  --line:#E0E5EC; --line2:#C9D1DC; --ink:#111823; --ink2:#2E3A4A; --muted:#5D6878; --label:#2F5DA8;
  --accent:#1F4E99; --accent-ink:#FFFFFF; --accent-soft:#E8EFFA; --link:#1F4E99;
  --hl:#EEF4FC; --hl-line:#8FB0E0; --ready:#EEF8F2; --ready-line:#9ACFB2; --green:#16804F;
  --amber:#A65F00; --amber-soft:#FBEFD9; --ok:#16804F; --ok-soft:#E3F3EA; --bad:#B0342C; --bad-soft:#FBE7E5;
  --d1:#2F6FE0; --d2:#16975F; --d3:#7A4BD8; --d4:#C77A10;
  --shadow:0 6px 18px rgba(31,78,153,.18);
  --display:"Space Grotesk",-apple-system,"Segoe UI",Roboto,sans-serif;
  --sans:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:4px;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#10151C; --bg2:#0B0F14; --surface:#171D26; --surface2:#1C2330; --sunk:#131922;
  --line:#252D39; --line2:#36404F; --ink:#E7ECF2; --ink2:#C3CCD7; --muted:#8E99A8; --label:#8DB3E8;
  --accent:#A8C7F2; --accent-ink:#0D1A2C; --accent-soft:#1A2638; --link:#9DC0F0;
  --hl:#172539; --hl-line:#4A6C99; --ready:#11231C; --ready-line:#2B5C45; --green:#4BD18B;
  --amber:#E9A94B; --amber-soft:#2E2412; --ok:#4BD18B; --ok-soft:#10291D; --bad:#F07A70; --bad-soft:#341716;
  --d1:#4C86F0; --d2:#2DBE7E; --d3:#9B6CF0; --d4:#F0A030;
  --shadow:0 6px 22px rgba(168,199,242,.22); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#10151C; --bg2:#0B0F14; --surface:#171D26; --surface2:#1C2330; --sunk:#131922;
  --line:#252D39; --line2:#36404F; --ink:#E7ECF2; --ink2:#C3CCD7; --muted:#8E99A8; --label:#8DB3E8;
  --accent:#A8C7F2; --accent-ink:#0D1A2C; --accent-soft:#1A2638; --link:#9DC0F0;
  --hl:#172539; --hl-line:#4A6C99; --ready:#11231C; --ready-line:#2B5C45; --green:#4BD18B;
  --amber:#E9A94B; --amber-soft:#2E2412; --ok:#4BD18B; --ok-soft:#10291D; --bad:#F07A70; --bad-soft:#341716;
  --d1:#4C86F0; --d2:#2DBE7E; --d3:#9B6CF0; --d4:#F0A030;
  --shadow:0 6px 22px rgba(168,199,242,.22); color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg2)}
a{color:var(--link);text-decoration-thickness:1px;text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.lbl{font:500 11.5px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--label)}
.lbl.m{color:var(--muted)}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;letter-spacing:-.01em;margin:0;font-weight:600}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg2);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:24px;height:72px;max-width:none}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font:600 18px var(--display);white-space:nowrap}
.logo{font:700 15px/1 var(--display);letter-spacing:-.02em;padding:5px 7px 4px;background:var(--accent);color:var(--accent-ink);transform:skew(-6deg);border-radius:2px}
.certpill{font:500 11.5px var(--mono);letter-spacing:.1em;padding:9px 12px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:10px}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;align-items:center}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 6px;color:var(--ink2);text-decoration:none;font:500 14.5px var(--display);white-space:nowrap;border-bottom:2px solid transparent}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.nav .sep{width:1px;height:16px;background:var(--line2);margin:0 8px}
.tools{display:flex;align-items:center;gap:10px}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;background:transparent;border:1px solid transparent;color:var(--ink2);cursor:pointer;border-radius:var(--r)}
.iconbtn:hover{border-color:var(--line2);color:var(--ink)}
.theme-dark{display:none}
:root[data-theme="dark"] .theme-dark{display:block} :root[data-theme="dark"] .theme-light{display:none}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .theme-dark{display:block} :root:not([data-theme="light"]) .theme-light{display:none} }

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 18px;border-radius:var(--r);border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:600 14px var(--display);text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.light{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn.lg{min-height:48px;padding:0 32px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none;box-shadow:none}

main{display:block;padding-bottom:72px}
.page{padding-top:40px}
.crumb{font:500 11.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
.crumb a{color:var(--muted);text-decoration:none}
.crumb b{color:var(--label);font-weight:500}

/* footer */
footer{background:var(--bg2);border-top:1px solid var(--line)}
.ft{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px;padding:36px 32px;max-width:1240px;margin:0 auto}
.ft .b{font:500 15px var(--display)}
.ft .c{font:500 11px var(--mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-top:6px}
.ft nav{display:flex;flex-wrap:wrap;gap:12px 28px}
.ft nav a{font:500 11.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);text-decoration:none}
.ft nav a:hover{color:var(--ink)}
.ft2{border-top:1px solid var(--line);text-align:center;padding:16px 32px;font:500 11.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* home head */
.jhead{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding:36px 0 28px}
.jhead h1{font-size:clamp(34px,4.6vw,46px);margin:6px 0 6px;letter-spacing:-.02em}
.jhead .sub{font:500 17px var(--display);color:var(--ink2)}

/* journey cards */
.jcards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:relative}
.jcard{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);padding:20px 20px 16px;min-height:228px;color:var(--ink);text-decoration:none}
a.jcard:hover{border-color:var(--line2)}
.jcard .h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.jcard h3{font-size:18px}
.jcard .h svg{color:var(--ink2)}
.jcard p{margin:0 0 12px;color:var(--ink2);font-size:14px;line-height:1.55}
.jcard .stat{font:600 20px var(--display);margin:auto 0 2px}
.jcard .stat small{display:block;font:400 13px var(--sans);color:var(--muted)}
.jcard .f{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.jcard .stat+.f{margin-top:12px}
.jcard.hl{background:var(--hl);border-color:var(--hl-line)}
.jcard.ready{background:var(--ready);border-color:var(--ready-line)}
.jcard.ready .h svg{color:var(--green)}
.jcard.ready .ext{color:var(--green);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;margin-top:auto;padding-bottom:12px}
.jcard.done .h svg{color:var(--green)}
.jcard .arrow{position:absolute;right:-17px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--bg);border:1px solid var(--line2);display:grid;place-items:center;z-index:2;color:var(--ink2)}
.prog{height:3px;background:var(--line);margin:10px 0 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}

/* about */
.about{max-width:860px;padding-top:56px;margin-top:56px;border-top:1px solid var(--line)}
.about h2{font-size:28px;margin:8px 0 18px}
.about h3{font-size:20px;margin:44px 0 14px}
.about p{color:var(--ink2);font-size:16px;line-height:1.7;margin:0 0 14px;max-width:72ch}
.facts{width:100%;border-collapse:collapse;border:1px solid var(--line);background:var(--surface);font-size:14px}
.facts th,.facts td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.facts th{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);width:200px;font-weight:500}
.facts tr:last-child th,.facts tr:last-child td{border-bottom:0}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.bpd{margin:26px 0 0}
.bpd h4{font-size:16px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bpd h4 .sq{width:10px;height:10px;display:inline-block}
.bpd h4 .w{font:500 12px var(--mono);color:var(--muted);font-weight:500;letter-spacing:0}
.bpd a{display:flex;justify-content:space-between;gap:16px;padding:6px 0;color:var(--ink2);text-decoration:none;font-size:14.5px}
.bpd a:hover{color:var(--ink)}
.bpd a span:last-child{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plan article{background:var(--surface);border:1px solid var(--line);padding:18px 20px}
.plan h4{font-size:16px;margin:6px 0 8px}
.plan ul{margin:0;padding-left:18px;color:var(--ink2);font-size:14.5px}
.plan li{margin:4px 0}
.faq{display:grid;gap:12px}
.faq details{background:var(--surface);border:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;padding:20px 22px;font:600 15px var(--display);display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";width:8px;height:8px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);margin-top:4px;transition:transform .15s}
.faq details[open] summary::after{transform:rotate(-135deg);margin-top:8px}
.faq details p{margin:0;padding:0 22px 20px;color:var(--ink2);font-size:15px}

/* shell with curriculum sidebar */
.shell{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:calc(100vh - 72px)}
.shell.collapsed{grid-template-columns:0 minmax(0,1fr)}
.sbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);align-self:start;height:calc(100vh - 72px);background:var(--bg2);border-right:1px solid var(--line);overflow:hidden}
.sbar .in{height:100%;overflow-y:auto;padding:28px 20px 40px 24px;width:288px}
.shell.collapsed .sbar .in{visibility:hidden}
.sbtoggle{position:absolute;right:-14px;top:24px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);background:var(--bg);display:grid;place-items:center;cursor:pointer;z-index:3;color:var(--ink2)}
.sbwrap{position:relative}
.shell.collapsed .sbtoggle svg{transform:rotate(180deg)}
.sp-row{display:flex;justify-content:space-between;font:500 12px var(--mono);color:var(--ink2);margin:14px 0 6px}
.sbar .prog{margin:0 0 28px}
.sbar .ov{display:block;font:600 15px var(--display);color:var(--link);text-decoration:none;margin:14px 0 10px}
.sbar .ov[aria-current="page"]{color:var(--ink)}
.cg{margin:4px 0}
.cg summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:10px 22px 1fr 14px;gap:8px;align-items:start;padding:7px 0;font:600 14.5px/1.35 var(--display);color:var(--ink)}
.cg summary::-webkit-details-marker{display:none}
.cg summary .dot{width:7px;height:7px;border-radius:50%;margin-top:6px}
.cg summary .n{font:500 12px/1.9 var(--mono);color:var(--muted);font-weight:500}
.cg summary .cv{width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);margin-top:6px}
.cg[open] summary .cv{transform:rotate(-135deg);margin-top:9px}
.cg ol{list-style:none;margin:2px 0 10px 14px;padding:0 0 0 10px;border-left:1px solid var(--line)}
.cg li a{display:grid;grid-template-columns:30px 1fr 12px;gap:6px;align-items:start;padding:6px 6px;color:var(--ink2);text-decoration:none;font-size:14px;line-height:1.4}
.cg li a:hover{color:var(--ink)}
.cg li a[aria-current="page"]{color:var(--link);background:var(--accent-soft)}
.cg li a .n{font:500 12px/1.65 var(--mono);color:var(--muted)}
.tick{width:12px;height:12px;border-radius:50%;border:1px solid var(--line2);margin-top:3px}
.tick.on{background:var(--green);border-color:var(--green)}
.mainc{min-width:0;padding:40px 48px 0}
.mainc .inner{max-width:960px}

/* learn overview */
.lhead h1{font-size:clamp(28px,3.4vw,34px);margin-bottom:10px}
.lhead .sub{font-size:17px;color:var(--ink2);margin:0 0 14px}
.lhead .meta{font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-bottom:22px}
.lhead p{color:var(--ink2);max-width:68ch;margin:0 0 36px}
.dcards{display:grid;gap:16px}
.dcard{display:block;background:var(--surface);border:1px solid var(--line);padding:22px;color:var(--ink);text-decoration:none}
.dcard:hover{border-color:var(--line2)}
.dcard .h{display:flex;align-items:center;gap:12px;justify-content:space-between}
.dcard .h .l{display:flex;align-items:center;gap:12px}
.dcard h3{font-size:18px}
.badge{font:600 11.5px var(--mono);padding:3px 6px;color:#fff;letter-spacing:.02em}
.dcard .w{font:500 12px var(--mono);color:var(--ink2)}
.dcard p{margin:10px 0 0;color:var(--ink2);font-size:15px}
.dcard .ls{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:2px}
.dcard .ls a{display:grid;grid-template-columns:36px 1fr auto;gap:10px;padding:6px 0;color:var(--ink2);text-decoration:none;font-size:14.5px}
.dcard .ls a:hover{color:var(--link)}
.dcard .ls .n{font:500 12px/1.9 var(--mono);color:var(--muted)}
.dcard .ls .r{font:500 12px var(--mono);color:var(--muted);display:flex;gap:10px;align-items:center;white-space:nowrap}
.dcard .cnt{font:500 11.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-top:14px}
.ctaband{margin-top:48px;background:var(--hl);border:1px solid var(--hl-line);padding:32px;display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center}
.ctaband h2{font-size:24px;margin-bottom:8px}
.ctaband p{margin:0;color:var(--ink2);max-width:60ch}

/* reader */
.reader{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:48px}
.toc{position:sticky;top:112px;align-self:start;font-size:13.5px;max-height:calc(100vh - 140px);overflow:auto}
.toc .lbl{margin-bottom:12px;display:block}
.toc button{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid var(--line);padding:5px 0 5px 12px;color:var(--muted);cursor:pointer;line-height:1.35}
.toc button:hover{color:var(--ink)}
.toc button.on{border-left-color:var(--accent);color:var(--ink)}
.article{max-width:74ch;min-width:0}
.article h1{font-size:clamp(28px,3.4vw,38px);margin:4px 0 10px;letter-spacing:-.02em}
.article .sub{color:var(--muted);font-size:14px;margin-bottom:30px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.prose{font-size:16.5px;line-height:1.72;color:var(--ink2)}
.prose p{margin:0 0 1.05em}
.prose strong{color:var(--ink);font-weight:600}
.prose h3{font-size:22px;margin:2.2em 0 .7em;color:var(--ink)}
.prose h4{font-size:18px;margin:1.6em 0 .5em;color:var(--ink)}
.prose ul,.prose ol{padding-left:1.3em;margin:0 0 1.1em}
.prose li{margin:.35em 0}
.prose code{font:13.5px var(--mono);background:var(--surface2);padding:1px 5px;color:var(--ink)}
.prose pre{background:var(--bg2);border:1px solid var(--line);padding:16px 18px;overflow-x:auto;margin:0 0 1.3em;font:13px/1.6 var(--mono);color:var(--ink)}
.prose pre code{background:none;padding:0;font-size:inherit}
.prose .tw{overflow-x:auto;margin:0 0 1.4em;border:1px solid var(--line);background:var(--surface)}
.prose table{border-collapse:collapse;font-size:14px;line-height:1.5;min-width:100%}
.prose th,.prose td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.prose th{background:var(--surface2);font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.prose td{color:var(--ink2)}
.prose tr:last-child td{border-bottom:0}
.prose blockquote{margin:0 0 1.3em;padding:14px 18px;border-left:3px solid var(--line2);background:var(--surface)}
.prose blockquote p:last-child{margin-bottom:0}
.prose blockquote.voice{border-left-color:var(--amber);font-style:italic}
.prose blockquote.voice .who{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;font-style:normal;color:var(--amber);margin-right:8px}
.prose blockquote.tip{border-left-color:var(--accent);background:var(--hl);color:var(--ink)}
.focus{display:inline-block;vertical-align:middle;font:500 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--amber);border:1px solid var(--amber);padding:4px 6px;margin-left:8px}
.dtag{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono);color:var(--ink2)}
.dtag i{width:8px;height:8px;display:inline-block}
.lfoot{margin-top:48px;padding-top:24px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.pn a{display:block;padding:14px 16px;border:1px solid var(--line);text-decoration:none;color:var(--ink);background:var(--surface);font:600 15px var(--display)}
.pn a:hover{border-color:var(--line2)}
.pn small{display:block;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.pn .nx{text-align:right;grid-column:2}
.mobile-cur{display:none}

/* question */
.qcard{background:var(--surface);border:1px solid var(--line);padding:24px;margin:0 0 16px}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 16px;font:500 11.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;align-items:center}
.qmeta .dtag{text-transform:none;letter-spacing:0}
.qtext{font-size:16.5px;line-height:1.65;margin:0 0 6px;max-width:74ch;color:var(--ink)}
.qsel{font:600 14px var(--display);margin:10px 0 16px;color:var(--label)}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;line-height:1.55;font-size:15px;color:var(--ink);transition:border-color .12s,background .12s;border-radius:var(--r)}
.opt:not([disabled]):hover{border-color:var(--line2)}
.opt .ltr{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font:500 12px var(--mono);color:var(--muted);margin-top:-2px}
.opt.multi .ltr{border-radius:4px}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .ltr{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .ltr{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .ltr{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.opt .why{display:block;margin-top:6px;font-size:14px;color:var(--ink2)}
.opt .why b{font-weight:600;color:var(--ink)}
.qact{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.verdict{font:600 16px var(--display);display:flex;align-items:center;gap:8px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.reflex{margin-top:14px;padding:12px 14px;background:var(--hl);border-left:3px solid var(--accent);font-size:14.5px;color:var(--ink)}
.reflex b{font-weight:600}
.practice-block{margin-top:56px}
.practice-block h2{font-size:24px;margin:6px 0 6px}

/* generic page head (diagnostic, practice, results) */
.phead{padding:40px 0 24px}
.phead h1{font-size:clamp(30px,4vw,42px);letter-spacing:-.02em}
.phead p{color:var(--ink2);margin:12px 0 0;max-width:66ch;font-size:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
.chip{min-height:34px;padding:0 14px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font:500 13px var(--display);display:inline-flex;align-items:center;gap:8px;color:var(--ink2);border-radius:var(--r)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip i{width:8px;height:8px}
.progress{height:3px;background:var(--line);overflow:hidden;margin:8px 0 20px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.two{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);padding:22px}
.panel h3{font-size:17px;margin-bottom:14px}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);text-align:right}
.bar{height:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%}
.dbars{display:grid;gap:16px}
.dbar .lb{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;margin-bottom:7px;flex-wrap:wrap}
.dbar .lb > span:last-child{font-family:var(--mono);color:var(--muted);white-space:nowrap;font-size:12.5px}
.pill{display:inline-block;font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 7px;border:1px solid currentColor}
.pill.ok{color:var(--ok);background:var(--ok-soft)} .pill.bad{color:var(--bad);background:var(--bad-soft)}
.empty{padding:40px;text-align:center;background:var(--surface);border:1px dashed var(--line2);color:var(--ink2)}

/* mock landing */
.mock{max-width:780px;margin:0 auto;padding-top:40px;text-align:center}
.mock .crumb{text-align:left}
.mock h1{font-size:clamp(44px,7vw,68px);letter-spacing:-.03em;margin:10px 0 22px}
.mock .intro{font-size:18px;line-height:1.65;color:var(--ink2);max-width:540px;margin:0 auto}
.stats{display:flex;justify-content:center;flex-wrap:wrap;gap:16px 40px;margin:40px 0 36px}
.stats b{display:block;font:600 32px/1 var(--display);letter-spacing:-.02em;margin-bottom:10px}
.stats span{font:500 11.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.mock .acts{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-bottom:56px}
.box{text-align:left;background:var(--surface);border:1px solid var(--line);padding:30px 32px;margin-bottom:24px}
.box h2{font-size:20px;margin-bottom:14px}
.box ul{margin:0 0 16px;padding-left:20px;color:var(--ink2);font-size:16px}
.box li{margin:7px 0}
.box p{color:var(--ink2);font-size:14.5px;margin:0 0 12px}
.box.icon{display:grid;grid-template-columns:28px 1fr;gap:10px}
.box.icon svg{color:var(--green);margin-top:2px}
.foot-note{font-size:12.5px;color:var(--ink2);max-width:460px;margin:12px auto 0;line-height:1.5}
table.att{width:100%;border-collapse:collapse;font-size:14px}
table.att th,table.att td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left}
table.att th{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
table.att td.mono{font-family:var(--mono)}

/* exam */
.exam{min-height:100vh;display:flex;flex-direction:column}
.ebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg2);border-bottom:1px solid var(--line)}
.ebar .wrap{display:flex;align-items:center;gap:16px;height:64px}
.ebar .title{font:600 16px var(--display);white-space:nowrap;display:flex;align-items:center;gap:10px}
.ebar .count{font:500 11.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.timer{font:500 17px var(--mono);padding:6px 12px;background:var(--surface);border:1px solid var(--line);min-width:96px;text-align:center}
.timer.low{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.ebar .sp{flex:1}
.ebody{flex:1;padding:32px 0 120px}
.ebody .wrap{max-width:880px}
.efoot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.efoot .wrap{max-width:880px;display:flex;align-items:center;gap:10px;height:66px}
.efoot .sp{flex:1}
.flagbtn[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.grid-nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.grid-nav button{height:40px;border:1px solid var(--line2);background:var(--surface);font:500 12.5px var(--mono);cursor:pointer;position:relative;color:var(--ink2);border-radius:var(--r)}
.grid-nav button.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.grid-nav button.cur{outline:2px solid var(--accent);outline-offset:1px}
.grid-nav button.flg::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted);margin:12px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border:1px solid var(--line2);display:inline-block}
dialog{border:1px solid var(--line2);padding:0;max-width:540px;width:calc(100% - 32px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(5,8,12,.6)}
dialog .db{padding:24px}
dialog h2{font-size:20px;margin-bottom:8px}
dialog .da{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--line)}
.navpanel{margin-top:28px}
.navpanel summary{font:500 11.5px var(--mono);letter-spacing:.12em;text-transform:uppercase}

/* results */
.score{display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:center;background:var(--surface);border:1px solid var(--line);padding:28px}
.score .big{font:600 64px/1 var(--display);letter-spacing:-.03em}
.score .big small{font:500 18px var(--mono);color:var(--muted)}
.scale{position:relative;height:8px;background:var(--line);margin:18px 0 8px}
.scale i{position:absolute;left:0;top:0;bottom:0}
.scale .pm{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.scale-l{position:relative;height:18px;font:500 11.5px var(--mono);color:var(--muted)}
.scale-l span{position:absolute;top:0;white-space:nowrap}
.rv details{background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
.rv summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:14px 18px}
.rv summary::-webkit-details-marker{display:none}
.rv summary .n{font:500 13px var(--mono);color:var(--muted)}
.rv summary .q{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:14.5px;color:var(--ink2)}
.rv details .qcard{border:0;border-top:1px solid var(--line);margin:0}
h2.sec{font-size:22px;margin:44px 0 6px}

@media (max-width:1180px){ .reader{grid-template-columns:minmax(0,1fr)} .toc{display:none} }
@media (max-width:1060px){
  .jcards{grid-template-columns:1fr 1fr;gap:12px}

}

  .wrap{padding:0 20px}

  .sbwrap{display:none}
  .mobile-cur{display:block;margin:0 0 24px;background:var(--surface);border:1px solid var(--line)}
  .mobile-cur > summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font:600 14px var(--display)}
  .mobile-cur > summary::-webkit-details-marker{display:none}
  .mobile-cur .in{padding:0 16px 12px}
  .mainc{padding:28px 20px 0}
  .two{grid-template-columns:1fr}
  .plan{grid-template-columns:1fr}
  .score{grid-template-columns:1fr;gap:16px}
  .jhead{flex-direction:column}
}
@media (max-width:640px){
  .top .wrap{gap:4px 10px;flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:4px}
  .top .tools .btn{display:none}
  .nav{order:3;flex-basis:100%;margin:0 -6px}
  .nav .sep{display:none}
  .nav a{padding:8px 6px;font-size:14px}
  .tools{margin-left:auto}
  .jcards{grid-template-columns:1fr}
  .jcard{min-height:0}
  .jcard .arrow{right:50%;top:auto;bottom:-17px;transform:translateX(50%) rotate(90deg)}
  .jcard:nth-child(2) .arrow{display:grid}
  .facts th{width:auto;display:block;border-bottom:0;padding-bottom:0}
  .facts td{display:block}
  .facts tr{display:block;border-bottom:1px solid var(--line)}
  .facts tr td{border-bottom:0}
  .qcard{padding:18px}
  .opt{padding:12px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:28px 12px}
  .box{padding:22px 20px}
  .ctaband{padding:24px}
  .pn{grid-template-columns:1fr}.pn .nx{grid-column:1}
  .ebar .title{display:none}
  .ebar .count{display:none}
  .dcard .ls a{grid-template-columns:32px 1fr}
  .dcard .ls .r{grid-column:2}
  .ft,.ft2{padding-left:20px;padding-right:20px}
}

.certsw{position:relative}
.certsw>summary{list-style:none;cursor:pointer;user-select:none}
.certsw>summary::-webkit-details-marker{display:none}
.certsw .cv{width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);margin-top:-3px}
.certsw[open]>summary{border-color:var(--accent)}
.certmenu{position:absolute;top:calc(100% + 6px);left:0;min-width:300px;background:var(--surface);border:1px solid var(--line2);box-shadow:0 12px 28px rgba(17,24,35,.16);z-index:60;padding:6px}
.certmenu a{display:block;padding:10px 12px;color:var(--ink);text-decoration:none}
.certmenu a:hover{background:var(--surface2)}
.certmenu a[aria-current="true"]{background:var(--accent-soft)}
.certmenu b{display:block;font:500 12px var(--mono);letter-spacing:.1em}
.certmenu span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<script>
const LESSONS=[{"id": "start", "ch": null, "title": "How to use this guide", "short": "How to use this guide", "topic": "", "d": 0, "focus": false, "mins": 3, "html": "<p>You will learn CLF-C02 through one company: <strong>PulseWire</strong>, a news and creator startup that is moving to AWS. Each chapter starts with a business situation, explains the idea in plain language, and then names the AWS service or term the exam uses.</p>\n<p><strong>The cast</strong></p>\n<ul>\n<li><strong>Meera</strong>, founder and CEO of PulseWire. She speaks in business needs: “the bill doubled”, “we must pass the audit”, “Europe is slow”.</li>\n<li><strong>Kabir</strong>, the engineer. He asks “why can’t we just…?” and keeps the explanations honest.</li>\n<li><strong>You</strong>, PulseWire’s new cloud lead. You answer both of them, and the exam asks you the same kinds of questions.</li>\n</ul>\n<h3 id=\"s-what-the-exam-checks\">What the exam checks</h3>\n<p>Cloud Practitioner is a foundational exam. It checks that you recognise the right AWS idea or service for a situation. It does not ask you to configure anything. Four domains, weighted by AWS:</p>\n<div class=\"tw\"><table>\n<thead><tr><th>Domain</th><th>Weight</th><th>Chapters</th></tr></thead>\n<tbody>\n<tr><td>Cloud Concepts</td><td>24%</td><td>1–3</td></tr>\n<tr><td>Security and Compliance</td><td>30%</td><td>4–6</td></tr>\n<tr><td>Cloud Technology and Services</td><td>34%</td><td>7–13</td></tr>\n<tr><td>Billing, Pricing, and Support</td><td>12%</td><td>14–15</td></tr>\n</tbody></table></div>\n<h3 id=\"s-how-to-study\">How to study</h3>\n<ol>\n<li>Take the <strong>diagnostic</strong> to see which domains are weakest.</li>\n<li>Read the chapters in order. Each ends with a <strong>Decision tree</strong>: the “if the question says X, pick Y” reflexes.</li>\n<li>Answer the <strong>practice questions</strong> at the bottom of a chapter, and read the explanation for every option, including the ones you got right.</li>\n<li>Read the <strong>Exam reflexes</strong> appendix in your last week.</li>\n<li>Sit the <strong>mock exam</strong> in one 90-minute session. Aim for 800 or more before you book.</li>\n</ol>\n<blockquote class=\"tip\">Most wrong answers on this exam are look-alike services. When two answers seem right, ask what the question is really about: who is responsible, what it costs, or which service does that exact job.</blockquote>\n<h3 id=\"s-time-needed\">How long it takes</h3>\n<p>Allow 15–25 hours if AWS is new to you, or 8–12 if you already work with it. About an hour a day for two weeks is a comfortable pace.</p>", "toc": [{"id": "what-the-exam-checks", "text": "What the exam checks"}, {"id": "how-to-study", "text": "How to study"}, {"id": "time-needed", "text": "How long it takes"}]}, {"id": "ch1", "ch": 1, "title": "Chapter 1: Why the cloud? (Cloud value and models)", "short": "Why would anyone rent computers?", "topic": "Cloud value proposition and models", "d": 1, "focus": false, "mins": 7, "html": "<p>It is your first Monday as PulseWire's cloud lead. Meera, the founder, walks over with a printout. &quot;We have a viral video launch in three weeks. Last time our servers fell over and we lost a day of readers. Everyone says we should be in the cloud. Tell me why, in business terms.&quot;</p><p>Kabir, the engineer, leans on the desk. &quot;Why can't we just buy more servers?&quot; Good question. By the end of this chapter you will be able to answer both of them, and you will know the vocabulary the exam loves to mix up.</p><h3 id=\"s-value-of-cloud\">The value of cloud computing</h3><p><strong>Cloud computing</strong> means renting IT resources (computing power, storage, databases, networking) over the internet and paying only for what you use, instead of buying and running your own equipment. Think of electricity: you do not build a power plant, you plug in and get a bill.</p><p>AWS describes the benefits in a handful of ideas. The exam uses these words directly, so learn them:</p><ul><li><strong>Pay-as-you-go pricing:</strong> no big upfront purchase. You pay for what you consume, and you stop paying when you stop using.</li><li><strong>Economies of scale:</strong> AWS buys hardware and runs data centers at enormous volume, so its cost per unit is lower than yours would be. Those savings are passed on as lower prices.</li><li><strong>Stop guessing capacity:</strong> you no longer predict next year's traffic and buy for it. You scale up or down as needed.</li><li><strong>Speed and agility:</strong> a new server or database takes minutes, not weeks. Teams can try ideas quickly and drop the ones that fail.</li><li><strong>Stop spending money on running data centers:</strong> your people work on the product (articles, videos, readers) instead of racking servers and managing cooling.</li><li><strong>Go global in minutes:</strong> you can deploy close to users around the world with a few clicks.</li></ul><blockquote class=\"voice\"><span class=\"who\">Kabir</span>So the pitch is: we stop owning hardware and start renting speed?</blockquote><p>Exactly. For Meera: the launch can be handled by temporarily using more capacity, and the bill returns to normal afterward.</p><h3 id=\"s-capex-opex\">CapEx versus OpEx</h3><p>Finance people already know this split, and the exam tests it.</p><div class=\"tw\"><table><thead><tr><th></th><th>Capital expenditure (CapEx)</th><th>Operational expenditure (OpEx)</th></tr></thead><tbody><tr><td>Meaning</td><td>Big upfront spend on assets you own</td><td>Ongoing spend on services you consume</td></tr><tr><td>Example</td><td>Buying 50 servers and a data center room</td><td>Paying an AWS bill each month</td></tr><tr><td>Risk</td><td>You may buy too much or too little</td><td>You pay for actual use</td></tr><tr><td>Model</td><td>Traditional on-premises</td><td>Cloud pay-as-you-go</td></tr></tbody></table></div><ul><li><strong>What it is:</strong> the cloud turns a large fixed cost (CapEx) into a variable cost (OpEx).</li><li><strong>Use it when:</strong> a question mentions avoiding upfront investment or paying only for what is used.</li><li><strong>Remember for the exam:</strong> cloud = trade fixed expense for variable expense. Variable expense follows demand.</li></ul><h3 id=\"s-service-models\">Cloud computing models: IaaS, PaaS, SaaS</h3><p>These describe <em>how much of the stack the provider manages for you</em>. Picture a pizza: making it from scratch at home, buying a kit, or ordering it delivered.</p><div class=\"tw\"><table><thead><tr><th>Model</th><th>You manage</th><th>Provider manages</th><th>Example</th></tr></thead><tbody><tr><td>IaaS (Infrastructure as a Service)</td><td>Operating system, apps, data</td><td>Servers, storage, networking</td><td>Amazon EC2</td></tr><tr><td>PaaS (Platform as a Service)</td><td>Your application and data</td><td>Servers, OS, runtime, scaling</td><td>AWS Elastic Beanstalk</td></tr><tr><td>SaaS (Software as a Service)</td><td>Just your use of it and your data</td><td>Everything else</td><td>Web-based email or a hosted CRM product</td></tr></tbody></table></div><ul><li><strong>Use it when:</strong> IaaS for maximum control, PaaS to focus on code only, SaaS when you just want a finished product.</li><li><strong>Remember for the exam:</strong> more control means more responsibility. EC2 is the classic IaaS example.</li></ul><h3 id=\"s-deployment-models\">Deployment models: cloud, hybrid, on-premises</h3><ul><li><strong>Cloud (all-in):</strong> everything runs in the cloud. Some apps are built there from scratch, others are migrated over.</li><li><strong>On-premises (private cloud):</strong> everything runs in your own data center. You get full control but carry all the cost and work.</li><li><strong>Hybrid:</strong> a mix. Some resources stay on-premises (maybe for legal or latency reasons) while others run on AWS, connected together.</li></ul><p><strong>Remember for the exam:</strong> if a company must keep some data in its own building but wants cloud for the rest, the answer is <strong>hybrid</strong>.</p><h3 id=\"s-vocabulary\">Availability and scaling vocabulary</h3><p>These four terms sound alike and appear in tricky questions.</p><div class=\"tw\"><table><thead><tr><th>Term</th><th>Plain meaning</th><th>Example</th></tr></thead><tbody><tr><td>Scalability</td><td>The system can grow (or shrink) to handle more load</td><td>Moving from 2 servers to 20 as readers grow</td></tr><tr><td>Elasticity</td><td>Growing and shrinking <em>automatically</em> with demand, so you do not overpay</td><td>Extra servers appear at launch time and disappear at night</td></tr><tr><td>High availability</td><td>The system stays up with minimal downtime, even if a part fails</td><td>Running in more than one location so one failure does not stop the site</td></tr><tr><td>Fault tolerance</td><td>The system keeps working with <em>no interruption</em> even when a component fails</td><td>A backup component takes over instantly, users notice nothing</td></tr></tbody></table></div><ul><li><strong>Remember for the exam:</strong> scalability is the ability to grow; elasticity is doing it automatically in both directions. Fault tolerance is stricter than high availability: zero interruption versus quick recovery.</li><li>In AWS, elasticity is delivered by services such as <strong>Auto Scaling</strong>, and availability comes from using multiple locations.</li></ul><h3 id=\"s-traps\">Common traps</h3><ul><li>Mixing up <strong>scalability</strong> and <strong>elasticity</strong>. If the question says &quot;automatically&quot; or &quot;match demand&quot;, pick elasticity.</li><li>Picking fault tolerance when the question only needs <strong>high availability</strong> (limited downtime acceptable).</li><li>Thinking cloud means <em>no</em> responsibility. You still manage your data and configuration.</li><li>Calling cloud spending CapEx. Cloud spending is <strong>OpEx</strong>.</li><li>Confusing hybrid with multi-cloud. Hybrid means on-premises plus cloud.</li><li>Assuming IaaS means less work than SaaS. SaaS is the least work for you.</li></ul><h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>If the question says...                                   -&gt; pick\nPay only for what you use / no upfront cost               -&gt; Pay-as-you-go (OpEx)\nLower cost per unit because of huge volume               -&gt; Economies of scale\nResources grow AND shrink automatically with demand       -&gt; Elasticity\nAbility to handle more load (grow bigger)                 -&gt; Scalability\nStay up with minimal downtime if something fails          -&gt; High availability\nNo interruption at all when a component fails             -&gt; Fault tolerance\nFull control of OS and servers, rented                    -&gt; IaaS (EC2)\nJust upload code, provider handles the platform           -&gt; PaaS (Elastic Beanstalk)\nFinished software used as a product                       -&gt; SaaS\nSome systems stay in own data center, some in AWS         -&gt; Hybrid deployment\nBuy hardware upfront vs ongoing bill                      -&gt; CapEx vs OpEx</code></pre>", "toc": [{"id": "value-of-cloud", "text": "The value of cloud computing"}, {"id": "capex-opex", "text": "CapEx versus OpEx"}, {"id": "service-models", "text": "Cloud computing models: IaaS, PaaS, SaaS"}, {"id": "deployment-models", "text": "Deployment models: cloud, hybrid, on-premises"}, {"id": "vocabulary", "text": "Availability and scaling vocabulary"}, {"id": "traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch2", "ch": 2, "title": "Chapter 2: Designing well (Well-Architected and cloud economics)", "short": "How do you know it's built well?", "topic": "Well-Architected pillars and cloud economics", "d": 1, "focus": false, "mins": 7, "html": "<p>The launch went well, but Meera has a new worry. &quot;An investor asked how we know our setup is well built. Do we just trust you?&quot; Kabir shrugs: &quot;It works, isn't that enough?&quot;</p><p>Not quite. AWS has a standard way to judge whether a system is built well, and a tool to check it. You will also learn how to explain cost savings in the language Meera's finance team expects.</p><h3 id=\"s-six-pillars\">The six Well-Architected pillars</h3><p>The <strong>AWS Well-Architected Framework</strong> is a set of best practices for designing and running workloads in the cloud. It is organized into six pillars. A handy way to remember them: think of building a house.</p><div class=\"tw\"><table><thead><tr><th>Pillar</th><th>The question it asks</th><th>Key idea</th></tr></thead><tbody><tr><td>Operational excellence</td><td>Can we run, monitor and improve this smoothly?</td><td>Automate, make small reversible changes, learn from failures</td></tr><tr><td>Security</td><td>Is our data and system protected?</td><td>Strong identity, traceability, protect data at every layer</td></tr><tr><td>Reliability</td><td>Does it recover from failure and meet demand?</td><td>Recover automatically, scale horizontally, test recovery</td></tr><tr><td>Performance efficiency</td><td>Are we using the right resources efficiently?</td><td>Use the right resource types, go global, experiment</td></tr><tr><td>Cost optimization</td><td>Are we avoiding unneeded spend?</td><td>Pay only for what you need, measure and analyze spend</td></tr><tr><td>Sustainability</td><td>Are we minimizing environmental impact?</td><td>Maximize utilization, use efficient hardware and managed services</td></tr></tbody></table></div><p><strong>Remember for the exam:</strong> you must be able to match a scenario to the right pillar. &quot;Recover from disaster&quot; is reliability; &quot;least privilege&quot; is security; &quot;automate deployments&quot; is operational excellence; &quot;reduce carbon footprint&quot; is sustainability.</p><h3 id=\"s-design-principles\">Design principles in the cloud</h3><p>Beyond the pillars, the exam expects you to know the general habits of good cloud design.</p><ul><li><strong>Design for failure:</strong> assume parts will break, and build so the system survives. (Not &quot;hope nothing fails&quot;.)</li><li><strong>Loose coupling:</strong> split a system into pieces that do not depend tightly on each other, so one failing piece does not take down the rest.</li><li><strong>Scale horizontally:</strong> add more small machines instead of one giant one.</li><li><strong>Automate:</strong> use code and tools rather than manual clicking, so results are repeatable.</li><li><strong>Use managed services:</strong> let AWS run the undifferentiated heavy lifting.</li><li><strong>Stop guessing capacity</strong> and test at production scale cheaply.</li></ul><blockquote class=\"voice\"><span class=\"who\">Kabir</span>So &quot;it works on my laptop&quot; is not an architecture.</blockquote><p>A few more principles worth knowing: <strong>test systems at production scale</strong> (you can create a full-size test copy, run the test, then delete it, paying only for the hours used); <strong>allow for evolutionary architectures</strong> (change designs as you learn, since experiments are cheap); <strong>drive architectures using data</strong> (measure first, then decide); and <strong>practice failure</strong> by running &quot;game days&quot; that simulate outages so teams are ready.</p><p>Each pillar also has its own small set of principles. For example, security stresses a strong identity foundation, enabling traceability, applying security at all layers, and protecting data in transit and at rest. Reliability stresses recovering automatically from failure and scaling horizontally to increase total availability. You do not need to memorize every line, but be able to tell which pillar a described habit belongs to.</p><h3 id=\"s-well-architected-tool\">AWS Well-Architected Tool</h3><ul><li><strong>What it is:</strong> a free service in the AWS console that helps you review a workload against the six pillars. You answer questions, and it shows risks and suggests improvements.</li><li><strong>Use it when:</strong> you want a structured review of how well an application follows AWS best practices.</li><li><strong>Remember for the exam:</strong> the framework is the guidance (the pillars); the <strong>Tool</strong> is the service that reviews your workload against it. It does not fix things automatically.</li></ul><h3 id=\"s-cloud-economics\">Cloud economics</h3><p>Meera's finance team will ask for numbers. Three ideas matter.</p><ul><li><strong>Total Cost of Ownership (TCO):</strong> <ul><li><strong>What it is:</strong> the full cost of running something, including hardware, space, power, staff and maintenance, not just the purchase price.</li><li><strong>Use it when:</strong> comparing on-premises to AWS fairly. The <strong>AWS Pricing Calculator</strong> estimates AWS costs, and migration planning tools help build the comparison.</li><li><strong>Remember for the exam:</strong> on-premises often hides costs such as electricity, cooling, real estate and IT labor.</li></ul></li><li><strong>Rightsizing:</strong> <ul><li><strong>What it is:</strong> matching the size of a resource to what the workload really needs, so you are not paying for a giant machine that sits idle.</li><li><strong>Use it when:</strong> usage data shows resources are mostly idle.</li><li><strong>Remember for the exam:</strong> rightsizing is a cost-optimization habit you repeat over time. <strong>AWS Cost Explorer</strong> shows spend patterns, and <strong>AWS Compute Optimizer</strong> recommends better-sized resources.</li></ul></li><li><strong>Managed services:</strong> <ul><li><strong>What it is:</strong> services where AWS handles setup, patching, backups and scaling for you.</li><li><strong>Use it when:</strong> you want your team spending time on the product, not on maintenance.</li><li><strong>Remember for the exam:</strong> managed services reduce operational effort and often total cost, because you avoid administration labor.</li></ul></li></ul><blockquote class=\"tip\">Cost-saving ideas the exam likes: pay only for what you use, scale down when idle, rightsize, use managed services, and compare using TCO rather than just sticker price.</blockquote><h3 id=\"s-traps\">Common traps</h3><ul><li>Confusing the <strong>Well-Architected Framework</strong> (guidance) with the <strong>Tool</strong> (review service).</li><li>Counting only hardware price in an on-premises comparison and forgetting power, space and staff. That ignores TCO.</li><li>Mixing <strong>reliability</strong> (recover from failure) with <strong>performance efficiency</strong> (use resources well).</li><li>Forgetting that <strong>sustainability</strong> is a pillar. It is the newest and easy to overlook.</li><li>Assuming rightsizing is a one-time action. It is ongoing.</li><li>Thinking Well-Architected is a certification or a pass/fail test. It is a review that produces improvement suggestions.</li></ul><h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>If the question says...                                -&gt; pick\nAutomate, monitor, improve operations, runbooks        -&gt; Operational excellence\nProtect data, least privilege, traceability            -&gt; Security\nRecover from failure, meet demand, test recovery       -&gt; Reliability\nChoose right resource types, experiment, go global     -&gt; Performance efficiency\nAvoid unneeded spend, measure and analyze spend        -&gt; Cost optimization\nReduce environmental impact, maximize utilization      -&gt; Sustainability\nReview my workload against best practices (a service)  -&gt; Well-Architected Tool\nInclude power, space, staff when comparing costs       -&gt; TCO\nResource is too big for what it does                   -&gt; Rightsizing\nAWS handles patching, backups, scaling for me          -&gt; Managed services</code></pre>", "toc": [{"id": "six-pillars", "text": "The six Well-Architected pillars"}, {"id": "design-principles", "text": "Design principles in the cloud"}, {"id": "well-architected-tool", "text": "AWS Well-Architected Tool"}, {"id": "cloud-economics", "text": "Cloud economics"}, {"id": "traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch3", "ch": 3, "title": "Chapter 3: Moving in (Cloud adoption and migration)", "short": "Move it, rebuild it, or toss it?", "topic": "Cloud Adoption Framework and migration strategies", "d": 1, "focus": false, "mins": 7, "html": "<p>Meera's board loves the plan, but PulseWire still runs an old video-processing system in a rented rack across town. &quot;We pay for it every month and it is slow,&quot; she says. &quot;Can we just move it?&quot;</p><p>Kabir winces. &quot;Move it how? Copy it, rebuild it, or throw it away?&quot; That is precisely the right question. AWS offers a framework for organizing the whole change and a menu of seven strategies for each application.</p><h3 id=\"s-adoption-framework\">AWS Cloud Adoption Framework (CAF)</h3><p>Moving to the cloud is not just a technical project. People, rules and money change too. The <strong>AWS Cloud Adoption Framework</strong> organizes that change into six <strong>perspectives</strong>, each owned by different roles.</p><div class=\"tw\"><table><thead><tr><th>Perspective</th><th>Focus</th><th>Typical stakeholders</th></tr></thead><tbody><tr><td>Business</td><td>Make sure cloud investments serve business outcomes</td><td>Executives, finance, strategy</td></tr><tr><td>People</td><td>Training, culture, hiring, organizational change</td><td>HR, team leaders</td></tr><tr><td>Governance</td><td>Manage risk, compliance, and cost control</td><td>CIO, program managers, finance</td></tr><tr><td>Platform</td><td>Build and run the technical environment and architecture</td><td>CTO, engineers, architects</td></tr><tr><td>Security</td><td>Protect data, identities and workloads</td><td>CISO, security teams</td></tr><tr><td>Operations</td><td>Run, monitor and keep workloads healthy</td><td>Operations and support teams</td></tr></tbody></table></div><ul><li><strong>Remember for the exam:</strong> the six perspectives are Business, People, Governance, Platform, Security, Operations. Business, People and Governance are the &quot;business&quot; side; Platform, Security and Operations are the &quot;technical&quot; side.</li><li>If a question is about training staff or changing culture, think <strong>People</strong>. If it is about audits and risk, think <strong>Governance</strong>.</li></ul><h3 id=\"s-seven-rs\">The 7 Rs of migration</h3><p>Each application can take a different path. Learn the seven names and what each means in one line.</p><div class=\"tw\"><table><thead><tr><th>Strategy</th><th>Plain meaning</th><th>Example</th></tr></thead><tbody><tr><td>Retire</td><td>Switch it off. Nobody needs it</td><td>An old reporting tool nobody opens</td></tr><tr><td>Retain</td><td>Keep it where it is, for now</td><td>A system tied to special hardware, or recently upgraded</td></tr><tr><td>Rehost (lift and shift)</td><td>Move as-is to AWS servers, no changes</td><td>Copy the video system onto EC2 machines</td></tr><tr><td>Relocate</td><td>Move to the cloud version of the same platform without changes</td><td>Move VMware servers to VMware Cloud on AWS</td></tr><tr><td>Repurchase (drop and shop)</td><td>Replace with a different product, often SaaS</td><td>Swap a self-run CRM for a SaaS CRM</td></tr><tr><td>Replatform (lift, tinker and shift)</td><td>Move with small improvements, keep core design</td><td>Move a self-run database to a managed database service</td></tr><tr><td>Refactor (re-architect)</td><td>Redesign to use cloud-native features</td><td>Rebuild the app using serverless pieces</td></tr></tbody></table></div><p>A simple way to order them by effort: retire and retain are the least work, rehost and relocate are quick moves, repurchase and replatform take some change, and refactor takes the most work but may yield the most long-term benefit.</p><blockquote class=\"voice\"><span class=\"who\">Kabir</span>So &quot;just move it&quot; is only one of seven answers. And one answer is &quot;don't.&quot;</blockquote><h3 id=\"s-migration-tools\">Migration tools (mention level)</h3><p>You only need to recognize what each one does.</p><ul><li><strong>AWS Migration Hub:</strong> a single place to track the progress of migrations across tools.</li><li><strong>AWS Application Migration Service (MGN):</strong> the main service for lift-and-shift (rehost) of servers to AWS.</li><li><strong>AWS Database Migration Service (DMS):</strong> moves databases to AWS with little downtime, and can also convert between different database types (together with the Schema Conversion Tool).</li><li><strong>AWS Snow Family (for example, Snowball Edge):</strong> physical devices shipped to you for moving very large amounts of data when the network is too slow, or for computing at the edge.</li></ul><p>Think about how PulseWire would use them together. Kabir uses Application Migration Service to copy the old video servers to AWS while they keep running. The article database moves with DMS, so readers see little or no downtime. A few hundred terabytes of old video archives are too large to upload over the office internet comfortably, so a Snow Family device is shipped, loaded, and returned. Migration Hub gives Meera one dashboard to watch it all.</p><p><strong>Remember for the exam:</strong> servers = Application Migration Service; databases = DMS; huge data offline = Snow Family; tracking = Migration Hub.</p><h3 id=\"s-benefits\">Benefits of migrating</h3><p>Meera will want the payoff in plain words. The exam groups the benefits roughly like this:</p><ul><li><strong>Cost savings:</strong> no data center to run, and pay-as-you-go.</li><li><strong>Agility and speed:</strong> new resources in minutes.</li><li><strong>Resilience:</strong> build systems that survive failures.</li><li><strong>Staff productivity:</strong> less time on maintenance, more on features.</li><li><strong>Operational efficiency and modernization:</strong> use managed services and newer technology.</li><li><strong>Business agility:</strong> reach new markets and respond to change sooner.</li></ul><p>One honest point for Meera: migration does not make everything cheaper overnight. Savings usually come from paying for actual use, retiring unused systems, and rightsizing after the move. Many companies move first (rehost), then improve later (replatform or refactor) once the workload is stable in AWS. This staged approach lowers risk because each step is small and reversible.</p><blockquote class=\"tip\">When a question asks for the fastest, lowest-effort way to move to AWS with no code changes, the answer is rehost. When it asks for the most long-term cloud benefit, the answer is refactor.</blockquote><h3 id=\"s-traps\">Common traps</h3><ul><li>Mixing up <strong>Rehost</strong> (no change) and <strong>Replatform</strong> (small tweaks for benefit).</li><li>Mixing up <strong>Replatform</strong> and <strong>Refactor</strong>. Refactor changes the architecture, replatform does not.</li><li>Forgetting <strong>Retire</strong> and <strong>Retain</strong> are real strategies. Not everything moves.</li><li>Choosing <strong>Repurchase</strong> when the company keeps its own software. Repurchase means buying a different product.</li><li>Confusing <strong>Application Migration Service</strong> (servers) with <strong>DMS</strong> (databases).</li><li>Treating the CAF as a technical tool. It is a planning framework, not a service.</li></ul><h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>If the question says...                                  -&gt; pick\nNobody uses it anymore, switch it off                    -&gt; Retire\nKeep it on-premises for now                              -&gt; Retain\nMove as-is, no changes (lift and shift)                  -&gt; Rehost\nMove VMware workloads without changing them              -&gt; Relocate\nReplace with SaaS / drop and shop                        -&gt; Repurchase\nSmall tweaks, e.g. to a managed database                 -&gt; Replatform\nRedesign to be cloud-native                              -&gt; Refactor\nTraining staff, culture change                           -&gt; CAF People perspective\nAudit, risk, compliance planning                         -&gt; CAF Governance perspective\nMove servers to AWS                                      -&gt; Application Migration Service\nMove a database with minimal downtime                    -&gt; DMS\nTruckloads of data, slow network                         -&gt; Snow Family</code></pre>", "toc": [{"id": "adoption-framework", "text": "AWS Cloud Adoption Framework (CAF)"}, {"id": "seven-rs", "text": "The 7 Rs of migration"}, {"id": "migration-tools", "text": "Migration tools (mention level)"}, {"id": "benefits", "text": "Benefits of migrating"}, {"id": "traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch4", "ch": 4, "title": "Chapter 4: Who is responsible for what? (Shared responsibility and IAM)", "short": "Who is responsible for what?", "topic": "Shared responsibility and IAM", "d": 2, "focus": true, "mins": 7, "html": "<p>On your first Monday as PulseWire's cloud lead, Meera drops by with a worried look. \"A customer asked who is responsible if our data leaks. Is that us or Amazon? We must pass the audit next quarter, so I need a clear answer.\"</p><p>Kabir leans in. \"Why can't we just give everyone admin access so nobody gets blocked?\" Both questions land on the same exam domain: who owns which security job, and who is allowed to do what.</p><h3 id=\"s-shared-responsibility\">Shared responsibility model</h3><p>Think of renting an office in a secure building. The landlord guards the lobby, the elevators and the building walls. You decide who gets a key to your suite and what you leave on your desk. AWS works the same way.</p><ul><li><strong>Security OF the cloud</strong> is AWS: data centers, hardware, networking, and the software that runs the core services.</li><li><strong>Security IN the cloud</strong> is you: your data, who can access it, how it is encrypted, and how your guest systems are configured.</li></ul><p>The more managed the service, the more AWS takes on. Compare four common ones.</p><div class=\"tw\"><table><thead><tr><th>Service</th><th>AWS handles</th><th>You handle</th></tr></thead><tbody><tr><td>Amazon EC2 (virtual servers)</td><td>Physical hosts, hypervisor, data centers</td><td>Guest operating system, patching, applications, security groups, data, IAM</td></tr><tr><td>Amazon RDS (managed database)</td><td>Hardware, OS and database engine patching, backups tooling</td><td>Who can connect, data in the database, encryption settings, network rules</td></tr><tr><td>Amazon S3 (storage)</td><td>Durable storage infrastructure, the service itself</td><td>Bucket permissions, encryption choices, what you upload, versioning and lifecycle settings</td></tr><tr><td>AWS Lambda (serverless code)</td><td>Servers, OS, runtime patching, scaling</td><td>Your code, its permissions (IAM role), the data it touches</td></tr></tbody></table></div><blockquote class=\"tip\">Rule of thumb: on EC2 you patch the operating system. On RDS, Lambda and S3 AWS patches it. Your data and your access settings are always yours.</blockquote><h3 id=\"s-control-types\">Inherited, shared and customer-specific controls</h3><p>AWS also describes responsibility in terms of controls (safeguards).</p><ul><li><strong>Inherited controls:</strong> you get them fully from AWS, such as physical and environmental security of the data centers.</li><li><strong>Shared controls:</strong> both sides play a part, but in different ways. Examples: patch management (AWS patches the infrastructure, you patch your guest OS and apps), configuration management, and awareness and training.</li><li><strong>Customer-specific controls:</strong> fully yours, depending on how you use AWS. Example: service and communications protection, such as deciding that data in a particular app must be encrypted, or zone-based security rules.</li></ul><p><strong>Remember for the exam:</strong> physical security of data centers is inherited. Patching a guest OS on EC2 is on you. Questions often ask \"who is responsible for X?\" so match X to the table above.</p><h3 id=\"s-iam-basics\">IAM: the front door</h3><p><strong>AWS Identity and Access Management (IAM)</strong></p><ul><li><strong>What it is:</strong> the service that controls who (authentication) can do what (authorization) in your AWS account. It is global and free to use.</li><li><strong>Use it when:</strong> you need to create people, applications or services that can sign in and call AWS, and limit what they can do.</li><li><strong>Remember for the exam:</strong> IAM is where you apply least privilege: give only the permissions needed for the job, nothing more.</li></ul><p>The pieces:</p><ul><li><strong>Root user:</strong> the all-powerful identity created with the account email. Lock it away: turn on MFA, do not create access keys for it, and do not use it for daily work. Use it only for the few tasks that require it, such as closing the account or changing the support plan.</li><li><strong>IAM users:</strong> an identity for one person or application, with its own credentials.</li><li><strong>IAM groups:</strong> a collection of users, so you attach permissions once (for example, a Developers group). Groups contain users only, not other groups.</li><li><strong>IAM roles:</strong> an identity with permissions that anyone or anything can temporarily assume. No long-term password or keys. Use roles for EC2 instances, Lambda functions, other AWS services and cross-account access.</li><li><strong>IAM policies:</strong> JSON documents that say Allow or Deny for certain actions on certain resources. Attach them to users, groups or roles.</li></ul><blockquote class=\"voice\"><span class=\"who\">Kabir</span>Why can't the app on our server just use my access key? Because keys leak. Give the server a role instead.</blockquote><h3 id=\"s-iam-hardening\">Credentials: MFA, access keys and password policy</h3><ul><li><strong>Multi-factor authentication (MFA):</strong> a second proof beyond the password, such as an authenticator app, a security key or a hardware token. Always enable it for the root user and for privileged users.</li><li><strong>Access keys:</strong> an access key ID plus a secret key, used for programmatic access (CLI, SDK). Treat them like passwords, rotate them, never put them in code or share them. Prefer roles, which avoid long-term keys.</li><li><strong>Password policy:</strong> set rules for your account: minimum length, required character types, expiration and preventing reuse.</li><li><strong>Credential report:</strong> a downloadable CSV listing all users and the status of their passwords, access keys and MFA. Use it for audits.</li><li><strong>IAM Access Analyzer:</strong> finds resources (like S3 buckets) shared with outside accounts or the public, so you can spot unintended access.</li></ul><h3 id=\"s-identity-center-orgs\">IAM Identity Center, Organizations and SCPs</h3><p><strong>AWS IAM Identity Center</strong></p><ul><li><strong>What it is:</strong> central single sign-on (SSO) for people across many AWS accounts and business apps. One login, with permission sets per account.</li><li><strong>Use it when:</strong> the company has multiple accounts and you want staff to sign in once instead of managing separate IAM users in each.</li><li><strong>Remember for the exam:</strong> It is the modern answer for workforce SSO. It can use its own directory or connect to an external one such as Microsoft Active Directory.</li></ul><p><strong>AWS Organizations</strong></p><ul><li><strong>What it is:</strong> lets you manage many AWS accounts together, group them into organizational units, and get consolidated billing.</li><li><strong>Use it when:</strong> you want separate accounts for dev, test and prod, one bill, and shared guardrails.</li><li><strong>Remember for the exam:</strong> Consolidated billing combines usage to reach volume discounts.</li></ul><p><strong>Service control policies (SCPs)</strong></p><ul><li><strong>What it is:</strong> guardrails in Organizations that set the maximum permissions for accounts or OUs.</li><li><strong>Use it when:</strong> you want to block something for an entire account, such as using certain Regions.</li><li><strong>Remember for the exam:</strong> SCPs never grant permissions. They only limit what is allowed, and they apply to all users in the member account, including its root user. They do not affect the management account.</li></ul><h3 id=\"s-common-traps\">Common traps</h3><ul><li><strong>User vs role:</strong> a user has long-term credentials. A role is assumed temporarily. If the question says \"EC2 instance needs access to S3,\" the answer is a role.</li><li><strong>Group vs role:</strong> groups bundle users. They cannot be assumed or used by services.</li><li><strong>SCP vs IAM policy:</strong> an SCP alone never gives access. It only caps the maximum.</li><li><strong>Root for daily work:</strong> never the right answer. The root user is for rare account-level tasks.</li><li><strong>\"AWS is responsible for my data\":</strong> wrong. Customer data and its access settings are always yours.</li><li><strong>Credential report vs Access Analyzer:</strong> the report lists your users' credential status. Access Analyzer finds resources shared externally.</li></ul><h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>If the question says...                           -&gt; pick\nAWS secures data centers and hardware             -&gt; security OF the cloud (AWS)\nPatching the guest OS on EC2                      -&gt; customer responsibility\nPhysical security of facilities                   -&gt; inherited control\nApplication on EC2 needs to call S3 safely        -&gt; IAM role\nGive many developers the same permissions         -&gt; IAM group + policy\nExtra proof of identity beyond password           -&gt; MFA\nAudit users, passwords, keys and MFA status       -&gt; IAM credential report\nFind buckets shared with the public or others     -&gt; IAM Access Analyzer\nOne login for staff across many accounts          -&gt; IAM Identity Center\nLimit what a whole account can ever do            -&gt; Organizations SCP\nOnly the minimum permissions needed               -&gt; least privilege</code></pre>", "toc": [{"id": "shared-responsibility", "text": "Shared responsibility model"}, {"id": "control-types", "text": "Inherited, shared and customer-specific controls"}, {"id": "iam-basics", "text": "IAM: the front door"}, {"id": "iam-hardening", "text": "Credentials: MFA, access keys and password policy"}, {"id": "identity-center-orgs", "text": "IAM Identity Center, Organizations and SCPs"}, {"id": "common-traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch5", "ch": 5, "title": "Chapter 5: Locking the data and the doors (Encryption and network protection)", "short": "Locking the data and the doors", "topic": "Encryption and network protection", "d": 2, "focus": false, "mins": 7, "html": "<p>Kabir has a worry. \"A contractor just asked whether our customer database is encrypted. I said 'probably'.\" Meera is not amused. \"Probably is not an answer I can give an auditor. Lock the data, lock the doors, and tell me how.\"</p><p>That is this chapter: scramble the data so thieves can read nothing, keep secrets out of code, and put guards at every network entrance.</p><h3 id=\"s-encryption-basics\">Encryption at rest and in transit</h3><p>Encryption scrambles data so only someone with the right key can read it.</p><ul><li><strong>At rest:</strong> data sitting in storage (S3 objects, EBS volumes, RDS databases). Think of a locked filing cabinet.</li><li><strong>In transit:</strong> data moving across a network. Think of an armored van. This uses TLS (the \"https\" you see in a browser).</li></ul><p><strong>Remember for the exam:</strong> most AWS storage and database services support encryption at rest, often switched on with a checkbox and AWS KMS. For in transit, use HTTPS/TLS endpoints and certificates from ACM.</p><h3 id=\"s-kms-hsm\">KMS and CloudHSM</h3><p><strong>AWS Key Management Service (KMS)</strong></p><ul><li><strong>What it is:</strong> a managed service to create and control the encryption keys that protect your data. It integrates with most AWS services and is logged in CloudTrail.</li><li><strong>Use it when:</strong> you want easy, managed encryption for S3, EBS, RDS and more, with key policies and rotation.</li><li><strong>Remember for the exam:</strong> The default choice for key management. AWS manages the underlying hardware.</li></ul><p><strong>AWS CloudHSM</strong></p><ul><li><strong>What it is:</strong> a dedicated hardware security module (HSM) in the AWS cloud that only you control.</li><li><strong>Use it when:</strong> rules or contracts demand single-tenant hardware, and you must manage the keys yourself.</li><li><strong>Remember for the exam:</strong> Pick CloudHSM for \"dedicated hardware\" or \"customer fully controls keys\". Pick KMS for easy and managed.</li></ul><h3 id=\"s-acm-secrets\">ACM, Secrets Manager and Parameter Store</h3><p><strong>AWS Certificate Manager (ACM)</strong></p><ul><li><strong>What it is:</strong> creates, manages and renews public TLS/SSL certificates so your sites can use HTTPS.</li><li><strong>Use it when:</strong> you need HTTPS on a load balancer, CloudFront or API Gateway without handling certificates by hand.</li><li><strong>Remember for the exam:</strong> Public certificates from ACM are free and renew automatically. It is about encryption in transit.</li></ul><p><strong>AWS Secrets Manager</strong></p><ul><li><strong>What it is:</strong> stores and rotates secrets such as database passwords and API keys, so they are not hard-coded in your app.</li><li><strong>Use it when:</strong> an app needs a password or key and you want automatic rotation.</li><li><strong>Remember for the exam:</strong> Key feature: automatic rotation of secrets. It is paid per secret.</li></ul><p><strong>Systems Manager Parameter Store</strong> is a lighter option for storing configuration values and secrets. It is cheaper but does not offer the same built-in rotation.</p><h3 id=\"s-network-controls\">VPC, security groups and network ACLs</h3><p>A <strong>VPC</strong> (Virtual Private Cloud) is your own private slice of the AWS network. Inside it you create <strong>public subnets</strong> (reachable from the internet) and <strong>private subnets</strong> (hidden, good for databases). Put the website in public and the database in private.</p><p>Two filters protect traffic:</p><div class=\"tw\"><table><thead><tr><th></th><th>Security group</th><th>Network ACL</th></tr></thead><tbody><tr><td>Works at</td><td>The instance (server) level</td><td>The subnet level</td></tr><tr><td>State</td><td>Stateful: reply traffic is allowed automatically</td><td>Stateless: you must allow both directions</td></tr><tr><td>Rules</td><td>Allow rules only</td><td>Allow and deny rules</td></tr><tr><td>Default</td><td>Denies all inbound, allows all outbound</td><td>Default NACL allows all</td></tr></tbody></table></div><blockquote class=\"tip\">Stateful means the firewall remembers the conversation. Let a request in, and the reply goes out on its own.</blockquote><h3 id=\"s-edge-protection\">WAF, Shield and Firewall Manager</h3><p><strong>AWS WAF</strong></p><ul><li><strong>What it is:</strong> a web application firewall that inspects web requests and blocks common attacks like SQL injection and cross-site scripting, or blocks by IP or country.</li><li><strong>Use it when:</strong> you must protect a website or API behind CloudFront, an Application Load Balancer or API Gateway at the application layer (layer 7).</li><li><strong>Remember for the exam:</strong> WAF = web exploits and bad requests.</li></ul><p><strong>AWS Shield</strong></p><ul><li><strong>What it is:</strong> protection against DDoS (distributed denial of service) attacks, where a flood of fake traffic tries to knock your site offline. Shield Standard is automatic and free for all customers. Shield Advanced is paid, adds extra detection, 24/7 response team support and cost protection during attacks.</li><li><strong>Use it when:</strong> you want stronger protection for critical internet-facing apps.</li><li><strong>Remember for the exam:</strong> Standard covers common network and transport layer attacks at no cost. Advanced is the upgrade.</li></ul><p><strong>AWS Firewall Manager</strong></p><ul><li><strong>What it is:</strong> centrally sets up and enforces WAF rules, Shield Advanced and security group policies across all accounts in Organizations.</li><li><strong>Use it when:</strong> you manage many accounts and want one place to apply rules.</li><li><strong>Remember for the exam:</strong> Think \"central management of firewall rules\".</li></ul><p><strong>AWS Network Firewall</strong> (a mention): a managed firewall for traffic entering and leaving your VPC, for deeper network filtering.</p><h3 id=\"s-common-traps\">Common traps</h3><ul><li><strong>KMS vs CloudHSM:</strong> KMS is the managed default. CloudHSM is dedicated hardware you control.</li><li><strong>Security group vs NACL:</strong> groups are stateful and instance-level. NACLs are stateless and subnet-level, with deny rules.</li><li><strong>WAF vs Shield:</strong> WAF filters web requests. Shield fights DDoS floods.</li><li><strong>ACM vs Secrets Manager:</strong> ACM handles certificates. Secrets Manager handles passwords and keys.</li><li><strong>At rest vs in transit:</strong> stored data versus moving data. Read the wording closely.</li><li><strong>Shield Standard costs money:</strong> wrong. It is free and automatic.</li></ul><h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>If the question says...                         -&gt; pick\nCreate and manage encryption keys easily        -&gt; AWS KMS\nDedicated hardware, customer-controlled keys    -&gt; AWS CloudHSM\nFree HTTPS certificate that auto-renews         -&gt; AWS Certificate Manager\nStore and auto-rotate a database password       -&gt; AWS Secrets Manager\nFirewall at the server, remembers replies       -&gt; security group (stateful)\nFirewall at the subnet, allow and deny rules    -&gt; network ACL (stateless)\nBlock SQL injection or bad web requests         -&gt; AWS WAF\nProtect against DDoS flooding                   -&gt; AWS Shield\n24/7 DDoS response team and cost protection     -&gt; Shield Advanced\nApply firewall rules across all accounts        -&gt; AWS Firewall Manager\nHide the database from the internet             -&gt; private subnet</code></pre>", "toc": [{"id": "encryption-basics", "text": "Encryption at rest and in transit"}, {"id": "kms-hsm", "text": "KMS and CloudHSM"}, {"id": "acm-secrets", "text": "ACM, Secrets Manager and Parameter Store"}, {"id": "network-controls", "text": "VPC, security groups and network ACLs"}, {"id": "edge-protection", "text": "WAF, Shield and Firewall Manager"}, {"id": "common-traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch6", "ch": 6, "title": "Chapter 6: Spotting trouble and proving compliance (Detection, auditing and compliance)", "short": "Spotting trouble, proving compliance", "topic": "Detection, auditing and compliance", "d": 2, "focus": false, "mins": 6, "html": "<p>A big sponsor emails Meera: \"Send us proof that you follow recognized security standards.\" Meera forwards it to you with one line: \"We must pass the audit. Show them we are safe, and tell me when something looks wrong.\"</p><p>Kabir shrugs. \"Why can't we just s
