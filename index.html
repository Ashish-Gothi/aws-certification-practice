eering is not transitive: if A peers with B and B peers with C, A still cannot reach C. Address ranges must not overlap.</li></ul><p><strong>AWS Transit Gateway</strong></p><ul><li><strong>What it is:</strong> a central hub; every VPC and on-premises network plugs into the hub once.</li><li><strong>Use it when:</strong> you have many VPCs and want a hub-and-spoke design instead of a tangle of peering links.</li><li><strong>Remember for the exam:</strong> \"hub\", \"many VPCs\" or \"simplify network connections\" points to Transit Gateway.</li></ul><h3 id=\"s-hybrid\">Linking your office to AWS: VPN and Direct Connect</h3><p>Many companies keep some systems in their own building (on premises). Two services connect that building to a VPC.</p><p><strong>AWS Site-to-Site VPN</strong></p><ul><li><strong>What it is:</strong> an encrypted tunnel over the public internet between your office network and your VPC.</li><li><strong>Use it when:</strong> you need a connection quickly and cheaply, and internet variability is acceptable.</li><li><strong>Remember for the exam:</strong> fast to set up, encrypted, but runs over the internet so speed can vary.</li></ul><p><strong>AWS Direct Connect</strong></p><ul><li><strong>What it is:</strong> a dedicated physical network line from your premises to AWS, bypassing the public internet.</li><li><strong>Use it when:</strong> you need steady speed, low latency, or large data transfers.</li><li><strong>Remember for the exam:</strong> private and consistent, but takes weeks to install and is not encrypted by default. Cost and set-up time are higher than VPN.</li></ul><p>A simple memory trick: <strong>VPN is the quick tunnel; Direct Connect is the private highway.</strong></p><h3 id=\"s-route53\">Route 53: the cloud's phone book</h3><p>Computers find each other by number (IP address), but people type names like <code>pulsewire.com</code>. <strong>DNS</strong> (Domain Name System) translates names into numbers.</p><p><strong>Amazon Route 53</strong></p><ul><li><strong>What it is:</strong> AWS's highly available DNS service. It registers domain names, answers DNS questions, and checks the health of your endpoints.</li><li><strong>Use it when:</strong> you want to point your domain at your website, or fail over to a backup when the main site breaks.</li><li><strong>Remember for the exam:</strong> Route 53 can register domains, route traffic and run health checks. The name comes from DNS using port 53.</li></ul><p>Route 53 can answer differently depending on the <strong>routing policy</strong> you choose. At exam depth you only need the idea:</p><ul><li><strong>Simple:</strong> one answer for one name.</li><li><strong>Weighted:</strong> split traffic by percentage, for example 10 percent to a new version.</li><li><strong>Latency-based:</strong> send each user to the Region that responds fastest for them.</li><li><strong>Failover:</strong> use a primary, switch to a backup if health checks fail.</li><li><strong>Geolocation:</strong> answer based on where the user is, for example local-language sites or legal rules.</li></ul><p><strong>Health checks</strong> let Route 53 stop sending people to a broken endpoint.</p><h3 id=\"s-delivery\">Delivering fast worldwide: CloudFront, Global Accelerator, API Gateway</h3><p>Distance causes delay. These services bring your content closer to readers.</p><p><strong>Amazon CloudFront</strong></p><ul><li><strong>What it is:</strong> a content delivery network (CDN). It keeps copies (a cache) of your pictures, videos and pages in hundreds of <strong>edge locations</strong> around the world and serves each reader from the nearest one.</li><li><strong>Use it when:</strong> you serve websites, images or video to a global audience, or want to protect an origin with AWS WAF and Shield.</li><li><strong>Remember for the exam:</strong> edge locations make static content fast; the original source (such as an S3 bucket) is called the <em>origin</em>.</li></ul><p><strong>AWS Global Accelerator</strong></p><ul><li><strong>What it is:</strong> gives your application fixed entry IP addresses and routes users over the AWS global network to the nearest healthy endpoint.</li><li><strong>Use it when:</strong> you need faster, more reliable access for non-cacheable traffic such as games, voice or APIs, or need static IPs.</li><li><strong>Remember for the exam:</strong> CloudFront caches content; Global Accelerator speeds up the path but does not cache.</li></ul><p><strong>Amazon API Gateway</strong></p><ul><li><strong>What it is:</strong> a managed front door for building and publishing APIs that other apps call.</li><li><strong>Use it when:</strong> you want to expose a back end such as Lambda functions as a secure, scalable API.</li><li><strong>Remember for the exam:</strong> it handles traffic, authorization and throttling for you; it is commonly paired with Lambda.</li></ul><h3 id=\"s-common-traps\">Common traps</h3><ul><li><strong>Internet gateway vs NAT gateway.</strong> IGW is two-way for public subnets; NAT is outbound-only for private subnets.</li><li><strong>Security group vs network ACL.</strong> Security group: instance level, stateful, allow only. NACL: subnet level, stateless, allow and deny.</li><li><strong>VPN vs Direct Connect.</strong> Quick and encrypted over the internet is VPN. Dedicated and consistent is Direct Connect.</li><li><strong>CloudFront vs Global Accelerator.</strong> Caching content at the edge is CloudFront; static IPs and a faster network path is Global Accelerator.</li><li><strong>Peering vs Transit Gateway.</strong> Two or three VPCs: peering. Many VPCs and offices: Transit Gateway.</li><li><strong>Route 53 is DNS, not a load balancer.</strong> It chooses where a name points; it does not spread each request across servers like Elastic Load Balancing.</li></ul><h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>Private network of my own in AWS               -&gt; VPC\nServer in a subnet must be reachable by anyone -&gt; Internet gateway + public subnet\nPrivate server needs outbound updates only     -&gt; NAT gateway\nReach S3 / AWS service without the internet    -&gt; VPC endpoint (PrivateLink)\nConnect two VPCs directly                      -&gt; VPC peering\nHub for many VPCs and offices                  -&gt; Transit Gateway\nEncrypted link to office, quick and cheap      -&gt; Site-to-Site VPN\nDedicated private line, steady performance     -&gt; Direct Connect\nDomain names, DNS, health checks, failover     -&gt; Route 53\nCache content near users worldwide (CDN)       -&gt; CloudFront\nStatic IPs and faster global network path      -&gt; Global Accelerator\nPublish an API in front of Lambda              -&gt; API Gateway</code></pre>", "toc": [{"id": "vpc-basics", "text": "VPC, subnets and gateways"}, {"id": "connect-private", "text": "Connecting privately: endpoints, peering, Transit Gateway"}, {"id": "hybrid", "text": "Linking your office to AWS: VPN and Direct Connect"}, {"id": "route53", "text": "Route 53: the cloud's phone book"}, {"id": "delivery", "text": "Delivering fast worldwide: CloudFront, Global Accelerator, API Gateway"}, {"id": "common-traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch12", "ch": 12, "title": "Chapter 12: Connecting and Running the Platform (Integration, DevOps, Governance)", "short": "Who did what, and how is it running?", "topic": "Integration, developer tools, management and governance", "d": 3, "focus": false, "mins": 8, "html": "<p>It is 2 a.m. and PulseWire's site is slow. Meera messages: \"Who changed what, and why didn't we know sooner?\" Kabir replies, \"Why can't we just look at the server?\" You explain there are tools for that, and each answers a different question.</p><p>This chapter covers three groups: services that let parts of an app talk to each other, tools that help developers ship code, and tools that help you watch, audit and govern the whole platform.</p><h3 id=\"s-integration\">Integration: passing messages between parts</h3><p>Big systems work better when pieces are <strong>decoupled</strong>, meaning one piece can fail or slow down without breaking the others.</p><p><strong>Amazon SQS (Simple Queue Service)</strong></p><ul><li><strong>What it is:</strong> a queue. Senders drop messages in; receivers pick them up when ready.</li><li><strong>Use it when:</strong> a burst of work arrives faster than workers can handle, for example video uploads waiting to be processed.</li><li><strong>Remember for the exam:</strong> one message is generally handled by one consumer; the queue holds messages so none are lost.</li></ul><p><strong>Amazon SNS (Simple Notification Service)</strong></p><ul><li><strong>What it is:</strong> a publish and subscribe notification service. One message goes out to many subscribers (email, text, queues, Lambda).</li><li><strong>Use it when:</strong> you want to alert people or fan one event out to many systems.</li><li><strong>Remember for the exam:</strong> SNS pushes; SQS holds. They are often used together.</li></ul><p><strong>Amazon EventBridge</strong></p><ul><li><strong>What it is:</strong> an event bus that routes events from AWS services, your apps and partner software to targets based on rules.</li><li><strong>Use it when:</strong> something should happen automatically when an event occurs, or on a schedule.</li><li><strong>Remember for the exam:</strong> think \"if this happens, then run that\".</li></ul><p><strong>AWS Step Functions</strong></p><ul><li><strong>What it is:</strong> a visual workflow builder that links steps (often Lambda functions) in order with branching and retries.</li><li><strong>Use it when:</strong> a process has several steps, such as publish article, resize images, then notify subscribers.</li><li><strong>Remember for the exam:</strong> coordinates steps; serverless.</li></ul><p><strong>Amazon AppFlow</strong> (mention only) moves data between SaaS apps such as Salesforce and AWS services without code.</p><h3 id=\"s-devtools\">Developer tools: from code to running app</h3><p>Developers need a pipeline that turns code into a live product safely.</p><ul><li><strong>AWS CodeCommit:</strong> managed Git code storage. It is closed to new customers, so newer teams use other Git hosts; you may still see it named in questions as the AWS service for storing source code.</li><li><strong>AWS CodeBuild:</strong> compiles code and runs tests; no build servers to manage.</li><li><strong>AWS CodeDeploy:</strong> automates putting new versions onto EC2, Lambda or on-premises servers.</li><li><strong>AWS CodePipeline:</strong> the conveyor belt that connects source, build, test and deploy steps into one automated release flow (continuous delivery).</li><li><strong>AWS X-Ray:</strong> traces a request as it travels through your app so you can see where it slows down or fails.</li></ul><blockquote class=\"tip\">Order to remember: Commit (store) then Build then Deploy, all orchestrated by Pipeline. X-Ray is for debugging, not for releasing.</blockquote><h3 id=\"s-watching\">Watching and auditing: CloudWatch, CloudTrail, Config</h3><p>These three are the most confused trio on the exam. Each answers a different question.</p><div class=\"tw\"><table><thead><tr><th>Service</th><th>Question it answers</th><th>What you get</th></tr></thead><tbody><tr><td>Amazon CloudWatch</td><td>How is it performing right now?</td><td>Metrics (CPU, traffic), logs, dashboards, <strong>alarms</strong> that notify or trigger actions.</td></tr><tr><td>AWS CloudTrail</td><td>Who did what, and when?</td><td>Records API calls and console actions: user, time, source address. An audit trail.</td></tr><tr><td>AWS Config</td><td>What does it look like, and did it change from the rules?</td><td>Records resource configuration over time and checks it against rules for compliance.</td></tr></tbody></table></div><p><strong>Amazon CloudWatch</strong></p><ul><li><strong>What it is:</strong> monitoring for resources and apps: <strong>metrics</strong> (numbers over time), <strong>logs</strong> (text records) and <strong>alarms</strong> (alerts when a number crosses a line).</li><li><strong>Use it when:</strong> you want to know when CPU is too high, or want to collect app logs in one place.</li><li><strong>Remember for the exam:</strong> performance and health monitoring.</li></ul><p><strong>AWS CloudTrail</strong></p><ul><li><strong>What it is:</strong> a recorder of account activity and API calls.</li><li><strong>Use it when:</strong> someone deleted a server and you need to find out who; or you must prove activity for an audit.</li><li><strong>Remember for the exam:</strong> \"who\", \"when\", \"which user\" means CloudTrail.</li></ul><p><strong>AWS Config</strong></p><ul><li><strong>What it is:</strong> tracks the configuration of your resources and judges them against rules.</li><li><strong>Use it when:</strong> you must show that every storage bucket stayed encrypted, or see what a setting was last month.</li><li><strong>Remember for the exam:</strong> \"compliance\" and \"configuration history\" mean Config.</li></ul><h3 id=\"s-operate\">Operating and advising: Systems Manager, Trusted Advisor, Health</h3><ul><li><strong>AWS Systems Manager:</strong> one place to see and operate your servers: patching, running commands and storing configuration values (Parameter Store), often without logging in directly. Use it to manage fleets of EC2 and on-premises machines.</li><li><strong>AWS Trusted Advisor:</strong> automated checks and recommendations across cost, performance, security, fault tolerance, service limits and operational excellence. The full set of checks needs a Business, Enterprise On-Ramp or Enterprise Support plan.</li><li><strong>AWS Health Dashboard:</strong> shows the status of AWS services overall (service health) and the <strong>Personal Health Dashboard</strong> view shows events that affect <em>your</em> resources, such as scheduled maintenance or an outage in your Region.</li><li><strong>AWS Compute Optimizer</strong> (mention): looks at your usage and recommends right-sized EC2 and similar compute.</li></ul><h3 id=\"s-governance\">Governing many accounts</h3><p>As PulseWire grows, it will use several AWS accounts (one per team or environment).</p><p><strong>AWS Organizations</strong></p><ul><li><strong>What it is:</strong> groups many accounts under one structure with consolidated billing and Service Control Policies (SCPs) that set maximum permissions.</li><li><strong>Use it when:</strong> you want one bill, volume discounts, or guardrails across accounts.</li><li><strong>Remember for the exam:</strong> SCPs restrict what accounts can do; they do not grant permissions.</li></ul><p><strong>AWS Control Tower</strong></p><ul><li><strong>What it is:</strong> sets up a secure multi-account environment (a landing zone) quickly using best-practice guardrails.</li><li><strong>Use it when:</strong> you want a ready-made, governed account structure without building it by hand.</li><li><strong>Remember for the exam:</strong> built on top of Organizations; automated set-up plus guardrails.</li></ul><p><strong>AWS Service Catalog</strong></p><ul><li><strong>What it is:</strong> a menu of pre-approved products (templates) that teams can launch themselves.</li><li><strong>Use it when:</strong> you want teams to self-serve while staying inside company standards.</li><li><strong>Remember for the exam:</strong> approved catalog of products.</li></ul><ul><li><strong>AWS License Manager</strong> (mention): tracks software licenses across AWS and on-premises.</li><li><strong>AWS Well-Architected Tool:</strong> a free review tool that compares your workload to the Well-Architected Framework pillars and suggests improvements.</li></ul><h3 id=\"s-common-traps\">Common traps</h3><ul><li><strong>CloudWatch vs CloudTrail.</strong> Performance and alarms is CloudWatch; who made an API call is CloudTrail.</li><li><strong>CloudTrail vs Config.</strong> CloudTrail is the action log; Config is the state-of-resources history and compliance check.</li><li><strong>SQS vs SNS.</strong> Queue that holds work is SQS; broadcast to many subscribers is SNS.</li><li><strong>Trusted Advisor vs Compute Optimizer vs Well-Architected Tool.</strong> Broad best-practice checks, right-sizing compute, and a questionnaire-style review.</li><li><strong>Health Dashboard vs the status of your own app.</strong> Health Dashboard is about AWS services and events affecting your account; CloudWatch is about your app.</li><li><strong>Organizations vs Control Tower.</strong> Organizations manages accounts and policies; Control Tower automates a best-practice set-up on top of it.</li></ul><h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>Hold work in a line until workers are ready      -&gt; SQS\nSend one alert to many subscribers               -&gt; SNS\nReact to an event or run on a schedule           -&gt; EventBridge\nMulti-step workflow with branching               -&gt; Step Functions\nBuild and test code / deploy it / full pipeline  -&gt; CodeBuild / CodeDeploy / CodePipeline\nTrace a slow request through the app             -&gt; X-Ray\nCPU graph, logs, alarm                           -&gt; CloudWatch\nWho deleted that resource?                       -&gt; CloudTrail\nIs it configured per our rules? History?         -&gt; Config\nPatch and run commands on many servers           -&gt; Systems Manager\nCost/security/limits best-practice checks        -&gt; Trusted Advisor\nEvents affecting MY resources                    -&gt; Personal Health Dashboard\nMany accounts, one bill, guardrails              -&gt; Organizations / Control Tower</code></pre>", "toc": [{"id": "integration", "text": "Integration: passing messages between parts"}, {"id": "devtools", "text": "Developer tools: from code to running app"}, {"id": "watching", "text": "Watching and auditing: CloudWatch, CloudTrail, Config"}, {"id": "operate", "text": "Operating and advising: Systems Manager, Trusted Advisor, Health"}, {"id": "governance", "text": "Governing many accounts"}, {"id": "common-traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch13", "ch": 13, "title": "Chapter 13: Smart Services and Data (AI/ML, Analytics, Business Apps)", "short": "Can AWS read, speak and predict?", "topic": "AI/ML, analytics and business applications", "d": 3, "focus": false, "mins": 8, "html": "<p>Meera has a new idea: \"Can we caption every video automatically, translate stories into five languages, and let readers ask a chatbot for a summary?\" Kabir groans: \"Why can't we just hire more people?\" Not at PulseWire's budget.</p><p>AWS has ready-made smart services so you do not need a team of scientists. This chapter also covers analytics (finding insights in data) and a few business applications.</p><h3 id=\"s-ml\">Machine learning and AI services</h3><p><strong>Machine learning (ML)</strong> means computers learning patterns from examples instead of following hand-written rules. AWS offers it in two layers: build-your-own tools, and ready-to-use services you simply call.</p><p><strong>Amazon SageMaker</strong></p><ul><li><strong>What it is:</strong> a platform to build, train and deploy your own ML models.</li><li><strong>Use it when:</strong> your data scientists want to create custom models.</li><li><strong>Remember for the exam:</strong> the \"build your own\" ML service.</li></ul><p>Below are the ready-made AI services. Match the job to the name:</p><div class=\"tw\"><table><thead><tr><th>Service</th><th>Job</th></tr></thead><tbody><tr><td>Amazon Rekognition</td><td>Finds objects, faces and text in images and video.</td></tr><tr><td>Amazon Comprehend</td><td>Understands text: sentiment, key phrases, language (natural language processing).</td></tr><tr><td>Amazon Lex</td><td>Builds chatbots and voice bots (the technology behind Alexa).</td></tr><tr><td>Amazon Polly</td><td>Turns text into spoken audio (text to speech).</td></tr><tr><td>Amazon Transcribe</td><td>Turns speech into text (speech to text), for captions and call notes.</td></tr><tr><td>Amazon Translate</td><td>Translates text between languages.</td></tr><tr><td>Amazon Textract</td><td>Pulls text and tables out of scanned documents and forms.</td></tr><tr><td>Amazon Kendra</td><td>Intelligent search across company documents using natural language questions.</td></tr></tbody></table></div><blockquote class=\"tip\">Polly speaks (P for pronounce); Transcribe writes down what was said.</blockquote><h3 id=\"s-genai\">Generative AI, Bedrock and Amazon Q</h3><p><strong>Generative AI</strong> creates new content such as text, images or code. It is powered by <strong>foundation models (FMs)</strong>: very large models trained on huge amounts of data that can be adapted to many tasks.</p><p><strong>Amazon Bedrock</strong></p><ul><li><strong>What it is:</strong> a managed service that gives access to foundation models from several providers through one API, with no servers to run.</li><li><strong>Use it when:</strong> you want to add text generation, summarization or a chatbot to your app using a ready model, and to customize it with your own data safely.</li><li><strong>Remember for the exam:</strong> \"foundation models\" and \"generative AI\" without managing infrastructure point to Bedrock. Your data is not used to train the base models.</li></ul><p><strong>Amazon Q</strong></p><ul><li><strong>What it is:</strong> a generative-AI assistant. Amazon Q Business answers questions about your company's data; Amazon Q Developer helps write and understand code and work with AWS.</li><li><strong>Use it when:</strong> you want an assistant for employees or developers.</li><li><strong>Remember for the exam:</strong> Q is the assistant; Bedrock is the platform for building your own generative apps.</li></ul><p>A few concepts to know at this depth:</p><ul><li><strong>Prompt:</strong> the instruction or question you give the model. Better prompts give better answers (prompt engineering).</li><li><strong>Hallucination:</strong> when a model confidently states something untrue, so people should verify important answers.</li><li><strong>Responsible AI:</strong> building AI that is fair, explainable, private, safe and transparent. Watch for bias in training data, protect personal data, and keep a human in the loop for important decisions.</li></ul><h3 id=\"s-analytics\">Analytics: turning data into answers</h3><p>PulseWire stores lots of raw data in S3. These services help you ask questions of it.</p><p><strong>Amazon Athena</strong></p><ul><li><strong>What it is:</strong> runs SQL queries directly on files in S3. Serverless, pay per query.</li><li><strong>Use it when:</strong> you want a quick answer from data in S3 without loading it elsewhere.</li><li><strong>Remember for the exam:</strong> \"query S3 with SQL\" means Athena.</li></ul><p><strong>AWS Glue</strong></p><ul><li><strong>What it is:</strong> a serverless ETL service (extract, transform, load) with a data catalog that cleans and prepares data.</li><li><strong>Use it when:</strong> data must be reshaped before it can be analyzed.</li><li><strong>Remember for the exam:</strong> ETL means Glue.</li></ul><p><strong>Amazon EMR</strong></p><ul><li><strong>What it is:</strong> managed big-data clusters running tools like Apache Spark and Hadoop.</li><li><strong>Use it when:</strong> you have huge data-processing jobs using open-source big-data frameworks.</li><li><strong>Remember for the exam:</strong> \"Hadoop\" or \"Spark\" means EMR.</li></ul><p><strong>Amazon Kinesis</strong></p><ul><li><strong>What it is:</strong> handles streaming data: many small records arriving continuously, such as clicks or sensor readings.</li><li><strong>Use it when:</strong> you need real-time collection and processing of live data.</li><li><strong>Remember for the exam:</strong> \"real-time streaming\" means Kinesis.</li></ul><p><strong>Amazon OpenSearch Service</strong></p><ul><li><strong>What it is:</strong> search and log analytics engine.</li><li><strong>Use it when:</strong> you need fast text search or dashboards over logs.</li><li><strong>Remember for the exam:</strong> search and log analytics.</li></ul><p><strong>Amazon QuickSight</strong></p><ul><li><strong>What it is:</strong> business intelligence: dashboards and charts for non-technical users.</li><li><strong>Use it when:</strong> Meera wants a visual dashboard of readership.</li><li><strong>Remember for the exam:</strong> \"BI\" or \"dashboard\" means QuickSight.</li></ul><ul><li><strong>Amazon Redshift</strong> (mention): a data warehouse for fast analysis of large structured data.</li><li><strong>AWS Lake Formation</strong> (mention): helps set up and secure a data lake in S3.</li></ul><h3 id=\"s-business\">Business apps and IoT</h3><ul><li><strong>Amazon Connect:</strong> a cloud contact centre (customer-service phone and chat system). Use it to run support without buying phone hardware.</li><li><strong>Amazon SES (Simple Email Service):</strong> sends bulk and transactional email such as newsletters and receipts. PulseWire's newsletter would use it.</li><li><strong>Amazon WorkSpaces:</strong> virtual desktops in the cloud for employees (desktop as a service).</li><li><strong>Amazon AppStream 2.0</strong> (mention): streams individual desktop applications to a browser.</li><li><strong>AWS IoT Core</strong> (mention): securely connects Internet of Things devices such as sensors to the cloud.</li></ul><h3 id=\"s-common-traps\">Common traps</h3><ul><li><strong>Polly vs Transcribe.</strong> Polly turns text into speech; Transcribe turns speech into text.</li><li><strong>Comprehend vs Textract vs Rekognition.</strong> Comprehend understands text meaning; Textract extracts text from documents; Rekognition analyses images and video.</li><li><strong>SageMaker vs Bedrock.</strong> SageMaker builds and trains your own models; Bedrock uses ready foundation models.</li><li><strong>Kendra vs OpenSearch.</strong> Kendra answers natural-language questions over documents; OpenSearch is a general search and log engine.</li><li><strong>Athena vs Redshift vs QuickSight.</strong> Athena queries S3 files; Redshift is a warehouse; QuickSight draws dashboards.</li><li><strong>Kinesis vs SQS.</strong> Kinesis streams live data for real-time analysis; SQS queues messages between parts of an app.</li></ul><h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>Build and train my own ML model                 -&gt; SageMaker\nFind faces or objects in a photo or video       -&gt; Rekognition\nSentiment or key phrases in text                -&gt; Comprehend\nChatbot or voice bot                            -&gt; Lex\nText to spoken audio                            -&gt; Polly\nSpeech to text, captions                        -&gt; Transcribe\nTranslate between languages                     -&gt; Translate\nExtract text and tables from scanned forms      -&gt; Textract\nSmart search of company documents               -&gt; Kendra\nFoundation models, generative AI via one API    -&gt; Bedrock\nAI assistant for staff or coders                -&gt; Amazon Q\nSQL on S3 / ETL / Spark / live streams          -&gt; Athena / Glue / EMR / Kinesis\nBI dashboard                                    -&gt; QuickSight\nContact centre / bulk email / virtual desktops  -&gt; Connect / SES / WorkSpaces</code></pre>", "toc": [{"id": "ml", "text": "Machine learning and AI services"}, {"id": "genai", "text": "Generative AI, Bedrock and Amazon Q"}, {"id": "analytics", "text": "Analytics: turning data into answers"}, {"id": "business", "text": "Business apps and IoT"}, {"id": "common-traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch14", "ch": 14, "title": "Chapter 14: The Bill (Pricing and Cost Management)", "short": "Why did the bill double?", "topic": "Pricing, purchasing options and cost tools", "d": 4, "focus": true, "mins": 8, "html": "<p>Meera walked into the room holding a printout. \"The bill doubled last month and nobody can tell me why. Before we ship anything else, I want to understand what we pay for.\"</p>\n<p>Kabir shrugged. \"Some of that is the test servers I forgot to stop.\" As PulseWire's new cloud lead, you now own the bill. This chapter is the heart of Domain 4, so read it slowly.</p>\n<h3 id=\"s-pricing-basics\">Pricing fundamentals</h3>\n<p>AWS pricing rests on three ideas that show up constantly on the exam.</p>\n<ul>\n<li><strong>Pay as you go.</strong> No upfront contract. You pay for what you use, by the second, hour or gigabyte, and stop paying when you stop using.</li>\n<li><strong>Pay less when you reserve.</strong> Commit to a steady amount of usage for one or three years and the price per hour drops, often by up to about 70 percent or more.</li>\n<li><strong>Pay less per unit as you use more.</strong> Volume discounts. For example, S3 gets cheaper per gigabyte at higher storage tiers.</li>\n</ul>\n<p>The <strong>AWS Free Tier</strong> comes in three types:</p>\n<ul>\n<li><strong>Always free:</strong> never expires, with monthly limits (for example a small amount of Lambda requests and DynamoDB storage).</li>\n<li><strong>12 months free:</strong> starts when you open the account (for example limited EC2 and S3 usage).</li>\n<li><strong>Short-term trials:</strong> a trial period that starts when you first use the service.</li>\n</ul>\n<h3 id=\"s-ec2-purchasing\">EC2 purchasing options</h3>\n<p>The exam loves this table. Same server, different ways to pay.</p><div class=\"tw\"><table><thead><tr><th>Option</th><th>Pay how</th><th>Best for</th></tr></thead><tbody><tr><td><strong>On-Demand</strong></td><td>Per second or hour, no commitment</td><td>Unpredictable or short-term workloads, first-time testing</td></tr><tr><td><strong>Reserved Instances (RI)</strong></td><td>1 or 3 year commitment, big discount</td><td>Steady, predictable workloads</td></tr><tr><td><strong>Savings Plans</strong></td><td>Commit to a dollar amount per hour for 1 or 3 years</td><td>Steady usage with flexibility to change</td></tr><tr><td><strong>Spot Instances</strong></td><td>Spare capacity at up to about 90 percent off; AWS can take it back with short notice</td><td>Fault-tolerant, flexible jobs (batch, rendering, analysis)</td></tr><tr><td><strong>Dedicated Hosts</strong></td><td>A whole physical server for you</td><td>Bring-your-own server-bound licenses, compliance rules</td></tr><tr><td><strong>Dedicated Instances</strong></td><td>Instances on hardware used only by your account</td><td>Isolation from other customers, less control than a Host</td></tr><tr><td><strong>Capacity Reservations</strong></td><td>Reserve capacity in one AZ, billed at On-Demand rates</td><td>Guaranteeing that servers are available when you need them</td></tr></tbody></table></div>\n<ul>\n<li><strong>Reserved Instances</strong> come as <strong>Standard</strong> (largest discount, limited changes) and <strong>Convertible</strong> (smaller discount, you can swap to a different instance family).</li>\n<li><strong>Savings Plans</strong> come as <strong>Compute</strong> (most flexible: applies across instance families, Regions, and even Fargate and Lambda) and <strong>EC2 Instance</strong> (a bigger discount, tied to one instance family in one Region).</li>\n<li><strong>Remember for the exam:</strong> Spot is cheapest but can be interrupted. A Capacity Reservation guarantees capacity, not a discount. Reserved and Savings Plans give the discount for steady use.</li>\n</ul>\n<h3 id=\"s-data-transfer\">Data transfer rules</h3>\n<p>Kabir's favorite question: \"Why are we paying just to move data?\" Here is the pattern.</p>\n<ul>\n<li><strong>Data in</strong> to AWS from the internet is free.</li>\n<li><strong>Data out</strong> to the internet is charged, with volume discounts.</li>\n<li><strong>Same AZ</strong> traffic using private IPs is generally free or cheapest. Traffic <strong>between AZs</strong> costs a little. Traffic <strong>between Regions</strong> costs more.</li>\n<li>Putting Amazon CloudFront in front of content often lowers data-out costs, and traffic from an AWS origin to CloudFront is free.</li>\n</ul>\n<blockquote class=\"tip\">Exam shortcut: in is free, out is charged, and the farther the data travels, the more it costs.</blockquote>\n<h3 id=\"s-storage-costs\">Thinking about storage cost</h3>\n<p>The cheapest storage is the one that matches how often you read the data. S3 Standard is for frequently used data. Infrequent Access classes cost less to store but charge to retrieve. Glacier classes are very cheap for archives but slow or fee-based to retrieve. S3 Intelligent-Tiering moves objects for you when you cannot predict access. Lifecycle rules move data to cheaper classes automatically. Also remember EBS volumes you forgot to delete and unattached IPs still cost money.</p>\n<h3 id=\"s-org-billing\">Organizations and consolidated billing</h3>\n<ul>\n<li><strong>What it is:</strong> AWS Organizations lets you group many accounts under one management account with one bill.</li>\n<li><strong>Use it when:</strong> PulseWire has separate accounts for dev, prod and the video team.</li>\n<li><strong>Remember for the exam:</strong> Consolidated billing combines usage across accounts, so you reach volume discounts sooner, and unused Reserved Instance or Savings Plans discounts can be shared across accounts. It is free.</li>\n</ul>\n<h3 id=\"s-cost-tools\">Cost management tools</h3>\n<p>Many tools sound alike. Match each to its job.</p>\n<ul>\n<li><strong>Cost allocation tags.</strong> Labels such as <code>team=video</code> that you attach to resources. Activate them in billing and your reports can split costs by team or project. Two kinds: AWS-generated and user-defined.</li>\n<li><strong>AWS Budgets.</strong> Set a spending or usage target and get <strong>alerts</strong> when you are forecast to exceed it. It can also trigger actions.</li>\n<li><strong>AWS Cost Explorer.</strong> A visual tool to <strong>see and analyze</strong> past spending and forecast future spending, filtered by service, tag or account.</li>\n<li><strong>AWS Cost and Usage Report (CUR).</strong> The most detailed data, delivered as files to S3, for deep analysis.</li>\n<li><strong>AWS Pricing Calculator.</strong> <strong>Estimate</strong> the cost of a design <em>before</em> you build it.</li>\n<li><strong>AWS Billing Conductor.</strong> Lets you customize billing data to show back or charge back groups (for resellers or internal chargeback). Just recognize the name.</li>\n<li><strong>AWS Compute Optimizer.</strong> Uses usage data to recommend right-sized EC2, EBS, Lambda and similar resources.</li>\n<li><strong>AWS Trusted Advisor.</strong> Checks for idle or underused resources and other cost savings. Cost optimization is one of its categories; the full set of checks needs a Business or higher support plan.</li>\n<li><strong>AWS Marketplace.</strong> A catalog for buying third-party software that you can launch in AWS, with the charges added to your AWS bill.</li>\n</ul>\n<h3 id=\"s-common-traps\">Common traps</h3>\n<ul>\n<li><strong>Budgets vs Cost Explorer.</strong> Alert you when you cross a limit means Budgets. Look at and chart your spending means Cost Explorer.</li>\n<li><strong>Pricing Calculator vs Cost Explorer.</strong> Calculator is for future designs; Cost Explorer is for what you already spent.</li>\n<li><strong>Spot for critical databases.</strong> Spot can be interrupted, so it is wrong for workloads that cannot stop.</li>\n<li><strong>Capacity Reservation is not a discount.</strong> It only guarantees availability.</li>\n<li><strong>Standard vs Convertible RI.</strong> Convertible gives flexibility; Standard gives the deepest discount.</li>\n<li><strong>Data in is free.</strong> A question asking what is free often points to inbound data.</li>\n</ul>\n<h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>If the question says...                         -&gt; pick\nSteady workload, lowest price, 1-3 yr commit    -&gt; Reserved Instances / Savings Plans\nNeeds flexibility across families or Regions    -&gt; Compute Savings Plans\nInterruptible batch work, cheapest              -&gt; Spot Instances\nUnpredictable, short-term, no commitment        -&gt; On-Demand\nOwn physical server for licensing               -&gt; Dedicated Hosts\nGuarantee capacity in an AZ                     -&gt; Capacity Reservations\nAlert me before I overspend                     -&gt; AWS Budgets\nVisualize and forecast past costs               -&gt; Cost Explorer\nEstimate cost before building                   -&gt; Pricing Calculator\nSplit costs by team or project                  -&gt; Cost allocation tags\nRight-size underused instances                  -&gt; Compute Optimizer</code></pre>", "toc": [{"id": "pricing-basics", "text": "Pricing fundamentals"}, {"id": "ec2-purchasing", "text": "EC2 purchasing options"}, {"id": "data-transfer", "text": "Data transfer rules"}, {"id": "storage-costs", "text": "Thinking about storage cost"}, {"id": "org-billing", "text": "Organizations and consolidated billing"}, {"id": "cost-tools", "text": "Cost management tools"}, {"id": "common-traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch15", "ch": 15, "title": "Chapter 15: Getting Help (Support and Resources)", "short": "Who do we call at 2 a.m.?", "topic": "Support plans and AWS help resources", "d": 4, "focus": false, "mins": 6, "html": "<p>At 2 a.m. the video pipeline stopped working, and Kabir was staring at an error he had never seen. \"Can we just call someone?\" Meera asked, already worried about the morning's launch.</p>\n<p>You can, but who answers, and how fast, depends on the support plan you chose. This chapter covers the ways to get help from AWS and from the community.</p>\n<h3 id=\"s-support-plans\">AWS Support plans</h3>\n<p>There are five plans. At CLF depth, memorize who gets what.</p><div class=\"tw\"><table><thead><tr><th>Plan</th><th>Who it fits</th><th>Key features</th></tr></thead><tbody><tr><td><strong>Basic</strong></td><td>Everyone, free</td><td>Documentation, whitepapers, re:Post, Health Dashboard, limited Trusted Advisor checks. No technical support cases (billing and account cases only).</td></tr><tr><td><strong>Developer</strong></td><td>Testing and early development</td><td>Business-hours email access to Cloud Support Associates. General guidance (first response within 24 business hours); system impaired within 12 business hours.</td></tr><tr><td><strong>Business</strong></td><td>Production workloads</td><td>24/7 phone, chat and email with engineers. Production system impaired within 4 hours; production system down within 1 hour. <strong>Full Trusted Advisor checks.</strong></td></tr><tr><td><strong>Enterprise On-Ramp</strong></td><td>Important production, business-critical starters</td><td>Everything in Business, plus a pool of Technical Account Managers, a Concierge-style billing and account team, and business-critical system down within 30 minutes.</td></tr><tr><td><strong>Enterprise</strong></td><td>Business-critical, large scale</td><td>Everything above, plus a <strong>designated Technical Account Manager</strong>, and business-critical system down within 15 minutes.</td></tr></tbody></table></div>\n<ul>\n<li><strong>Remember for the exam:</strong> The Technical Account Manager is available on Enterprise On-Ramp (a pool) and Enterprise (designated). Full Trusted Advisor checks start at Business. 24/7 engineer access starts at Business. Business-critical response times belong to the Enterprise plans.</li>\n<li><strong>Who can open cases:</strong> On Basic, only account and billing cases. On Developer, one primary contact (and other users with permission) can open technical cases; Business and above allow unlimited contacts to open cases.</li>\n<li>Exact response times can change, so for the exam, remember the pattern: faster plans cost more and have faster response for more critical problems.</li>\n</ul>\n<h3 id=\"s-tam-and-support-center\">Technical Account Manager and Support Center</h3>\n<ul>\n<li><strong>Technical Account Manager (TAM).</strong> <strong>What it is:</strong> a named AWS expert who knows your environment. <strong>Use it when:</strong> you want proactive guidance, architecture reviews and a single point of contact for escalation. <strong>Remember:</strong> Enterprise level plans only.</li>\n<li><strong>AWS Support Center.</strong> <strong>What it is:</strong> the console page where you create and manage support cases and view your plan. <strong>Remember:</strong> this is where you open a technical case.</li>\n</ul>\n<h3 id=\"s-partners\">Partners and Marketplace</h3>\n<ul>\n<li><strong>AWS Partner Network (APN).</strong> A global community of consulting and technology companies that build on and sell AWS. <strong>Use it when:</strong> PulseWire wants an outside company to design or migrate a system.</li>\n<li><strong>AWS Marketplace.</strong> A digital catalog to find, try and buy third-party software and data, billed through AWS.</li>\n<li><strong>Remember for the exam:</strong> Partners are companies; Marketplace is the store.</li>\n</ul>\n<h3 id=\"s-expert-help\">Expert help from AWS</h3>\n<ul>\n<li><strong>AWS Professional Services.</strong> A team of AWS experts you can hire to help reach specific business outcomes, such as a cloud migration.</li>\n<li><strong>AWS IQ.</strong> A marketplace to hire AWS-certified freelance experts for a project. Think of it as finding a certified expert on demand.</li>\n<li><strong>Trusted Advisor.</strong> Gives best-practice checks across cost, performance, security, fault tolerance, service limits and operational excellence.</li>\n</ul>\n<h3 id=\"s-self-service\">Self-service learning and community</h3>\n<ul>\n<li><strong>AWS re:Post.</strong> A community question-and-answer site, free for everyone, where people and AWS experts answer questions.</li>\n<li><strong>AWS Knowledge Center.</strong> Articles answering the most common support questions, from real support cases.</li>\n<li><strong>Documentation and whitepapers.</strong> Official guides and deep technical papers, including the Well-Architected material. Free for all plans.</li>\n<li><strong>AWS Health Dashboard.</strong> Shows the status of AWS services and events that affect <em>your</em> resources. Use it when something is broken and you wonder if AWS is the cause.</li>\n</ul>\n<h3 id=\"s-abuse\">Reporting abuse</h3>\n<p>If you believe AWS resources are being used for spam, attacks or other illegal activity, report it to the <strong>AWS Trust and Safety</strong> team (the abuse report form or the abuse email address). It is not a support plan feature and is not a security tool; it is the place to report misuse.</p>\n<h3 id=\"s-common-traps\">Common traps</h3>\n<ul>\n<li><strong>Basic is not technical support.</strong> Basic offers account and billing help only.</li>\n<li><strong>TAM is not on Business.</strong> Look for Enterprise On-Ramp or Enterprise.</li>\n<li><strong>Professional Services vs IQ vs Partner.</strong> AWS's own experts, freelance certified experts, outside consulting companies.</li>\n<li><strong>re:Post vs Knowledge Center.</strong> Community Q and A versus curated support articles.</li>\n<li><strong>Health Dashboard vs Trusted Advisor.</strong> Events and outages versus best-practice recommendations.</li>\n</ul>\n<h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>If the question says...                        -&gt; pick\nFree, billing questions only                   -&gt; Basic support\nTesting, business-hours email                  -&gt; Developer support\nProduction workload, 24/7 phone and chat       -&gt; Business support\nFull Trusted Advisor checks, lowest plan       -&gt; Business support\nNamed expert who knows my account              -&gt; TAM (Enterprise)\nHire AWS experts for a migration               -&gt; Professional Services\nHire a certified freelancer                    -&gt; AWS IQ\nAsk the community                              -&gt; AWS re:Post\nIs AWS having an outage that affects me        -&gt; AWS Health Dashboard\nReport spam or abuse from AWS IPs              -&gt; AWS Trust and Safety\nFind third-party software to buy               -&gt; AWS Marketplace</code></pre>", "toc": [{"id": "support-plans", "text": "AWS Support plans"}, {"id": "tam-and-support-center", "text": "Technical Account Manager and Support Center"}, {"id": "partners", "text": "Partners and Marketplace"}, {"id": "expert-help", "text": "Expert help from AWS"}, {"id": "self-service", "text": "Self-service learning and community"}, {"id": "abuse", "text": "Reporting abuse"}, {"id": "common-traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "appendix", "ch": null, "title": "Appendix: Exam reflexes", "short": "Exam reflexes", "topic": "", "d": 0, "focus": false, "mins": 6, "html": "<p>Use this as your last review before the exam. Each row is a trigger phrase and the answer the exam usually wants. Read the tables, then test yourself by covering the right column.</p><h3 id=\"s-cloud-concepts\">Cloud Concepts</h3><div class=\"tw\"><table><thead><tr><th>When the question says...</th><th>Think...</th></tr></thead><tbody><tr><td>Trade upfront cost for variable cost</td><td>Benefit of cloud (pay as you go)</td></tr><tr><td>Scale up and down automatically to match demand</td><td>Elasticity</td></tr><tr><td>Handle growth by adding resources</td><td>Scalability</td></tr><tr><td>Deploy worldwide in minutes</td><td>Global reach and speed (Regions)</td></tr><tr><td>Survive the failure of one data center</td><td>Multiple Availability Zones, high availability</td></tr><tr><td>Survive the failure of a whole Region</td><td>Multi-Region, disaster recovery</td></tr><tr><td>Reduce guessing about capacity</td><td>Stop guessing capacity (cloud benefit)</td></tr><tr><td>Six pillars, design best practices</td><td>AWS Well-Architected Framework</td></tr><tr><td>Move out of a data center, plan the journey</td><td>AWS Cloud Adoption Framework / migration strategies (6 Rs)</td></tr><tr><td>Move as is without changes</td><td>Rehost (lift and shift)</td></tr><tr><td>Move to a managed service, replace the database</td><td>Replatform or refactor</td></tr><tr><td>Mix of on-premises and cloud</td><td>Hybrid cloud</td></tr><tr><td>Hardware you manage vs the provider manages</td><td>IaaS, PaaS, SaaS levels of responsibility</td></tr><tr><td>Fast to launch, low risk of experiments</td><td>Agility, innovate faster</td></tr><tr><td>Cost drops as AWS grows</td><td>Economies of scale</td></tr></tbody></table></div><h3 id=\"s-security-and-compliance\">Security and Compliance</h3><div class=\"tw\"><table><thead><tr><th>When the question says...</th><th>Think...</th></tr></thead><tbody><tr><td>Who secures the hardware and data centers</td><td>AWS (security OF the cloud)</td></tr><tr><td>Who configures access, data and firewalls</td><td>Customer (security IN the cloud)</td></tr><tr><td>Control who can do what</td><td>IAM policies, least privilege</td></tr><tr><td>Extra proof at sign-in</td><td>Multi-factor authentication (MFA)</td></tr><tr><td>Temporary credentials for services or apps</td><td>IAM roles</td></tr><tr><td>Single sign-on for many accounts and apps</td><td>IAM Identity Center</td></tr><tr><td>Manage keys for encryption</td><td>AWS KMS</td></tr><tr><td>Hardware keys dedicated to me</td><td>AWS CloudHSM</td></tr><tr><td>Store and rotate passwords and API keys</td><td>AWS Secrets Manager</td></tr><tr><td>Download compliance reports on demand</td><td>AWS Artifact</td></tr><tr><td>Block common web exploits like SQL injection</td><td>AWS WAF</td></tr><tr><td>Protect against DDoS attacks</td><td>AWS Shield (Advanced for extra support)</td></tr><tr><td>Find threats by analyzing logs and traffic</td><td>Amazon GuardDuty</td></tr><tr><td>Find sensitive data like personal information in S3</td><td>Amazon Macie</td></tr><tr><td>Scan servers and containers for vulnerabilities</td><td>Amazon Inspector</td></tr><tr><td>Who made this API call</td><td>AWS CloudTrail</td></tr><tr><td>Central security findings across accounts</td><td>AWS Security Hub</td></tr></tbody></table></div><h3 id=\"s-cloud-technology-and-services\">Cloud Technology and Services</h3><div class=\"tw\"><table><thead><tr><th>When the question says...</th><th>Think...</th></tr></thead><tbody><tr><td>Virtual servers</td><td>Amazon EC2</td></tr><tr><td>Run code without servers, pay per use</td><td>AWS Lambda</td></tr><tr><td>Run containers</td><td>Amazon ECS / EKS (Fargate for serverless)</td></tr><tr><td>Easiest way to deploy a web app</td><td>AWS Elastic Beanstalk</td></tr><tr><td>Simple, fixed-price starter servers</td><td>Amazon Lightsail</td></tr><tr><td>Object storage, unlimited, static website</td><td>Amazon S3</td></tr><tr><td>Hard drive attached to one EC2 instance</td><td>Amazon EBS</td></tr><tr><td>Shared file system for many Linux servers</td><td>Amazon EFS</td></tr><tr><td>Cheap archive for years</td><td>S3 Glacier classes</td></tr><tr><td>Managed relational (SQL) database</td><td>Amazon RDS / Aurora</td></tr><tr><td>Key-value NoSQL, single-digit millisecond</td><td>Amazon DynamoDB</td></tr><tr><td>Data warehouse, analytics queries</td><td>Amazon Redshift</td></tr><tr><td>In-memory cache</td><td>Amazon ElastiCache</td></tr><tr><td>Private network in AWS</td><td>Amazon VPC</td></tr><tr><td>DNS and routing</td><td>Amazon Route 53</td></tr><tr><td>Cache content close to users</td><td>Amazon CloudFront</td></tr><tr><td>Dedicated private line to AWS</td><td>AWS Direct Connect</td></tr><tr><td>Encrypted tunnel over the internet to AWS</td><td>Site-to-Site VPN</td></tr><tr><td>Monitor metrics and alarms</td><td>Amazon CloudWatch</td></tr><tr><td>Record resource configuration changes</td><td>AWS Config</td></tr><tr><td>Distribute traffic across servers</td><td>Elastic Load Balancing</td></tr><tr><td>Add or remove servers automatically</td><td>EC2 Auto Scaling</td></tr><tr><td>Build, train and deploy ML models</td><td>Amazon SageMaker AI</td></tr><tr><td>Foundation models and generative AI apps</td><td>Amazon Bedrock</td></tr></tbody></table></div><h3 id=\"s-billing-pricing-and-support\">Billing, Pricing and Support</h3><div class=\"tw\"><table><thead><tr><th>When the question says...</th><th>Think...</th></tr></thead><tbody><tr><td>Steady workload, big discount for commitment</td><td>Reserved Instances or Savings Plans</td></tr><tr><td>Interruptible, cheapest compute</td><td>Spot Instances</td></tr><tr><td>No commitment, unpredictable</td><td>On-Demand</td></tr><tr><td>Own physical server for licenses</td><td>Dedicated Hosts</td></tr><tr><td>Alert when spending passes a limit</td><td>AWS Budgets</td></tr><tr><td>Chart and forecast past spending</td><td>AWS Cost Explorer</td></tr><tr><td>Estimate cost of a new design</td><td>AWS Pricing Calculator</td></tr><tr><td>Most detailed billing data</td><td>Cost and Usage Report</td></tr><tr><td>Split costs by team or project</td><td>Cost allocation tags</td></tr><tr><td>Combine bills, share volume discounts</td><td>AWS Organizations consolidated billing</td></tr><tr><td>Right-size recommendations</td><td>AWS Compute Optimizer</td></tr><tr><td>Best-practice checks including cost</td><td>AWS Trusted Advisor</td></tr><tr><td>Data into AWS</td><td>Free</td></tr><tr><td>Named expert for my account</td><td>TAM (Enterprise On-Ramp and Enterprise)</td></tr><tr><td>24/7 engineer support in production, lowest plan</td><td>Business support</td></tr><tr><td>Hire AWS experts for a project</td><td>Professional Services</td></tr><tr><td>Hire a certified freelancer</td><td>AWS IQ</td></tr><tr><td>Buy third-party software through AWS</td><td>AWS Marketplace</td></tr></tbody></table></div><h3 id=\"s-common-look-alikes\">Common look-alikes</h3><div class=\"tw\"><table><thead><tr><th>Pair or group</th><th>How to tell them apart</th></tr></thead><tbody><tr><td>Security group vs network ACL</td><td>Security group is stateful and sits at the instance (allow rules only). NACL is stateless and sits at the subnet (allow and deny).</td></tr><tr><td>CloudWatch vs CloudTrail vs Config</td><td>CloudWatch: how is it performing (metrics, alarms). CloudTrail: who did what (API calls). Config: what changed and is it compliant (resource configuration).</td></tr><tr><td>Inspector vs GuardDuty vs Macie</td><td>Inspector scans for vulnerabilities. GuardDuty detects threats. Macie finds sensitive data in S3.</td></tr><tr><td>Shield vs WAF</td><td>Shield stops DDoS floods. WAF filters web requests (SQL injection, cross-site scripting).</td></tr><tr><td>Budgets vs Cost Explorer</td><td>Budgets sets limits and alerts. Cost Explorer analyzes and forecasts.</td></tr><tr><td>SQS vs SNS vs EventBridge</td><td>SQS is a queue (pull). SNS is publish and subscribe (push). EventBridge routes events between services by rules.</td></tr><tr><td>EBS vs EFS vs S3</td><td>EBS is a disk for one instance. EFS is a shared file system. S3 is object storage over the web.</td></tr><tr><td>Reserved vs Savings Plans</td><td>Reserved Instances commit to specific instance configuration. Savings Plans commit to dollars per hour and are more flexible.</td></tr><tr><td>Direct Connect vs VPN</td><td>Direct Connect is a private physical line. VPN is encrypted over the public internet.</td></tr><tr><td>IAM user vs role</td><td>User is a long-term identity for a person. Role gives temporary permissions to be assumed.</td></tr><tr><td>Professional Services vs IQ vs Partner Network</td><td>AWS own experts vs freelance certified experts vs outside consulting companies.</td></tr><tr><td>Region vs AZ vs edge location</td><td>Region is a geographic area. AZ is a data center group in a Region. Edge locations cache content for CloudFront.</td></tr></tbody></table></div><h3 id=\"s-exam-day-tips\">Exam day tips</h3>\n<ul>\n<li><strong>65 questions in 90 minutes.</strong> That gives about 80 seconds per question, so keep moving.</li>\n<li><strong>Some questions are unscored.</strong> AWS includes unscored questions to test new ones, and you cannot tell which. Treat every question as if it counts.</li>\n<li><strong>Flag and return.</strong> If you are unsure, pick your best answer, flag it and move on. Use leftover time to review.</li>\n<li><strong>Eliminate wrong answers.</strong> Remove options you know are wrong; with two left, the odds are much better.</li>\n<li><strong>Read the keywords.</strong> Look for words like cheapest, most secure, least operational effort, highly available and fault tolerant. They point to the answer.</li>\n<li><strong>Do not skip.</strong> There is no penalty for guessing, so answer every question.</li>\n<li><strong>Think concept, not configuration.</strong> This exam asks what a service is for, not how to set it up.</li>\n</ul>", "toc": [{"id": "cloud-concepts", "text": "Cloud Concepts"}, {"id": "security-and-compliance", "text": "Security and Compliance"}, {"id": "cloud-technology-and-services", "text": "Cloud Technology and Services"}, {"id": "billing-pricing-and-support", "text": "Billing, Pricing and Support"}, {"id": "common-look-alikes", "text": "Common look-alikes"}, {"id": "exam-day-tips", "text": "Exam day tips"}]}];

/* ---------- question rendering ---------- */
const ORD={}; // qid -> option order for instant mode
function optOrder(q,fixed){ if(fixed) return fixed; if(!ORD[q.id]) ORD[q.id]=perm(q.o.length); return ORD[q.id]; }
function qHTML(q,o){
  // o: {order, sel:[orig idx], reveal:bool, num, total, mode:'instant'|'exam'|'review', flagged}
  const multi=q.a.length>1, ord=o.order, sel=o.sel||[];
  const opts=ord.map((oi,pos)=>{
    const isSel=sel.includes(oi), isAns=q.a.includes(oi);
    let cls="opt"+(multi?" multi":"");
    if(o.reveal){ if(isAns) cls+=" right"; else if(isSel) cls+=" wrong"; }
    const why=o.reveal?`<span class="why"><b>${isAns?"Correct.":"Incorrect."}</b> ${esc(q.w[oi])}</span>`:"";
    return `<button type="button" class="${cls}" role="${multi?"checkbox":"radio"}" aria-checked="${isSel}" data-oi="${oi}" ${o.reveal?"disabled":""}><span class="ltr">${"ABCDE"[pos]}</span><span>${esc(q.o[oi])}${why}</span></button>`;
  }).join("");
  const meta=`<div class="qmeta">${o.num?`<span class="mono">Question ${o.num}${o.total?" of "+o.total:""}</span>`:""}${o.showDomain!==false?dtag(q.d):""}${o.flagged?'<span style="color:var(--amber)">Flagged</span>':""}</div>`;
  let after="";
  if(o.reveal){
    const ok=same(sel,q.a);
    if(o.mode!=="review") after+=`<div class="verdict ${ok?"ok":"bad"}">${ok?"Correct":sel.length?"Not quite":"Not answered"}</div>`;
    else after+=`<div class="verdict ${ok?"ok":"bad"}">${ok?"You answered correctly":sel.length?"You answered incorrectly":"You did not answer"}</div>`;
    after+=`<div class="reflex"><b>Exam reflex:</b> ${esc(q.k)}</div>`;
  }
  return `<div class="qcard" data-qid="${q.id}">${meta}<p class="qtext">${esc(q.q)}</p>${multi?`<p class="qsel">Select ${NUMW[q.a.length]}.</p>`:'<div style="height:12px"></div>'}<div class="opts" role="${multi?"group":"radiogroup"}" aria-label="Answer options">${opts}</div>${o.reveal?`<div style="margin-top:16px">${after}</div>`:""}${o.actions?`<div class="qact">${o.actions}</div>`:""}</div>`;
}
function toggleSel(q,sel,oi){
  sel=sel.slice();
  if(q.a.length>1){ const i=sel.indexOf(oi); if(i>=0) sel.splice(i,1); else { if(sel.length>=q.a.length) sel.shift(); sel.push(oi);} }
  else sel=[oi];
  return sel;
}

/* ---------- instant-check question widget (lessons, practice) ---------- */
function mountInstant(container,q,opts){
  let sel=[], revealed=false; const ord=optOrder(q);
  const draw=()=>{
    const need=q.a.length;
    const actions=revealed
      ? (opts.next?`<button class="btn primary" data-act="next">${opts.nextLabel||"Next question"}</button>`:"")
      : `<button class="btn primary" data-act="check" ${sel.length===need?"":"disabled"}>Check answer</button>${need>1?`<span class="muted" style="font-size:14px">${sel.length} of ${need} selected</span>`:""}`;
    container.innerHTML=qHTML(q,{order:ord,sel,reveal:revealed,num:opts.num,total:opts.total,mode:"instant",actions});
  };
  container.addEventListener("click",e=>{
    const b=e.target.closest(".opt"); if(b&&!revealed){ sel=toggleSel(q,sel,+b.dataset.oi); draw(); const nb=container.querySelector(`.opt[data-oi="${b.dataset.oi}"]`); nb&&nb.focus(); return; }
    const a=e.target.closest("[data-act]"); if(!a) return;
    if(a.dataset.act==="check"){ revealed=true; S.prac[q.id]={c:same(sel,q.a),t:Date.now()}; save(); draw(); opts.onCheck&&opts.onCheck(same(sel,q.a)); }
    if(a.dataset.act==="next"){ opts.next(); }
  });
  container._key=k=>{
    if(!revealed){ const n="12345".indexOf(k)>=0?"12345".indexOf(k):"abcde".indexOf(k.toLowerCase()); if(n>=0&&n<ord.length){ sel=toggleSel(q,sel,ord[n]); draw(); return true;} if(k==="Enter"&&sel.length===q.a.length){ revealed=true; S.prac[q.id]={c:same(sel,q.a),t:Date.now()}; save(); draw(); opts.onCheck&&opts.onCheck(same(sel,q.a)); return true;} }
    else if(k==="Enter"&&opts.next){ opts.next(); return true; }
    return false;
  };
  draw();
}

/* ---------- views ---------- */
function afterLesson(id){
  $$(".qslot").forEach(s=>mountInstant(s,ALLQ[s.dataset.q],{num:+s.dataset.n,total:$$(".qslot").length}));
  $$("[data-go]").forEach(b=>b.addEventListener("click",()=>{const t=document.getElementById(b.dataset.go); t&&t.scrollIntoView({behavior:"smooth",block:"start"});}));
  const db=$('[data-act="done"]'); db&&db.addEventListener("click",()=>{S.done[id]=!S.done[id];save();render(true);});
  // toc highlight
  const heads=$$(".prose h3[id]"), btns=$$(".toc button");
  if(heads.length&&"IntersectionObserver" in window){
    const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){btns.forEach(b=>b.classList.toggle("on",b.dataset.go===e.target.id));}});},{rootMargin:"-80px 0px -70% 0px"});
    heads.forEach(h=>io.observe(h)); cleanup.push(()=>io.disconnect());
  }
}
