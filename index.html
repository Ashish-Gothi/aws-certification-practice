here the code runs","topic":"Compute","d":2,"focus":false,"mins":9,"html":"<p>PulseWire has four very different kinds of work, and the exam tests whether you match each to the right compute model:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Workload<\/th>\n<th>Shape<\/th>\n<th>Our choice<\/th>\n<th>Why not the others<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Web + REST API<\/td>\n<td>Always on, steady with spikes, long-lived connections<\/td>\n<td>EC2 Auto Scaling at first, then <strong>ECS on Fargate<\/strong><\/td>\n<td>Lambda works for spiky APIs but our app holds DB connection pools and some requests run long<\/td>\n<\/tr>\n<tr>\n<td>Image resize, tagging, notifications<\/td>\n<td>Short, event-triggered, bursty<\/td>\n<td><strong>Lambda<\/strong><\/td>\n<td>Idle EC2 between bursts wastes money<\/td>\n<\/tr>\n<tr>\n<td>Nightly video re-encoding, archive reprocessing<\/td>\n<td>Large, batchy, interruptible<\/td>\n<td><strong>AWS Batch on Spot<\/strong><\/td>\n<td>Lambda’s 15-minute limit; always-on EC2 wastes money<\/td>\n<\/tr>\n<tr>\n<td>Recommendation model training<\/td>\n<td>GPU, occasional<\/td>\n<td><strong>SageMaker<\/strong> (managed)<\/td>\n<td>Running GPU EC2 fleets by hand is heavy operational work<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3 id=\"s-amazon-ec2-the-starting-point\">Amazon EC2 (the starting point)<\/h3>\n<ul>\n<li><strong>Problem it solves:<\/strong> You need a server with full control over OS, runtime and installed software, without buying hardware.<\/li>\n<li><strong>Why PulseWire needs it:<\/strong> v2 of the platform: the existing app moves as-is (lift-and-shift) onto EC2 behind a load balancer.<\/li>\n<li><strong>How it works:<\/strong> Launch from an <strong>AMI<\/strong> (OS + your baked software), pick an <strong>instance type<\/strong>, attach <strong>EBS<\/strong> volumes, a <strong>security group<\/strong>, an <strong>IAM role<\/strong> (instance profile), and <strong>user data<\/strong> (a boot script that runs once at first launch).<\/li>\n<li><strong>Where it sits:<\/strong> Private app subnets, behind the ALB.<\/li>\n<li><strong>Alternatives:<\/strong> Containers on ECS/EKS, Lambda, Elastic Beanstalk.<\/li>\n<li><strong>Why we chose it (initially):<\/strong> Zero code changes, full control, fastest way off the single server.<\/li>\n<li><strong>When NOT to use it:<\/strong> Event-driven, short tasks (Lambda); when the team doesn’t want to patch operating systems (Fargate).<\/li>\n<li><strong>Security impact:<\/strong> You own OS patching (Systems Manager Patch Manager helps) and Inspector scans. Use IMDSv2 to protect instance-role credentials.<\/li>\n<li><strong>Scaling impact:<\/strong> Only scales horizontally if the app is stateless and sits in an Auto Scaling group.<\/li>\n<li><strong>Cost:<\/strong> Per second, by instance type, plus EBS. Purchasing options (Spot, Savings Plans) in Ch 15.<\/li>\n<li><strong>SAA exam clue:<\/strong> “full control of the operating system”, “legacy application”, “specific license/kernel requirements”.<\/li>\n<li><strong>Memory rule:<\/strong> EC2 = rent a computer; you own everything above the hypervisor.<\/li>\n<\/ul>\n<p><strong>Instance families (pick by the bottleneck):<\/strong><\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Family<\/th>\n<th>Optimized for<\/th>\n<th>PulseWire example<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>T (burstable)<\/td>\n<td>Low baseline with occasional bursts, CPU credits<\/td>\n<td>Admin portal, dev environments<\/td>\n<\/tr>\n<tr>\n<td>M<\/td>\n<td>General purpose balance<\/td>\n<td>Default web/API tier<\/td>\n<\/tr>\n<tr>\n<td>C<\/td>\n<td>Compute<\/td>\n<td>Image processing, ad-serving logic<\/td>\n<\/tr>\n<tr>\n<td>R, X<\/td>\n<td>Memory<\/td>\n<td>Self-managed caches, in-memory analytics<\/td>\n<\/tr>\n<tr>\n<td>I, D<\/td>\n<td>Local NVMe / dense storage<\/td>\n<td>Self-managed search or Kafka nodes<\/td>\n<\/tr>\n<tr>\n<td>P, G, Inf, Trn<\/td>\n<td>GPU / ML accelerators<\/td>\n<td>Model training and inference<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>Graviton (arm64, the “g” suffix, e.g. m7g)<\/strong> typically gives better price-performance than comparable x86 instances — a common cost-optimization answer when the software supports ARM.<\/p>\n<p><strong>Placement groups:<\/strong> <em>Cluster<\/em> (same rack, lowest latency, HPC), <em>Spread<\/em> (each instance on separate hardware, max 7 per AZ, for a few critical instances), <em>Partition<\/em> (groups of racks, for HDFS/Cassandra/Kafka). <strong>Hibernation<\/strong> saves RAM to EBS for fast resume of long-initializing apps.<\/p>\n<h3 id=\"s-auto-scaling-group-asg\">Auto Scaling group (ASG)<\/h3>\n<ul>\n<li><strong>Problem it solves:<\/strong> Traffic changes by 20× during breaking news, and dead instances must be replaced automatically.<\/li>\n<li><strong>Why PulseWire needs it:<\/strong> Removes the “Kabir restarts the server at 2 a.m.” problem and pays only for capacity in use.<\/li>\n<li><strong>How it works:<\/strong> A <strong>launch template<\/strong> (AMI, type, SG, role, user data) + min / desired / max size + subnets across AZs. Scaling policies:<ul>\n<li><strong>Target tracking<\/strong>: “keep average CPU at 50%” or “1,000 requests per target” — the default answer.<\/li>\n<li><strong>Step scaling<\/strong>: add more instances the further a CloudWatch alarm is breached.<\/li>\n<li><strong>Scheduled<\/strong>: scale up before the 9 p.m. prime-time news bulletin.<\/li>\n<li><strong>Predictive<\/strong>: ML forecasts recurring daily patterns and scales ahead.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Where it sits:<\/strong> Spans private app subnets in 2–3 AZs; registers instances with the ALB target group.<\/li>\n<li><strong>Alternatives:<\/strong> Manual scaling; scheduled scripts; serverless (scales by itself).<\/li>\n<li><strong>Why we chose it:<\/strong> Self-healing + elasticity in one service, and it rebalances across AZs.<\/li>\n<li><strong>When NOT to use it:<\/strong> Stateful single-instance software that can’t run as copies.<\/li>\n<li><strong>Security impact:<\/strong> Immutable replacement — no snowflake servers that drift.<\/li>\n<li><strong>Scaling impact:<\/strong> Use <strong>ELB health checks<\/strong> (not just EC2 status) so instances whose app is broken get replaced. Use warm pools or pre-baked AMIs to shorten boot time; a 5-minute user-data install is too slow for a spike.<\/li>\n<li><strong>Cost:<\/strong> Free; you pay for instances. Mixed instances policy lets one ASG combine On-Demand and Spot.<\/li>\n<li><strong>SAA exam clue:<\/strong> “automatically adjust capacity”, “replace unhealthy instances”, “maintain a minimum number of instances across AZs”.<\/li>\n<li><strong>Memory rule:<\/strong> ASG = thermostat plus a medic.<\/li>\n<\/ul>\n<h3 id=\"s-elastic-load-balancing-alb-vs-nlb-vs-gwlb\">Elastic Load Balancing: ALB vs NLB vs GWLB<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Application LB<\/th>\n<th>Network LB<\/th>\n<th>Gateway LB<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Layer<\/td>\n<td>7 (HTTP/HTTPS/gRPC, WebSocket)<\/td>\n<td>4 (TCP/UDP/TLS)<\/td>\n<td>3 (IP packets, GENEVE)<\/td>\n<\/tr>\n<tr>\n<td>Superpower<\/td>\n<td>Path/host/header routing, Lambda targets, Cognito/OIDC auth, WAF<\/td>\n<td><strong>Static IP / Elastic IP per AZ<\/strong>, millions of req/s, ultra-low latency, preserves source IP<\/td>\n<td>Inserts third-party firewalls/IDS transparently<\/td>\n<\/tr>\n<tr>\n<td>PulseWire use<\/td>\n<td><code>/api/*<\/code> → API service, <code>/admin/*<\/code> → admin service<\/td>\n<td>Real-time sports-score TCP feed partners must allow-list by IP; PrivateLink endpoint services<\/td>\n<td>Not needed unless a third-party appliance is mandated<\/td>\n<\/tr>\n<tr>\n<td>Exam clue<\/td>\n<td>“route by URL path”, “microservices”, “HTTP”<\/td>\n<td>“static IP”, “UDP”, “extreme performance”, “TCP”<\/td>\n<td>“third-party virtual appliances”, “deep packet inspection”<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>Every load balancer is multi-AZ when you give it subnets in several AZs. <strong>Deregistration delay (connection draining)<\/strong> lets in-flight requests finish when an instance leaves.<\/p>\n<h3 id=\"s-aws-lambda\">AWS Lambda<\/h3>\n<ul>\n<li><strong>Problem it solves:<\/strong> Running small pieces of code in response to events without keeping servers running.<\/li>\n<li><strong>Why PulseWire needs it:<\/strong> When an image lands in S3, generate three sizes, run moderation (Rekognition), and update the article record. This happens in bursts.<\/li>\n<li><strong>How it works:<\/strong> Upload code; triggers (S3 event, SQS, EventBridge, API Gateway, DynamoDB Streams) invoke it. Memory 128 MB–10 GB (CPU scales with memory), <strong>max 15 minutes per invocation<\/strong>, up to 10 GB of ephemeral <code>/tmp<\/code>. Scales by running more concurrent copies.<\/li>\n<li><strong>Where it sits:<\/strong> Behind S3 events/SQS for async work; optionally in the VPC when it must reach RDS (use RDS Proxy then).<\/li>\n<li><strong>Alternatives:<\/strong> EC2 workers polling SQS; ECS/Fargate tasks; AWS Batch.<\/li>\n<li><strong>Why we chose it:<\/strong> Zero cost when idle, scales automatically per event, no servers to patch.<\/li>\n<li><strong>When NOT to use it:<\/strong> Jobs over 15 minutes, steady high-throughput workloads where an always-busy container is cheaper, or needs for GPUs.<\/li>\n<li><strong>Security impact:<\/strong> Least-privilege execution role per function; no OS to patch.<\/li>\n<li><strong>Scaling impact:<\/strong> Account concurrency quota (default 1,000 per region, raisable); <strong>reserved concurrency<\/strong> caps a function (protecting the database); <strong>provisioned concurrency<\/strong> removes cold starts for latency-sensitive paths.<\/li>\n<li><strong>Cost:<\/strong> Per request + GB-seconds. Very cheap for spiky, low-average load; can exceed a container’s cost at constant high load.<\/li>\n<li><strong>SAA exam clue:<\/strong> “serverless”, “event-driven”, “runs for a few seconds/minutes”, “least operational overhead”, “process files as they arrive in S3”.<\/li>\n<li><strong>Memory rule:<\/strong> Lambda = code that wakes up for events, sleeps for free, and dies at 15 minutes.<\/li>\n<\/ul>\n<h3 id=\"s-containers-ecs-fargate-eks-and-ecr\">Containers: ECS, Fargate, EKS (and ECR)<\/h3>\n<p>By year one, Kabir has split the monolith into an article service, a user service and a search service. Containers make deployments identical from laptop to prod.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>What you manage<\/th>\n<th>Choose when<\/th>\n<th>Exam clue<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>ECS on EC2<\/strong><\/td>\n<td>Containers + the EC2 fleet<\/td>\n<td>Need specific instance types, GPUs, or maximum cost control with Reserved/Spot capacity<\/td>\n<td>“containers” + “control over instances”<\/td>\n<\/tr>\n<tr>\n<td><strong>ECS on Fargate<\/strong><\/td>\n<td>Containers only<\/td>\n<td>Default for most container workloads<\/td>\n<td>“containers” + “no servers to manage”, “least operational overhead”<\/td>\n<\/tr>\n<tr>\n<td><strong>EKS<\/strong><\/td>\n<td>Kubernetes workloads (control plane managed)<\/td>\n<td>Team already uses Kubernetes, needs portability or K8s tooling<\/td>\n<td>“Kubernetes”, “open-source”, “hybrid with EKS Anywhere”<\/td>\n<\/tr>\n<tr>\n<td><strong>ECR<\/strong><\/td>\n<td>Nothing — it’s the image registry<\/td>\n<td>Store and scan container images<\/td>\n<td>“store Docker images”<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>PulseWire picks ECS on Fargate<\/strong>: no Kubernetes expertise on the team, no EC2 patching, per-task IAM roles, and Fargate Spot for interruptible workers. <em>Why not EKS?<\/em> Kubernetes adds a cluster fee and significant operational knowledge for no requirement we have. <em>Why not keep EC2?<\/em> Patching and AMI pipelines are work that produces no product value.<\/p>\n<h3 id=\"s-elastic-beanstalk-and-aws-batch\">Elastic Beanstalk and AWS Batch<\/h3>\n<ul>\n<li><strong>Elastic Beanstalk:<\/strong> upload code; it provisions EC2, ASG, ALB and monitoring for you while you keep access to the resources. Exam clue: “developers want to deploy quickly without managing infrastructure” for a standard web app. PulseWire skipped it because we wanted container-level control, but it would have been a reasonable v2.<\/li>\n<li><strong>AWS Batch:<\/strong> queues and runs batch jobs on managed EC2/Spot/Fargate fleets, sizing compute to the job queue. PulseWire re-encodes its back-catalogue video nightly on Spot via Batch. Exam clue: “batch processing jobs”, “hundreds of thousands of jobs”, “no 15-minute limit”.<\/li>\n<li><strong>Edge/hybrid compute (know the trigger):<\/strong> <em>Outposts<\/em> = AWS racks in your data centre (low-latency or data-residency on-prem); <em>Wavelength<\/em> = compute inside 5G networks (ultra-low-latency mobile); <em>Snowball Edge<\/em> = compute at disconnected sites; <em>Local Zones<\/em> = AWS compute closer to a metro area.<\/li>\n<\/ul>\n<h3 id=\"s-architecture-after-this-chapter\">Architecture after this chapter<\/h3>\n<pre><code class=\"language-mermaid\">Internet → ALB (public subnets, 2 AZs)\n             ├── /api/*   → ECS Fargate: article-svc, user-svc (private subnets, 2 AZs)\n             └── /admin/* → ECS Fargate: admin-svc\nS3 upload event → Lambda: resize + moderate\nNightly → AWS Batch (Spot): video re-encode\nImages pulled from ECR via interface endpoint\n<\/code><\/pre>\n<h3 id=\"s-failure-scenarios\">Failure scenarios<\/h3>\n<ol>\n<li><em>An EC2 instance crashes.<\/em> ALB health checks stop routing to it within seconds; the ASG launches a replacement. Users see nothing if the app is stateless.<\/li>\n<li><em>Image processing takes 25 minutes per video.<\/em> Not Lambda (15-min cap). Use ECS Fargate tasks or AWS Batch, triggered via SQS/EventBridge.<\/li>\n<li><em>A partner requires a fixed IP to allow-list.<\/em> NLB with Elastic IPs (or Global Accelerator’s two static anycast IPs). ALB IPs change.<\/li>\n<li><em>Lambda overwhelms RDS with connections during a spike.<\/em> Reserved concurrency to cap it, and RDS Proxy to pool connections.<\/li>\n<li><em>New instances take 8 minutes to become healthy and miss the spike.<\/em> Bake software into the AMI (golden AMI), use warm pools, or scheduled/predictive scaling before known peaks.<\/li>\n<\/ol>\n<h3 id=\"s-decision-tree\">Decision tree<\/h3>\n<pre class=\"diagram\"><code>Need compute?\n  ├── Event-driven, &lt; 15 min, spiky → Lambda\n  ├── Containers\n  │     ├── No servers to manage → ECS on Fargate\n  │     ├── Kubernetes required → EKS\n  │     └── Need instance control / GPUs → ECS on EC2\n  ├── Legacy app, full OS control → EC2 + ASG + ALB\n  ├── Simple web app, fast deploy → Elastic Beanstalk\n  ├── Large batch jobs → AWS Batch (Spot)\n  └── Big-data frameworks (Spark/Hadoop) → EMR (Ch 10)\n\nLoad balancer?\n  ├── HTTP routing by path/host → ALB\n  ├── TCP/UDP, static IP, extreme throughput → NLB\n  └── Third-party appliances → GWLB\n<\/code><\/pre>\n<p><strong>Domains:<\/strong> 2 (scalable, loosely coupled; containers and serverless), 3 (elastic compute, instance selection), 4 (right compute model for cost).<\/p>\n","toc":[{"id":"amazon-ec2-the-starting-point","text":"Amazon EC2 (the starting point)"},{"id":"auto-scaling-group-asg","text":"Auto Scaling group (ASG)"},{"id":"elastic-load-balancing-alb-vs-nlb-vs-gwlb","text":"Elastic Load Balancing: ALB vs NLB vs GWLB"},{"id":"aws-lambda","text":"AWS Lambda"},{"id":"containers-ecs-fargate-eks-and-ecr","text":"Containers: ECS, Fargate, EKS (and ECR)"},{"id":"elastic-beanstalk-and-aws-batch","text":"Elastic Beanstalk and AWS Batch"},{"id":"architecture-after-this-chapter","text":"Architecture after this chapter"},{"id":"failure-scenarios","text":"Failure scenarios"},{"id":"decision-tree","text":"Decision tree"}]},{"id":"ch5","ch":5,"title":"Chapter 5: 500,000 images a day (Storage)","short":"500,000 images a day","topic":"Storage","d":3,"focus":true,"mins":15,"html":"<p>PulseWire receives 500,000 images and 2,000 videos a day. They must survive any server being replaced, be readable from every server at once, and cost almost nothing once the news is old. That one sentence rules out local disks and points to S3. But PulseWire also has boot disks, a shared folder for a legacy CMS, a Windows-based ad-ops team and backups — and each needs a different storage type.<\/p>\n<h3 id=\"s-first-question-always-object-block-or-file\">First question, always: object, block or file?<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>What it is<\/th>\n<th>Access<\/th>\n<th>AWS services<\/th>\n<th>PulseWire data<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Object<\/strong><\/td>\n<td>Whole files + metadata addressed by key, via HTTP API<\/td>\n<td>Any number of clients, over the network<\/td>\n<td>S3, S3 Glacier<\/td>\n<td>Images, videos, exports, logs, backups, data lake<\/td>\n<\/tr>\n<tr>\n<td><strong>Block<\/strong><\/td>\n<td>Raw disk volume, formatted with a filesystem by the OS<\/td>\n<td>One instance (mostly), low latency<\/td>\n<td>EBS, Instance Store<\/td>\n<td>EC2 boot and data volumes, self-managed databases<\/td>\n<\/tr>\n<tr>\n<td><strong>File<\/strong><\/td>\n<td>Shared hierarchical filesystem (NFS/SMB)<\/td>\n<td>Many instances mount it at once<\/td>\n<td>EFS (Linux/NFS), FSx (Windows/SMB, Lustre, ONTAP, OpenZFS)<\/td>\n<td>Legacy CMS shared <code>/media<\/code> folder, Windows ad-ops share, ML training data<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3 id=\"s-amazon-s3\">Amazon S3<\/h3>\n<ul>\n<li><strong>Problem it solves:<\/strong> Durable, unlimited storage for files that many systems read and write over HTTP, without managing disks.<\/li>\n<li><strong>Why PulseWire needs it:<\/strong> Media must outlive any server, be shared by all servers and Lambda, and feed CloudFront.<\/li>\n<li><strong>How it works:<\/strong> Buckets (regional, globally unique names) hold objects (up to 5 TB each) under keys. Designed for <strong>11 nines (99.999999999%) durability<\/strong>: data is stored across at least three AZs (except One Zone classes). Strong read-after-write consistency.<\/li>\n<li><strong>Where it sits:<\/strong> Outside the VPC; reached via gateway endpoint from private subnets, via CloudFront (with Origin Access Control) for readers, and via <strong>presigned URLs<\/strong> for direct browser uploads.<\/li>\n<li><strong>Alternatives:<\/strong> EBS (single instance, AZ-bound), EFS (file semantics, ~10× the per-GB price of S3 Standard), a database BLOB column (expensive and slow).<\/li>\n<li><strong>Why we chose it:<\/strong> Cheapest durable storage at any scale, native integrations (events, CloudFront, Athena, lifecycle), no capacity planning.<\/li>\n<li><strong>When NOT to use it:<\/strong> As a boot disk, for a database’s files, or for apps needing POSIX file locking and in-place partial edits.<\/li>\n<li><strong>Security impact:<\/strong> Block Public Access on by default, bucket policies, encryption by default (SSE-S3), Object Lock for WORM, access logged to CloudTrail.<\/li>\n<li><strong>Scaling impact:<\/strong> At least 3,500 writes and 5,500 reads per second <strong>per prefix<\/strong>, and prefixes are unlimited, so spread keys across prefixes for extreme rates. Use <strong>multipart upload<\/strong> for large files (recommended above 100 MB, required above 5 GB), <strong>Transfer Acceleration<\/strong> for long-distance uploads via edge locations, byte-range fetches for parallel downloads.<\/li>\n<li><strong>Cost:<\/strong> Per GB-month by storage class + requests + retrieval fees (IA/Glacier) + data transfer out. Transfer <em>in<\/em> is free.<\/li>\n<li><strong>SAA exam clue:<\/strong> “durable”, “unlimited”, “static content”, “images/videos”, “data lake”, “decouple storage from compute”.<\/li>\n<li><strong>Memory rule:<\/strong> If it’s a file the world reads and no one edits in place, it belongs in S3.<\/li>\n<\/ul>\n<h3 id=\"s-s3-storage-classes-the-money-chapter\">S3 storage classes: the money chapter<\/h3>\n<p>Approximate us-east-1 list prices for orientation; check current regional pricing.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Class<\/th>\n<th>~$/GB-month<\/th>\n<th>Retrieval<\/th>\n<th>Min duration<\/th>\n<th>Availability / AZs<\/th>\n<th>Use when<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Standard<\/td>\n<td>0.023<\/td>\n<td>Instant, free<\/td>\n<td>None<\/td>\n<td>99.99%, ≥3 AZ<\/td>\n<td>Hot data, unknown short-term use<\/td>\n<\/tr>\n<tr>\n<td>Intelligent-Tiering<\/td>\n<td>0.023 → lower tiers automatically<\/td>\n<td>Instant (free) for frequent, infrequent, archive-instant tiers<\/td>\n<td>None<\/td>\n<td>99.9%, ≥3 AZ<\/td>\n<td><strong>Unknown or changing access patterns<\/strong>; small monitoring fee per object, no retrieval fees<\/td>\n<\/tr>\n<tr>\n<td>Standard-IA<\/td>\n<td>0.0125<\/td>\n<td>Instant, per-GB fee<\/td>\n<td>30 days, 128 KB min object charge<\/td>\n<td>99.9%, ≥3 AZ<\/td>\n<td>Accessed ~monthly, must be instant and multi-AZ<\/td>\n<\/tr>\n<tr>\n<td>One Zone-IA<\/td>\n<td>0.01<\/td>\n<td>Instant, per-GB fee<\/td>\n<td>30 days<\/td>\n<td>99.5%, <strong>1 AZ<\/strong><\/td>\n<td><strong>Re-creatable<\/strong> data (thumbnails, replicas of data stored elsewhere)<\/td>\n<\/tr>\n<tr>\n<td>Glacier Instant Retrieval<\/td>\n<td>0.004<\/td>\n<td><strong>Milliseconds<\/strong>, higher fee<\/td>\n<td>90 days<\/td>\n<td>99.9%<\/td>\n<td>Rarely accessed (~quarterly) but needs instant access<\/td>\n<\/tr>\n<tr>\n<td>Glacier Flexible Retrieval<\/td>\n<td>0.0036<\/td>\n<td>Expedited 1–5 min, Standard 3–5 h, Bulk 5–12 h<\/td>\n<td>90 days<\/td>\n<td>99.99%<\/td>\n<td>Archives where minutes-to-hours is fine<\/td>\n<\/tr>\n<tr>\n<td>Glacier Deep Archive<\/td>\n<td>~0.001<\/td>\n<td>Standard within 12 h, Bulk within 48 h<\/td>\n<td>180 days<\/td>\n<td>99.99%<\/td>\n<td>Compliance archives, 7–10-year retention, “rarely if ever”<\/td>\n<\/tr>\n<tr>\n<td>Express One Zone<\/td>\n<td>Higher than Standard<\/td>\n<td>Single-digit ms<\/td>\n<td>None<\/td>\n<td>1 AZ<\/td>\n<td>Ultra-low-latency, high-request workloads (ML training, analytics scratch)<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>To feel the difference: 100 TB in Standard is roughly $2,300 a month; in Deep Archive roughly $100.<\/p>\n<p><strong>Reading the exam wording:<\/strong><\/p>\n<ul>\n<li>“Unpredictable / unknown access pattern” → <strong>Intelligent-Tiering<\/strong>.<\/li>\n<li>“Infrequently accessed but must be available immediately when needed” → <strong>Standard-IA<\/strong> (or <strong>Glacier Instant Retrieval<\/strong> if it’s very rare, ~quarterly).<\/li>\n<li>“Can be recreated if lost” + infrequent → <strong>One Zone-IA<\/strong>.<\/li>\n<li>“Retrieve within hours”, “archive” → <strong>Glacier Flexible Retrieval<\/strong>. “Within 12/48 hours”, “lowest cost”, “regulatory retention for years” → <strong>Deep Archive<\/strong>.<\/li>\n<li>“Retrieve in minutes from Glacier, occasionally urgently” → Glacier Flexible with <strong>Expedited<\/strong> retrieval (buy provisioned capacity if it must be guaranteed).<\/li>\n<li>Watch the trap: a class with a <strong>minimum duration<\/strong> penalizes short-lived objects. Deleting a Deep Archive object after 30 days still bills 180 days.<\/li>\n<\/ul>\n<h3 id=\"s-s3-lifecycle-pulsewires-actual-policy\">S3 Lifecycle: PulseWire’s actual policy<\/h3>\n<p>News has a predictable decay: a photo is hot for a week, browsed occasionally from archive pages for months, then almost never. Predictable patterns favour <strong>explicit lifecycle rules<\/strong> (cheaper than Intelligent-Tiering’s monitoring fee on billions of small objects); unpredictable ones favour Intelligent-Tiering.<\/p>\n<pre class=\"diagram\"><code>media/originals/   Standard ──(30 d)──▶ Standard-IA ──(90 d)──▶ Glacier Instant Retrieval\n                   (archive pages still show old photos, so retrieval must stay instant)\nmedia/video-masters/ Standard ──(30 d)──▶ Glacier Deep Archive   (only needed for rare re-encodes)\nmedia/thumbnails/  One Zone-IA from day 0   (regenerable from originals)\ncreator-uploads/   Intelligent-Tiering      (unpredictable: some go viral months later)\nlogs/              Standard ──(30 d)──▶ Glacier Flexible ──(400 d)──▶ expire\nAll buckets:       abort incomplete multipart uploads after 7 days\n                   noncurrent versions → Glacier after 30 d, delete after 365 d\n<\/code><\/pre>\n<p>Note: lifecycle can’t move objects into Standard-IA or One Zone-IA before they are 30 days old, and objects under 128 KB aren’t worth tiering (minimum billable size and per-object transition charges).<\/p>\n<h3 id=\"s-protecting-s3-data\">Protecting S3 data<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>What it does<\/th>\n<th>PulseWire use<\/th>\n<th>Exam clue<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Versioning<\/strong><\/td>\n<td>Keeps every version; deletes add a delete marker<\/td>\n<td>Editor accidentally overwrites a hero image; restore previous version<\/td>\n<td>“accidental deletion or overwrite”<\/td>\n<\/tr>\n<tr>\n<td><strong>MFA Delete<\/strong><\/td>\n<td>Requires MFA to permanently delete versions or disable versioning<\/td>\n<td>Media bucket<\/td>\n<td>“extra protection against deletion”<\/td>\n<\/tr>\n<tr>\n<td><strong>Object Lock<\/strong><\/td>\n<td>WORM: <em>Governance<\/em> mode (privileged users can override) or <em>Compliance<\/em> mode (nobody, including root, until retention ends); legal holds<\/td>\n<td>Legal/compliance copies of published articles<\/td>\n<td>“write once read many”, “cannot be deleted for N years”<\/td>\n<\/tr>\n<tr>\n<td><strong>Replication (CRR / SRR)<\/strong><\/td>\n<td>Async copy to another bucket; requires versioning on both; only new objects (Batch Replication for existing)<\/td>\n<td>CRR to eu-west-1 for DR and GDPR-region reads; <strong>Replication Time Control<\/strong> gives a 15-minute SLA<\/td>\n<td>“copy to another region”, “DR”, “replicate within 15 minutes”<\/td>\n<\/tr>\n<tr>\n<td><strong>Encryption<\/strong><\/td>\n<td>SSE-S3 (default, AWS-managed keys), <strong>SSE-KMS<\/strong> (your KMS key, audit, key policy), DSSE-KMS (dual layer), SSE-C (you supply the key per request), client-side<\/td>\n<td>SSE-KMS with a customer managed key + S3 Bucket Key for PII exports<\/td>\n<td>“audit who used the key” → SSE-KMS; “company manages keys outside AWS” → SSE-C or client-side<\/td>\n<\/tr>\n<tr>\n<td><strong>Bucket policy<\/strong><\/td>\n<td>Resource policy: who, what, conditions<\/td>\n<td>Deny any request without TLS (<code>aws:SecureTransport = false<\/code>), allow only CloudFront OAC to read<\/td>\n<td>&quot;enforce encryption in transit&quot;, &quot;only from VPC endpoint&quot; (<code>aws:SourceVpce<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><strong>Presigned URL<\/strong><\/td>\n<td>Time-limited URL granting one operation<\/td>\n<td>Browser uploads straight to S3, app servers never proxy bytes<\/td>\n<td>“temporary access to a private object”<\/td>\n<\/tr>\n<tr>\n<td><strong>Requester Pays<\/strong><\/td>\n<td>Downloader pays transfer and request costs<\/td>\n<td>Sharing the public research dataset with universities<\/td>\n<td>“other accounts pay for data access”<\/td>\n<\/tr>\n<tr>\n<td><strong>Access Points<\/strong><\/td>\n<td>Named endpoints with their own policies per team/app<\/td>\n<td>Data-science vs ad-ops access to the same lake bucket<\/td>\n<td>“simplify access for many teams to a shared bucket”<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>S3 Event Notifications<\/strong> (to Lambda, SQS, SNS, or EventBridge for richer filtering and many targets) start PulseWire’s image pipeline in Ch 7.<\/p>\n<h3 id=\"s-amazon-ebs\">Amazon EBS<\/h3>\n<ul>\n<li><strong>Problem it solves:<\/strong> EC2 needs a persistent disk that survives instance stop/start.<\/li>\n<li><strong>Why PulseWire needs it:<\/strong> Boot volumes for remaining EC2 instances, and a self-managed Elasticsearch cluster in the early days.<\/li>\n<li><strong>How it works:<\/strong> Network-attached block volume, <strong>locked to one AZ<\/strong>, attached to one instance (io1/io2 support Multi-Attach to up to 16 Nitro instances in the same AZ). Snapshots are incremental, stored in S3, and can be copied across Regions/accounts.<\/li>\n<li><strong>Where it sits:<\/strong> Inside an AZ, next to its instance.<\/li>\n<li><strong>Alternatives:<\/strong> Instance store (faster, ephemeral), EFS (shared), S3 (object).<\/li>\n<li><strong>Why we chose it:<\/strong> Persistent, snapshot-able, resizable live.<\/li>\n<li><strong>When NOT to use it:<\/strong> Data many instances must share (EFS/S3), or data that must survive an AZ outage on its own (snapshot or replicate it).<\/li>\n<li><strong>Security impact:<\/strong> KMS encryption (enable account-level default encryption). To encrypt an existing unencrypted volume: snapshot → copy snapshot with encryption → create volume.<\/li>\n<li><strong>Scaling impact:<\/strong> Choose the volume type for the I/O pattern:<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Medium<\/th>\n<th>Best for<\/th>\n<th>Exam clue<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>gp3<\/strong><\/td>\n<td>SSD<\/td>\n<td>Default: boot volumes, most apps. Baseline 3,000 IOPS and 125 MB/s at any size; IOPS and throughput provisioned <strong>independently of size<\/strong><\/td>\n<td>“general purpose”, “cost-effective SSD” (gp3 is ~20% cheaper per GB than gp2)<\/td>\n<\/tr>\n<tr>\n<td><strong>io2 Block Express<\/strong><\/td>\n<td>SSD<\/td>\n<td>Critical databases needing sustained high IOPS and sub-millisecond latency, Multi-Attach<\/td>\n<td>“&gt; 16,000 IOPS”, “mission-critical database”, “highest durability”<\/td>\n<\/tr>\n<tr>\n<td><strong>st1<\/strong><\/td>\n<td>HDD<\/td>\n<td>Large sequential throughput: logs, big data, data warehouse scans<\/td>\n<td>“throughput-intensive”, “sequential”, “frequently accessed big data”<\/td>\n<\/tr>\n<tr>\n<td><strong>sc1<\/strong><\/td>\n<td>HDD<\/td>\n<td>Cheapest, cold, infrequently accessed sequential data<\/td>\n<td>“lowest cost”, “infrequently accessed” block storage<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>HDD types cannot be boot volumes.<\/p>\n<ul>\n<li><strong>Cost:<\/strong> Per provisioned GB (and provisioned IOPS/throughput), whether used or not. Delete unattached volumes; move old snapshots to the <strong>EBS Snapshot Archive<\/strong> tier (75% cheaper, 24–72 h restore); <strong>Recycle Bin<\/strong> protects against accidental snapshot deletion.<\/li>\n<li><strong>SAA exam clue:<\/strong> “block storage for EC2”, “boot volume”, “single instance database storage”.<\/li>\n<li><strong>Memory rule:<\/strong> EBS = a USB drive that can’t leave its AZ.<\/li>\n<\/ul>\n<p><strong>Instance Store:<\/strong> physically attached NVMe, highest IOPS and lowest latency, free with the instance, but <strong>data is lost on stop, terminate or hardware failure<\/strong>. Use for caches, scratch, buffers, or replicated data (e.g. a Kafka or Cassandra node that has copies elsewhere). Exam clue: “temporary”, “highest I/O performance”, “data can be lost”.<\/p>\n<h3 id=\"s-amazon-efs-and-amazon-fsx\">Amazon EFS and Amazon FSx<\/h3>\n<p><strong>Amazon EFS:<\/strong> managed NFS for Linux that hundreds of instances, containers and Lambda functions mount at once, across AZs, growing and shrinking automatically. PulseWire&#39;s legacy CMS plugin insists on writing to a shared <code>/media<\/code> folder from every server — EFS solves it without rewriting the plugin. Cost: per GB used (higher than EBS, far higher than S3), so use <strong>lifecycle management<\/strong> to move cold files to EFS Infrequent Access/Archive, and One Zone storage for non-critical data. Throughput modes: Elastic (default for spiky), Provisioned, Bursting. Exam clue: “shared file system”, “Linux”, “multiple EC2 instances across AZs”, “POSIX”.<\/p>\n<p><strong>Amazon FSx<\/strong> — pick by protocol and ecosystem:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Variant<\/th>\n<th>Choose when<\/th>\n<th>Exam clue<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>FSx for <strong>Windows File Server<\/strong><\/td>\n<td>Windows apps, SMB, Active Directory, NTFS ACLs, DFS<\/td>\n<td>“Windows”, “SMB”, “Active Directory integration”<\/td>\n<\/tr>\n<tr>\n<td>FSx for <strong>Lustre<\/strong><\/td>\n<td>HPC/ML needing hundreds of GB/s, sub-ms; links to S3 (lazy-load and write back)<\/td>\n<td>“high-performance computing”, “machine learning training”, “process S3 data at high speed”<\/td>\n<\/tr>\n<tr>\n<td>FSx for <strong>NetApp ONTAP<\/strong><\/td>\n<td>Migrating NetApp, multi-protocol (NFS + SMB + iSCSI), snapshots/clones<\/td>\n<td>“NetApp”, “multi-protocol”<\/td>\n<\/tr>\n<tr>\n<td>FSx for <strong>OpenZFS<\/strong><\/td>\n<td>Migrating ZFS/Linux NFS workloads needing very low latency<\/td>\n<td>“ZFS”<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>PulseWire’s ad-ops team runs Windows reporting tools on a shared drive → <strong>FSx for Windows File Server<\/strong>, Multi-AZ deployment. Not EFS: EFS doesn’t speak SMB or support Windows clients.<\/p>\n<h3 id=\"s-aws-backup\">AWS Backup<\/h3>\n<p>One policy (“backup plan”) for RDS, Aurora, DynamoDB, EBS, EFS, FSx, S3 and more: schedules, retention, lifecycle to cold storage, <strong>cross-Region and cross-account copies<\/strong>, and <strong>Vault Lock<\/strong> (WORM, so even a compromised admin can&#39;t delete backups — the ransomware answer). Apply plans by tag (<code>backup=daily<\/code>) across the Organization. Exam clue: &quot;centralize and automate backups across services and accounts&quot;, &quot;compliance backup retention&quot;.<\/p>\n<h3 id=\"s-hybrid-and-transfer-storage-data-coming-in-from-outside\">Hybrid and transfer storage (data coming in from outside)<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Service<\/th>\n<th>Problem<\/th>\n<th>PulseWire use<\/th>\n<th>Exam clue<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Storage Gateway — S3 File Gateway<\/strong><\/td>\n<td>On-prem apps need NFS/SMB that’s actually backed by S3, with a local cache<\/td>\n<td>The Gurugram studio’s editing machines save to a share that lands in S3<\/td>\n<td>“on-premises file share backed by S3”, “hybrid”<\/td>\n<\/tr>\n<tr>\n<td><strong>Storage Gateway — Volume Gateway<\/strong><\/td>\n<td>iSCSI block volumes: <em>cached<\/em> (primary in S3, hot data local) or <em>stored<\/em> (primary local, async backup to S3 as EBS snapshots)<\/td>\n<td>Not used<\/td>\n<td>“iSCSI”, “block storage on-prem backed up to AWS”<\/td>\n<\/tr>\n<tr>\n<td><strong>Storage Gateway — Tape Gateway<\/strong><\/td>\n<td>Replace physical tape with virtual tapes in S3/Glacier, same backup software<\/td>\n<td>Not used<\/td>\n<td>“tape backups”, “replace tape library”<\/td>\n<\/tr>\n<tr>\n<td><strong>DataSync<\/strong><\/td>\n<td>Online, scheduled, accelerated transfer of files (NFS, SMB, HDFS, object stores) to S3/EFS/FSx, preserving metadata, with verification<\/td>\n<td>Nightly sync of the photo-agency archive server into S3<\/td>\n<td>“migrate/sync large amounts of file data over the network”, “recurring transfer”<\/td>\n<\/tr>\n<tr>\n<td><strong>Transfer Family<\/strong><\/td>\n<td>Managed SFTP/FTPS/FTP/AS2 endpoints that write to S3 or EFS<\/td>\n<td>News wire agencies push stories by SFTP; no SFTP server to run<\/td>\n<td>“partners use SFTP”, “keep existing FTP workflows”<\/td>\n<\/tr>\n<tr>\n<td><strong>Snow Family (Snowball Edge)<\/strong><\/td>\n<td>Physical device shipped to you for offline bulk transfer (and edge compute)<\/td>\n<td>Acquisition of a magazine with 300 TB of archives on a slow link (Ch 11)<\/td>\n<td>“limited bandwidth”, “would take weeks over the network”, “remote site”<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>Rule of thumb for transfer:<\/strong> days to transfer ≈ TB × 8,000 ÷ (Mbps × 86,400 × utilization). 100 TB over 1 Gbps at 80% ≈ 12 days. If the network takes more than about a week, or the link can’t be saturated, ship a Snowball.<\/p>\n<h3 id=\"s-architecture-after-this-chapter\">Architecture after this chapter<\/h3>\n<pre class=\"diagram\"><code>Browser ──presigned URL──▶ S3 media bucket (versioned, SSE-KMS, lifecycle, CRR → eu-west-1)\n                              │ event\n                              ▼\n                           Lambda resize → thumbnails (One Zone-IA)\nReaders ◀── CloudFront (OAC) ◀── S3\nECS tasks ──gateway endpoint──▶ S3\nLegacy CMS (EC2 × N) ──NFS──▶ EFS\nAd-ops (Windows) ──SMB──▶ FSx for Windows\nWire agencies ──SFTP──▶ Transfer Family → S3\nAWS Backup: RDS, EFS, FSx, EBS → vault (Vault Lock) + copy to second region\n<\/code><\/pre>\n<h3 id=\"s-failure-scenarios\">Failure scenarios<\/h3>\n<ol>\n<li><em>An editor deletes 2,000 images by mistake.<\/em> With versioning, remove the delete markers. Without it, they’re gone — enable versioning (and MFA Delete) on anything you can’t regenerate.<\/li>\n<li><em>Ransomware deletes backups with stolen admin credentials.<\/em> AWS Backup Vault Lock or S3 Object Lock in Compliance mode, plus copies in a separate account.<\/li>\n<li><em>Analytics team reads 2-year-old logs about twice a year and can wait a day.<\/em> Glacier Deep Archive (12-h standard retrieval is fine). Not Glacier Instant (paying for speed nobody needs).<\/li>\n<li><em>Thousands of EC2 instances need shared read access to training data at very high throughput, data lives in S3.<\/em> FSx for Lustre linked to the S3 bucket. Not EFS (lower peak throughput for HPC), not EBS (not shared).<\/li>\n<li><em>An EC2 database’s EBS volume is in AZ-a; AZ-a fails.<\/em> The volume is unavailable. Restore from the latest snapshot in AZ-b (RPO = snapshot age), or better, use RDS Multi-AZ (Ch 6).<\/li>\n<li><em>Uploads from Europe to the Mumbai bucket are slow.<\/em> S3 Transfer Acceleration (uploads enter at the nearest edge location), plus multipart upload.<\/li>\n<\/ol>\n<h3 id=\"s-decision-tree\">Decision tree<\/h3>\n<pre class=\"diagram\"><code>Need storage?\n  ├── Object (files via API, any scale) → S3\n  │     ├── Hot / unknown short-term → Standard\n  │     ├── Unpredictable access → Intelligent-Tiering\n  │     ├── Infrequent, instant, multi-AZ → Standard-IA\n  │     ├── Infrequent, instant, re-creatable → One Zone-IA\n  │     ├── Rare (quarterly), instant → Glacier Instant Retrieval\n  │     ├── Archive, minutes-to-hours → Glacier Flexible Retrieval\n  │     └── Archive, 12–48 h OK, cheapest → Glacier Deep Archive\n  ├── Block disk for one EC2\n  │     ├── Default → EBS gp3\n  │     ├── Highest sustained IOPS DB → EBS io2 Block Express\n  │     ├── Big sequential throughput → st1   (cold &amp; cheapest → sc1)\n  │     └── Temporary, fastest, loss OK → Instance Store\n  ├── Shared files\n  │     ├── Linux / NFS → EFS\n  │     ├── Windows / SMB / AD → FSx for Windows File Server\n  │     ├── HPC / ML, S3-linked → FSx for Lustre\n  │     └── NetApp / multi-protocol → FSx for NetApp ONTAP\n  ├── On-prem needs cloud-backed storage → Storage Gateway (File / Volume / Tape)\n  ├── Move data in\n  │     ├── Online, recurring, files → DataSync\n  │     ├── Partners push via SFTP/FTP → Transfer Family\n  │     └── Too big/slow for the network → Snowball Edge\n  └── Backups across services/accounts → AWS Backup (+ Vault Lock)\n<\/code><\/pre>\n<p><strong>Domains:<\/strong> 1 (data protection, encryption, lifecycle policies), 2 (storage durability and replication), 3 (high-performing storage), 4 (cost-optimized storage — the single most tested cost topic).<\/p>\n","toc":[{"id":"first-question-always-object-block-or-file","text":"First question, always: object, block or file?"},{"id":"amazon-s3","text":"Amazon S3"},{"id":"s3-storage-classes-the-money-chapter","text":"S3 storage classes: the money chapter"},{"id":"s3-lifecycle-pulsewires-actual-policy","text":"S3 Lifecycle: PulseWire&#39;s actual policy"},{"id":"protecting-s3-data","text":"Protecting S3 data"},{"id":"amazon-ebs","text":"Amazon EBS"},{"id":"amazon-efs-and-amazon-fsx","text":"Amazon EFS and Amazon FSx"},{"id":"aws-backup","text":"AWS Backup"},{"id":"hybrid-and-transfer-storage-data-coming-in-from-outside","text":"Hybrid and transfer storage (data coming in from outside)"},{"id":"architecture-after-this-chapter","text":"Architecture after this chapter"},{"id":"failure-scenarios","text":"Failure scenarios"},{"id":"decision-tree","text":"Decision tree"}]},{"id":"ch6","ch":6,"title":"Chapter 6: The data heart (Databases)","short":"The data heart","topic":"Databases","d":3,"focus":false,"mins":10,"html":"<p>PulseWire doesn’t have “a database”; it has several kinds of data with different shapes and access patterns. Purpose-built databases are an explicit exam theme: the right answer is usually the database built for that access pattern, not one database for everything.<\/p>\n<h3 id=\"s-step-1-classify-the-data\">Step 1: classify the data<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Data<\/th>\n<th>Shape<\/th>\n<th>Access pattern<\/th>\n<th>Needs<\/th>\n<th>Choice<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Articles, authors, categories, subscriptions, payments<\/td>\n<td>Relational, joins, foreign keys<\/td>\n<td>Read-heavy (95%), transactional writes<\/td>\n<td>ACID, SQL, consistency<\/td>\n<td><strong>Aurora PostgreSQL<\/strong> (started as RDS)<\/td>\n<\/tr>\n<tr>\n<td>Comments, reactions, view counters, user sessions<\/td>\n<td>Key-value, simple lookups by article/user ID<\/td>\n<td>Write-heavy, huge scale, spiky<\/td>\n<td>Single-digit ms at any scale, no joins<\/td>\n<td><strong>DynamoDB<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Hot article JSON, “trending now” ranking<\/td>\n<td>Key-value in memory<\/td>\n<td>Extremely read-heavy<\/td>\n<td>Sub-millisecond<\/td>\n<td><strong>ElastiCache<\/strong> (Redis OSS/Valkey)<\/td>\n<\/tr>\n<tr>\n<td>Full-text search with relevance and filters<\/td>\n<td>Inverted index<\/td>\n<td>Search queries<\/td>\n<td>Fuzzy match, facets, ranking<\/td>\n<td><strong>OpenSearch<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Clickstream and business metrics<\/td>\n<td>Columnar, historical<\/td>\n<td>Analytical scans and aggregates<\/td>\n<td>SQL over billions of rows<\/td>\n<td><strong>Redshift / Athena<\/strong> (Ch 10)<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3 id=\"s-the-evolution-of-pulsewires-relational-database\">The evolution of PulseWire’s relational database<\/h3>\n<pre class=\"diagram\"><code>v1  MySQL on the app server          (SPOF, shared resources)\nv2  RDS single-AZ                    (managed backups, patching — still a SPOF)\nv3  RDS Multi-AZ                     (survives AZ / instance failure)\nv4  + Read Replicas + ElastiCache    (scale the 95% reads)\nv5  Aurora PostgreSQL + RDS Proxy    (fast failover, 15 replicas, Global Database later)\n<\/code><\/pre>\n<h3 id=\"s-amazon-rds\">Amazon RDS<\/h3>\n<ul>\n<li><strong>Problem it solves:<\/strong> Running a relational database yourself means patching, backups, replication and failover — hard, risky work.<\/li>\n<li><strong>Why PulseWire needs it:<\/strong> Articles and payments need SQL, transactions and referential integrity.<\/li>\n<li><strong>How it works:<\/strong> Managed MySQL, PostgreSQL, MariaDB, Oracle, SQL Server or Db2 on an instance you size. Automated backups (retention up to 35 days) enable <strong>point-in-time restore<\/strong> to within about five minutes. Storage auto-scaling grows the disk before it fills.<\/li>\n<li><strong>Where it sits:<\/strong> Private DB subnets (a DB subnet group across ≥2 AZs), security group allowing only the app tier.<\/li>\n<li><strong>Alternatives:<\/strong> Database on EC2 (full control incl. OS access, all the operational work), Aurora, DynamoDB.<\/li>\n<li><strong>Why we chose it (initially):<\/strong> Same MySQL/PostgreSQL the team knows, minus the operations.<\/li>\n<li><strong>When NOT to use it:<\/strong> You need OS-level access or an unsupported engine/version (EC2, or <strong>RDS Custom<\/strong> for Oracle/SQL Server); massive key-value scale (DynamoDB).<\/li>\n<li><strong>Security impact:<\/strong> Encryption at rest with KMS (must be chosen at creation; to encrypt an existing DB, snapshot → encrypted copy → restore), TLS in transit, IAM database authentication, no public access.<\/li>\n<li><strong>Scaling impact:<\/strong> Vertical (bigger instance, short downtime) and read replicas for reads. Writes scale only vertically.<\/li>\n<li><strong>Cost:<\/strong> Instance hours + storage + IOPS + backup storage beyond the DB size. Multi-AZ roughly doubles instance cost.<\/li>\n<li><strong>SAA exam clue:<\/strong> “relational”, “SQL”, “transactions”, “minimal operational overhead” with a named engine.<\/li>\n<li><strong>Memory rule:<\/strong> RDS = your database engine, with AWS as the DBA.<\/li>\n<\/ul>\n<h3 id=\"s-multi-az-vs-read-replicas-the-1-rds-exam-distinction\">Multi-AZ vs Read Replicas (the #1 RDS exam distinction)<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Multi-AZ (instance)<\/th>\n<th>Multi-AZ DB cluster<\/th>\n<th>Read Replica<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Purpose<\/td>\n<td><strong>High availability<\/strong><\/td>\n<td>HA + some read scaling<\/td>\n<td><strong>Read scaling<\/strong> (and DR if cross-region)<\/td>\n<\/tr>\n<tr>\n<td>Replication<\/td>\n<td>Synchronous<\/td>\n<td>Semi-synchronous, 1 writer + 2 readable standbys<\/td>\n<td><strong>Asynchronous<\/strong> (replica lag)<\/td>\n<\/tr>\n<tr>\n<td>Serve reads?<\/td>\n<td>No (standby is idle)<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>Failover<\/td>\n<td>Automatic, DNS endpoint flips, ~1–2 min<\/td>\n<td>Automatic, typically under ~35 s<\/td>\n<td>Manual <strong>promotion<\/strong> (becomes standalone)<\/td>\n<\/tr>\n<tr>\n<td>Cross-Region?<\/td>\n<td>No<\/td>\n<td>No<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>Exam clue<\/td>\n<td>“high availability”, “automatic failover”, “survive AZ failure”<\/td>\n<td>“faster failover and readable standbys”<\/td>\n<td>“read-heavy”, “reporting queries slow down production”, “offload reads”<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>PulseWire:<\/strong> Multi-AZ for HA, plus one read replica that the analytics/reporting dashboard queries so heavy reports never slow the live site.<\/p>\n<h3 id=\"s-amazon-aurora\">Amazon Aurora<\/h3>\n<ul>\n<li><strong>Problem it solves:<\/strong> Standard RDS failover is slow-ish, read scaling is limited, and storage is tied to instances.<\/li>\n<li><strong>Why PulseWire needs it:<\/strong> At 1M users, the database needs many read replicas, sub-minute failover, and a path to multi-region.<\/li>\n<li><strong>How it works:<\/strong> MySQL/PostgreSQL-compatible engine with a distributed storage layer: <strong>6 copies across 3 AZs<\/strong>, auto-growing, self-healing. Up to <strong>15 Aurora Replicas<\/strong> share the same storage (low lag), behind a <strong>reader endpoint<\/strong> that load-balances reads. Failover to a replica typically takes under 30 seconds. <strong>Aurora Global Database<\/strong> replicates to up to several secondary regions with typically under one second of lag; a secondary can be promoted in about a minute. Fast <strong>cloning<\/strong> for test copies; <strong>Backtrack<\/strong> (MySQL) rewinds without restore.<\/li>\n<li><strong>Where it sits:<\/strong> Private DB subnets; writer endpoint for writes, reader endpoint for reads.<\/li>\n<li><strong>Alternatives:<\/strong> RDS with read replicas; DynamoDB.<\/li>\n<li><strong>Why we chose it:<\/strong> Same SQL, better availability and read scaling, and Global Database is the cleanest multi-region relational story.<\/li>\n<li><strong>When NOT to use it:<\/strong> Small, steady workloads where plain RDS is cheaper; key-value workloads.<\/li>\n<li><strong>Security impact:<\/strong> Same as RDS (KMS, TLS, IAM auth).<\/li>\n<li><strong>Scaling impact:<\/strong> Read scaling via replicas with auto scaling; writes still go to one writer. <strong>Aurora Serverless v2<\/strong> scales capacity in fine-grained steps within seconds — ideal for unpredictable or intermittent load (the staging DB, a new product line).<\/li>\n<li><strong>Cost:<\/strong> Instances (or Serverless capacity units) + storage + I/O (or the I/O-Optimized configuration when I/O exceeds ~25% of the bill).<\/li>\n<li><strong>SAA exam clue:<\/strong> “high performance relational”, “up to 15 read replicas”, “failover in under 30 seconds”, “cross-region with RPO of seconds / RTO under a minute” (Global Database), “unpredictable relational workload” (Serverless).<\/li>\n<li><strong>Memory rule:<\/strong> Aurora = RDS with cloud-native storage: 6 copies, 15 readers, global in a second.<\/li>\n<\/ul>\n<h3 id=\"s-rds-proxy\">RDS Proxy<\/h3>\n<p>The image-processing Lambdas open thousands of short connections during a spike and exhaust the database. <strong>RDS Proxy<\/strong> pools and reuses connections, cuts failover time (it holds client connections while the database fails over), and enforces IAM auth with credentials from Secrets Manager. Exam clue: “Lambda + RDS + too many connections”, “improve failover time without app changes”.<\/p>\n<h3 id=\"s-amazon-dynamodb\">Amazon DynamoDB<\/h3>\n<ul>\n<li><strong>Problem it solves:<\/strong> Relational databases struggle with millions of simple writes per second and unpredictable spikes.<\/li>\n<li><strong>Why PulseWire needs it:<\/strong> During a cricket final, comments and reactions hit 50,000 writes/second. Every lookup is by article ID or user ID — no joins needed.<\/li>\n<li><strong>How it works:<\/strong> Serverless key-value and document store. Data is partitioned by a <strong>partition key<\/strong> (+ optional sort key, e.g. <code>PK=article#123, SK=comment#timestamp<\/code>). Items up to 400 KB. <strong>Global secondary indexes<\/strong> add other query patterns. Capacity: <strong>On-Demand<\/strong> (pay per request, no planning) or <strong>Provisioned<\/strong> with auto scaling (cheaper for steady load). <strong>DynamoDB Streams<\/strong> emit every change; <strong>TTL<\/strong> auto-expires items (sessions); <strong>PITR<\/strong> for 35 days; transactions supported.<\/li>\n<li><strong>Where it sits:<\/strong> Regional, outside the VPC (reach it through the free gateway endpoint).<\/li>\n<li><strong>Alternatives:<\/strong> Aurora, DocumentDB, Keyspaces, ElastiCache.<\/li>\n<li><strong>Why we chose it:<\/strong> Consistent single-digit-ms latency at any scale, zero servers, multi-AZ by default, and <strong>Global Tables<\/strong> for multi-region active-active later.<\/li>\n<li><strong>When NOT to use it:<\/strong> Ad-hoc queries, complex joins and reports (it’s built around known access patterns), or relational integrity.<\/li>\n<li><strong>Security impact:<\/strong> IAM fine-grained access down to item/attribute (e.g. users can only read their own items), encryption at rest by default.<\/li>\n<li><strong>Scaling impact:<\/strong> Effectively unlimited if the partition key spreads load; a &quot;hot key&quot; (everyone writing <code>article#viral<\/code>) causes throttling — use write sharding.<\/li>\n<li><strong>Cost:<\/strong> On-Demand: per read/write request. Provisioned: per RCU/WCU-hour (Reserved Capacity for steady load). Storage per GB; Standard-IA table class for rarely read tables.<\/li>\n<li><strong>SAA exam clue:<\/strong> “key-value”, “millisecond latency at any scale”, “serverless NoSQL”, “unpredictable traffic”, “session data”, “schema flexibility”.<\/li>\n<li><strong>Memory rule:<\/strong> DynamoDB = a giant, infinitely fast hash map you design around your queries.<\/li>\n<\/ul>\n<p><strong>DAX<\/strong> sits in front of DynamoDB as a write-through, in-memory cache: microsecond reads with <strong>no application logic changes<\/strong> (DynamoDB-compatible API). Exam clue: “microsecond latency for DynamoDB”, “read-heavy DynamoDB”. Use ElastiCache instead when caching something other than DynamoDB.<\/p>\n<h3 id=\"s-amazon-elasticache\">Amazon ElastiCache<\/h3>\n<p>The home page and the top 50 articles are read millions of times an hour. Hitting the database each time is wasteful.<\/p>\n<ul>\n<li><strong>Caching patterns:<\/strong> <strong>Lazy loading / cache-aside<\/strong> (read cache → miss → read DB → write cache; only caches what’s requested, data can be stale) and <strong>write-through<\/strong> (update cache whenever you write the DB; fresh but caches unread data). Always set a <strong>TTL<\/strong>.<\/li>\n<li><strong>Redis OSS / Valkey vs Memcached:<\/strong><\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Redis OSS / Valkey<\/th>\n<th>Memcached<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Data structures<\/td>\n<td>Rich (sorted sets, lists, hashes, pub/sub)<\/td>\n<td>Simple strings<\/td>\n<\/tr>\n<tr>\n<td>HA<\/td>\n<td>Replication, Multi-AZ auto-failover, backups<\/td>\n<td>None (node loss = data loss)<\/td>\n<\/tr>\n<tr>\n<td>Threads<\/td>\n<td>Mostly single per shard, scales via shards<\/td>\n<td>Multi-threaded<\/td>\n<\/tr>\n<tr>\n<td>Exam clue<\/td>\n<td>“leaderboard”, “session store”, “high availability”, “persistence”<\/td>\n<td>“simple cache”, “multithreaded”, “no persistence needed”<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>PulseWire uses Redis-compatible ElastiCache: cached article JSON (TTL 60 s), the “Trending Now” ranking as a sorted set, and rate-limit counters. ElastiCache also has a <strong>serverless<\/strong> option that removes node sizing. <strong>MemoryDB<\/strong> is Redis-compatible but <strong>durable<\/strong> (multi-AZ transaction log) — a primary database, not just a cache. Exam clue for MemoryDB: “Redis-compatible, durable, primary database”.<\/p>\n<h3 id=\"s-the-rest-of-the-purpose-built-family\">The rest of the purpose-built family<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Service<\/th>\n<th>Model<\/th>\n<th>Choose when<\/th>\n<th>Would PulseWire use it?<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>DocumentDB<\/strong><\/td>\n<td>Document (MongoDB-compatible)<\/td>\n<td>Migrating MongoDB workloads, JSON documents with rich queries<\/td>\n<td>Only if we were migrating an existing MongoDB app<\/td>\n<\/tr>\n<tr>\n<td><strong>Neptune<\/strong><\/td>\n<td>Graph<\/td>\n<td>Highly connected data: social networks, recommendations, fraud rings, knowledge graphs<\/td>\n<td>Yes, later: a “people / places / topics” knowledge graph powering related-story links<\/td>\n<\/tr>\n<tr>\n<td><strong>Keyspaces<\/strong><\/td>\n<td>Wide-column (Cassandra-compatible)<\/td>\n<td>Migrating Cassandra workloads serverlessly<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td><strong>Timestream<\/strong><\/td>\n<td>Time series<\/td>\n<td>IoT, metrics, telemetry with time-based queries<\/td>\n<td>Live sports-score and telemetry feeds would fit<\/td>\n<\/tr>\n<tr>\n<td><strong>QLDB<\/strong><\/td>\n<td>Ledger<\/td>\n<td>Previously the exam answer for “immutable, cryptographically verifiable history”. AWS ended support for QLDB in July 2025 (Aurora PostgreSQL with audit tables is the suggested path), but it can still appear in question banks<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td><strong>OpenSearch<\/strong><\/td>\n<td>Search + log analytics<\/td>\n<td>Full-text search, log analytics, dashboards<\/td>\n<td>Yes: article search (fed from Aurora/DynamoDB streams)<\/td>\n<\/tr>\n<tr>\n<td><strong>Redshift<\/strong><\/td>\n<td>Columnar data warehouse<\/td>\n<td>Analytical SQL over large historical data<\/td>\n<td>Yes, Ch 10<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3 id=\"s-failure-scenarios\">Failure scenarios<\/h3>\n<ol>\n<li><em>The RDS primary’s AZ fails.<\/em> With Multi-AZ, the DNS endpoint flips to the standby automatically (~1–2 min). Apps must reconnect (and not cache DNS forever). Without Multi-AZ: restore from backup — long RTO.<\/li>\n<li><em>Database receives 10× more reads.<\/em> Add read replicas (Aurora Replicas behind the reader endpoint) and ElastiCache in front. Not “bigger instance” alone (vertical limits, downtime), not Multi-AZ (the standby doesn’t serve reads in instance Multi-AZ).<\/li>\n<li><em>Reporting queries slow down the live site.<\/em> Point reporting at a read replica (or move analytics to Redshift).<\/li>\n<li><em>Need relational DR in another region with RPO ~1 s and RTO ~1 min.<\/em> Aurora Global Database. Cross-region read replica gives higher lag and slower, manual promotion.<\/li>\n<li><em>DynamoDB throttles on one viral article.<\/em> Hot partition. Spread writes (shard the key with a suffix), add DAX for reads.<\/li>\n<li><em>A bug deletes rows at 14:05.<\/em> RDS/Aurora point-in-time restore to 14:04 (creates a new instance), or Aurora Backtrack (MySQL) in minutes.<\/li>\n<\/ol>\n<h3 id=\"s-decision-tree\">Decision tree<\/h3>\n<pre class=\"diagram\"><code>What data?\n  ├── Relational, transactions, joins\n  │     ├── Standard needs → RDS (Multi-AZ for HA)\n  │     ├── High performance, many readers, fast failover, global → Aurora\n  │     ├── Unpredictable/intermittent load → Aurora Serverless v2\n  │     └── Need OS access / custom engine → RDS Custom or EC2\n  ├── Key-value, massive scale, ms latency → DynamoDB (+ DAX for µs reads)\n  ├── Cache in front of anything → ElastiCache (Redis/Valkey for HA &amp; structures; Memcached for simple)\n  ├── Durable Redis as primary DB → MemoryDB\n  ├── MongoDB-compatible → DocumentDB\n  ├── Graph relationships → Neptune\n  ├── Cassandra-compatible → Keyspaces\n  ├── Time series → Timestream\n  ├── Full-text search / logs → OpenSearch\n  └── Analytics / warehouse → Redshift (or Athena on S3)\n\nRDS problem?\n  ├── Availability → Multi-AZ\n  ├── Read load → Read replicas (+ cache)\n  ├── Too many connections (Lambda) → RDS Proxy\n  └── Regional disaster → Cross-region replica / Aurora Global Database\n<\/code><\/pre>\n<p><strong>Domains:<\/strong> 2 (read replicas, HA databases), 3 (high-performing database solutions, caching), 4 (cost-effective database choice: DynamoDB vs RDS, Serverless, Reserved).<\/p>\n","toc":[{"id":"step-1-classify-the-data","text":"Step 1: classify the data"},{"id":"the-evolution-of-pulsewires-relational-database","text":"The evolution of PulseWire&#39;s relational database"},{"id":"amazon-rds","text":"Amazon RDS"},{"id":"multi-az-vs-read-replicas-the-1-rds-exam-distinction","text":"Multi-AZ vs Read Replicas (the #1 RDS exam distinction)"},{"id":"amazon-aurora","text":"Amazon Aurora"},{"id":"rds-proxy","text":"RDS Proxy"},{"id":"amazon-dynamodb","text":"Amazon DynamoDB"},{"id":"amazon-elasticache","text":"Amazon ElastiCache"},{"id":"the-rest-of-the-purpose-built-family","text":"The rest of the purpose-built family"},{"id":"failure-scenarios","text":"Failure scenarios"},{"id":"decision-tree","text":"Decision tree"}]},{"id":"ch7","ch":7,"title":"Chapter 7: Stop making the editor wait (Messaging, events and APIs)","short":"Stop making the editor wait","topic":"Messaging, events and APIs","d":2,"focus":false,"mins":10,"html":"<p>When an editor clicks <strong>Publish<\/strong>, Kabir’s code does everything in one request: save the article, resize images, tag entities with AI, translate to Hindi, generate an audio version, update search, and notify 2 million subscribers. The request takes 30 seconds, times out under load, and if the translation API hiccups, the whole publish fails.<\/p>\n<pre class=\"diagram\"><code>BEFORE (synchronous, tightly coupled)\nEditor → API → [save → resize → AI tags → translate → audio → index → notify] → 30 s response\n\nAFTER (asynchronous, loosely coupled)\nEditor → API → save to Aurora → emit &quot;ArticlePublished&quot; event → 200 OK in 150 ms\n                                       │\n                               EventBridge bus\n             ┌──────────────────────┼──────────────────────┐\n             ▼                       ▼                      ▼\n   SNS &quot;breaking-news&quot;     SQS &quot;search-index&quot;     Step Functions &quot;enrich-article&quot;\n     ├─ SQS → push worker      ↓                    Comprehend → Translate → Polly\n     ├─ SQS → email worker   Lambda → OpenSearch     (retries, timeouts, human review)\n     └─ Lambda → partner webhooks\n<\/code><\/pre>\n<p>The principle: <strong>decouple<\/strong> so each part scales, fails and retries independently. A slow translation no longer blocks publishing; a spike of 2M notifications is buffered instead of crashing a server.<\/p>\n<h3 id=\"s-amazon-sqs\">Amazon SQS<\/h3>\n<ul>\n<li><strong>Problem it solves:<\/strong> A producer generates work faster (or burstier) than consumers can process it, and work must not be lost if a consumer dies.<\/li>\n<li><strong>Why PulseWire needs it:<\/strong> Image uploads arrive in bursts of thousands; search indexing must catch up without dropping updates.<\/li>\n<li><strong>How it works:<\/strong> Producers send messages; consumers <strong>poll<\/strong>, process, then delete. While a consumer works, the message is hidden for the <strong>visibility timeout<\/strong> (set it longer than processing time, or the message is processed twice). Failed messages retry, and after <code>maxReceiveCount<\/code> attempts move to a <strong>dead-letter queue (DLQ)<\/strong> for inspection. Retention 1 minute–14 days (default 4 days). <strong>Long polling<\/strong> (up to 20 s) cuts empty receives and cost. Large payloads go to S3, with a pointer in the message.<\/li>\n<li><strong>Where it sits:<\/strong> Between a producer (API, S3 event) and a worker fleet (Lambda, ECS, EC2 ASG).<\/li>\n<li><strong>Alternatives:<\/strong> SNS (push, no buffering), Kinesis (ordered stream, replay), Amazon MQ (protocol compatibility), direct synchronous calls.<\/li>\n<li><strong>Why we chose it:<\/strong> Fully managed, practically unlimited throughput (Standard), pay per request, the simplest way to buffer and decouple.<\/li>\n<li><strong>When NOT to use it:<\/strong> Multiple independent consumers each need <em>every<\/em> message (use SNS fan-out or Kinesis); you need replay of old data (Kinesis).<\/li>\n<li><strong>Standard vs FIFO:<\/strong><\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Standard<\/th>\n<th>FIFO<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Ordering<\/td>\n<td>Best-effort<\/td>\n<td>Strict, per <strong>message group ID<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Delivery<\/td>\n<td>At-least-once (occasional duplicates)<\/td>\n<td>Exactly-once processing (deduplication)<\/td>\n<\/tr>\n<tr>\n<td>Throughput<\/td>\n<td>Nearly unlimited<\/td>\n<td>300 msg/s per API action, 3,000 with batching (higher in high-throughput mode)<\/td>\n<\/tr>\n<tr>\n<td>PulseWire use<\/td>\n<td>Image processing, indexing (idempotent workers)<\/td>\n<td>Payment/subscription events per user, where order matters<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<ul>\n<li><strong>Security impact:<\/strong> SSE (SQS-managed or KMS), queue policies, VPC interface endpoint.<\/li>\n<li><strong>Scaling impact:<\/strong> Scale workers on <strong>queue depth<\/strong>, e.g. a target-tracking policy on &quot;backlog per instance&quot; (<code>ApproximateNumberOfMessagesVisible ÷ running tasks<\/code>). This is the classic exam pattern for decoupled scaling.<\/li>\n<li><strong>Cost:<\/strong> Per million requests; batching (up to 10 messages per call) and long polling reduce it.<\/li>\n<li><strong>SAA exam clue:<\/strong> “decouple”, “buffer”, “absorb spikes”, “ensure no orders are lost”, “process asynchronously”, “order must be preserved” (FIFO), “exactly once” (FIFO).<\/li>\n<li><strong>Memory rule:<\/strong> SQS = a to-do list that waits patiently until a worker is free.<\/li>\n<\/ul>\n<h3 id=\"s-amazon-sns\">Amazon SNS<\/h3>\n<ul>\n<li><strong>Problem it solves:<\/strong> One event must reach many subscribers at once (push, not poll).<\/li>\n<li><strong>Why PulseWire needs it:<\/strong> “Breaking: Election results” must go to mobile push, email, SMS and partner webhooks simultaneously.<\/li>\n<li><strong>How it works:<\/strong> Publishers send to a <strong>topic<\/strong>; SNS pushes to every subscriber: SQS, Lambda, HTTP(S), email, SMS, mobile push. <strong>Message filtering<\/strong> lets a subscriber receive only matching messages (e.g. only <code>category=sports<\/code>). FIFO topics exist for ordered fan-out to SQS FIFO.<\/li>\n<li><strong>The fan-out pattern:<\/strong> SNS topic → several SQS queues → independent workers. Each consumer gets its own durable buffer, retries and scaling. This is one of the most tested patterns in the exam.<\/li>\n<li><strong>When NOT to use it:<\/strong> Single consumer needing buffering (SQS alone); complex routing by event content across many sources and SaaS apps (EventBridge).<\/li>\n<li><strong>Cost:<\/strong> Per publish and per delivery (varies by protocol; SMS is the expensive one).<\/li>\n<li><strong>SAA exam clue:<\/strong> “fan-out”, “notify multiple subscribers”, “pub/sub”, “send SMS/email/push”.<\/li>\n<li><strong>Memory rule:<\/strong> SNS = a megaphone; SQS = a mailbox. Megaphone into many mailboxes = fan-out.<\/li>\n<\/ul>\n<h3 id=\"s-amazon-eventbridge\">Amazon EventBridge<\/h3>\n<ul>\n<li><strong>Problem it solves:<\/strong> Many services emit events, and you want rules (not code) deciding who reacts to what.<\/li>\n<li><strong>Why PulseWire needs it:<\/strong> “ArticlePublished”, “UserSubscribed”, “PaymentFailed” events from multiple services, plus AWS events (an EC2 state change, a GuardDuty finding) and SaaS events (the payment provider, Zendesk).<\/li>\n<li><strong>How it works:<\/strong> Events go to an <strong>event bus<\/strong>; <strong>rules<\/strong> match on event content (e.g. <code>detail.category = &quot;breaking&quot;<\/code>) and route to targets (Lambda, SQS, SNS, Step Functions, another account&#39;s bus, API destinations). <strong>Archive and replay<\/strong> events; <strong>EventBridge Scheduler<\/strong> runs cron/one-time schedules at scale; <strong>Pipes<\/strong> connect a source to a target with filtering and enrichment.<\/li>\n<li><strong>Alternatives:<\/strong> SNS (simpler fan-out, higher throughput, fewer routing options), custom routing code.<\/li>\n<li><strong>Why we chose it:<\/strong> Content-based routing across many producers, SaaS integrations, schedules and cross-account delivery in one service.<\/li>\n<li><strong>When NOT to use it:<\/strong> Ultra-high-throughput, ordered streaming (Kinesis/MSK).<\/li>\n<li><strong>SAA exam clue:<\/strong> “react to events from AWS services”, “SaaS integration”, “route events based on content”, “scheduled task / cron” (replacing a cron EC2), “event-driven architecture”.<\/li>\n<li><strong>Memory rule:<\/strong> EventBridge = the event router with rules; SNS = the broadcaster.<\/li>\n<\/ul>\n<h3 id=\"s-aws-step-functions\">AWS Step Functions<\/h3>\n<ul>\n<li><strong>Problem it solves:<\/strong> Multi-step processes with retries, branching, parallel steps, timeouts and human approvals turn into fragile spaghetti code.<\/li>\n<li><strong>Why PulseWire needs it:<\/strong> Article enrichment: detect language and entities (Comprehend) → in parallel, translate (Translate) and generate audio (Polly) → if Rekognition flags an image, <strong>pause for an editor’s approval<\/strong> → update the article.<\/li>\n<li><strong>How it works:<\/strong> A visual <strong>state machine<\/strong> (Amazon States Language) calling Lambda, ECS tasks and 200+ AWS services directly, with built-in retry/catch. <strong>Standard<\/strong> workflows run up to a year with exactly-once execution and full history; <strong>Express<\/strong> workflows are for high-volume, short (up to 5 min) event processing at lower cost.<\/li>\n<li><strong>Alternatives:<\/strong> Chaining Lambdas or queues by hand; SWF (legacy); Amazon MWAA (Airflow — out of exam scope).<\/li>\n<li><strong>SAA exam clue:<\/strong> “orchestrate”, “workflow”, “multiple steps with error handling and retries”, “human approval”, “coordinate Lambda functions”.<\/li>\n<li><strong>Memory rule:<\/strong> Step Functions = the conductor; Lambdas are the musicians.<\/li>\n<\/ul>\n<h3 id=\"s-streams-and-legacy-brokers-kinesis-msk-amazon-mq\">Streams and legacy brokers: Kinesis, MSK, Amazon MQ<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Service<\/th>\n<th>Model<\/th>\n<th>Choose when<\/th>\n<th>PulseWire use<\/th>\n<th>Exam clue<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Kinesis Data Streams<\/strong><\/td>\n<td>Ordered stream of records in shards; multiple consumers read independently; <strong>replay<\/strong> (retention 24 h up to 365 days)<\/td>\n<td>Real-time analytics, many consumers on the same data, ordering per key<\/td>\n<td>Clickstream: 50M events/day feeding real-time trending + the data lake (Ch 10)<\/td>\n<td>“real-time”, “streaming”, “clickstream”, “replay”, “multiple applications consume the same data”<\/td>\n<\/tr>\n<tr>\n<td><strong>Amazon Data Firehose<\/strong><\/td>\n<td>Fully managed delivery into S3, Redshift, OpenSearch, Splunk, with buffering and transforms<\/td>\n<td>Load streaming data into storage with no consumer code<\/td>\n<td>Clickstream → S3 as Parquet<\/td>\n<td>“load streaming data into S3/Redshift”, “near real-time”, “no administration”<\/td>\n<\/tr>\n<tr>\n<td><strong>Amazon MSK<\/strong><\/td>\n<td>Managed Apache Kafka (provisioned or serverless)<\/td>\n<td>Team already uses Kafka APIs/ecosystem<\/td>\n<td>Not chosen (no Kafka expertise)<\/td>\n<td>“Kafka”, “migrate existing Kafka”<\/td>\n<\/tr>\n<tr>\n<td><strong>Amazon MQ<\/strong><\/td>\n<td>Managed ActiveMQ / RabbitMQ (JMS, AMQP, MQTT, STOMP)<\/td>\n<td><strong>Migrating existing apps<\/strong> that use these protocols, without code changes<\/td>\n<td>The acquired magazine’s legacy CMS uses JMS (Ch 11)<\/td>\n<td>“existing message broker”, “JMS”, “AMQP”, “lift and shift messaging”<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>Cheat line from the brief:<\/p>\n<pre class=\"diagram\"><code>SQS            → queue / buffering (one consumer group, pull)\nSNS            → fan-out / notifications (push)\nEventBridge    → event routing with rules, SaaS, schedules\nStep Functions → workflow orchestration\nKinesis        → streaming data, ordered, replayable\nAmazon MQ      → traditional broker protocols (migration)\nMSK            → managed Kafka\n<\/code><\/pre>\n<h3 id=\"s-amazon-api-gateway\">Amazon API Gateway<\/h3>\n<ul>\n<li><strong>Problem it solves:<\/strong> Public APIs need authentication, throttling per client, request validation, versioning and monitoring — none of which you want to write yourself.<\/li>\n<li><strong>Why PulseWire needs it:<\/strong> We launch a <strong>partner API<\/strong>: news aggregators and telecom apps license PulseWire content. Each partner gets an API key, a usage plan (quota + rate limit) and is billed by usage. The mobile app’s lightweight endpoints are also serverless.<\/li>\n<li><strong>How it works:<\/strong> Front door that maps routes to integrations: <strong>Lambda<\/strong>, any HTTP endpoint, AWS services directly (e.g. put to SQS without code), or a <strong>VPC Link<\/strong> to a private ALB/NLB. Authorization via IAM, <strong>Cognito authorizers<\/strong>, or <strong>Lambda authorizers<\/strong> (custom tokens). Default integration timeout is 29 seconds, so long jobs go async.<\/li>\n<li><strong>API types:<\/strong><\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Use when<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>REST API<\/strong><\/td>\n<td>Need the full feature set<\/td>\n<td>API keys + usage plans, request validation, response <strong>caching<\/strong>, WAF, private APIs (VPC-only), edge-optimized/regional/private endpoints<\/td>\n<\/tr>\n<tr>\n<td><strong>HTTP API<\/strong><\/td>\n<td>Simple, fast, cheapest proxy to Lambda/HTTP<\/td>\n<td>Lower latency and much cheaper; JWT authorizers; fewer features<\/td>\n<\/tr>\n<tr>\n<td><strong>WebSocket API<\/strong><\/td>\n<td>Persistent two-way connections<\/td>\n<td>Live comment threads, live match commentary<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<ul>\n<li><strong>Security impact:<\/strong> WAF attachment, throttling as DoS protection, authorizers, resource policies, mutual TLS.<\/li>\n<li><strong>Scaling impact:<\/strong> Fully managed; account-level throttling (default 10,000 requests/s steady, 5,000 burst, raisable) and per-client/per-method throttles; caching reduces backend load.<\/li>\n<li><strong>Cost:<\/strong> Per million requests (HTTP API is the cheapest), plus cache size per hour and data transfer.<\/li>\n<li><strong>SAA exam clue:<\/strong> “serverless API”, “API keys”, “throttle per customer”, “usage plans”, “cache API responses”, “WebSocket”, “expose Lambda as REST”.<\/li>\n<li><strong>Memory rule:<\/strong> API Gateway = the bouncer, accountant and receptionist for your APIs.<\/li>\n<\/ul>\n<p><strong>When API Gateway beats exposing the ALB directly:<\/strong> per-client keys, quotas and throttling; request validation; response caching; serverless (Lambda) backends; WebSockets without servers; private APIs. <strong>When the ALB is better:<\/strong> high, steady throughput to containers (ALB is cheaper per request at scale), long-running requests beyond the API Gateway timeout, and when you need none of API Gateway’s API-management features. PulseWire uses <strong>both<\/strong>: CloudFront → ALB → ECS for the website and main app API; CloudFront → API Gateway (REST) → Lambda/VPC Link for the partner API.<\/p>\n<p><strong>AWS AppSync<\/strong> is the managed <strong>GraphQL<\/strong> alternative with real-time subscriptions and offline sync — exam clue “GraphQL”.<\/p>\n<h3 id=\"s-failure-scenarios\">Failure scenarios<\/h3>\n<ol>\n<li><em>The image worker crashes mid-job.<\/em> The message’s visibility timeout expires and another worker picks it up. After 5 failures, it lands in the DLQ and an alarm fires. Nothing is lost.<\/li>\n<li><em>Messages are processed twice.<\/em> Visibility timeout shorter than processing time, or Standard queue duplicates. Raise the timeout and make workers <strong>idempotent<\/strong>; use FIFO if duplicates are unacceptable.<\/li>\n<li><em>Notifications must go to email, push and an analytics system, each at its own pace.<\/em> SNS → three SQS queues (fan-out). Not one SQS queue with three consumers (each message would go to only one of them).<\/li>\n<li><em>A nightly cron EC2 instance runs the “daily digest” job.<\/em> Replace it with EventBridge Scheduler → Lambda/ECS task. No idle server, no SPOF.<\/li>\n<li><em>Events must be processed in exact order per user, exactly once.<\/em> SQS FIFO with <code>MessageGroupId = userId<\/code>.<\/li>\n<li><em>A partner floods the API.<\/em> Usage plan throttle per API key, plus a WAF rate-based rule.<\/li>\n<\/ol>\n<h3 id=\"s-decision-tree\">Decision tree<\/h3>\n<pre class=\"diagram\"><code>Async communication?\n  ├── Buffer work for one set of workers → SQS (FIFO if order/exactly-once)\n  ├── Same message to many subscribers → SNS (→ SQS per subscriber = fan-out)\n  ├── Route events by content / SaaS / schedules / cross-account → EventBridge\n  ├── Multi-step workflow with retries &amp; approvals → Step Functions\n  ├── Real-time stream, replay, many consumers → Kinesis Data Streams\n  ├── Deliver a stream into S3/Redshift/OpenSearch → Data Firehose\n  ├── Existing Kafka → MSK\n  └── Existing JMS/AMQP/MQTT broker → Amazon MQ\n\nAPI front door?\n  ├── Keys, quotas, validation, caching, Lambda → API Gateway REST\n  ├── Simple, cheap Lambda/HTTP proxy → API Gateway HTTP\n  ├── Real-time two-way → API Gateway WebSocket (or AppSync)\n  ├── GraphQL → AppSync\n  └── High-throughput container web app → ALB\n<\/code><\/pre>\n<p><strong>Domains:<\/strong> 2 (loosely coupled, event-driven, workflow orchestration — Task Statement 2.1 almost entirely), 3 (decoupling for independent scaling), 4 (serverless pricing, throttling strategy).<\/p>\n","toc":[{"id":"amazon-sqs","text":"Amazon SQS"},{"id":"amazon-sns","text":"Amazon SNS"},{"id":"amazon-eventbridge","text":"Amazon EventBridge"},{"id":"aws-step-functions","text":"AWS Step Functions"},{"id":"streams-and-legacy-brokers-kinesis-msk-amazon-mq","text":"Streams and legacy brokers: Kinesis, MSK, Amazon MQ"},{"id":"amazon-api-gateway","text":"Amazon API Gateway"},{"id":"failure-scenarios","text":"Failure scenarios"},{"id":"decision-tree","text":"Decision tree"}]},{"id":"ch8","ch":8,"title":"Chapter 8: “Europe is slow” (Route 53, CloudFront, Global Accelerator)","short":"“Europe is slow”","topic":"Route 53, CloudFront, Global Accelerator","d":3,"focus":false,"mins":7,"html":"<p>PulseWire launches in the US and Europe. Readers in London see 1.8-second page loads; New York sees 1.5 seconds. Every request crosses the planet to Mumbai: ~120–250 ms of round-trip latency, multiplied by every image and API call on the page.<\/p>\n<blockquote class=\"voice\"><p><span class=\"who\">Meera<\/span> “Europe is slow, and our EU lawyers say EU readers’ personal data should stay in the EU.”<\/p>\n<\/blockquote>\n<p>Two different problems: <strong>latency<\/strong> (solve with edge caching and regional presence) and <strong>data residency<\/strong> (solve with routing EU users to an EU region).<\/p>\n<h3 id=\"s-amazon-route-53\">Amazon Route 53<\/h3>\n<ul>\n<li><strong>Problem it solves:<\/strong> Users need to find your app by name, and DNS should send them to the <em>best healthy<\/em> endpoint, not just <em>an<\/em> endpoint.<\/li>\n<li><strong>Why PulseWire needs it:<\/strong> <code>pulsewire.com<\/code> must route EU users to eu-west-1, everyone else to the lowest-latency region, and skip unhealthy regions automatically.<\/li>\n<li><strong>How it works:<\/strong> Authoritative DNS with 100% availability SLA, <strong>health checks<\/strong>, and routing policies. <strong>Alias records<\/strong> point to AWS resources (CloudFront, ALB, S3 website, API Gateway) for free and work at the zone apex (<code>pulsewire.com<\/code>), unlike CNAME.<\/li>\n<li><strong>Routing policies (memorize all):<\/strong><\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Policy<\/th>\n<th>What it does<\/th>\n<th>PulseWire / exam use<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Simple<\/td>\n<td>One record, no health checks<\/td>\n<td>Single resource<\/td>\n<\/tr>\n<tr>\n<td><strong>Weighted<\/strong><\/td>\n<td>Split traffic by percentage<\/td>\n<td>Canary: 10% to the new version, A/B tests, blue/green<\/td>\n<\/tr>\n<tr>\n<td><strong>Latency<\/strong><\/td>\n<td>Send to the region with lowest latency for the user<\/td>\n<td>Global performance across Mumbai, Virginia, Ireland<\/td>\n<\/tr>\n<tr>\n<td><strong>Failover<\/strong><\/td>\n<td>Primary/secondary using health checks<\/td>\n<td>Active-passive DR (Ch 13)<\/td>\n<\/tr>\n<tr>\n<td><strong>Geolocation<\/strong><\/td>\n<td>Route by user’s continent/country<\/td>\n<td><strong>Compliance/residency<\/strong>: EU readers → eu-west-1; localized content; needs a default record<\/td>\n<\/tr>\n<tr>\n<td><strong>Geoproximity<\/strong><\/td>\n<td>Route by distance, adjustable with a <strong>bias<\/strong> to shift traffic<\/td>\n<td>Gradually move load toward a new region (Traffic Flow)<\/td>\n<\/tr>\n<tr>\n<td>Multivalue answer<\/td>\n<td>Return up to 8 healthy records<\/td>\n<td>Simple client-side load spreading (not a load balancer replacement)<\/td>\n<\/tr>\n<tr>\n<td>IP-based<\/td>\n<td>Route by client IP CIDR<\/td>\n<td>Specific ISPs/networks to specific endpoints<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<ul>\n<li><strong>Alternatives:<\/strong> Third-party DNS; Global Accelerator for fast failover without DNS caching.<\/li>\n<li><strong>When NOT to use it alone:<\/strong> When clients/resolvers cache DNS and you need failover in seconds (TTL delays) → Global Accelerator.<\/li>\n<li><strong>Cost:<\/strong> Per hosted zone per month + per million queries (alias queries to AWS resources are fre
