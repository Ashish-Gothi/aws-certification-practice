function afterDiag(){
  const s=$('[data-act="start-diag"]'); if(s) s.addEventListener("click",()=>{DG={ids:shuffle(DIAGNOSTIC_IDS),i:0,ans:{},ord:{}};render();});
  const dq=$("#dq"); if(!dq) { const r=$('[data-act="retake-diag"]'); r&&r.addEventListener("click",()=>{DG=null;render();}); return; }
  const q=ALLQ[DG.ids[DG.i]]; DG.ord[q.id]=DG.ord[q.id]||perm(q.o.length);
  let sel=DG.ans[q.id]||[];
  const draw=()=>{dq.innerHTML=qHTML(q,{order:DG.ord[q.id],sel,num:DG.i+1,total:DG.ids.length,showDomain:false,
    actions:`${DG.i>0?'<button class="btn" data-act="prev">Previous</button>':""}<button class="btn primary" data-act="next" ${sel.length===q.a.length?"":"disabled"}>${DG.i===DG.ids.length-1?"See my results":"Next"}</button>`});};
  dq.onclick=e=>{const b=e.target.closest(".opt"); if(b){sel=toggleSel(q,sel,+b.dataset.oi);DG.ans[q.id]=sel;draw();return;}
    const a=e.target.closest("[data-act]"); if(!a) return;
    if(a.dataset.act==="prev"){DG.i--;render();}
    if(a.dataset.act==="next"){ if(DG.i<DG.ids.length-1){DG.i++;render();} else { finishDiag(); } } };
  dq._key=k=>{const n="12345".indexOf(k)>=0?"12345".indexOf(k):"abcde".indexOf(k.toLowerCase()); if(n>=0&&n<q.o.length){sel=toggleSel(q,sel,DG.ord[q.id][n]);DG.ans[q.id]=sel;draw();return true;} if(k==="Enter"&&sel.length===q.a.length){$('[data-act="next"]',dq).click();return true;} return false;};
  draw();
}
function finishDiag(){
  const by={1:{c:0,t:0},2:{c:0,t:0},3:{c:0,t:0},4:{c:0,t:0}}; let c=0;
  DG.ids.forEach(id=>{const q=ALLQ[id],ok=same(DG.ans[id]||[],q.a); by[q.d].t++; if(ok){by[q.d].c++;c++;} S.prac[id]={c:ok,t:Date.now()};});
  S.diag={date:Date.now(),c,t:DG.ids.length,by}; save(); DG.done=true; render();
}
function vDiagResult(){
  const d=S.diag, weak=[1,2,3,4].filter(k=>d.by[k].c<d.by[k].t);
  const recs=weak.length?L.filter(l=>weak.includes(l.d)&&l.ch).slice(0,4):[];
  const level=d.c>=8?"Strong start. Read the chapters quickly, focus on the practice questions, and move to the mock exam early.":d.c>=5?"A solid base with clear gaps. Read every chapter, and slow down in the domains below.":"You’re at the start, which is exactly who this guide is for. Read in order from the beginning and do every practice question.";
  return chrome("diagnostic",`<div class="wrap"><div class="phead"><div class="crumb">${C.code} / <b>Diagnostic</b></div><h1>Your diagnostic result</h1><p>${level}</p></div>
  <div class="two"><div>
    <div class="score"><div class="big">${d.c}<small> / ${d.t}</small></div><div><div class="dbars">${[1,2,3,4].map(k=>`<div class="dbar"><div class="lb"><span>${DOMAINS[k].name}</span><span>${d.by[k].c} / ${d.by[k].t}</span></div><div class="bar"><i style="width:${d.by[k].t?d.by[k].c/d.by[k].t*100:0}%;background:${DCOL(k)}"></i></div></div>`).join("")}</div></div></div>
    <h2 style="font-size:22px;margin:40px 0 14px">Review your answers</h2>
    <div class="rv">${DG.ids.map((id,i)=>{const q=ALLQ[id],sel=DG.ans[id]||[],ok=same(sel,q.a);return `<details><summary><span class="n">${i+1}</span><span class="q">${esc(q.q)}</span><span class="pill ${ok?"ok":"bad"}">${ok?"Correct":"Incorrect"}</span></summary>${qHTML(q,{order:DG.ord[id],sel,reveal:true,mode:"review"})}</details>`;}).join("")}</div>
  </div>
  <aside class="panel"><h3>Where to start</h3>${recs.length?`<p class="muted" style="margin:0 0 12px;font-size:15px">Chapters from the domains where you dropped points:</p><ol style="padding-left:18px;margin:0 0 16px">${recs.map(l=>`<li style="margin:6px 0"><a href="#learn-${l.id}">Ch ${l.ch}: ${l.short}</a></li>`).join("")}</ol>`:`<p class="muted" style="font-size:15px">No weak domain showed up. Skim the lessons and go to the mock exam.</p>`}
  <a class="btn primary" href="#learn-start" style="width:100%">Start learning</a><button class="btn ghost" data-act="retake-diag" style="width:100%;margin-top:8px">Retake diagnostic</button></aside></div></div>`);
}

/* practice drill */
let PR={d:0,mode:"all",queue:null,i:0,c:0,n:0};
function buildQueue(){ let qs=PRACTICE.filter(q=>!PR.d||q.d===PR.d); if(PR.mode==="todo") qs=qs.filter(q=>!S.prac[q.id]||!S.prac[q.id].c); PR.queue=shuffle(qs.map(q=>q.id)); PR.i=0; }
function vPractice(){
  if(!PR.queue) buildQueue();
  const tot=PRACTICE.length, ans=PRACTICE.filter(q=>S.prac[q.id]).length, cor=PRACTICE.filter(q=>S.prac[q.id]&&S.prac[q.id].c).length;
  const byd=[1,2,3,4].map(d=>{const qs=PRACTICE.filter(q=>q.d===d),a=qs.filter(q=>S.prac[q.id]),c=a.filter(q=>S.prac[q.id].c);return {d,t:qs.length,a:a.length,c:c.length};});
  const chips=`<div class="toolbar" role="group" aria-label="Domain"><button class="chip" aria-pressed="${PR.d===0}" data-d="0">All domains</button>${[1,2,3,4].map(d=>`<button class="chip" aria-pressed="${PR.d===d}" data-d="${d}"><i style="background:${DCOL(d)}"></i>${DOMAINS[d].short}</button>`).join("")}</div>
  <div class="toolbar" role="group" aria-label="Which questions"><button class="chip" aria-pressed="${PR.mode==="all"}" data-m="all">All questions</button><button class="chip" aria-pressed="${PR.mode==="todo"}" data-m="todo">Unanswered and missed</button></div>`;
  const done=PR.i>=PR.queue.length;
  return chrome("practice",`<div class="wrap"><div class="phead"><div class="crumb">${C.code} / <b>Practice drill</b></div><h1>Practice drill</h1><p>Instant feedback on every question. Filter by domain, or work only on questions you haven’t answered or got wrong. The mock exam uses a separate set, so it stays unseen.</p></div>
  <div class="two"><div>${chips}
   ${PR.queue.length?`<div class="muted" style="font-size:14px;font-family:var(--mono)">${Math.min(PR.i+1,PR.queue.length)} of ${PR.queue.length} in this set</div><div class="progress"><i style="width:${PR.i/PR.queue.length*100}%"></i></div>`:""}
   ${PR.queue.length===0?`<div class="empty">Nothing left in this filter. You’ve answered every question here correctly.<br><br><button class="btn" data-m="all">Show all questions</button></div>`:done?`<div class="empty"><b>Set complete.</b> ${PR.c} of ${PR.n} correct this session.<br><br><button class="btn primary" data-act="again">Start a new set</button></div>`:`<div id="pq"></div>`}
  </div><aside class="panel"><h3>Your progress</h3><dl class="kv"><dt>Answered</dt><dd>${ans} / ${tot}</dd><dt>Correct</dt><dd>${cor}</dd><dt>Accuracy</dt><dd>${ans?Math.round(cor/ans*100):0}%</dd></dl>
   <div class="dbars" style="margin-top:20px">${byd.map(b=>`<div class="dbar"><div class="lb"><span>${DOMAINS[b.d].short}</span><span>${b.c}/${b.t}</span></div><div class="bar"><i style="width:${b.c/b.t*100}%;background:${DCOL(b.d)}"></i></div></div>`).join("")}</div>
   <p class="muted" style="font-size:13px;margin:16px 0 0">Keys: 1–5 to choose, Enter to check and continue.</p></aside></div></div>`);
}
function afterPractice(){
  $$("[data-d]").forEach(b=>b.addEventListener("click",()=>{PR.d=+b.dataset.d;buildQueue();PR.c=PR.n=0;render(true);}));
  $$("[data-m]").forEach(b=>b.addEventListener("click",()=>{PR.mode=b.dataset.m;buildQueue();PR.c=PR.n=0;render(true);}));
  const ag=$('[data-act="again"]'); ag&&ag.addEventListener("click",()=>{buildQueue();PR.c=PR.n=0;render(true);});
  const pq=$("#pq"); if(!pq) return;
  const q=ALLQ[PR.queue[PR.i]]; delete ORD[q.id];
  mountInstant(pq,q,{onCheck:ok=>{PR.n++; if(ok) PR.c++;},next:()=>{PR.i++;render(true);},nextLabel:PR.i===PR.queue.length-1?"Finish set":"Next question"});
}

/* mock exam */
function afterMock(){
  const b=$('[data-act="begin"]'); b&&b.addEventListener("click",startMock);
  const r=$('[data-act="resume"]'); r&&r.addEventListener("click",()=>{location.hash="exam";});
  const d=$('[data-act="discard"]'); d&&d.addEventListener("click",()=>{ if(confirm("Discard the exam in progress? Your answers will be lost.")){S.run=null;save();render(true);} });
}
function startMock(){
  const order=shuffle(MOCK1.map(q=>q.id)), opt={}; order.forEach(id=>opt[id]=perm(ALLQ[id].o.length));
  S.run={id:"mock1",order,opt,ans:{},flag:{},i:0,start:Date.now(),dur:MOCK_MIN*60000}; save(); location.hash="exam";
}
let TICK=null;
function vExam(){
  const R=S.run; if(!R) return vMock();
  const q=ALLQ[R.order[R.i]], n=R.order.length, answered=R.order.filter(id=>(R.ans[id]||[]).length).length;
  const rev=R.review;
  const head=`<div class="ebar"><div class="wrap"><span class="title"><span class="logo" aria-hidden="true">${C.logo}</span>Mock exam</span><span class="count">${rev?"Review":`Question ${R.i+1} of ${n}`} · ${answered} answered</span><span class="sp"></span><span class="timer" id="timer" aria-live="off" title="Time remaining">--:--</span><a class="btn ghost sm" href="#mock" title="Your answers and the clock are saved">Save and exit</a><button class="btn sm" data-act="review">${rev?"Back to question":"Review all"}</button></div></div>`;
  let body;
  if(rev){
    const fl=R.order.filter(id=>R.flag[id]).length;
    body=`<h1 style="font-size:28px;font-weight:600;margin-bottom:8px">Review before you submit</h1><p class="muted" style="margin:0 0 20px">${answered} answered, ${n-answered} unanswered, ${fl} flagged. Select a number to go back to it.</p>
    <div class="grid-nav">${R.order.map((id,i)=>`<button class="${(R.ans[id]||[]).length?"ans":""} ${R.flag[id]?"flg":""}" data-goto="${i}" aria-label="Question ${i+1}${R.flag[id]?", flagged":""}${(R.ans[id]||[]).length?", answered":", unanswered"}">${i+1}</button>`).join("")}</div>
    <div class="legend"><span><i style="background:var(--accent-soft);border-color:var(--accent)"></i>Answered</span><span><i></i>Unanswered</span><span><i style="background:var(--amber);border-color:var(--amber);border-radius:50%;width:8px;height:8px"></i>Flagged</span></div>
    <div class="qact" style="margin-top:28px">${n-answered?`<button class="btn" data-act="first-un">Go to first unanswered</button>`:""}${fl?`<button class="btn" data-act="first-fl">Go to first flagged</button>`:""}<button class="btn primary" data-act="submit">Submit exam</button></div>`;
  } else {
    body=`<div id="eq"></div><details class="navpanel"><summary class="muted" style="cursor:pointer;font-size:14px">Question navigator</summary><div style="margin-top:12px" class="grid-nav">${R.order.map((id,i)=>`<button class="${(R.ans[id]||[]).length?"ans":""} ${R.flag[id]?"flg":""} ${i===R.i?"cur":""}" data-goto="${i}">${i+1}</button>`).join("")}</div></details>`;
  }
  const foot=rev?"":`<div class="efoot"><div class="wrap"><button class="btn" data-act="prev" ${R.i===0?"disabled":""}>Previous</button><button class="btn flagbtn" data-act="flag" aria-pressed="${!!R.flag[q.id]}">${R.flag[q.id]?"Flagged":"Flag for review"}</button><span class="sp"></span>${R.i===n-1?`<button class="btn primary" data-act="review">Review and submit</button>`:`<button class="btn primary" data-act="next">Next</button>`}</div></div>`;
  return `<div class="exam">${head}<div class="ebody"><div class="wrap">${body}</div></div>${foot}</div>
  <dialog id="dlg"><div class="db"><h2>Submit your exam?</h2><p class="muted" id="dlgt" style="margin:0"></p></div><div class="da"><button class="btn" data-act="cancel">Keep working</button><button class="btn primary" data-act="confirm">Submit exam</button></div></dialog>`;
}
function afterExam(){
  const R=S.run; if(!R) return;
  const tEl=$("#timer");
  const tick=()=>{const left=R.start+R.dur-Date.now(); if(tEl){tEl.textContent=fmtT(left); tEl.classList.toggle("low",left<10*60000);} if(left<=0){ submitMock(true);} };
  tick(); TICK=setInterval(tick,1000); cleanup.push(()=>clearInterval(TICK));
  const eq=$("#eq");
  if(eq){
    const q=ALLQ[R.order[R.i]];
    const draw=()=>{eq.innerHTML=qHTML(q,{order:R.opt[q.id],sel:R.ans[q.id]||[],num:R.i+1,total:R.order.length,showDomain:false,flagged:R.flag[q.id]}); };
    draw();
    eq.onclick=e=>{const b=e.target.closest(".opt"); if(!b) return; R.ans[q.id]=toggleSel(q,R.ans[q.id]||[],+b.dataset.oi); save(); draw(); const nb=eq.querySelector(`.opt[data-oi="${b.dataset.oi}"]`); nb&&nb.focus(); refreshNav();};
    eq._key=k=>{const ix="12345".indexOf(k)>=0?"12345".indexOf(k):"abcde".indexOf(k.toLowerCase()); if(ix>=0&&ix<q.o.length){R.ans[q.id]=toggleSel(q,R.ans[q.id]||[],R.opt[q.id][ix]);save();draw();refreshNav();return true;} return false;};
  }
  const go=i=>{R.i=i;R.review=false;save();render(true);};
  $("#app").addEventListener("click",examClick); cleanup.push(()=>$("#app").removeEventListener("click",examClick));
  function examClick(e){
    const g=e.target.closest("[data-goto]"); if(g){go(+g.dataset.goto);return;}
    const a=e.target.closest("[data-act]"); if(!a) return;
    const act=a.dataset.act, n=R.order.length;
    if(act==="next"&&R.i<n-1) go(R.i+1);
    if(act==="prev"&&R.i>0) go(R.i-1);
    if(act==="flag"){const id=R.order[R.i]; R.flag[id]=!R.flag[id]; save(); render(true);}
    if(act==="review"){R.review=!R.review; save(); render(true);}
    if(act==="first-un"){const i=R.order.findIndex(id=>!(R.ans[id]||[]).length); if(i>=0) go(i);}
    if(act==="first-fl"){const i=R.order.findIndex(id=>R.flag[id]); if(i>=0) go(i);}
    if(act==="submit"){ const un=R.order.filter(id=>!(R.ans[id]||[]).length).length, fl=R.order.filter(id=>R.flag[id]).length;
      $("#dlgt").textContent=(un?`${un} question${un>1?"s are":" is"} unanswered and will score zero. `:"All questions are answered. ")+(fl?`${fl} still flagged. `:"")+"You can’t change answers after submitting.";
      const dl=$("#dlg"); dl.showModal?dl.showModal():(confirm($("#dlgt").textContent)&&submitMock()); }
    if(act==="cancel") $("#dlg").close();
    if(act==="confirm"){ $("#dlg").close(); submitMock(); }
  }
  function refreshNav(){ $$(".grid-nav button").forEach(b=>{const id=R.order[+b.dataset.goto]; b.classList.toggle("ans",!!(R.ans[id]||[]).length);}); const c=$(".count"); if(c) c.textContent=`Question ${R.i+1} of ${R.order.length} · ${R.order.filter(id=>(R.ans[id]||[]).length).length} answered`; }
}
function submitMock(timeout){
  const R=S.run; if(!R) return;
  const by={1:{c:0,t:0},2:{c:0,t:0},3:{c:0,t:0},4:{c:0,t:0}}; let c=0;
  R.order.forEach(id=>{const q=ALLQ[id]; by[q.d].t++; if(same(R.ans[id]||[],q.a)){by[q.d].c++;c++;}});
  const t=R.order.length, sc=scaled(c,t);
  S.attempts.push({id:R.id,date:Date.now(),c,t,scaled:sc,pass:sc>=PASS,by,ans:R.ans,flag:R.flag,order:R.order,opt:R.opt,used:Math.min(R.dur,Date.now()-R.start),timeout:!!timeout});
  S.run=null; save(); location.hash="result-"+(S.attempts.length-1);
}
let RF="all";
function vResult(i){
  const a=S.attempts[i]; if(!a) return vMock();
  const pct=(a.scaled-100)/900*100, pm=(PASS-100)/900*100;
  const items=a.order.map((id,k)=>({id,k,q:ALLQ[id],sel:a.ans[id]||[],ok:same(a.ans[id]||[],ALLQ[id].a),fl:!!a.flag[id]}));
  const shown=items.filter(x=>RF==="all"||(RF==="wrong"&&!x.ok)||(RF==="flag"&&x.fl));
  const wrongN=items.filter(x=>!x.ok).length, flN=items.filter(x=>x.fl).length;
  const weak=[1,2,3,4].filter(d=>a.by[d].c/a.by[d].t<.7).sort((x,y)=>a.by[x].c/a.by[x].t-a.by[y].c/a.by[y].t).slice(0,2);
  return chrome("mock",`<div class="wrap"><div class="phead"><div class="crumb"><a href="#mock">${C.code} / Mock exam</a> / <b>Result</b></div><h1>${a.pass?"You passed this mock":"Not a pass yet"}</h1><p>${a.timeout?"Time ran out and the exam was submitted automatically. ":""}${a.pass?(a.scaled>=800?"A comfortable margin. Review your misses, and you’re in good shape to book.":"You cleared the bar, but the margin is thin. Review every miss and retake before booking."):"Use the domain report to pick what to study, review each miss below, then retake."}</p></div>
  <div class="score"><div><div class="big">${a.scaled}<small> / 1,000</small></div><div style="margin-top:8px"><span class="pill ${a.pass?"ok":"bad"}">${a.pass?"Pass":"Fail"}</span> <span class="muted" style="font-size:14px;margin-left:6px">${a.c} of ${a.t} correct · ${fmtT(a.used)} used</span></div></div>
   <div><div class="scale"><i style="width:${pct}%;background:${a.pass?"var(--ok)":"var(--bad)"}"></i><span class="pm" style="left:${pm}%" title="Pass mark ${PASS}"></span></div><div class="scale-l"><span style="left:0">100</span><span style="left:${pm}%;transform:translateX(-50%)">${PASS} to pass</span><span style="right:0">1,000</span></div></div></div>
  <h2 style="font-size:22px;margin:40px 0 6px">Domain report</h2><p class="muted" style="margin:0 0 16px">Like the real score report: 70% or more in a domain meets competencies.</p>
  <div class="panel"><div class="dbars">${[1,2,3,4].map(d=>{const p=a.by[d].c/a.by[d].t;return `<div class="dbar"><div class="lb"><span>${DOMAINS[d].name} <span class="pill ${p>=.7?"ok":"bad"}" style="margin-left:6px">${p>=.7?"Meets competencies":"Needs improvement"}</span></span><span>${a.by[d].c} / ${a.by[d].t}</span></div><div class="bar"><i style="width:${p*100}%;background:${DCOL(d)}"></i></div></div>`;}).join("")}</div>
  ${weak.length?`<p style="margin:20px 0 0;font-size:15px">Study next, starting with your weakest ${weak.length>1?"domains":"domain"}: ${L.filter(l=>weak.includes(l.d)&&l.ch).map(l=>`<a href="#learn-${l.id}">Ch ${l.ch}</a>`).join(", ")}, then <a href="#practice">drill those domains</a>.</p>`:""}</div>
  <h2 style="font-size:22px;margin:40px 0 14px">Review answers</h2>
  <div class="toolbar"><button class="chip" aria-pressed="${RF==="all"}" data-rf="all">All ${items.length}</button><button class="chip" aria-pressed="${RF==="wrong"}" data-rf="wrong">Incorrect ${wrongN}</button><button class="chip" aria-pressed="${RF==="flag"}" data-rf="flag">Flagged ${flN}</button></div>
  <div class="rv">${shown.length?shown.map(x=>`<details><summary><span class="n">${x.k+1}</span><span class="q">${esc(x.q.q)}</span><span class="pill ${x.ok?"ok":"bad"}">${x.ok?"Correct":x.sel.length?"Incorrect":"Unanswered"}</span></summary>${qHTML(x.q,{order:a.opt[x.id],sel:x.sel,reveal:true,mode:"review",flagged:x.fl})}</details>`).join(""):`<div class="empty">Nothing in this filter.</div>`}</div>
  <div class="qact" style="margin-top:28px"><a class="btn primary" href="#mock">Back to mock exam</a></div></div>`);
}
function afterResult(){ $$("[data-rf]").forEach(b=>b.addEventListener("click",()=>{RF=b.dataset.rf;render(true);})); }

/* ---------- router ---------- */
let cleanup=[];
function render(keepScroll){
  cleanup.forEach(f=>f()); cleanup=[];
  const h=decodeURIComponent(location.hash.slice(1));
  const y=window.scrollY;
  let html, after=()=>{};
  if(h===""||h==="home"){html=vHome();}
  else if(h==="learn"){html=vLearn();}
  else if(h.startsWith("learn-")){const id=h.slice(6); html=vLesson(id); after=()=>afterLesson(id);}
  else if(h==="diagnostic"){html=vDiag(); after=afterDiag;}
  else if(h==="practice"){html=vPractice(); after=afterPractice;}
  else if(h==="mock"){html=vMock(); after=afterMock;}
  else if(h==="exam"){ if(S.run){html=vExam(); after=afterExam;} else {html=vMock(); after=afterMock;} }
  else if(h.startsWith("result-")){RF=RF||"all"; html=vResult(+h.slice(7)); after=afterResult;}
  else {html=vHome();}
  $("#app").innerHTML=html; after();
  window.scrollTo(0,keepScroll?y:0);
  const t=$("h1"); document.title=(t&&h?t.textContent.trim()+" — ":"")+C.code+" Path";
}
let lastHash=null;
window.addEventListener("hashchange",()=>{ const h=location.hash; if(!h.startsWith("#result-")) RF="all"; if(h==="#diagnostic"&&DG&&DG.done) {} render(); lastHash=h; });
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return; const tg=e.target.tagName; if(tg==="INPUT"||tg==="TEXTAREA") return;
  if(document.querySelector("dialog[open]")) return;
  const host=$("#eq")||$("#pq")||$("#dq");
  if(host&&host._key&&host._key(e.key)){e.preventDefault();return;}
  if($("#eq")){ if(e.key==="ArrowRight"){const b=$('[data-act="next"]');b&&b.click();} if(e.key==="ArrowLeft"){const b=$('[data-act="prev"]');b&&b.click();} if(e.key==="f"||e.key==="F"){const b=$('[data-act="flag"]');b&&b.click();} }
});
document.addEventListener("click",e=>{const d=document.querySelector(".certsw[open]");if(d&&!d.contains(e.target))d.removeAttribute("open");});
(function(){try{const t=localStorage.getItem("saa-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}})();
document.addEventListener("click",e=>{
  const t=e.target.closest('[data-act="theme"]');
  if(t){const r=document.documentElement;const cur=r.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");const nx=cur==="dark"?"light":"dark";r.dataset.theme=nx;try{localStorage.setItem("saa-theme",nx);}catch(_){}}
  const sb=e.target.closest('[data-act="sb"]'); if(sb){SBC=!SBC;const sh=$(".shell");sh&&sh.classList.toggle("collapsed",SBC);sb.setAttribute("aria-label",(SBC?"Show":"Hide")+" curriculum");}
});
render();
})();
</script>
