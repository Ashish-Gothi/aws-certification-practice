{id:"m9",d:1,ch:2,q:"Administrators need interactive shell access to Linux instances in private subnets. Security requires no inbound ports open in any security group, no SSH keys to manage, access controlled with IAM and every session’s commands logged to S3. What should the solutions architect implement?",
o:["AWS Systems Manager Session Manager with session logging to an S3 bucket enabled.","A bastion host in a public subnet whose security group allows SSH from the office range.","An AWS Site-to-Site VPN from the office with SSH access through the private IP addresses.","Public IP addresses on the instances, with network ACLs allowing SSH only from the office."],
a:[0],
w:["Session Manager uses an outbound agent connection, needs no inbound ports or keys, uses IAM and logs sessions.","It requires inbound SSH and key management.","SSH keys and open inbound port 22 are still needed.","This exposes instances publicly and still needs SSH keys."],
k:"No inbound ports, no keys, audited shell → Session Manager."},

{id:"m10",d:1,ch:5,q:"Auditors found that some clients upload objects to an S3 bucket over plain HTTP. The company must reject any request to the bucket that does not use TLS. What should the solutions architect add?",
o:["A bucket policy statement that denies all S3 actions when aws:SecureTransport is false.","Default bucket encryption using SSE-KMS with a customer managed key set on the bucket.","A bucket policy statement that requires the x-amz-server-side-encryption request header.","S3 Block Public Access at both the bucket level and the account level for the bucket."],
a:[0],
w:["The aws:SecureTransport condition is false on plain HTTP requests, so this denies them.","This is encryption at rest. It does not control the transport protocol.","This header requests encryption at rest, not TLS in transit.","Block Public Access governs public policies and ACLs, not the protocol."],
k:"Enforce TLS to S3 → deny when aws:SecureTransport = false."},

{id:"m11",d:1,ch:9,q:"Amazon GuardDuty occasionally reports that an EC2 instance is communicating with known cryptocurrency mining hosts. Security wants such instances isolated from the network automatically within minutes, while keeping them running for forensic analysis. What should the solutions architect design?",
o:["An EventBridge rule matching the GuardDuty finding type that invokes a Lambda function to swap in an isolation security group.","An Amazon Inspector schedule that scans the instances daily and terminates any instance with a high-severity finding.","A CloudTrail metric filter on outbound network connection events with a CloudWatch alarm that stops the affected instance automatically.","AWS Shield Advanced with automatic application layer mitigation turned on for all instances in the account."],
a:[0],
w:["GuardDuty findings flow to EventBridge. A Lambda function can isolate the instance quickly and keep it running.","Inspector finds vulnerabilities, not live mining traffic, and terminating destroys evidence.","CloudTrail records API calls, not network connections, and stopping loses memory state.","Shield addresses DDoS, not compromised instances."],
k:"Automated response to findings → EventBridge + Lambda (or SSM Automation)."},

{id:"m12",d:1,ch:3,q:"A company with 60 AWS accounts wants employees to sign in once with their existing corporate identity provider and receive role-based access to specific accounts. Joiners and leavers must be reflected automatically. What should the solutions architect implement?",
o:["IAM Identity Center connected to the corporate IdP with SAML and SCIM, and permission sets assigned per account.","IAM users created in each of the 60 accounts and kept in sync with the corporate directory by a nightly script.","An Amazon Cognito user pool federated with the corporate IdP that issues IAM roles to employees.","An AD Connector deployed in each of the 60 accounts, with IAM roles mapped to directory groups."],
a:[0],
w:["Identity Center centralizes workforce SSO across Organizations, and SCIM provisions joiners and leavers automatically.","Long-term users in 60 accounts is a large security and operations burden.","Cognito is for customer identity in applications, not workforce access to AWS accounts.","Running a connector per account is heavy and duplicative."],
k:"Workforce SSO across accounts → IAM Identity Center."},

{id:"m13",d:1,ch:2,q:"An application tier runs in an Auto Scaling group in VPC A. Its database runs on EC2 in VPC B in the same Region, connected to VPC A through VPC peering. The database must accept port 5432 only from application instances, whose IP addresses change as the group scales. What should the solutions architect do?",
o:["Add an inbound rule to the database security group that references the application security group ID.","Add network ACL rules in VPC B that allow port 5432 only from the subnet CIDR ranges of VPC A.","Replace the peering connection with a transit gateway and add route-table rules that restrict port 5432.","Assign Elastic IP addresses to the application instances and allow those in the database group."],
a:[0],
w:["Security groups can reference groups in a peered VPC in the same Region, so the rule follows the instances as they scale.","CIDR rules also allow any other host in those subnets, so access is broader than required.","Route tables do not filter by port, and the change adds cost without solving the access control.","Elastic IPs are public addresses and do not suit Auto Scaling or private peered traffic."],
k:"Scaling sources → reference security groups, not IPs (works across same-Region peering)."},

{id:"m14",d:1,ch:2,q:"A company must route all traffic between its VPCs and the internet through licensed third-party firewall appliances from AWS Marketplace. The appliance fleet must scale horizontally and be health checked, and traffic must keep flowing if an appliance fails. What should the solutions architect use?",
o:["A Gateway Load Balancer in front of the appliance fleet, with Gateway Load Balancer endpoints in route tables.","A Network Load Balancer in front of the appliance fleet, with its DNS name set as the default route target in each VPC.","An Application Load Balancer in front of the appliance fleet, with path-based rules for each traffic type.","AWS Network Firewall in each VPC, with stateful rule groups that copy the appliance vendor’s policies."],
a:[0],
w:["GWLB is built to insert, scale and health check third-party virtual appliances transparently.","Route tables cannot target an NLB’s DNS name, and NLB is not built for transparent appliance insertion.","ALB works at layer 7 for HTTP and cannot inspect all traffic transparently.","Network Firewall is AWS’s own service, but the requirement is to use the licensed third-party appliances."],
k:"Third-party virtual appliances inline → Gateway Load Balancer."},

{id:"m15",d:1,ch:8,q:"A web app runs behind an ALB in eu-west-1. The team is adding a CloudFront distribution with the custom domain news.example.com. They requested an ACM certificate for that domain in eu-west-1, but it does not appear in the CloudFront console. What should they do?",
o:["Request or import the certificate in ACM in us-east-1 and select it on the CloudFront distribution.","Export the eu-west-1 certificate and its private key from ACM and upload them to the CloudFront distribution.","Wait for ACM to replicate the eu-west-1 certificate to every edge location, then select it.","Attach the eu-west-1 certificate to the ALB and let CloudFront pass the TLS session through."],
a:[0],
w:["CloudFront only uses ACM certificates from us-east-1.","Public ACM certificates you requested from ACM cannot be exported.","ACM does not replicate certificates between Regions.","The viewer connection still needs a certificate on CloudFront, which terminates TLS."],
k:"CloudFront certificate → ACM in us-east-1."},

{id:"m16",d:1,ch:5,q:"A bucket receives millions of small uploads per hour. Security requires a customer managed KMS key so access to data can be separated from access to the key and every key use is auditable. The KMS request bill has become very high. What should the solutions architect do?",
o:["Keep SSE-KMS with the customer managed key and enable S3 Bucket Keys on the bucket.","Switch the bucket to SSE-S3 so that Amazon S3 manages the keys and the requests itself.","Switch to SSE-C so that clients supply their own keys on each upload and download request.","Encrypt on the client with a new KMS data key generated for every object before upload."],
a:[0],
w:["Bucket Keys sharply reduce calls from S3 to KMS while keeping the customer managed key and CloudTrail auditing.","SSE-S3 drops the separate key permissions and the per-use audit trail.","Customers must manage and send keys themselves, and there is no KMS audit trail.","A data key per object makes even more KMS requests."],
k:"SSE-KMS cost at high request rates → S3 Bucket Keys."},

{id:"m17",d:1,ch:5,q:"A company wants to make sure no S3 bucket or object in any of its member accounts can ever be made public, even by account administrators, now or in future accounts. Which TWO actions together meet this requirement?",
o:["Turn on S3 Block Public Access at the account level in every member account.","Apply an SCP that denies s3:PutAccountPublicAccessBlock to all member account principals.","Set every bucket’s ACL to private and remove any existing public grants from the buckets.","Enable Amazon Macie in every account to report buckets that are publicly accessible.","Create AWS Config rules that detect public buckets and notify the security team by email."],
a:[0,1],
w:["Account-level Block Public Access overrides any public bucket policy or ACL in that account.","The SCP stops administrators from turning that setting off.","ACLs can be changed later, and bucket policies can still grant public access.","Macie reports findings. It does not prevent public access.","Detection and notification are not prevention."],
k:"Prevent (BPA) + lock the control (SCP)."},

{id:"m18",d:1,ch:8,q:"A broadcaster’s streaming platform is a frequent DDoS target. It needs 24/7 access to AWS DDoS experts during attacks and protection against scaling charges caused by attack traffic on CloudFront, Route 53 and its load balancers. What should the solutions architect recommend?",
o:["AWS Shield Advanced on the CloudFront, Route 53 and load balancer resources.","AWS Shield Standard together with AWS WAF rate-based rules on CloudFront.","Amazon GuardDuty with Runtime Monitoring enabled across all of the workloads.","AWS Firewall Manager with security group policies applied across the accounts."],
a:[0],
w:["Shield Advanced adds the Shield Response Team and cost protection for scaling during attacks.","Standard is automatic and free but has no response team access or cost protection.","GuardDuty detects threats. It is not DDoS mitigation.","Firewall Manager manages policies centrally. It adds no response team or cost protection by itself."],
k:"DDoS + response team + cost protection → Shield Advanced."},

{id:"m19",d:1,ch:2,q:"A SaaS vendor must reach one internal API that a company runs behind a Network Load Balancer. The two VPCs have overlapping CIDR ranges, and the company must not expose the API to the internet or give the vendor network access to anything else. What should the solutions architect do?",
o:["Create a VPC endpoint service for the NLB and let the vendor create an interface endpoint to it.","Create a VPC peering connection with the vendor and limit access with the security groups.","Attach both VPCs to a transit gateway and use separate route tables to isolate the API.","Put a public Application Load Balancer in front of the API that allows only the vendor’s published IP ranges."],
a:[0],
w:["PrivateLink exposes a single service, works with overlapping CIDRs and grants no wider network access.","Peering does not allow overlapping CIDRs and opens network-level reachability.","Overlapping CIDRs cause routing conflicts, and access is network-wide rather than per service.","This exposes the API to the internet."],
k:"Expose one service privately, overlapping CIDRs → PrivateLink."},

{id:"m20",d:1,ch:3,q:"A developer with the AdministratorAccess managed policy can download objects from a bucket when working on an EC2 instance in the company VPC, but gets Access Denied from a laptop on home internet. No SCPs or permissions boundaries apply. What is the MOST likely cause?",
o:["The bucket policy has an explicit Deny for requests whose aws:SourceVpce value is not the VPC endpoint.","AdministratorAccess does not include S3 permissions unless an S3 policy is also attached to the user.","The objects were uploaded by another account and the bucket uses ACLs to restrict object ownership.","S3 Block Public Access on the bucket blocks every request that arrives from outside an AWS network."],
a:[0],
w:["An explicit Deny in the bucket policy overrides any Allow, and only requests through the VPC endpoint meet the condition.","AdministratorAccess grants all actions on all resources.","That would also fail from the EC2 instance, which it does not.","Block Public Access affects anonymous public access, not authenticated requests from the internet."],
k:"Works from VPC, fails outside → bucket policy deny on aws:SourceVpce or aws:SourceVpc."},

// ---------- Domain 2: Resilient architectures (17) ----------
{id:"m21",d:2,ch:7,q:"A web tier calls a third-party payment processor synchronously when an order is placed. The processor is sometimes unavailable for several minutes, and orders fail during that time. The company must accept every order and keep the website responsive. What should the solutions architect do?",
o:["Write each order to an SQS queue, and process it with workers that retry and send failures to a dead-letter queue.","Retry the processor call from the web tier with exponential backoff for up to five minutes on every incoming order request.","Publish each order to an SNS topic and subscribe the processor’s HTTPS endpoint so that SNS delivers it.","Write each order to an ElastiCache for Redis list, and have a cron job on one instance submit them."],
a:[0],
w:["The queue decouples the web tier from the processor. Orders persist and are processed when it recovers.","Holding requests open for minutes makes the site unresponsive and risks timeouts.","SNS HTTPS retries are limited and do not offer durable buffering, so orders could be lost.","A cache is not a durable order store, and one cron instance is a single point of failure."],
k:"Unreliable downstream + must not lose work → SQS buffer."},

{id:"m22",d:2,ch:7,q:"Workers process messages from an SQS standard queue. Processing each message takes up to 4 minutes. The queue’s visibility timeout is 30 seconds, and the team sees many messages processed two or three times. What should the solutions architect change first?",
o:["Raise the queue’s visibility timeout to a value above the maximum message processing time.","Turn on long polling by setting the queue’s receive message wait time to 20 seconds.","Convert the standard queue to a FIFO queue with content-based deduplication.","Shorten the message retention period so that stale messages expire sooner."],
a:[0],
w:["If processing outlasts the visibility timeout, the message reappears and another worker takes it.","Long polling reduces empty receives, not duplicate processing.","FIFO deduplicates sends within 5 minutes, but a timed-out message still becomes visible again.","Retention controls how long unprocessed messages are kept, not duplicates."],
k:"Duplicates + long processing → visibility timeout too short."},

{id:"m23",d:2,ch:7,q:"A content approval workflow has several steps, including one where a human editor approves the article, which can take up to 5 days. Failed steps need retries, and some steps need compensating actions. The team wants the least custom orchestration code. What should the solutions architect use?",
o:["An AWS Step Functions Standard workflow that uses a callback task token for the approval step.","An AWS Step Functions Express workflow that uses a wait state to pause for the editor’s human approval step.","A chain of Lambda functions linked by SQS delay queues to wait for the editor’s approval.","An EC2-based scheduler that polls an approvals table in DynamoDB every few minutes."],
a:[0],
w:["Standard workflows run for up to a year, support waitForTaskToken callbacks, retries and catch-based compensation.","Express workflows are limited to 5 minutes.","SQS delays cap at 15 minutes, and the orchestration becomes custom code.","This is all custom code and servers to maintain."],
k:"Long-running, human step, retries → Step Functions Standard + task token."},

{id:"m24",d:2,ch:6,q:"An application uses an Amazon Aurora MySQL cluster with one writer and two Aurora Replicas. After a writer failure, the replica was promoted, but the application kept sending writes to the old instance’s endpoint and failed. How should the application connect?",
o:["Send writes to the cluster endpoint and send read-only queries to the reader endpoint.","Send writes to the writer’s instance endpoint and reads to each replica’s endpoint.","Send all queries to the reader endpoint, because Aurora forwards the writes automatically.","Send all queries to a custom endpoint that contains every instance in the Aurora cluster."],
a:[0],
w:["The cluster endpoint always points at the current writer and follows failover. The reader endpoint balances reads.","Instance endpoints do not follow failover, which is exactly what broke.","The reader endpoint does not accept writes by default.","A custom endpoint across all instances would route some writes to read-only replicas."],
k:"Aurora: cluster endpoint for writes, reader endpoint for reads."},

{id:"m25",d:2,ch:8,q:"A company’s primary site runs behind an ALB in ap-south-1. If the primary becomes unhealthy, users must automatically see a static “we’ll be back soon” page hosted in S3 in another Region. Which Route 53 configuration should the solutions architect use?",
o:["Failover routing, with the ALB alias as primary using target health and the S3 site as secondary.","Weighted routing with a weight of 100 for the ALB alias record and a weight of 0 for the S3 website record.","Latency-based routing records for the ALB in ap-south-1 and for the S3 website in its Region.","Geoproximity routing with a bias that moves almost all traffic toward the ap-south-1 Region."],
a:[0],
w:["Failover routing sends traffic to the secondary when the primary’s health evaluation fails.","Without health checks the weights never shift on failure.","Users near the S3 Region would get the maintenance page even while the primary is healthy.","Geoproximity routes by location, not health, so it does not provide failover."],
k:"Active-passive → failover routing + health checks."},

{id:"m26",d:2,ch:13,q:"An internal reporting system can tolerate losing up to 1 hour of data and being unavailable for up to 24 hours after a regional disaster. The company wants the lowest possible DR cost. What should the solutions architect recommend?",
o:["Backup and restore, with AWS Backup copying hourly backups to the DR Region.","Pilot light, with a cross-Region database replica and AMIs kept for the app tier.","Warm standby, with a scaled-down but fully functional copy running in the DR Region.","Multi-site active-active, with Route 53 spreading traffic evenly across both Regions."],
a:[0],
w:["Hourly copies meet the 1-hour RPO, a 24-hour RTO allows a full restore, and the cost is lowest.","This meets the targets but pays for a continuously running replica that is not needed.","Running infrastructure costs more than the targets require.","This is the most expensive option and far exceeds the targets."],
k:"Generous RPO/RTO → backup and restore."},

{id:"m27",d:2,ch:12,q:"A web application runs on EC2 instances behind an ALB, with an Amazon RDS for MySQL database. The company needs the application to keep serving if an entire Availability Zone fails. Which TWO changes are required?",
o:["Configure the Auto Scaling group and the ALB to use subnets in at least two AZs.","Convert the RDS DB instance to a Multi-AZ deployment with a standby in another AZ.","Launch the application instances in a cluster placement group for lower latency.","Store the application’s session data on the instance store volumes of each instance.","Use one NAT gateway in the first AZ for outbound traffic from all of the subnets."],
a:[0,1],
w:["Instances in multiple AZs behind a multi-AZ ALB survive the loss of one AZ.","The database fails over to its standby in another AZ.","A cluster placement group puts instances in a single AZ, which is the opposite of what is needed.","Instance store is ephemeral and local, and the app should be stateless anyway.","A single NAT gateway is itself an AZ-level single point of failure."],
k:"AZ resilience = every tier across ≥2 AZs."},

{id:"m28",d:2,ch:6,q:"A global app needs users in North America, Europe and Asia to write to and read from a key-value user profile store with single-digit millisecond latency in their own Region. Data must replicate between Regions automatically, and any Region must keep working if another fails. What should the solutions architect use?",
o:["DynamoDB global tables with a replica table in each of the three Regions.","DynamoDB tables in each Region, kept in sync by DynamoDB Streams and Lambda.","A DynamoDB table in one Region, with DAX clusters deployed in the other Regions.","A DynamoDB table in one Region, with cross-Region backups copied every hour."],
a:[0],
w:["Global tables give multi-active, multi-Region replication with local reads and writes.","This is custom replication logic and conflict handling to maintain.","DAX clusters are regional and cannot front a table in another Region.","Users still write to one Region, and backups are not live replication."],
k:"Multi-Region active-active key-value → DynamoDB global tables."},

{id:"m29",d:2,ch:13,q:"A company enabled S3 Cross-Region Replication on a bucket that already held 200 million objects. New uploads replicate correctly, but objects that existed before the rule was created are not in the destination bucket. What should the solutions architect do?",
o:["Use S3 Batch Replication to replicate the objects that existed before the rule was created.","Turn S3 Versioning off and back on so that the replication rule re-evaluates every object.","Enable S3 Replication Time Control so that replication of all objects completes within 15 minutes.","Change the storage class on the destination so that it matches the class of the source bucket."],
a:[0],
w:["Replication rules only apply to new objects. Batch Replication handles existing ones.","Versioning cannot be disabled once enabled, only suspended, and that would not trigger replication.","RTC provides an SLA for new objects. It does not backfill existing ones.","Storage class has no effect on which objects replicate."],
k:"Existing objects + CRR → S3 Batch Replication."},

{id:"m30",d:2,ch:7,q:"A Lambda function processes SQS messages in batches of 10. When one message in a batch fails, the whole batch returns to the queue, and the nine successful messages are processed again, causing duplicate side effects. What should the solutions architect configure?",
o:["Enable ReportBatchItemFailures on the event source mapping and return only the failed message IDs.","Set the event source mapping’s batch size to 1 so that each message is processed by itself.","Increase the maxReceiveCount on the queue’s redrive policy so that failing batches retry longer.","Convert the queue to SQS FIFO so that duplicate messages are removed within the deduplication window."],
a:[0],
w:["A partial batch response returns only the failed messages to the queue, so successful ones are not reprocessed.","This works but sharply reduces throughput and raises cost.","This causes more duplicate reprocessing, not less.","FIFO deduplicates on send, not after a failed receive."],
k:"Lambda + SQS partial failures → ReportBatchItemFailures."},

{id:"m31",d:2,ch:7,q:"Several microservices emit events. Different events must go to different targets based on fields inside the event body, and the team must be able to replay the last 30 days of events to a target after a bug fix. Which service meets these requirements with the least custom code?",
o:["Amazon EventBridge with content-based rules on a custom event bus and an event archive.","Amazon SNS with message filtering policies and subscriber queues for every service.","An Amazon SQS queue per service, with consumers that discard messages they don’t need.","Amazon Kinesis Data Streams, with consumers that parse each record and route it themselves."],
a:[0],
w:["EventBridge rules match on event content, and archive and replay are built in.","SNS can filter but has no archive or replay.","Routing logic sits in every consumer, and replay is not possible.","Replay works, but routing becomes custom code and retention is limited by default."],
k:"Content routing + archive/replay → EventBridge."},

{id:"m32",d:2,ch:2,q:"A company connects its data center to AWS with one Direct Connect connection. If that connection fails, connectivity must continue automatically, even at lower bandwidth. The company wants the most cost-effective solution. What should the solutions architect do?",
o:["Configure an AWS Site-to-Site VPN over the internet as a backup to the Direct Connect path.","Order a second Direct Connect connection from a different provider at the same Direct Connect location.","Deploy AWS Global Accelerator in front of the VPC resources the data center connects to.","Create a VPC peering connection to a second VPC that has its own internet gateway."],
a:[0],
w:["A VPN backup is cheap, and BGP fails over automatically. Lower bandwidth is acceptable here.","A second Direct Connect is more resilient but far more expensive than the requirement needs.","Global Accelerator speeds up internet users’ access. It does not provide hybrid connectivity.","Peering connects VPCs, not a data center."],
k:"Cheap DX backup → Site-to-Site VPN. Maximum resiliency → second DX at another location."},

{id:"m33",d:2,ch:4,q:"After a new launch template rolled out, instances in an Auto Scaling group are marked unhealthy and terminated in a loop. The application now takes about 4 minutes to start. The group uses ELB health checks with a 60-second grace period. What should the solutions architect change?",
o:["Increase the health check grace period so that it is longer than the application’s start time.","Increase the target group’s deregistration delay so that in-flight requests can finish before termination.","Add a lifecycle hook on instance termination that waits for the application to start.","Shorten the ALB health check interval so that new instances are evaluated more often."],
a:[0],
w:["The group ignores failed health checks until the grace period ends, giving the app time to start.","Deregistration delay is about draining connections, not about new instances starting.","The issue is at launch, not termination. The hook would only delay the loop.","More frequent checks mark starting instances unhealthy even sooner."],
k:"Replacement loop on slow boot → health check grace period."},

{id:"m34",d:2,ch:6,q:"A session store on Amazon ElastiCache must survive a node or Availability Zone failure with automatic failover and without losing most of its data. Which configuration should the solutions architect choose?",
o:["ElastiCache for Redis OSS with replicas in other AZs and Multi-AZ automatic failover enabled.","ElastiCache for Memcached with several nodes spread across multiple Availability Zones.","A single ElastiCache for Redis OSS node with automatic daily snapshots kept for 7 days.","A DynamoDB Accelerator (DAX) cluster in front of a DynamoDB table that is used as the session storage."],
a:[0],
w:["Replicas in other AZs with automatic failover keep the data available when a primary fails.","Memcached has no replication or failover, so a lost node loses its data.","Failover means a manual restore, losing up to a day of sessions.","DAX caches DynamoDB reads. It is not a standalone session store, and it adds an unneeded layer."],
k:"Cache that must survive failure → Redis/Valkey with Multi-AZ replicas. Memcached = no replication."},

{id:"m35",d:2,ch:7,q:"A company exposes a REST API to partners through Amazon API Gateway. Each partner has a contract allowing 100 requests per second and 1 million requests per month. Partners who exceed it must be throttled without affecting other partners. What should the solutions architect configure?",
o:["Usage plans with an API key per partner, each with rate limits and a monthly quota.","An AWS WAF rate-based rule on the API that limits each source IP address in five minutes.","Reserved concurrency on the backend Lambda functions, sized from each partner’s limit.","Stage-level throttling on the API set to 100 requests per second for every API method."],
a:[0],
w:["Usage plans enforce rate and quota per API key, which maps to each partner’s contract.","WAF limits per IP, not per partner, and partners may use many IPs. It also has no monthly quota.","This limits the backend for everyone, not per partner.","Stage throttling is shared by all callers, so one partner can starve the others."],
k:"Per-customer rate + quota → API Gateway usage plans + API keys."},

{id:"m36",d:2,ch:12,q:"Six instances of a critical stateful service must each run on separate underlying hardware in one Availability Zone, to reduce the chance that a single hardware failure affects more than one instance. What should the solutions architect use?",
o:["A spread placement group that places each instance on distinct underlying hardware.","A cluster placement group that keeps the instances close together for low latency.","A partition placement group with all six instances placed in a single partition.","Dedicated Hosts, with all six instances placed together on one physical server."],
a:[0],
w:["Spread groups put each instance on distinct racks, up to 7 per AZ, which fits 6 instances.","Packing instances close together increases correlated failure risk.","One partition shares the same hardware, which defeats the goal.","One host makes a single hardware failure affect every instance."],
k:"Few critical instances, isolate hardware → spread placement group."},

{id:"m37",d:2,ch:4,q:"An S3 upload triggers a Lambda function asynchronously. Occasionally the function fails because of a temporary downstream outage, and after the built-in retries the event is lost. The team must keep failed events for investigation and reprocessing. What should the solutions architect configure?",
o:["An on-failure destination for asynchronous invocations that sends failed events to an SQS queue.","A longer timeout on the function so that it waits out the downstream outage before it fails.","Reserved concurrency on the function so that it always has enough capacity to run every incoming event.","Provisioned concurrency on the function so that every invocation starts without a cold start."],
a:[0],
w:["After retries are exhausted, the event and error details go to the destination for later reprocessing.","An outage can last longer than the 15-minute maximum, and the event is still lost on failure.","Capacity was not the problem, and failed events are still discarded.","Cold starts are unrelated to losing failed events."],
k:"Async Lambda failures must be kept → on-failure destination (or DLQ)."},

// ---------- Domain 3: High-performing architectures (15) ----------
{id:"m38",d:3,ch:10,q:"Five independent applications read from the same Kinesis data stream. Consumers are getting ReadProvisionedThroughputExceeded errors and lagging. Each application must receive records within about 70 ms, and the team does not want to change the number of shards. What should the solutions architect do?",
o:["Register each application as an enhanced fan-out consumer of the stream.","Increase the stream’s data retention period from 24 hours to 7 days.","Combine the five consumers into one application that writes to five SQS queues.","Switch the stream from provisioned capacity mode to on-demand capacity mode."],
a:[0],
w:["Each enhanced fan-out consumer gets dedicated 2 MB/s per shard via push, at around 70 ms latency.","Retention does not change read throughput.","This adds a hop and latency and creates a new bottleneck.","On-demand changes the shard count indirectly, and standard consumers still share each shard’s read limit."],
k:"Many consumers + low latency on one stream → enhanced fan-out."},

{id:"m39",d:3,ch:5,q:"Branch offices need SMB access to shared files with low-latency local access to recently used files. All data must be stored durably in Amazon S3 so it can also be processed with AWS analytics services. What should the solutions architect deploy in each office?",
o:["AWS Storage Gateway S3 File Gateway, with local cache and SMB shares backed by S3.","AWS Storage Gateway Volume Gateway in cached mode, presenting iSCSI volumes.","Amazon FSx for Windows File Server, accessed from each office over a VPN connection.","AWS DataSync agents that copy the office file servers to S3 every night."],
a:[0],
w:["File Gateway gives SMB/NFS shares with a local cache and stores files as native S3 objects.","iSCSI block volumes are not SMB file shares, and data is not stored as usable S3 objects.","There is no local cache, so every access crosses the WAN, and data is not in S3 as objects.","Nightly copies don’t give users a shared file system with fresh data."],
k:"On-prem file access + data lands in S3 as objects → S3 File Gateway."},

{id:"m40",d:3,ch:4,q:"A tightly coupled HPC simulation uses MPI and needs the lowest possible network latency and highest throughput between dozens of instances. What should the solutions architect do?",
o:["Launch the instances in a cluster placement group in a single AZ and attach Elastic Fabric Adapter interfaces.","Launch the instances in a spread placement group across several of the Region’s Availability Zones.","Launch the instances in a partition placement group with one instance in each partition.","Launch the instances in an Auto Scaling group that is spread evenly across three AZs."],
a:[0],
w:["Cluster placement packs instances close together, and EFA provides OS-bypass networking for MPI.","Spreading across hardware and AZs adds latency.","Partitions isolate hardware for distributed systems. They do not minimize latency.","Cross-AZ traffic adds latency and cost for tightly coupled workloads."],
k:"HPC, tightly coupled → cluster placement group (+ EFA)."},

{id:"m41",d:3,ch:5,q:"A mission-critical database on EC2 needs block storage with the highest durability offered, consistent sub-millisecond latency and very high sustained IOPS. Data must survive instance stops and restarts. Which storage should the solutions architect choose?",
o:["Amazon EBS Provisioned IOPS SSD (io2 Block Express) volumes.","Amazon EBS General Purpose SSD (gp3) with maximum IOPS set.","Amazon EBS Throughput Optimized HDD (st1) volumes striped in RAID 0.","Instance store NVMe volumes striped in RAID 0 across disks."],
a:[0],
w:["io2 offers 99.999% durability and is designed for consistent sub-millisecond latency at very high IOPS.","gp3 is cheaper and capable but has lower durability (99.8–99.9%) and a lower ceiling.","HDD volumes are built for throughput, not low-latency random IOPS.","Instance store data is lost when the instance stops."],
k:"Highest durability + sub-ms + high IOPS → io2 Block Express."},

{id:"m42",d:3,ch:5,q:"A log processing cluster reads and writes large files sequentially. Performance depends on MB/s throughput rather than IOPS, the data is accessed frequently and the company wants the lowest-cost EBS volume that meets this. Which volume type should the solutions architect use?",
o:["Throughput Optimized HDD (st1)","Cold HDD (sc1)","General Purpose SSD (gp3)","Provisioned IOPS SSD (io2)"],
a:[0],
w:["st1 is designed for frequently accessed, throughput-heavy sequential workloads at low cost.","sc1 is cheapest but meant for infrequently accessed data and has lower throughput.","gp3 works but costs more per GB for large sequential data.","io2 pays for IOPS that this workload does not need."],
k:"Big sequential, frequent → st1. Infrequent → sc1."},

{id:"m43",d:3,ch:6,q:"Readers must be able to search 5 million articles by keywords with relevance ranking, typo tolerance and filtering by section, with results returned in under 300 ms. Which solution should the solutions architect add?",
o:["Amazon OpenSearch Service, indexing articles through a change-driven pipeline.","Amazon RDS read replicas running SQL LIKE queries on the article title and body text columns.","A DynamoDB table with a global secondary index on a keyword attribute.","Amazon Athena queries over article JSON files stored in an S3 bucket."],
a:[0],
w:["OpenSearch is built for full-text search with relevance scoring, fuzzy matching and fast filtering.","LIKE queries are slow and offer no relevance ranking or typo tolerance.","GSIs support exact key lookups, not full-text search.","Athena is for batch analytics, with seconds of latency, not interactive search."],
k:"Full-text search → OpenSearch."},

{id:"m44",d:3,ch:6,q:"A DynamoDB table uses event_date as its partition key. During live events almost all writes go to today’s date, and requests are throttled even though the table’s total provisioned capacity is far from used. What should the solutions architect recommend?",
o:["Add a random or calculated suffix to the partition key to spread writes across many partitions.","Increase the table’s read capacity units so that reads no longer compete with the writes.","Add a DAX cluster in front of the table to absorb the write traffic during the busiest live events.","Switch the table to on-demand capacity mode so that the per-partition limits are removed."],
a:[0],
w:["Write sharding spreads a hot key over many partitions, using the table’s full capacity.","The problem is writes to a hot key, not reads.","DAX is a write-through cache. Writes still go to the same hot partition.","On-demand adapts table capacity, but each partition still has throughput limits."],
k:"Throttling with spare table capacity → hot partition → better key design / write sharding."},

{id:"m45",d:3,ch:6,q:"A product catalog uses ElastiCache in front of RDS. After a price update, customers sometimes see the old price for several minutes. The business requires cached prices to reflect updates immediately, and the catalog is read far more than it is written. Which caching strategy should be used?",
o:["Write-through, so the application updates the cache whenever it writes to the database.","Lazy loading with a longer TTL so that fewer cache misses ever reach the database during busy hours.","Lazy loading with a TTL of zero so that every read fetches the price from the database.","Memcached auto discovery so that clients always connect to the most current cache node."],
a:[0],
w:["Writing to the cache with every database write keeps cached data current.","A longer TTL makes stale data last even longer.","A zero TTL disables the cache, which defeats its purpose.","Node discovery has nothing to do with data freshness."],
k:"Cache must be fresh → write-through (often with TTL as a safety net)."},

{id:"m46",d:3,ch:8,q:"A personalized HTTP API runs in a single Region. Global users report high latency, mainly from TCP and TLS setup over long distances. Responses are user-specific and cannot be cached, and the company wants to apply AWS WAF and response compression at the edge. What should the solutions architect do?",
o:["Put CloudFront in front of the API with caching disabled, and attach AWS WAF to the distribution.","Deploy RDS cross-Region read replicas so that each Region can answer the API’s database queries locally.","Create Route 53 latency-based routing records for the API endpoint in its one current Region.","Enable S3 Transfer Acceleration on the bucket that stores the API’s response payloads."],
a:[0],
w:["Edge TLS termination and reused connections to the origin cut latency, and WAF and compression run at the edge.","The application tier is still in one Region, so this does not solve connection latency.","With only one Region, latency routing has nothing to choose between.","Transfer Acceleration is for S3 transfers, not an API."],
k:"Uncacheable dynamic HTTP + edge features → CloudFront with caching disabled."},

{id:"m47",d:3,ch:5,q:"Creators around the world upload video files of 2–10 GB to one S3 bucket in ap-south-1. Uploads from distant countries are slow and often fail partway through. Which TWO actions should the solutions architect take?",
o:["Use multipart upload so parts upload in parallel and failed parts can be retried alone.","Enable S3 Transfer Acceleration and have clients upload to the accelerated endpoint.","Store the video files in S3 Intelligent-Tiering so that hot objects are served faster.","Spread the uploads across many key prefixes to raise the bucket’s request-rate limit.","Enable Requester Pays on the bucket so creators’ clients receive dedicated bandwidth."],
a:[0,1],
w:["Parallel parts raise throughput, and failures only retry the affected part.","Edge locations and the AWS backbone speed up long-distance uploads.","Storage class does not affect upload speed.","Prefixes help request rates, not the speed of a single large transfer.","Requester Pays changes who is billed, not performance."],
k:"Large, distant uploads → multipart + Transfer Acceleration."},

{id:"m48",d:3,ch:4,q:"A latency-sensitive API on AWS Lambda has p99 latency spikes caused by cold starts. Traffic is predictable, with a steady baseline during business hours. What should the solutions architect configure?",
o:["Provisioned concurrency for the baseline, scheduled with Application Auto Scaling.","Reserved concurrency for the function set to the expected peak concurrency level.","A much longer function timeout so that slow cold starts no longer cause failures.","Function memory reduced to the minimum so that each execution environment starts faster."],
a:[0],
w:["Provisioned concurrency keeps environments initialized, and scheduling it matches business hours.","Reserved concurrency guarantees and caps capacity but does not pre-warm environments.","The timeout does not reduce latency.","Less memory also means less CPU, which usually makes startup slower."],
k:"Cold start latency → provisioned concurrency."},

{id:"m49",d:3,ch:6,q:"An Aurora PostgreSQL cluster has read traffic that varies widely through the day. The company wants read capacity to grow and shrink automatically while the application uses a single connection string for reads. What should the solutions architect configure?",
o:["Aurora Auto Scaling for Aurora Replicas, with the application reading from the reader endpoint.","A scheduled job that resizes the writer instance class up during the day and down at night.","A Multi-AZ DB cluster deployment with the application reading from its standby instances.","Amazon RDS Proxy in front of the writer instance to pool and reuse the application’s read connections."],
a:[0],
w:["Replicas are added and removed by policy, and the reader endpoint balances across whatever replicas exist.","This causes disruption, and a schedule cannot follow variable demand.","This is not the Aurora replica scaling mechanism, and it does not scale automatically.","Pooling does not add read capacity."],
k:"Elastic Aurora reads → Aurora Auto Scaling + reader endpoint."},

{id:"m50",d:3,ch:10,q:"Analysts run Athena queries on 50 TB of CSV clickstream files in S3. Most queries filter on a date range and select a few columns, but every query scans the full dataset and takes minutes. Which TWO actions will improve performance the most?",
o:["Convert the data to a compressed columnar format such as Apache Parquet.","Partition the data by date and include the partition column in query filters.","Increase the Athena workgroup’s data usage limit to allow larger query scans.","Move the files to S3 Standard-IA, which offers faster first-byte read latency.","Enable S3 Versioning on the bucket so that Athena reads only current versions."],
a:[0,1],
w:["Columnar formats read only the needed columns and compress well.","Partition pruning skips data outside the requested dates.","Usage limits cap scanning. They do not make queries faster.","Standard-IA is cheaper to store, not faster to read.","Versioning has no effect on query performance."],
k:"Athena speed and cost → Parquet + partitions."},

{id:"m51",d:3,ch:10,q:"A fraud team needs to compute rolling 5-minute aggregates over a stream of payment events and raise alerts within seconds, using SQL or Java with managed scaling and state. What should the solutions architect use?",
o:["Amazon Managed Service for Apache Flink reading directly from the Kinesis data stream.","Amazon Data Firehose with a transformation Lambda function that writes the results to S3.","Amazon Athena queries scheduled every 5 minutes on the events stored in S3.","AWS Glue batch ETL jobs triggered every 5 minutes by an EventBridge schedule."],
a:[0],
w:["Flink is built for stateful, windowed stream processing with second-level latency.","Firehose delivers and transforms records but does not do stateful windowed aggregation.","Scheduled batch queries add minutes of delay.","Batch jobs triggered on a schedule cannot alert within seconds."],
k:"Real-time windowed analytics on streams → Managed Service for Apache Flink."},

{id:"m52",d:3,ch:5,q:"An Amazon EFS file system serves a web fleet whose throughput needs are spiky and hard to predict. It frequently runs out of burst credits and slows down, and the team does not want to pay for a fixed high throughput level all the time. What should the solutions architect change?",
o:["Switch the file system to Elastic throughput mode.","Switch the file system to Provisioned throughput mode.","Move the files to an EBS gp3 volume shared by the fleet.","Copy files to EFS One Zone to raise the burst credit balance."],
a:[0],
w:["Elastic throughput scales automatically with the workload, and you pay for what you use.","This pays for fixed throughput even when idle.","An EBS volume cannot be shared across a multi-AZ fleet.","One Zone reduces cost and availability. It does not change throughput behavior."],
k:"Spiky, unpredictable EFS throughput → Elastic throughput."},

// ---------- Domain 4: Cost-optimized architectures (13) ----------
{id:"m53",d:4,ch:15,q:"Development and test environments run on 40 EC2 instances that are only used from 9 AM to 7 PM on weekdays. The instances are On-Demand and running around the clock. What is the MOST cost-effective change?",
o:["Use AWS Instance Scheduler to stop the instances outside working hours and over the weekends.","Buy 3-year All Upfront Standard Reserved Instances for all 40 of the instances currently in use.","Buy a 1-year Compute Savings Plan that covers all 40 instances running 24/7.","Move the instances to Dedicated Instances so that the hardware is not shared."],
a:[0],
w:["Running only 50 of 168 weekly hours cuts compute cost by about 70% with no commitment.","Reservations pay for 24/7 capacity that is used only about 30% of the time.","A commitment based on 24/7 usage pays for idle hours.","Dedicated Instances cost more."],
k:"Used only part-time → stop it; don’t commit to it."},

{id:"m54",d:4,ch:15,q:"A stateless web tier needs 10 instances at all times and bursts unpredictably to 40 for short periods. It is fault tolerant, and the company wants the lowest cost without risking the baseline. Which approach should the solutions architect recommend?",
o:["Cover the baseline with a Savings Plan and use a mixed instances policy that adds Spot for bursts.","Run all 40 instances On-Demand at all times so that burst capacity is always ready to use.","Buy Reserved Instances for 40 instances so that peak capacity is always discounted.","Run all capacity, including the 10-instance baseline, as Spot across many instance types."],
a:[0],
w:["Committed pricing for the steady part and Spot for interruptible bursts gives the lowest cost while protecting the baseline.","Paying for idle peak capacity is the most expensive option.","Reserving peak capacity pays for 30 instances that sit idle most of the time.","A Spot interruption could remove the baseline, which risks availability."],
k:"Baseline → commitment. Bursts → Spot/On-Demand."},

{id:"m55",d:4,ch:2,q:"Private subnet instances write about 30 TB a month to a DynamoDB table in the same Region through a NAT gateway. What is the MOST cost-effective way to cut the associated costs?",
o:["Add a DynamoDB gateway VPC endpoint to the route tables of the private subnets.","Add a DynamoDB interface VPC endpoint to every Availability Zone in the VPC.","Move the instances to public subnets and route traffic through the internet gateway.","Replace the NAT gateway with a NAT instance on a small burstable instance type."],
a:[0],
w:["Gateway endpoints for DynamoDB have no charge and remove NAT data processing fees.","This removes NAT charges but adds endpoint hourly and per-GB fees.","This weakens security by exposing instances.","A NAT instance is a self-managed single point of failure, and the traffic still flows through it."],
k:"DynamoDB/S3 via NAT → gateway endpoint."},

{id:"m56",d:4,ch:15,q:"A company runs hundreds of x86 Lambda functions with memory set to 3,008 MB “to be safe.” Most functions are CPU-light and finish quickly. Which approach reduces cost the MOST with little risk?",
o:["Move compatible functions to the arm64 architecture and right-size memory using measured profiles.","Enable provisioned concurrency on every function so that invocations always run warm.","Increase each function’s timeout so that functions are retried less often after transient failures.","Rewrite the functions as long-running services on EC2 instances that run all the time."],
a:[0],
w:["Graviton costs less per GB-second, and memory matched to measured needs removes waste.","Provisioned concurrency adds cost.","Timeouts do not reduce the cost of successful invocations.","Always-on instances usually cost more for short, bursty functions, and add operational work."],
k:"Lambda cost → right-size memory + arm64."},

{id:"m57",d:4,ch:5,q:"A company has hundreds of EBS gp2 volumes attached to running instances. It wants to reduce storage cost without downtime while keeping or improving performance. What should the solutions architect do?",
o:["Use Elastic Volumes to modify the volumes to gp3, setting IOPS and throughput as needed.","Take snapshots, then restore them as new io2 volumes and swap them in for each instance.","Change the volumes to st1, which offers the lowest cost per GB of any EBS volume type.","Detach the volumes and recreate them as gp3 volumes during a scheduled maintenance window."],
a:[0],
w:["Elastic Volumes changes type while volumes stay attached, and gp3 is about 20% cheaper with independent performance settings.","io2 costs more, and swapping volumes causes downtime.","HDD volumes cannot be boot volumes and perform poorly for random I/O.","This causes avoidable downtime."],
k:"gp2 → gp3 in place, no downtime."},

{id:"m58",d:4,ch:15,q:"A company sends about 200 TB per month from AWS back to its on-premises data center, steadily, every month. Data transfer out is a major cost. What should the solutions architect recommend?",
o:["Use AWS Direct Connect, which has lower data transfer out rates than the internet.","Use an AWS Site-to-Site VPN connection, which encrypts all of the data sent to the data center.","Use monthly AWS Snowball Edge export jobs to send the data back on devices.","Use S3 Transfer Acceleration for the downloads from S3 to the data center."],
a:[0],
w:["For large steady volumes, Direct Connect’s lower per-GB rate outweighs its port fees.","VPN traffic is billed at normal internet data transfer out rates.","Monthly device shipping adds handling time and operational effort for a steady flow.","Acceleration adds cost on top of normal transfer charges."],
k:"Large steady egress to on-prem → Direct Connect."},

{id:"m59",d:4,ch:15,q:"Finance wants to see monthly AWS spend broken down by team and to be alerted when any team is forecast to go over its budget. Resources are already tagged with a team key. Which TWO actions should the solutions architect take?",
o:["Activate the team tag as a cost allocation tag in the Billing console.","Create AWS Budgets filtered by the team tag, with forecast-based alerts.","Enable AWS Trusted Advisor cost checks for each of the team accounts.","Create a CloudTrail trail to record each team’s resource creation calls.","Run AWS Compute Optimizer to produce rightsizing reports for every team."],
a:[0,1],
w:["Tags appear in cost reports and Cost Explorer only after activation.","Budgets can filter by tag and alert on forecast spend.","These are optimization suggestions, not spend attribution or alerts.","API logs do not show costs.","Rightsizing recommendations are not budget tracking."],
k:"Cost by team → activate cost allocation tags + Budgets."},

{id:"m60",d:4,ch:5,q:"A firm must keep compliance records for 10 years. They are almost never read, and when an audit requests them, a retrieval within 48 hours is acceptable. What is the MOST cost-effective storage?",
o:["S3 Glacier Deep Archive","S3 Glacier Flexible Retrieval","S3 Glacier Instant Retrieval","S3 Standard-Infrequent Access"],
a:[0],
w:["The lowest storage price, with retrieval within 12 hours (standard) or 48 hours (bulk).","It works but costs more to store than Deep Archive.","Millisecond retrieval is not needed, and storage costs more.","This class is far more expensive for archival data."],
k:"Rarely accessed + 12–48 hour retrieval OK → Deep Archive."},

{id:"m61",d:4,ch:9,q:"CloudWatch Logs storage costs keep growing. Application logs are only searched during the first 30 days, but compliance requires keeping them for 1 year at the lowest cost. What should the solutions architect do?",
o:["Set a 30-day log group retention, and stream logs to S3 with a lifecycle rule to archival classes.","Keep the default “never expire” retention and switch the log groups to the Infrequent Access log class later.","Set a 365-day retention on every log group and query them with CloudWatch Logs Insights.","Delete the log groups every month and recreate them so that the storage is reset to zero."],
a:[0],
w:["Logs stay searchable for the first 30 days, and long-term storage in S3 archival tiers is far cheaper.","Never-expire keeps growing indefinitely, and keeping a year in CloudWatch costs more than S3.","CloudWatch storage for a year is pricier than S3 archival storage.","This deletes data that compliance requires."],
k:"Logs: short retention in CloudWatch, long-term in S3."},

{id:"m62",d:4,ch:4,q:"A company runs nightly containerized data-cleaning tasks on Amazon ECS with Fargate. Tasks are idempotent, can restart if interrupted and are not time-critical. What should the solutions architect do to cut cost the MOST?",
o:["Use the FARGATE_SPOT capacity provider for these tasks.","Buy a Compute Savings Plan sized to cover all of the nightly tasks.","Move the tasks to EC2 instances on Dedicated Hosts.","Move the tasks to Lambda with the maximum memory."],
a:[0],
w:["Fargate Spot gives large discounts for interruptible tasks.","A Savings Plan gives a smaller discount and needs a commitment.","Dedicated Hosts are the most expensive option.","Maximum memory raises cost, and Lambda has a 15-minute limit."],
k:"Interruptible containers → Fargate Spot."},

{id:"m63",d:4,ch:6,q:"A DynamoDB table has steady, predictable traffic that rises gradually during the day and falls at night, with no sudden spikes. It currently uses on-demand capacity mode. What is the MOST cost-effective change?",
o:["Switch to provisioned capacity with auto scaling, and add reserved capacity for the baseline.","Keep on-demand capacity mode and add a DynamoDB Accelerator cluster in front to cut the request charges.","Keep on-demand capacity mode and convert the table into a DynamoDB global table.","Switch to provisioned capacity sized for peak traffic, without auto scaling enabled."],
a:[0],
w:["For predictable traffic, provisioned capacity with auto scaling and reservations costs far less than on-demand.","DAX adds node costs and helps reads only.","Global tables add replication cost.","Sizing for peak all the time wastes capacity at night."],
k:"Predictable traffic → provisioned + auto scaling. Unpredictable → on-demand."},

{id:"m64",d:4,ch:15,q:"A cost review shows that most production EC2 instances average under 10% CPU and 20% memory use over the last month. What should the solutions architect do FIRST?",
o:["Use AWS Compute Optimizer recommendations to downsize the over-provisioned instances.","Buy Reserved Instances for the current instance sizes to lock in a lower hourly rate.","Move all production instances to Spot Instances to get the largest possible discount.","Move the instances to Dedicated Hosts so that they share one licensed physical server."],
a:[0],
w:["Right-sizing first removes waste. Commitments should be bought for the right-sized footprint afterwards.","Committing first locks in oversized instances for years.","Production workloads may not tolerate interruptions.","Dedicated Hosts raise cost unless needed for licensing."],
k:"Order of operations: right-size → then commit."},

{id:"m65",d:4,ch:5,q:"A media app stores original images in S3 Standard and keeps resized thumbnails that can be regenerated from the originals at any time. Thumbnails are read occasionally and must load in milliseconds. Losing them in an AZ failure is acceptable. Which storage class is MOST cost-effective for the thumbnails?",
o:["S3 One Zone-Infrequent Access","S3 Standard-Infrequent Access","S3 Glacier Instant Retrieval","S3 Intelligent-Tiering"],
a:[0],
w:["Reproducible, infrequently accessed data that can tolerate an AZ loss fits One Zone-IA at the lowest price for millisecond access.","Pays for multi-AZ resilience the data does not need.","Higher retrieval cost for occasional reads, and resilience the data does not need.","Charges a monitoring fee per object and keeps data in multiple AZs."],
k:"Reproducible + infrequent → One Zone-IA."}
];

<script>
(function(){
"use strict";
const DOMAINS={1:{name:"Design Secure Architectures",short:"Secure",w:30},2:{name:"Design Resilient Architectures",short:"Resilient",w:26},3:{name:"Design High-Performing Architectures",short:"High-performing",w:24},4:{name:"Design Cost-Optimized Architectures",short:"Cost-optimized",w:20}};
const DCOL=d=>`var(--d${d})`;
const L=LESSONS, LBY={}; L.forEach((l,i)=>{l.i=i;LBY[l.id]=l;});
const ALLQ={}; PRACTICE.forEach(q=>ALLQ[q.id]=q); MOCK1.forEach(q=>ALLQ[q.id]=q);
const PASS=720, MOCK_MIN=130, AWS_URL="https://aws.amazon.com/certification/certified-solutions-architect-associate/";
const NUMW=["","ONE","TWO","THREE","FOUR"];

/* ---------- storage ---------- */
const KEY="saa-path-v1";
let S={done:{},prac:{},diag:null,attempts:[],run:null};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- utils ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const perm=n=>shuffle([...Array(n).keys()]);

/* ---------- question rendering ---------- */
const ORD={}; // qid -> option order for instant mode
function optOrder(q,fixed){ if(fixed) return fixed; if(!ORD[q.id]) ORD[q.id]=perm(q.o.length); return ORD[q.id]; }
function qHTML(q,o){
  // o: {order, sel:[orig idx], reveal:bool, num, total, mode:'instant'|'exam'|'review', flagged}
  const multi=q.a.length>1, ord=o.order, sel=o.sel||[];
  const opts=ord.map((oi,pos)=>{
    const isSel=sel.includes(oi), isAns=q.a.includes(oi);
    let cls="opt"+(multi?" multi":"");
    if(o.reveal){ if(isAns) cls+=" right"; else if(isSel) cls+=" wrong"; }
    const why=o.reveal?`<span class="why"><b>${isAns?"Correct.":"Incorrect."}</b> ${esc(q.w[oi])}</span>`:"";
    return `<button type="button" class="${cls}" role="${multi?"checkbox":"radio"}" aria-checked="${isSel}" data-oi="${oi}" ${o.reveal?"disabled":""}><span class="ltr">${"ABCDE"[pos]}</span><span>${esc(q.o[oi])}${why}</span></button>`;
  }).join("");
  const meta=`<div class="qmeta">${o.num?`<span class="mono">Question ${o.num}${o.total?" of "+o.total:""}</span>`:""}${o.showDomain!==false?dtag(q.d):""}${o.flagged?'<span style="color:var(--amber)">Flagged</span>':""}</div>`;
  let after="";
  if(o.reveal){
    const ok=same(sel,q.a);
    if(o.mode!=="review") after+=`<div class="verdict ${ok?"ok":"bad"}">${ok?"Correct":sel.length?"Not quite":"Not answered"}</div>`;
    else after+=`<div class="verdict ${ok?"ok":"bad"}">${ok?"You answered correctly":sel.length?"You answered incorrectly":"You did not answer"}</div>`;
    after+=`<div class="reflex"><b>Exam reflex:</b> ${esc(q.k)}</div>`;
  }
  return `<div class="qcard" data-qid="${q.id}">${meta}<p class="qtext">${esc(q.q)}</p>${multi?`<p class="qsel">Select ${NUMW[q.a.length]}.</p>`:'<div style="height:12px"></div>'}<div class="opts" role="${multi?"group":"radiogroup"}" aria-label="Answer options">${opts}</div>${o.reveal?`<div style="margin-top:16px">${after}</div>`:""}${o.actions?`<div class="qact">${o.actions}</div>`:""}</div>`;
}
function toggleSel(q,sel,oi){
  sel=sel.slice();
  if(q.a.length>1){ const i=sel.indexOf(oi); if(i>=0) sel.splice(i,1); else { if(sel.length>=q.a.length) sel.shift(); sel.push(oi);} }
  else sel=[oi];
  return sel;
}

/* ---------- instant-check question widget (lessons, practice) ---------- */
function mountInstant(container,q,opts){
  let sel=[], revealed=false; const ord=optOrder(q);
  const draw=()=>{
    const need=q.a.length;
    const actions=revealed
      ? (opts.next?`<button class="btn primary" data-act="next">${opts.nextLabel||"Next question"}</button>`:"")
      : `<button class="btn primary" data-act="check" ${sel.length===need?"":"disabled"}>Check answer</button>${need>1?`<span class="muted" style="font-size:14px">${sel.length} of ${need} selected</span>`:""}`;
    container.innerHTML=qHTML(q,{order:ord,sel,reveal:revealed,num:opts.num,total:opts.total,mode:"instant",actions});
  };
  container.addEventListener("click",e=>{
    const b=e.target.closest(".opt"); if(b&&!revealed){ sel=toggleSel(q,sel,+b.dataset.oi); draw(); const nb=container.querySelector(`.opt[data-oi="${b.dataset.oi}"]`); nb&&nb.focus(); return; }
    const a=e.target.closest("[data-act]"); if(!a) return;
    if(a.dataset.act==="check"){ revealed=true; S.prac[q.id]={c:same(sel,q.a),t:Date.now()}; save(); draw(); opts.onCheck&&opts.onCheck(same(sel,q.a)); }
    if(a.dataset.act==="next"){ opts.next(); }
  });
  container._key=k=>{
    if(!revealed){ const n="12345".indexOf(k)>=0?"12345".indexOf(k):"abcde".indexOf(k.toLowerCase()); if(n>=0&&n<ord.length){ sel=toggleSel(q,sel,ord[n]); draw(); return true;} if(k==="Enter"&&sel.length===q.a.length){ revealed=true; S.prac[q.id]={c:same(sel,q.a),t:Date.now()}; save(); draw(); opts.onCheck&&opts.onCheck(same(sel,q.a)); return true;} }
    else if(k==="Enter"&&opts.next){ opts.next(); return true; }
    return false;
  };
  draw();
}

  const wrongN=items.filter(x=>!x.ok).length, flN=items.filter(x=>x.fl).length;
  const weak=[1,2,3,4].filter(d=>a.by[d].c/a.by[d].t<.7).sort((x,y)=>a.by[x].c/a.by[x].t-a.by[y].c/a.by[y].t).slice(0,2);
  return chrome("mock",`<div class="wrap"><div class="phead"><div class="crumb"><a href="#mock">SAA-C03 / Mock exam</a> / <b>Result</b></div><h1>${a.pass?"You passed this mock":"Not a pass yet"}</h1><p>${a.timeout?"Time ran out and the exam was submitted automatically. ":""}${a.pass?(a.scaled>=800?"A comfortable margin. Review your misses, and you’re in good shape to book.":"You cleared the bar, but the margin is thin. Review every miss and retake before booking."):"Use the domain report to pick what to study, review each miss below, then retake."}</p></div>
  <div class="score"><div><div class="big">${a.scaled}<small> / 1,000</small></div><div style="margin-top:8px"><span class="pill ${a.pass?"ok":"bad"}">${a.pass?"Pass":"Fail"}</span> <span class="muted" style="font-size:14px;margin-left:6px">${a.c} of ${a.t} correct · ${fmtT(a.used)} used</span></div></div>
   <div><div class="scale"><i style="width:${pct}%;background:${a.pass?"var(--ok)":"var(--bad)"}"></i><span class="pm" style="left:${pm}%" title="Pass mark 720"></span></div><div class="scale-l"><span style="left:0">100</span><span style="left:${pm}%;transform:translateX(-50%)">720 to pass</span><span style="right:0">1,000</span></div></div></div>
  <h2 style="font-size:22px;margin:40px 0 6px">Domain report</h2><p class="muted" style="margin:0 0 16px">Like the real score report: 70% or more in a domain meets competencies.</p>
  <div class="panel"><div class="dbars">${[1,2,3,4].map(d=>{const p=a.by[d].c/a.by[d].t;return `<div class="dbar"><div class="lb"><span>${DOMAINS[d].name} <span class="pill ${p>=.7?"ok":"bad"}" style="margin-left:6px">${p>=.7?"Meets competencies":"Needs improvement"}</span></span><span>${a.by[d].c} / ${a.by[d].t}</span></div><div class="bar"><i style="width:${p*100}%;background:${DCOL(d)}"></i></div></div>`;}).join("")}</div>
  ${weak.length?`<p style="margin:20px 0 0;font-size:15px">Study next, starting with your weakest ${weak.length>1?"domains":"domain"}: ${L.filter(l=>weak.includes(l.d)&&l.ch).map(l=>`<a href="#learn-${l.id}">Ch ${l.ch}</a>`).join(", ")}, then <a href="#practice">drill those domains</a>.</p>`:""}</div>
  <h2 style="font-size:22px;margin:40px 0 14px">Review answers</h2>
  <div class="toolbar"><button class="chip" aria-pressed="${RF==="all"}" data-rf="all">All ${items.length}</button><button class="chip" aria-pressed="${RF==="wrong"}" data-rf="wrong">Incorrect ${wrongN}</button><button class="chip" aria-pressed="${RF==="flag"}" data-rf="flag">Flagged ${flN}</button></div>
  <div class="rv">${shown.length?shown.map(x=>`<details><summary><span class="n">${x.k+1}</span><span class="q">${esc(x.q.q)}</span><span class="pill ${x.ok?"ok":"bad"}">${x.ok?"Correct":x.sel.length?"Incorrect":"Unanswered"}</span></summary>${qHTML(x.q,{order:a.opt[x.id],sel:x.sel,reveal:true,mode:"review",flagged:x.fl})}</details>`).join(""):`<div class="empty">Nothing in this filter.</div>`}</div>
  <div class="qact" style="margin-top:28px"><a class="btn primary" href="#mock">Back to mock exam</a></div></div>`);
}
function afterResult(){ $$("[data-rf]").forEach(b=>b.addEventListener("click",()=>{RF=b.dataset.rf;render(true);})); }

/* ---------- router ---------- */
let cleanup=[];
function render(keepScroll){
  cleanup.forEach(f=>f()); cleanup=[];
  const h=decodeURIComponent(location.hash.slice(1));
  const y=window.scrollY;
  let html, after=()=>{};
  if(h===""||h==="home"){html=vHome();}
  else if(h==="learn"){html=vLearn();}
  else if(h.startsWith("learn-")){const id=h.slice(6); html=vLesson(id); after=()=>afterLesson(id);}
  else if(h==="diagnostic"){html=vDiag(); after=afterDiag;}
  else if(h==="practice"){html=vPractice(); after=afterPractice;}
  else if(h==="mock"){html=vMock(); after=afterMock;}
  else if(h==="exam"){ if(S.run){html=vExam(); after=afterExam;} else {html=vMock(); after=afterMock;} }
  else if(h.startsWith("result-")){RF=RF||"all"; html=vResult(+h.slice(7)); after=afterResult;}
  else {html=vHome();}
  $("#app").innerHTML=html; after();
  window.scrollTo(0,keepScroll?y:0);
  const t=$("h1"); document.title=(t&&h?t.textContent.trim()+" — ":"")+"SAA-C03 Path";
}
let lastHash=null;
window.addEventListener("hashchange",()=>{ const h=location.hash; if(!h.startsWith("#result-")) RF="all"; if(h==="#diagnostic"&&DG&&DG.done) {} render(); lastHash=h; });
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return; const tg=e.target.tagName; if(tg==="INPUT"||tg==="TEXTAREA") return;
  if(document.querySelector("dialog[open]")) return;
  const host=$("#eq")||$("#pq")||$("#dq");
  if(host&&host._key&&host._key(e.key)){e.preventDefault();return;}
  if($("#eq")){ if(e.key==="ArrowRight"){const b=$('[data-act="next"]');b&&b.click();} if(e.key==="ArrowLeft"){const b=$('[data-act="prev"]');b&&b.click();} if(e.key==="f"||e.key==="F"){const b=$('[data-act="flag"]');b&&b.click();} }
});
document.addEventListener("click",e=>{const d=document.querySelector(".certsw[open]");if(d&&!d.contains(e.target))d.removeAttribute("open");});
(function(){try{const t=localStorage.getItem("saa-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}})();
document.addEventListener("click",e=>{
  const t=e.target.closest('[data-act="theme"]');
  if(t){const r=document.documentElement;const cur=r.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");const nx=cur==="dark"?"light":"dark";r.dataset.theme=nx;try{localStorage.setItem("saa-theme",nx);}catch(_){}}
  const sb=e.target.closest('[data-act="sb"]'); if(sb){SBC=!SBC;const sh=$(".shell");sh&&sh.classList.toggle("collapsed",SBC);sb.setAttribute("aria-label",(SBC?"Show":"Hide")+" curriculum");}
});
render();
})();
</script>
