pillars. You answer questions, and it shows risks and suggests improvements.</li><li><strong>Use it when:</strong> you want a structured review of how well an application follows AWS best practices.</li><li><strong>Remember for the exam:</strong> the framework is the guidance (the pillars); the <strong>Tool</strong> is the service that reviews your workload against it. It does not fix things automatically.</li></ul><h3 id=\"s-cloud-economics\">Cloud economics</h3><p>Meera's finance team will ask for numbers. Three ideas matter.</p><ul><li><strong>Total Cost of Ownership (TCO):</strong> <ul><li><strong>What it is:</strong> the full cost of running something, including hardware, space, power, staff and maintenance, not just the purchase price.</li><li><strong>Use it when:</strong> comparing on-premises to AWS fairly. The <strong>AWS Pricing Calculator</strong> estimates AWS costs, and migration planning tools help build the comparison.</li><li><strong>Remember for the exam:</strong> on-premises often hides costs such as electricity, cooling, real estate and IT labor.</li></ul></li><li><strong>Rightsizing:</strong> <ul><li><strong>What it is:</strong> matching the size of a resource to what the workload really needs, so you are not paying for a giant machine that sits idle.</li><li><strong>Use it when:</strong> usage data shows resources are mostly idle.</li><li><strong>Remember for the exam:</strong> rightsizing is a cost-optimization habit you repeat over time. <strong>AWS Cost Explorer</strong> shows spend patterns, and <strong>AWS Compute Optimizer</strong> recommends better-sized resources.</li></ul></li><li><strong>Managed services:</strong> <ul><li><strong>What it is:</strong> services where AWS handles setup, patching, backups and scaling for you.</li><li><strong>Use it when:</strong> you want your team spending time on the product, not on maintenance.</li><li><strong>Remember for the exam:</strong> managed services reduce operational effort and often total cost, because you avoid administration labor.</li></ul></li></ul><blockquote class=\"tip\">Cost-saving ideas the exam likes: pay only for what you use, scale down when idle, rightsize, use managed services, and compare using TCO rather than just sticker price.</blockquote><h3 id=\"s-traps\">Common traps</h3><ul><li>Confusing the <strong>Well-Architected Framework</strong> (guidance) with the <strong>Tool</strong> (review service).</li><li>Counting only hardware price in an on-premises comparison and forgetting power, space and staff. That ignores TCO.</li><li>Mixing <strong>reliability</strong> (recover from failure) with <strong>performance efficiency</strong> (use resources well).</li><li>Forgetting that <strong>sustainability</strong> is a pillar. It is the newest and easy to overlook.</li><li>Assuming rightsizing is a one-time action. It is ongoing.</li><li>Thinking Well-Architected is a certification or a pass/fail test. It is a review that produces improvement suggestions.</li></ul><h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>If the question says...                                -&gt; pick\nAutomate, monitor, improve operations, runbooks        -&gt; Operational excellence\nProtect data, least privilege, traceability            -&gt; Security\nRecover from failure, meet demand, test recovery       -&gt; Reliability\nChoose right resource types, experiment, go global     -&gt; Performance efficiency\nAvoid unneeded spend, measure and analyze spend        -&gt; Cost optimization\nReduce environmental impact, maximize utilization      -&gt; Sustainability\nReview my workload against best practices (a service)  -&gt; Well-Architected Tool\nInclude power, space, staff when comparing costs       -&gt; TCO\nResource is too big for what it does                   -&gt; Rightsizing\nAWS handles patching, backups, scaling for me          -&gt; Managed services</code></pre>", "toc": [{"id": "six-pillars", "text": "The six Well-Architected pillars"}, {"id": "design-principles", "text": "Design principles in the cloud"}, {"id": "well-architected-tool", "text": "AWS Well-Architected Tool"}, {"id": "cloud-economics", "text": "Cloud economics"}, {"id": "traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch3", "ch": 3, "title": "Chapter 3: Moving in (Cloud adoption and migration)", "short": "Move it, rebuild it, or toss it?", "topic": "Cloud Adoption Framework and migration strategies", "d": 1, "focus": false, "mins": 7, "html": "<p>Meera's board loves the plan, but PulseWire still runs an old video-processing system in a rented rack across town. &quot;We pay for it every month and it is slow,&quot; she says. &quot;Can we just move it?&quot;</p><p>Kabir winces. &quot;Move it how? Copy it, rebuild it, or throw it away?&quot; That is precisely the right question. AWS offers a framework for organizing the whole change and a menu of seven strategies for each application.</p><h3 id=\"s-adoption-framework\">AWS Cloud Adoption Framework (CAF)</h3><p>Moving to the cloud is not just a technical project. People, rules and money change too. The <strong>AWS Cloud Adoption Framework</strong> organizes that change into six <strong>perspectives</strong>, each owned by different roles.</p><div class=\"tw\"><table><thead><tr><th>Perspective</th><th>Focus</th><th>Typical stakeholders</th></tr></thead><tbody><tr><td>Business</td><td>Make sure cloud investments serve business outcomes</td><td>Executives, finance, strategy</td></tr><tr><td>People</td><td>Training, culture, hiring, organizational change</td><td>HR, team leaders</td></tr><tr><td>Governance</td><td>Manage risk, compliance, and cost control</td><td>CIO, program managers, finance</td></tr><tr><td>Platform</td><td>Build and run the technical environment and architecture</td><td>CTO, engineers, architects</td></tr><tr><td>Security</td><td>Protect data, identities and workloads</td><td>CISO, security teams</td></tr><tr><td>Operations</td><td>Run, monitor and keep workloads healthy</td><td>Operations and support teams</td></tr></tbody></table></div><ul><li><strong>Remember for the exam:</strong> the six perspectives are Business, People, Governance, Platform, Security, Operations. Business, People and Governance are the &quot;business&quot; side; Platform, Security and Operations are the &quot;technical&quot; side.</li><li>If a question is about training staff or changing culture, think <strong>People</strong>. If it is about audits and risk, think <strong>Governance</strong>.</li></ul><h3 id=\"s-seven-rs\">The 7 Rs of migration</h3><p>Each application can take a different path. Learn the seven names and what each means in one line.</p><div class=\"tw\"><table><thead><tr><th>Strategy</th><th>Plain meaning</th><th>Example</th></tr></thead><tbody><tr><td>Retire</td><td>Switch it off. Nobody needs it</td><td>An old reporting tool nobody opens</td></tr><tr><td>Retain</td><td>Keep it where it is, for now</td><td>A system tied to special hardware, or recently upgraded</td></tr><tr><td>Rehost (lift and shift)</td><td>Move as-is to AWS servers, no changes</td><td>Copy the video system onto EC2 machines</td></tr><tr><td>Relocate</td><td>Move to the cloud version of the same platform without changes</td><td>Move VMware servers to VMware Cloud on AWS</td></tr><tr><td>Repurchase (drop and shop)</td><td>Replace with a different product, often SaaS</td><td>Swap a self-run CRM for a SaaS CRM</td></tr><tr><td>Replatform (lift, tinker and shift)</td><td>Move with small improvements, keep core design</td><td>Move a self-run database to a managed database service</td></tr><tr><td>Refactor (re-architect)</td><td>Redesign to use cloud-native features</td><td>Rebuild the app using serverless pieces</td></tr></tbody></table></div><p>A simple way to order them by effort: retire and retain are the least work, rehost and relocate are quick moves, repurchase and replatform take some change, and refactor takes the most work but may yield the most long-term benefit.</p><blockquote class=\"voice\"><span class=\"who\">Kabir</span>So &quot;just move it&quot; is only one of seven answers. And one answer is &quot;don't.&quot;</blockquote><h3 id=\"s-migration-tools\">Migration tools (mention level)</h3><p>You only need to recognize what each one does.</p><ul><li><strong>AWS Migration Hub:</strong> a single place to track the progress of migrations across tools.</li><li><strong>AWS Application Migration Service (MGN):</strong> the main service for lift-and-shift (rehost) of servers to AWS.</li><li><strong>AWS Database Migration Service (DMS):</strong> moves databases to AWS with little downtime, and can also convert between different database types (together with the Schema Conversion Tool).</li><li><strong>AWS Snow Family (for example, Snowball Edge):</strong> physical devices shipped to you for moving very large amounts of data when the network is too slow, or for computing at the edge.</li></ul><p>Think about how PulseWire would use them together. Kabir uses Application Migration Service to copy the old video servers to AWS while they keep running. The article database moves with DMS, so readers see little or no downtime. A few hundred terabytes of old video archives are too large to upload over the office internet comfortably, so a Snow Family device is shipped, loaded, and returned. Migration Hub gives Meera one dashboard to watch it all.</p><p><strong>Remember for the exam:</strong> servers = Application Migration Service; databases = DMS; huge data offline = Snow Family; tracking = Migration Hub.</p><h3 id=\"s-benefits\">Benefits of migrating</h3><p>Meera will want the payoff in plain words. The exam groups the benefits roughly like this:</p><ul><li><strong>Cost savings:</strong> no data center to run, and pay-as-you-go.</li><li><strong>Agility and speed:</strong> new resources in minutes.</li><li><strong>Resilience:</strong> build systems that survive failures.</li><li><strong>Staff productivity:</strong> less time on maintenance, more on features.</li><li><strong>Operational efficiency and modernization:</strong> use managed services and newer technology.</li><li><strong>Business agility:</strong> reach new markets and respond to change sooner.</li></ul><p>One honest point for Meera: migration does not make everything cheaper overnight. Savings usually come from paying for actual use, retiring unused systems, and rightsizing after the move. Many companies move first (rehost), then improve later (replatform or refactor) once the workload is stable in AWS. This staged approach lowers risk because each step is small and reversible.</p><blockquote class=\"tip\">When a question asks for the fastest, lowest-effort way to move to AWS with no code changes, the answer is rehost. When it asks for the most long-term cloud benefit, the answer is refactor.</blockquote><h3 id=\"s-traps\">Common traps</h3><ul><li>Mixing up <strong>Rehost</strong> (no change) and <strong>Replatform</strong> (small tweaks for benefit).</li><li>Mixing up <strong>Replatform</strong> and <strong>Refactor</strong>. Refactor changes the architecture, replatform does not.</li><li>Forgetting <strong>Retire</strong> and <strong>Retain</strong> are real strategies. Not everything moves.</li><li>Choosing <strong>Repurchase</strong> when the company keeps its own software. Repurchase means buying a different product.</li><li>Confusing <strong>Application Migration Service</strong> (servers) with <strong>DMS</strong> (databases).</li><li>Treating the CAF as a technical tool. It is a planning framework, not a service.</li></ul><h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>If the question says...                                  -&gt; pick\nNobody uses it anymore, switch it off                    -&gt; Retire\nKeep it on-premises for now                              -&gt; Retain\nMove as-is, no changes (lift and shift)                  -&gt; Rehost\nMove VMware workloads without changing them              -&gt; Relocate\nReplace with SaaS / drop and shop                        -&gt; Repurchase\nSmall tweaks, e.g. to a managed database                 -&gt; Replatform\nRedesign to be cloud-native                              -&gt; Refactor\nTraining staff, culture change                           -&gt; CAF People perspective\nAudit, risk, compliance planning                         -&gt; CAF Governance perspective\nMove servers to AWS                                      -&gt; Application Migration Service\nMove a database with minimal downtime                    -&gt; DMS\nTruckloads of data, slow network                         -&gt; Snow Family</code></pre>", "toc": [{"id": "adoption-framework", "text": "AWS Cloud Adoption Framework (CAF)"}, {"id": "seven-rs", "text": "The 7 Rs of migration"}, {"id": "migration-tools", "text": "Migration tools (mention level)"}, {"id": "benefits", "text": "Benefits of migrating"}, {"id": "traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch4", "ch": 4, "title": "Chapter 4: Who is responsible for what? (Shared responsibility and IAM)", "short": "Who is responsible for what?", "topic": "Shared responsibility and IAM", "d": 2, "focus": true, "mins": 7, "html": "<p>On your first Monday as PulseWire's cloud lead, Meera drops by with a worried look. \"A customer asked who is responsible if our data leaks. Is that us or Amazon? We must pass the audit next quarter, so I need a clear answer.\"</p><p>Kabir leans in. \"Why can't we just give everyone admin access so nobody gets blocked?\" Both questions land on the same exam domain: who owns which security job, and who is allowed to do what.</p><h3 id=\"s-shared-responsibility\">Shared responsibility model</h3><p>Think of renting an office in a secure building. The landlord guards the lobby, the elevators and the building walls. You decide who gets a key to your suite and what you leave on your desk. AWS works the same way.</p><ul><li><strong>Security OF the cloud</strong> is AWS: data centers, hardware, networking, and the software that runs the core services.</li><li><strong>Security IN the cloud</strong> is you: your data, who can access it, how it is encrypted, and how your guest systems are configured.</li></ul><p>The more managed the service, the more AWS takes on. Compare four common ones.</p><div class=\"tw\"><table><thead><tr><th>Service</th><th>AWS handles</th><th>You handle</th></tr></thead><tbody><tr><td>Amazon EC2 (virtual servers)</td><td>Physical hosts, hypervisor, data centers</td><td>Guest operating system, patching, applications, security groups, data, IAM</td></tr><tr><td>Amazon RDS (managed database)</td><td>Hardware, OS and database engine patching, backups tooling</td><td>Who can connect, data in the database, encryption settings, network rules</td></tr><tr><td>Amazon S3 (storage)</td><td>Durable storage infrastructure, the service itself</td><td>Bucket permissions, encryption choices, what you upload, versioning and lifecycle settings</td></tr><tr><td>AWS Lambda (serverless code)</td><td>Servers, OS, runtime patching, scaling</td><td>Your code, its permissions (IAM role), the data it touches</td></tr></tbody></table></div><blockquote class=\"tip\">Rule of thumb: on EC2 you patch the operating system. On RDS, Lambda and S3 AWS patches it. Your data and your access settings are always yours.</blockquote><h3 id=\"s-control-types\">Inherited, shared and customer-specific controls</h3><p>AWS also describes responsibility in terms of controls (safeguards).</p><ul><li><strong>Inherited controls:</strong> you get them fully from AWS, such as physical and environmental security of the data centers.</li><li><strong>Shared controls:</strong> both sides play a part, but in different ways. Examples: patch management (AWS patches the infrastructure, you patch your guest OS and apps), configuration management, and awareness and training.</li><li><strong>Customer-specific controls:</strong> fully yours, depending on how you use AWS. Example: service and communications protection, such as deciding that data in a particular app must be encrypted, or zone-based security rules.</li></ul><p><strong>Remember for the exam:</strong> physical security of data centers is inherited. Patching a guest OS on EC2 is on you. Questions often ask \"who is responsible for X?\" so match X to the table above.</p><h3 id=\"s-iam-basics\">IAM: the front door</h3><p><strong>AWS Identity and Access Management (IAM)</strong></p><ul><li><strong>What it is:</strong> the service that controls who (authentication) can do what (authorization) in your AWS account. It is global and free to use.</li><li><strong>Use it when:</strong> you need to create people, applications or services that can sign in and call AWS, and limit what they can do.</li><li><strong>Remember for the exam:</strong> IAM is where you apply least privilege: give only the permissions needed for the job, nothing more.</li></ul><p>The pieces:</p><ul><li><strong>Root user:</strong> the all-powerful identity created with the account email. Lock it away: turn on MFA, do not create access keys for it, and do not use it for daily work. Use it only for the few tasks that require it, such as closing the account or changing the support plan.</li><li><strong>IAM users:</strong> an identity for one person or application, with its own credentials.</li><li><strong>IAM groups:</strong> a collection of users, so you attach permissions once (for example, a Developers group). Groups contain users only, not other groups.</li><li><strong>IAM roles:</strong> an identity with permissions that anyone or anything can temporarily assume. No long-term password or keys. Use roles for EC2 instances, Lambda functions, other AWS services and cross-account access.</li><li><strong>IAM policies:</strong> JSON documents that say Allow or Deny for certain actions on certain resources. Attach them to users, groups or roles.</li></ul><blockquote class=\"voice\"><span class=\"who\">Kabir</span>Why can't the app on our server just use my access key? Because keys leak. Give the server a role instead.</blockquote><h3 id=\"s-iam-hardening\">Credentials: MFA, access keys and password policy</h3><ul><li><strong>Multi-factor authentication (MFA):</strong> a second proof beyond the password, such as an authenticator app, a security key or a hardware token. Always enable it for the root user and for privileged users.</li><li><strong>Access keys:</strong> an access key ID plus a secret key, used for programmatic access (CLI, SDK). Treat them like passwords, rotate them, never put them in code or share them. Prefer roles, which avoid long-term keys.</li><li><strong>Password policy:</strong> set rules for your account: minimum length, required character types, expiration and preventing reuse.</li><li><strong>Credential report:</strong> a downloadable CSV listing all users and the status of their passwords, access keys and MFA. Use it for audits.</li><li><strong>IAM Access Analyzer:</strong> finds resources (like S3 buckets) shared with outside accounts or the public, so you can spot unintended access.</li></ul><h3 id=\"s-identity-center-orgs\">IAM Identity Center, Organizations and SCPs</h3><p><strong>AWS IAM Identity Center</strong></p><ul><li><strong>What it is:</strong> central single sign-on (SSO) for people across many AWS accounts and business apps. One login, with permission sets per account.</li><li><strong>Use it when:</strong> the company has multiple accounts and you want staff to sign in once instead of managing separate IAM users in each.</li><li><strong>Remember for the exam:</strong> It is the modern answer for workforce SSO. It can use its own directory or connect to an external one such as Microsoft Active Directory.</li></ul><p><strong>AWS Organizations</strong></p><ul><li><strong>What it is:</strong> lets you manage many AWS accounts together, group them into organizational units, and get consolidated billing.</li><li><strong>Use it when:</strong> you want separate accounts for dev, test and prod, one bill, and shared guardrails.</li><li><strong>Remember for the exam:</strong> Consolidated billing combines usage to reach volume discounts.</li></ul><p><strong>Service control policies (SCPs)</strong></p><ul><li><strong>What it is:</strong> guardrails in Organizations that set the maximum permissions for accounts or OUs.</li><li><strong>Use it when:</strong> you want to block something for an entire account, such as using certain Regions.</li><li><strong>Remember for the exam:</strong> SCPs never grant permissions. They only limit what is allowed, and they apply to all users in the member account, including its root user. They do not affect the management account.</li></ul><h3 id=\"s-common-traps\">Common traps</h3><ul><li><strong>User vs role:</strong> a user has long-term credentials. A role is assumed temporarily. If the question says \"EC2 instance needs access to S3,\" the answer is a role.</li><li><strong>Group vs role:</strong> groups bundle users. They cannot be assumed or used by services.</li><li><strong>SCP vs IAM policy:</strong> an SCP alone never gives access. It only caps the maximum.</li><li><strong>Root for daily work:</strong> never the right answer. The root user is for rare account-level tasks.</li><li><strong>\"AWS is responsible for my data\":</strong> wrong. Customer data and its access settings are always yours.</li><li><strong>Credential report vs Access Analyzer:</strong> the report lists your users' credential status. Access Analyzer finds resources shared externally.</li></ul><h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>If the question says...                           -&gt; pick\nAWS secures data centers and hardware             -&gt; security OF the cloud (AWS)\nPatching the guest OS on EC2                      -&gt; customer responsibility\nPhysical security of facilities                   -&gt; inherited control\nApplication on EC2 needs to call S3 safely        -&gt; IAM role\nGive many developers the same permissions         -&gt; IAM group + policy\nExtra proof of identity beyond password           -&gt; MFA\nAudit users, passwords, keys and MFA status       -&gt; IAM credential report\nFind buckets shared with the public or others     -&gt; IAM Access Analyzer\nOne login for staff across many accounts          -&gt; IAM Identity Center\nLimit what a whole account can ever do            -&gt; Organizations SCP\nOnly the minimum permissions needed               -&gt; least privilege</code></pre>", "toc": [{"id": "shared-responsibility", "text": "Shared responsibility model"}, {"id": "control-types", "text": "Inherited, shared and customer-specific controls"}, {"id": "iam-basics", "text": "IAM: the front door"}, {"id": "iam-hardening", "text": "Credentials: MFA, access keys and password policy"}, {"id": "identity-center-orgs", "text": "IAM Identity Center, Organizations and SCPs"}, {"id": "common-traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch5", "ch": 5, "title": "Chapter 5: Locking the data and the doors (Encryption and network protection)", "short": "Locking the data and the doors", "topic": "Encryption and network protection", "d": 2, "focus": false, "mins": 7, "html": "<p>Kabir has a worry. \"A contractor just asked whether our customer database is encrypted. I said 'probably'.\" Meera is not amused. \"Probably is not an answer I can give an auditor. Lock the data, lock the doors, and tell me how.\"</p><p>That is this chapter: scramble the data so thieves can read nothing, keep secrets out of code, and put guards at every network entrance.</p><h3 id=\"s-encryption-basics\">Encryption at rest and in transit</h3><p>Encryption scrambles data so only someone with the right key can read it.</p><ul><li><strong>At rest:</strong> data sitting in storage (S3 objects, EBS volumes, RDS databases). Think of a locked filing cabinet.</li><li><strong>In transit:</strong> data moving across a network. Think of an armored van. This uses TLS (the \"https\" you see in a browser).</li></ul><p><strong>Remember for the exam:</strong> most AWS storage and database services support encryption at rest, often switched on with a checkbox and AWS KMS. For in transit, use HTTPS/TLS endpoints and certificates from ACM.</p><h3 id=\"s-kms-hsm\">KMS and CloudHSM</h3><p><strong>AWS Key Management Service (KMS)</strong></p><ul><li><strong>What it is:</strong> a managed service to create and control the encryption keys that protect your data. It integrates with most AWS services and is logged in CloudTrail.</li><li><strong>Use it when:</strong> you want easy, managed encryption for S3, EBS, RDS and more, with key policies and rotation.</li><li><strong>Remember for the exam:</strong> The default choice for key management. AWS manages the underlying hardware.</li></ul><p><strong>AWS CloudHSM</strong></p><ul><li><strong>What it is:</strong> a dedicated hardware security module (HSM) in the AWS cloud that only you control.</li><li><strong>Use it when:</strong> rules or contracts demand single-tenant hardware, and you must manage the keys yourself.</li><li><strong>Remember for the exam:</strong> Pick CloudHSM for \"dedicated hardware\" or \"customer fully controls keys\". Pick KMS for easy and managed.</li></ul><h3 id=\"s-acm-secrets\">ACM, Secrets Manager and Parameter Store</h3><p><strong>AWS Certificate Manager (ACM)</strong></p><ul><li><strong>What it is:</strong> creates, manages and renews public TLS/SSL certificates so your sites can use HTTPS.</li><li><strong>Use it when:</strong> you need HTTPS on a load balancer, CloudFront or API Gateway without handling certificates by hand.</li><li><strong>Remember for the exam:</strong> Public certificates from ACM are free and renew automatically. It is about encryption in transit.</li></ul><p><strong>AWS Secrets Manager</strong></p><ul><li><strong>What it is:</strong> stores and rotates secrets such as database passwords and API keys, so they are not hard-coded in your app.</li><li><strong>Use it when:</strong> an app needs a password or key and you want automatic rotation.</li><li><strong>Remember for the exam:</strong> Key feature: automatic rotation of secrets. It is paid per secret.</li></ul><p><strong>Systems Manager Parameter Store</strong> is a lighter option for storing configuration values and secrets. It is cheaper but does not offer the same built-in rotation.</p><h3 id=\"s-network-controls\">VPC, security groups and network ACLs</h3><p>A <strong>VPC</strong> (Virtual Private Cloud) is your own private slice of the AWS network. Inside it you create <strong>public subnets</strong> (reachable from the internet) and <strong>private subnets</strong> (hidden, good for databases). Put the website in public and the database in private.</p><p>Two filters protect traffic:</p><div class=\"tw\"><table><thead><tr><th></th><th>Security group</th><th>Network ACL</th></tr></thead><tbody><tr><td>Works at</td><td>The instance (server) level</td><td>The subnet level</td></tr><tr><td>State</td><td>Stateful: reply traffic is allowed automatically</td><td>Stateless: you must allow both directions</td></tr><tr><td>Rules</td><td>Allow rules only</td><td>Allow and deny rules</td></tr><tr><td>Default</td><td>Denies all inbound, allows all outbound</td><td>Default NACL allows all</td></tr></tbody></table></div><blockquote class=\"tip\">Stateful means the firewall remembers the conversation. Let a request in, and the reply goes out on its own.</blockquote><h3 id=\"s-edge-protection\">WAF, Shield and Firewall Manager</h3><p><strong>AWS WAF</strong></p><ul><li><strong>What it is:</strong> a web application firewall that inspects web requests and blocks common attacks like SQL injection and cross-site scripting, or blocks by IP or country.</li><li><strong>Use it when:</strong> you must protect a website or API behind CloudFront, an Application Load Balancer or API Gateway at the application layer (layer 7).</li><li><strong>Remember for the exam:</strong> WAF = web exploits and bad requests.</li></ul><p><strong>AWS Shield</strong></p><ul><li><strong>What it is:</strong> protection against DDoS (distributed denial of service) attacks, where a flood of fake traffic tries to knock your site offline. Shield Standard is automatic and free for all customers. Shield Advanced is paid, adds extra detection, 24/7 response team support and cost protection during attacks.</li><li><strong>Use it when:</strong> you want stronger protection for critical internet-facing apps.</li><li><strong>Remember for the exam:</strong> Standard covers common network and transport layer attacks at no cost. Advanced is the upgrade.</li></ul><p><strong>AWS Firewall Manager</strong></p><ul><li><strong>What it is:</strong> centrally sets up and enforces WAF rules, Shield Advanced and security group policies across all accounts in Organizations.</li><li><strong>Use it when:</strong> you manage many accounts and want one place to apply rules.</li><li><strong>Remember for the exam:</strong> Think \"central management of firewall rules\".</li></ul><p><strong>AWS Network Firewall</strong> (a mention): a managed firewall for traffic entering and leaving your VPC, for deeper network filtering.</p><h3 id=\"s-common-traps\">Common traps</h3><ul><li><strong>KMS vs CloudHSM:</strong> KMS is the managed default. CloudHSM is dedicated hardware you control.</li><li><strong>Security group vs NACL:</strong> groups are stateful and instance-level. NACLs are stateless and subnet-level, with deny rules.</li><li><strong>WAF vs Shield:</strong> WAF filters web requests. Shield fights DDoS floods.</li><li><strong>ACM vs Secrets Manager:</strong> ACM handles certificates. Secrets Manager handles passwords and keys.</li><li><strong>At rest vs in transit:</strong> stored data versus moving data. Read the wording closely.</li><li><strong>Shield Standard costs money:</strong> wrong. It is free and automatic.</li></ul><h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>If the question says...                         -&gt; pick\nCreate and manage encryption keys easily        -&gt; AWS KMS\nDedicated hardware, customer-controlled keys    -&gt; AWS CloudHSM\nFree HTTPS certificate that auto-renews         -&gt; AWS Certificate Manager\nStore and auto-rotate a database password       -&gt; AWS Secrets Manager\nFirewall at the server, remembers replies       -&gt; security group (stateful)\nFirewall at the subnet, allow and deny rules    -&gt; network ACL (stateless)\nBlock SQL injection or bad web requests         -&gt; AWS WAF\nProtect against DDoS flooding                   -&gt; AWS Shield\n24/7 DDoS response team and cost protection     -&gt; Shield Advanced\nApply firewall rules across all accounts        -&gt; AWS Firewall Manager\nHide the database from the internet             -&gt; private subnet</code></pre>", "toc": [{"id": "encryption-basics", "text": "Encryption at rest and in transit"}, {"id": "kms-hsm", "text": "KMS and CloudHSM"}, {"id": "acm-secrets", "text": "ACM, Secrets Manager and Parameter Store"}, {"id": "network-controls", "text": "VPC, security groups and network ACLs"}, {"id": "edge-protection", "text": "WAF, Shield and Firewall Manager"}, {"id": "common-traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch6", "ch": 6, "title": "Chapter 6: Spotting trouble and proving compliance (Detection, auditing and compliance)", "short": "Spotting trouble, proving compliance", "topic": "Detection, auditing and compliance", "d": 2, "focus": false, "mins": 6, "html": "<p>A big sponsor emails Meera: \"Send us proof that you follow recognized security standards.\" Meera forwards it to you with one line: \"We must pass the audit. Show them we are safe, and tell me when something looks wrong.\"</p><p>Kabir shrugs. \"Why can't we just say we're secure?\" Because auditors want evidence. This chapter covers the tools that watch for trouble and the ones that prove compliance.</p><h3 id=\"s-threat-detection\">Spotting trouble: the detection services</h3><p><strong>Amazon GuardDuty</strong></p><ul><li><strong>What it is:</strong> a threat detection service that watches your account activity, network traffic and DNS logs, using machine learning to flag suspicious behavior.</li><li><strong>Use it when:</strong> you want always-on detection of compromised accounts, odd logins or crypto-mining without installing agents.</li><li><strong>Remember for the exam:</strong> Keywords: \"intelligent threat detection\", \"malicious activity\".</li></ul><p><strong>Amazon Inspector</strong></p><ul><li><strong>What it is:</strong> an automated vulnerability scanner for EC2 instances, container images and Lambda functions.</li><li><strong>Use it when:</strong> you want to find known software flaws and unintended network exposure.</li><li><strong>Remember for the exam:</strong> Keyword: \"vulnerabilities\" in your workloads.</li></ul><p><strong>Amazon Macie</strong></p><ul><li><strong>What it is:</strong> uses machine learning to discover and protect sensitive data, such as personal information, in S3.</li><li><strong>Use it when:</strong> you must know where PII lives in your buckets.</li><li><strong>Remember for the exam:</strong> Keyword: \"sensitive data in S3\".</li></ul><p><strong>AWS Security Hub</strong></p><ul><li><strong>What it is:</strong> a central dashboard that collects findings from GuardDuty, Inspector, Macie and others, and checks your setup against security standards.</li><li><strong>Use it when:</strong> you want one view of your security posture across accounts.</li><li><strong>Remember for the exam:</strong> Keywords: \"central view\", \"aggregate findings\".</li></ul><p><strong>Amazon Detective</strong></p><ul><li><strong>What it is:</strong> helps you investigate the root cause of a security finding by linking logs and activity into easy visuals.</li><li><strong>Use it when:</strong> GuardDuty flagged something and you need to dig into what happened.</li><li><strong>Remember for the exam:</strong> Keyword: \"investigate\" or \"root cause\".</li></ul><h3 id=\"s-logging-config\">Recording what happened: CloudTrail, Config, CloudWatch</h3><p><strong>AWS CloudTrail</strong></p><ul><li><strong>What it is:</strong> records API calls and actions in your account: who did what, when and from where.</li><li><strong>Use it when:</strong> you need an audit trail, or must find out who deleted a resource.</li><li><strong>Remember for the exam:</strong> Think \"who did it\". It is enabled by default with 90 days of event history. Create a trail to keep logs longer in S3.</li></ul><p><strong>AWS Config</strong></p><ul><li><strong>What it is:</strong> tracks the configuration of your resources over time and checks them against rules.</li><li><strong>Use it when:</strong> you want to know what changed and whether resources follow policy, such as \"all buckets must be encrypted\".</li><li><strong>Remember for the exam:</strong> Think \"what changed and is it compliant\".</li></ul><p><strong>Amazon CloudWatch</strong> (a mention): monitors performance metrics, logs and alarms. It answers \"how is it running\", not \"who did it\".</p><h3 id=\"s-proving-compliance\">Proving compliance: Audit Manager and Artifact</h3><p><strong>AWS Audit Manager</strong></p><ul><li><strong>What it is:</strong> continuously collects evidence from your AWS usage and helps build audit-ready reports.</li><li><strong>Use it when:</strong> you must prepare for your own audit and gather proof that your controls work.</li><li><strong>Remember for the exam:</strong> Think \"automate evidence collection for audits\".</li></ul><p><strong>AWS Artifact</strong></p><ul><li><strong>What it is:</strong> a self-service portal to download AWS's own compliance reports (such as SOC and ISO reports) and to review and accept agreements (such as a BAA for HIPAA).</li><li><strong>Use it when:</strong> an auditor or customer wants proof that AWS itself is compliant.</li><li><strong>Remember for the exam:</strong> Artifact is about AWS's compliance documents. Audit Manager is about your own evidence.</li></ul><h3 id=\"s-compliance-residency\">Compliance programs, data residency and Trusted Advisor</h3><p>AWS supports many compliance programs, including SOC, ISO 27001, PCI DSS, HIPAA eligibility and GDPR-related support. Passing them is a shared job: AWS certifies its infrastructure, but you must configure your own workloads correctly.</p><p><strong>Data residency:</strong> data stays in the Region you choose and AWS does not move it elsewhere unless you tell it to. This helps meet local laws about where data may be stored.</p><p><strong>AWS Trusted Advisor</strong> inspects your account against best practices in categories like cost optimization, performance, security, fault tolerance, service limits and operational excellence. Security checks include open security group ports, public S3 buckets, missing MFA on root and exposed access keys. The full set of checks needs a Business, Enterprise On-Ramp or Enterprise support plan. Basic and Developer plans get a limited set of core checks.</p><h3 id=\"s-support-policies\">Security resources, pen testing and abuse reporting</h3><ul><li><strong>AWS Security Blog:</strong> news, announcements and guidance from AWS security teams.</li><li><strong>AWS Knowledge Center:</strong> answers to common support questions, including security ones.</li><li><strong>AWS Support:</strong> open a case for help. Higher plans give faster responses.</li><li><strong>Penetration testing:</strong> you may test your own resources for eight listed services (such as EC2 and RDS) <em>without prior approval</em>, but you may not run DDoS simulation or flooding attacks unless you follow AWS's DDoS simulation testing policy.</li><li><strong>Reporting abuse:</strong> if you think AWS resources are being used for spam, malware or attacks, report it to the AWS Trust &amp; Safety team using the abuse form or email.</li></ul><h3 id=\"s-common-traps\">Common traps</h3><ul><li><strong>CloudTrail vs Config:</strong> CloudTrail is who did what. Config is how resources changed and whether they comply.</li><li><strong>CloudTrail vs CloudWatch:</strong> trail is audit of API calls. CloudWatch is performance and alarms.</li><li><strong>GuardDuty vs Inspector:</strong> GuardDuty finds active threats. Inspector finds software vulnerabilities.</li><li><strong>Macie vs GuardDuty:</strong> Macie is about sensitive data in S3.</li><li><strong>Artifact vs Audit Manager:</strong> Artifact gives AWS's reports. Audit Manager gathers your evidence.</li><li><strong>Security Hub vs Detective:</strong> Hub aggregates findings. Detective investigates one.</li></ul><h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>If the question says...                          -&gt; pick\nDetect threats using ML on logs and traffic      -&gt; GuardDuty\nScan EC2, containers or Lambda for flaws         -&gt; Inspector\nFind personal data in S3                         -&gt; Macie\nOne dashboard of security findings               -&gt; Security Hub\nInvestigate the root cause of a finding          -&gt; Detective\nWho made this API call, and when                 -&gt; CloudTrail\nTrack resource configuration changes and rules   -&gt; AWS Config\nCollect evidence for our audit                   -&gt; Audit Manager\nDownload AWS SOC or ISO reports                  -&gt; AWS Artifact\nCheck for open ports or root MFA missing         -&gt; Trusted Advisor\nReport spam or malware from AWS resources        -&gt; AWS Trust &amp; Safety abuse report</code></pre>", "toc": [{"id": "threat-detection", "text": "Spotting trouble: the detection services"}, {"id": "logging-config", "text": "Recording what happened: CloudTrail, Config, CloudWatch"}, {"id": "proving-compliance", "text": "Proving compliance: Audit Manager and Artifact"}, {"id": "compliance-residency", "text": "Compliance programs, data residency and Trusted Advisor"}, {"id": "support-policies", "text": "Security resources, pen testing and abuse reporting"}, {"id": "common-traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch7", "ch": 7, "title": "Chapter 7: Where in the world is your app? (The AWS global infrastructure and ways to use AWS)", "short": "Where in the world is your app?", "topic": "The AWS global infrastructure and ways to use AWS", "d": 3, "focus": false, "mins": 7, "html": "<p>Meera opens the laptop on a Monday. &quot;Readers in Singapore say our site is slow, and our lawyers say EU subscriber data must stay in Europe. Where does PulseWire actually <em>live</em>?&quot; Kabir shrugs: &quot;Why can't we just put everything in one data centre?&quot;</p><p>As the new cloud lead, you need the map of AWS first. Once you can read the map, the questions about speed, law and outages answer themselves. This chapter also covers how people operate AWS: clicking, typing commands, or writing code that builds everything for you.</p><h3 id=\"s-regions-azs\">Regions and Availability Zones</h3><p>A <strong>Region</strong> is a physical area of the world where AWS has clusters of data centres, such as <code>us-east-1</code> (N. Virginia), <code>eu-west-1</code> (Ireland) or <code>ap-southeast-1</code> (Singapore). Regions are completely independent of each other. Your data does not leave a Region unless you decide to move it.</p><p>Inside each Region there are multiple <strong>Availability Zones (AZs)</strong>. An AZ is one or more separate data centres with their own power, cooling and networking. AZs in a Region are far enough apart to avoid sharing a disaster, yet close enough to be connected by very fast, low-latency links.</p><ul><li><strong>What it is:</strong> Region = a geographic area; AZ = an isolated data-centre group inside a Region (every Region has at least three).</li><li><strong>Use it when:</strong> you want resilience: spread your app across two or more AZs so one failed data centre does not take you down.</li><li><strong>Remember for the exam:</strong> Highly available = multiple AZs. Fault tolerant against a whole-Region problem = multiple Regions. Most services are Regional; IAM, Route 53 and CloudFront are global.</li></ul><pre class=\"diagram\"><code>AWS Global Infrastructure\n\n  Region (eu-west-1)\n  +--------------------------------------+\n  |  AZ-a        AZ-b        AZ-c        |\n  | [DC][DC]    [DC][DC]    [DC]         |\n  +--------------------------------------+\n         ^ fast private links between AZs ^</code></pre><h3 id=\"s-choose-region\">How to choose a Region</h3><p>Four factors decide which Region to use, and the exam loves asking which one matters most. The answer is usually <strong>compliance first</strong>.</p><div class=\"tw\"><table><thead><tr><th>Factor</th><th>Question to ask</th><th>Example</th></tr></thead><tbody><tr><td>Compliance / data residency</td><td>Does law or policy say where data must stay?</td><td>EU subscriber data stays in an EU Region</td></tr><tr><td>Latency</td><td>Where are most of my users?</td><td>Singapore readers: pick Singapore</td></tr><tr><td>Price</td><td>Costs differ by Region</td><td>US Regions are often cheaper than some others</td></tr><tr><td>Service availability</td><td>Is the new service offered there yet?</td><td>New features launch in some Regions first</td></tr></tbody></table></div><blockquote class=\"tip\">Rule of thumb: if a rule says the data must stay in a country, that decides the Region. Only after that do you weigh latency, price and available services.</blockquote><h3 id=\"s-edge-special\">Edge locations and special zones</h3><p>Not every location is a full Region. AWS also puts smaller sites closer to people and to special buildings.</p><ul><li><strong>Edge locations (points of presence):</strong> hundreds of small sites around the world. <strong>Amazon CloudFront</strong>, the content delivery network (CDN), caches copies of your images and videos there so readers get them from nearby. Route 53 and Global Accelerator also use them.</li><li><strong>AWS Local Zones:</strong> small extensions of a Region placed in a big city, giving single-digit-millisecond latency for things like live video editing or gaming.</li><li><strong>AWS Wavelength:</strong> AWS compute inside 5G telecom networks, for ultra-low latency to mobile devices.</li><li><strong>AWS Outposts:</strong> AWS-owned racks installed in <em>your own</em> data centre. Use it when you need AWS services but the workload must stay on premises (hybrid cloud).</li></ul><blockquote class=\"voice\"><span class=\"who\">Kabir</span>So the CDN is basically a local newsstand stocking copies of our front page?</blockquote><p>Exactly, Kabir. That is caching at the edge.</p><h3 id=\"s-access-aws\">Ways to access AWS</h3><p>You can talk to AWS in several ways. Under the hood they all call the same <strong>AWS APIs</strong>.</p><ul><li><strong>AWS Management Console:</strong> the web interface. Best for learning and one-off tasks.</li><li><strong>AWS CLI (Command Line Interface):</strong> type commands in a terminal; good for scripts and automation.</li><li><strong>SDKs (Software Development Kits):</strong> libraries for Python, JavaScript, Java and more, so your application code can use AWS.</li><li><strong>AWS CloudShell:</strong> a browser-based terminal inside the Console with the CLI already installed and your credentials loaded. No setup required.</li><li><strong>APIs:</strong> every action is an API call. Console, CLI and SDKs are friendly wrappers around them.</li></ul><p>Programmatic access (CLI and SDK) uses <strong>access keys</strong>, which are long-term credentials you must protect. Console users sign in with a username, password and ideally MFA.</p><h3 id=\"s-iac\">Infrastructure as code and deployment models</h3><p>Clicking in the Console is fine once, but not for rebuilding a whole environment ten times. <strong>Infrastructure as code (IaC)</strong> means you describe your servers, networks and databases in a file and let a tool build them. The result is repeatable, reviewable and easy to copy.</p><ul><li><strong>What it is:</strong> <strong>AWS CloudFormation</strong> builds resources from JSON or YAML templates, grouped as a <em>stack</em>. <strong>AWS CDK</strong> (Cloud Development Kit) lets you write the same thing in a programming language like Python or TypeScript; it generates CloudFormation for you.</li><li><strong>Use it when:</strong> you want identical test, staging and production environments, or you want to delete everything in one go by deleting the stack.</li><li><strong>Remember for the exam:</strong> IaC = CloudFormation (templates) or CDK (code). Both are free; you pay only for the resources they create.</li></ul><p>There are also three <strong>cloud deployment models</strong>: <strong>cloud</strong> (all in AWS), <strong>on-premises</strong> (all in your own building, sometimes called private cloud), and <strong>hybrid</strong> (a mix, connected together). Outposts and Direct Connect are common hybrid tools.</p><h3 id=\"s-high-availability\">High availability across AZs</h3><p>PulseWire's fear is a single outage taking the site down. <strong>High availability</strong> means the app keeps working when one part fails. On AWS the basic recipe is to run copies of your app in at least two AZs, with a load balancer in front, and a database that can fail over. If AZ-a burns down, AZ-b keeps serving readers.</p><p>Going one level up, <strong>multi-Region</strong> designs protect against a whole Region failing and also bring the app closer to far-away users. It costs more, so use it only when the business needs it.</p><h3 id=\"s-common-traps\">Common traps</h3><ul><li><strong>AZ vs Region:</strong> an AZ is a data centre group <em>inside</em> a Region. Multi-AZ is not multi-Region.</li><li><strong>Edge location vs AZ:</strong> edge locations cache content (CloudFront); you do not run your normal servers or databases in them.</li><li><strong>Outposts vs Local Zones vs Wavelength:</strong> Outposts is in <em>your</em> data centre; Local Zones is in a city near users; Wavelength is inside a 5G network.</li><li><strong>CloudFormation vs CDK:</strong> both are IaC. If the question says &quot;using a programming language&quot;, pick CDK.</li><li><strong>CloudShell vs CLI:</strong> CloudShell is a browser terminal with no installation; the CLI is installed on your own computer.</li><li><strong>Cheapest Region is not always the answer:</strong> compliance beats price.</li></ul><h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>If the question says...                        -&gt; pick\n-----------------------------------------------------------\nData must stay in a specific country               -&gt; that Region (compliance)\nSurvive one data-centre failure                    -&gt; Multi-AZ\nSurvive a whole Region outage                      -&gt; Multi-Region\nCache content close to users worldwide             -&gt; CloudFront (edge locations)\nRun AWS services in my own data centre             -&gt; AWS Outposts\nUltra-low latency inside a 5G network              -&gt; AWS Wavelength\nLow latency in a big city, extend a Region         -&gt; Local Zones\nBrowser terminal, no install                       -&gt; AWS CloudShell\nBuild identical environments from templates        -&gt; CloudFormation\nDefine infrastructure in Python or TypeScript      -&gt; AWS CDK</code></pre>", "toc": [{"id": "regions-azs", "text": "Regions and Availability Zones"}, {"id": "choose-region", "text": "How to choose a Region"}, {"id": "edge-special", "text": "Edge locations and special zones"}, {"id": "access-aws", "text": "Ways to access AWS"}, {"id": "iac", "text": "Infrastructure as code and deployment models"}, {"id": "high-availability", "text": "High availability across AZs"}, {"id": "common-traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch8", "ch": 8, "title": "Chapter 8: Where does the code actually run? (Compute services)", "short": "Where does the code actually run?", "topic": "Compute services", "d": 3, "focus": false, "mins": 8, "html": "<p>Meera: &quot;Last week's election night, traffic jumped ten times and the site crawled. Then at 3 a.m. we were paying for servers nobody used.&quot; Kabir: &quot;Why can't we just buy a bunch of big machines?&quot; Because then you pay for them when idle and drown when busy.</p><p>Compute is the &quot;where does the code run&quot; part of AWS. The exam wants you to pick the right style: a virtual server, a container, a serverless function, or a managed platform. Each trades control for convenience.</p><h3 id=\"s-ec2\">Amazon EC2: virtual servers</h3><ul><li><strong>What it is:</strong> Elastic Compute Cloud gives you virtual machines (instances) in the cloud. You choose the operating system, size and software, and you manage the OS, patches and apps (your side of shared responsibility).</li><li><strong>Use it when:</strong> you need full control, a custom OS, or you are moving an existing server application (lift and shift).</li><li><strong>Remember for the exam:</strong> EC2 is IaaS. Billing is per second for Linux (per hour for some others). Pricing options appear in the cost chapter.</li></ul><p>Three things to know about EC2:</p><ul><li><strong>Instance families</strong> match hardware to the job: general purpose (balanced, e.g. M, T), compute optimised (C, for busy CPUs), memory optimised (R, for big in-memory data), storage optimised (I, D, for fast disk), and accelerated computing (P, G, for GPUs and machine learning).</li><li><strong>AMI (Amazon Machine Image):</strong> a template with the OS and software, used to launch identical instances.</li><li><strong>User data:</strong> a script that runs the first time an instance starts, to install software automatically.</li></ul><h3 id=\"s-scaling-lb\">Auto Scaling and Elastic Load Balancing</h3><p>These two pair up to solve election night.</p><ul><li><strong>What it is:</strong> <strong>EC2 Auto Scaling</strong> adds instances when demand rises and removes them when it falls, within minimum and maximum limits you set. <strong>Elastic Load Balancing (ELB)</strong> spreads incoming traffic across many targets and only sends it to healthy ones.</li><li><strong>Use it when:</strong> traffic is unpredictable, or you want high availability across AZs.</li><li><strong>Remember for the exam:</strong> Auto Scaling = elasticity (right amount of capacity). ELB = distribution and health checks. Application Load Balancer handles web (HTTP/HTTPS) traffic; Network Load Balancer handles extreme performance for TCP/UDP.</li></ul><pre class=\"diagram\"><code>  Readers --&gt; [Load Balancer]\n                 /      |      \\\n            [EC2-a]  [EC2-b]  [EC2-c]   &lt;- Auto Scaling group\n             AZ-a     AZ-b     AZ-a</code></pre><h3 id=\"s-lambda\">AWS Lambda: serverless functions</h3><ul><li><strong>What it is:</strong> You upload code; AWS runs it only when triggered (a file lands in S3, an API call, a schedule). There are no servers for you to manage, and scaling is automatic.</li><li><strong>Use it when:</strong> work is short, event-driven and spiky, such as resizing an uploaded image or sending a notification.</li><li><strong>Remember for the exam:</strong> You pay only for the number of requests and the run time, and nothing when idle. Maximum run time is 15 minutes, so Lambda is not for long jobs.</li></ul><blockquote class=\"voice\"><span class=\"who\">Kabir</span>So &quot;serverless&quot; still has servers, we just never see them?</blockquote><p>Exactly. Someone else runs them.</p><h3 id=\"s-containers\">Containers: ECS, EKS, Fargate, ECR</h3><p>A <strong>container</strong> packages your app plus everything it needs so it runs the same everywhere. It is lighter than a full virtual machine. Running many containers needs an orchestrator.</p><ul><li><strong>Amazon ECS (Elastic Container Service):</strong> AWS's own container orchestrator. Simple and deeply integrated with AWS.</li><li><strong>Amazon EKS (Elastic Kubernetes Service):</strong> managed Kubernetes, the popular open-source orchestrator. Choose it if you already use Kubernetes or want portability.</li><li><strong>AWS Fargate:</strong> serverless compute for containers. It works with ECS and EKS so you do not manage the servers underneath.</li><li><strong>Amazon ECR (Elastic Container Registry):</strong> a place to store and share your container images.</li></ul><blockquote class=\"tip\">Memory trick: ECS = Amazon's way; EKS = Kubernetes; Fargate = no servers to run; ECR = image storage (like a library for images).</blockquote><h3 id=\"s-easier-paas\">Easier options: Beanstalk, Lightsail, App Runner, Batch</h3><ul><li><strong>AWS Elastic Beanstalk (PaaS):</strong> upload your web application code and Beanstalk handles provisioning, load balancing, scaling and monitoring. You keep control of the underlying resources. Good for developers who want to deploy fast without learning each service.</li><li><strong>Amazon Lightsail:</strong> simple virtual servers, databases and storage at a low, predictable monthly price. Aimed at small websites, blogs and beginners.</li><li><strong>AWS App Runner:</strong> deploy a web app or API from source code or a container image with almost no infrastructure work.</li><li><strong>AWS Batch:</strong> run large numbers of batch computing jobs, such as nightly data processing, and AWS provisions the right amount of compute.</li></ul><h3 id=\"s-which\">When to use which</h3><p>Think of it as a ladder: the higher you go, the less you manage, and the less control you have.</p><div class=\"tw\"><table><thead><tr><th>Style</th><th>Example</th><th>You manage</th><th>Best for</th></tr></thead><tbody><tr><td>Virtual server</td><td>EC2</td><td>OS, patches, app</td><td>Full control, legacy apps</td></tr><tr><td>Container</td><td>ECS, EKS (Fargate)</td><td>Containers and images</td><td>Microservices, portable apps</td></tr><tr><td>Serverless</td><td>Lambda</td><td>Only your code</td><td>Event-driven, spiky work</td></tr><tr><td>PaaS</td><td>Elastic Beanstalk</td><td>Application code</td><td>Quick web app deployment</td></tr></tbody></table></div><h3 id=\"s-common-traps\">Common traps</h3><ul><li><strong>EC2 vs Lambda:</strong> long-running, full-control workloads go to EC2; short event-driven code goes to Lambda.</li><li><strong>Auto Scaling vs Load Balancing:</strong> scaling changes <em>how many</em> servers; balancing decides <em>which</em> server gets each request.</li><li><strong>ECS vs EKS vs Fargate:</strong> Fargate is not an orchestrator; it is the serverless engine under them.</li><li><strong>ECR is storage:</strong> it does not run containers.</li><li><strong>Beanstalk vs Lightsail:</strong> Beanstalk deploys your code with AWS services behind it; Lightsail is a simple, fixed-price bundle for small projects.</li><li><strong>Shared responsibility:</strong> with EC2 you patch the guest OS; with Lambda and Fargate AWS handles more.</li></ul><h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>If the question says...                        -&gt; pick\n-----------------------------------------------------------\nVirtual machine, full control of the OS            -&gt; EC2\nAdd or remove servers automatically                -&gt; EC2 Auto Scaling\nSpread traffic across healthy servers              -&gt; Elastic Load Balancing\nRun code on an event, no servers to manage         -&gt; Lambda\nRun containers, AWS-native                         -&gt; ECS\nRun containers with Kubernetes                     -&gt; EKS\nContainers without managing servers                -&gt; Fargate\nStore container images                             -&gt; ECR\nUpload code, AWS handles the rest (PaaS)           -&gt; Elastic Beanstalk\nSimple, cheap, predictable small website           -&gt; Lightsail\nLarge scale batch jobs                             -&gt; AWS Batch</code></pre>", "toc": [{"id": "ec2", "text": "Amazon EC2: virtual servers"}, {"id": "scaling-lb", "text": "Auto Scaling and Elastic Load Balancing"}, {"id": "lambda", "text": "AWS Lambda: serverless functions"}, {"id": "containers", "text": "Containers: ECS, EKS, Fargate, ECR"}, {"id": "easier-paas", "text": "Easier options: Beanstalk, Lightsail, App Runner, Batch"}, {"id": "which", "text": "When to use which"}, {"id": "common-traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch9", "ch": 9, "title": "Chapter 9: Where do the photos and files live? (Storage services)", "short": "Where do the photos and files live?", "topic": "Storage services", "d": 3, "focus": true, "mins": 8, "html": "<p>PulseWire creators upload thousands of photos and videos every day. Meera: &quot;Storage is eating the budget, but I also need old footage kept for seven years for audits.&quot; Kabir: &quot;Why can't we just put it all on one big hard drive?&quot;</p><p>Because different data needs different homes: some is read all day, some once a year, some must be shared between servers. AWS offers three kinds of storage (object, block, file) and many tools to move and protect data. S3 is the star of this chapter and of the exam.</p><h3 id=\"s-s3\">Amazon S3: object storage</h3><ul><li><strong>What it is:</strong> Simple Storage Service stores <strong>objects</strong> (files plus metadata, up to 5 TB each) inside <strong>buckets</strong>. Bucket names are globally unique; the bucket lives in one Region. Capacity is effectively unlimited, and you access objects over the web with a URL or API.</li><li><strong>Use it when:</strong> you store photos, videos, backups, logs, website files or a data lake.</li><li><strong>Remember for the exam:</strong> S3 offers <strong>11 nines (99.999999999%) durability</strong>: data is copied across multiple AZs. S3 is not a disk you attach to a server. New buckets are private by default.</li></ul><p>Useful S3 features:</p><ul><li><strong>Versioning:</strong> keeps every version of an object, so you can recover from accidental deletes or overwrites.</li><li><strong>Static website hosting:</strong> serve plain HTML, images and scripts straight from a bucket, often fronted by CloudFront.</li><li><strong>Lifecycle rules:</strong> automatically move objects to cheaper classes after N days, or delete them after a set time.</li><li><strong>Encryption:</strong> objects are encrypted at rest by default; you can also use your own keys with KMS.</li></ul><h3 id=\"s-classes\">S3 storage classes</h3><p>Pick a class by <em>how often</em> you read the data and <em>how fast</em> you need it back. The less you touch it, the cheaper it is to store, but retrieval costs more or takes longer.</p><div class=\"tw\"><table><thead><tr><th>Class</th><th>Access pattern</th><th>Retrieval</th><th>Note</th></tr></thead><tbody><tr><td>Standard</td><td>Frequent</td><td>Instant</td><td>Default, highest storage price</td></tr><tr><td>Intelligent-Tiering</td><td>Unknown or changing</td><td>Instant</td><td>Moves objects between tiers for you</td></tr><tr><td>Standard-IA</td><td>Infrequent, needs rapid access</td><td>Instant</td><td>Lower storage, per-GB retrieval fee, multi-AZ</td></tr><tr><td>One Zone-IA</td><td>Infrequent, re-creatable data</td><td>Instant</td><td>Stored in a single AZ, cheaper, less resilient</td></tr><tr><td>Glacier Instant Retrieval</td><td>Rare, e.g. quarterly</td><td>Milliseconds</td><td>Archive with instant access</td></tr><tr><td>Glacier Flexible Retrieval</td><td>Rare, archive</td><td>Minutes to hours</td><td>Cheap, for backups</td></tr><tr><td>Glacier Deep Archive</td><td>Almost never, 7+ years</td><td>Hours (up to about 12 or more)</td><td>Cheapest class</td></tr></tbody></table></div><blockquote class=\"tip\">PulseWire plan: new uploads in Standard, then a lifecycle rule moves them to Standard-IA after 30 days and Glacier Deep Archive after a year for audit footage.</blockquote><h3 id=\"s-block-file\">EBS, EFS and FSx</h3><p>S3 is object storage. Servers sometimes need something that behaves like a disk or a shared folder.</p><ul><li><strong>What it is:</strong> <strong>Amazon EBS (Elastic Block Store)</strong> is a virtual hard drive for one EC2 instance. It lives in one AZ, persists after the instance stops, and supports snapshots (backups, stored in S3).</li><li><strong>Use it when:</strong> you need a boot volume or a fast database disk for an EC2 server.</li><li><strong>Remember for the exam:</strong> Block storage. EBS is attached to EC2 (in the same AZ). Instance store is temporary and lost when the instance stops.</li></ul><ul><li><strong>What it is:</strong> <strong>Amazon EFS (Elastic File System)</strong> is a shared network file system for Linux. Many EC2 instances, even across AZs, can use it at once; it grows and shrinks automatically.</li><li><strong>Use it when:</strong> several servers need to share the same files.</li><li><strong>Remember for the exam:</strong> File storage, Linux, pay for what you use.</li></ul><ul><li><strong>What it is:</strong> <strong>Amazon FSx</strong> is a family of fully managed file systems: FSx for Windows File Server, Lustre (high-performance computing), NetApp ONTAP and OpenZFS.</li><li><strong>Use it when:</strong> you need Windows file shares (SMB), Active Directory integration, or specialist file systems.</li><li><strong>Remember for the exam:</strong> Windows file share = FSx for Windows. High-performance computing = FSx for Lustre.</li></ul><h3 id=\"s-compare\">Block vs file vs object</h3><div class=\"tw\"><table><thead><tr><th></th><th>Block (EBS)</th><th>File (EFS, FSx)</th><th>Object (S3)</th></tr></thead><tbody><tr><td>Looks like</td><td>A hard drive</td><td>A shared folder</td><td>A bucket of files via web</td></tr><tr><td>Shared by</td><td>One instance (usually)</td><td>Many servers</td><td>Anyone with permission</td></tr><tr><td>Best for</td><td>Operating systems, databases</td><td>Shared content, home folders</td><td>Media, backups, data lakes, websites</td></tr><tr><td>Scale</td><td>Provisioned size</td><td>Grows automatically</td><td>Virtually unlimited</td></tr></tbody></table></div><h3 id=\"s-hybrid-move\">Backup, hybrid and moving data</h3><ul><li><strong>AWS Backup:</strong> one central place to set backup policies across EBS, RDS, EFS, DynamoDB and more. Use it for automated, compliance-friendly backups.</li><li><strong>AWS Storage Gateway:</strong> a bridge between on-premises systems and AWS storage (file, volume and tape gateways). Use it for hybrid storage.</li><li><strong>AWS DataSync:</strong> automated, fast online transfer of large amounts of data between on-premises and AWS storage.</li><li><strong>AWS Transfer Family:</strong> managed SFTP, FTPS and FTP into S3 or EFS, for partners who still send files that way.</li><li><strong>AWS Snow family:</strong> physical devices for moving data offline when the network is too slow or none exists. <strong>Snowcone</strong> is small and portable, <strong>Snowball Edge</strong> holds terabytes to petabytes and can do edge computing; the larger Snowmobile truck has been retired.</li></ul><p>Rule of thumb: terabytes over a good network, use DataSync; petabytes or poor networks, use Snow.</p><h3 id=\"s-common-traps\">Common traps</h3><ul><li><strong>S3 is not a file system or disk:</strong> you cannot install an OS on it. Use EBS for that.</li><li><strong>EBS vs EFS:</strong> EBS = one server, one AZ; EFS = many servers sharing files.</li><li><strong>Glacier retrieval speeds differ:</strong> Instant is milliseconds; Flexible takes minutes to hours; Deep Archive takes hours.</li><li><strong>One Zone-IA is not multi-AZ:</strong> do not pick it for data you cannot lose.</li><li><strong>Storage Gateway vs DataSync:</strong> Gateway is an ongoing hybrid bridge; DataSync is a bulk transfer tool.</li><li><strong>Versioning vs lifecycle:</strong> versioning keeps old copies; lifecycle moves or expires objects.</li></ul><h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>If the question says...                        -&gt; pick\n-----------------------------------------------------------\nUnlimited objects, photos, backups, websites       -&gt; S3\nUnknown or changing access pattern                 -&gt; S3 Intelligent-Tiering\nCheapest archive, accessed once a year or less     -&gt; Glacier Deep Archive\nDisk for one EC2 instance                          -&gt; EBS\nShared Linux file system for many servers          -&gt; EFS\nWindows file share (SMB)                           -&gt; FSx for Windows File Server\nCentral backup policies across services            -&gt; AWS Backup\nOn-premises app using cloud storage                -&gt; Storage Gateway\nMove large data online                             -&gt; DataSync\nMove petabytes offline                             -&gt; Snow family (Snowball Edge)\nPartners upload via SFTP                           -&gt; Transfer Family</code></pre>", "toc": [{"id": "s3", "text": "Amazon S3: object storage"}, {"id": "classes", "text": "S3 storage classes"}, {"id": "block-file", "text": "EBS, EFS and FSx"}, {"id": "compare", "text": "Block vs file vs object"}, {"id": "hybrid-move", "text": "Backup, hybrid and moving data"}, {"id": "common-traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch10", "ch": 10, "title": "Chapter 10: Where does the data go to be remembered? (Database services)", "short": "Where does the data go to be remembered?", "topic": "Database services", "d": 3, "focus": false, "mins": 8, "html": "<p>PulseWire needs to keep subscribers, articles and comments. Kabir wants to install a database on an EC2 server himself. Meera: &quot;Who will patch it, back it up and wake up when it breaks?&quot; The answer is: you, unless you pick a managed database.</p><p>AWS has a purpose-built database for almost every need. For the exam you only need to match the need to the service. The big split is relational (tables with fixed structure) versus NoSQL (flexible, built for scale).</p><h3 id=\"s-managed\">Managed databases and the big split</h3><p>With a <strong>managed database</strong>, AWS handles hardware, OS installation, database patching, backups and failover. You still own your data, who can access it, and the design of the tables. If you install a database yourself on EC2, all of the admin is yours.</p><div class=\"tw\"><table><thead><tr><th></th><th>Relational (SQL)</th><th>NoSQL</th></tr></thead><tbody><tr><td>Structure</td><td>Tables, rows, fixed schema</td><td>Flexible: key-value, document, graph</td></tr><tr><td>Strength</td><td>Complex queries, joins, transactions</td><td>Huge scale, fast, simple access</td></tr><tr><td>AWS examples</td><td>RDS, Aurora, Redshift</td><td>DynamoDB, DocumentDB, Neptune</td></tr></tbody></table></div><p>Under shared responsibility, AWS secures and operates the database service itself. You decide who may connect (IAM and security groups), whether data is encrypted, and what the data contains. The exam often asks who patches the database engine: for RDS and Aurora, AWS does; for a database you installed on EC2, you do.</p><p>Remember the purpose-built idea: AWS does not push one database for everything. Pick the engine whose strengths match the access pattern, and you get better speed and lower cost than forcing every workload into one product.</p><h3 id=\"s-rds-aurora\">Amazon RDS and Aurora</h3><ul><li><strong>What it is:</strong> <strong>Amazon RDS (Relational Database Service)</strong> runs familiar engines for you: MySQL, PostgreSQL, MariaDB, Oracle, SQL Server and Db2. <strong>Amazon Aurora</strong> is AWS's own cloud-built MySQL- and PostgreSQL-compatible engine, with higher performance and storage that automatically grows and is copied across three AZs.</li><li><strong>Use it when:</strong> you need a traditional relational database for an app, with less admin work. Choose Aurora for higher performance and availability.</li><li><strong>Remember for the exam:</strong> You cannot log in to the underlying OS of RDS. Aurora is up to about five times faster than standard MySQL and three times faster than PostgreSQL. Aurora Serverless adjusts capacity automatically.</li></ul><p><strong>Multi-AZ vs read replicas</strong> is a favourite exam contrast:</p><div class=\"tw\"><table><thead><tr><th></th><th>Multi-AZ</th><th>Read replica</th></tr></thead><tbody><tr><td>Purpose</td><td>High availability and failover</td><td>Performance: spread read traffic</td></tr><tr><td>How it works</td><td>A standby copy in another AZ takes over automatically</td><td>Extra copies that serve reads only</td></tr><tr><td>Use when</td><td>You cannot afford downtime</td><td>Reports and readers overload the database</td></tr></tbody></table></div><h3 id=\"s-dynamo-cache\">DynamoDB and caching</h3><ul><li><strong>What it is:</strong> <strong>Amazon DynamoDB</strong> is a serverless NoSQL key-value and document database. It delivers single-digit-millisecond performance at any scale, with multi-AZ copies by default and optional global tables.</li><li><strong>Use it when:</strong> you need very fast, massive-scale lookups such as shopping carts, sessions or leaderboards.</li><li><strong>Remember for the exam:</strong> Fully managed and serverless; no servers to choose. Not for complex joins.</li></ul><ul><li><strong>What it is:</strong> <strong>Amazon ElastiCache</strong> is a managed in-memory cache (Redis OSS or Valkey, and Memcached). <strong>Amazon MemoryDB</strong> is a durable, Redis-compatible in-memory database.</li><li><strong>Use it when:</strong> you want microsecond responses, for example caching the front-page query so the main database is not hit every time.</li><li><strong>Remember for the exam:</strong> In-memory = very fast. ElastiCache is a cache; MemoryDB is used as a primary database.</li></ul><h3 id=\"s-special\">Analytics and specialised databases</h3><ul><li><strong>Amazon Redshift:</strong> a managed data warehouse for analytics across huge amounts of data (OLAP, not day-to-day transactions).</li><li><strong>Amazon DocumentDB:</strong> JSON document database compatible with MongoDB.</li><li><strong>Amazon Neptune:</strong> graph database for highly connected data, like social networks or fraud detection.</li><li><strong>Amazon Keyspaces:</strong> managed Apache Cassandra-compatible wide-column database.</li><li><strong>Amazon Timestream:</strong> time-series database for IoT and metrics data.</li><li><strong>Amazon QLDB:</strong> a ledger database with an unchangeable history. AWS has announced it is ending support, so treat it as a legacy item; Amazon Aurora PostgreSQL is the suggested route for ledger-style needs.</li></ul><h3 id=\"s-migration\">Moving databases: DMS and SCT</h3><ul><li><strong>What it is:</strong> <strong>AWS Database Migration Service (DMS)</strong> moves data from one database to another quickly and securely, with the source staying live. The <strong>AWS Schema Conversion Tool (SCT)</strong> converts the schema and code when the engines differ, for example Oracle to PostgreSQL.</li><li><strong>Use it when:</strong> you move an on-premises database to AWS, or switch engines (heterogeneous migration).</li><li><strong>Remember for the exam:</strong> Same engine: DMS alone is enough. Different engine: SCT plus DMS.</li></ul><h3 id=\"s-common-traps\">Common traps</h3><ul><li><strong>Multi-AZ vs read replica:</strong> Multi-AZ is for availability; read replicas are for read performance.</li><li><strong>RDS vs Aurora:</strong> Aurora is the AWS-built, higher-performing option; RDS offers many familiar engines.</li><li><strong>DynamoDB vs RDS:</strong> key-value at huge scale = DynamoDB; joins and SQL = RDS or Aurora.</li><li><strong>Redshift is not a transactional app database:</strong> it is for analytics.</li><li><strong>ElastiCache vs DynamoDB:</strong> a cache speeds up another database; DynamoDB is itself the database.</li><li><strong>DocumentDB vs DynamoDB:</strong> DocumentDB mimics MongoDB; DynamoDB is key-value and serverless.</li></ul><h3 id=\"s-decision-tree\">Decision tree</h3><pre class=\"diagram\"><code>If the question says...                        -&gt; pick\n-----------------------------------------------------------\nManaged MySQL, PostgreSQL, Oracle, SQL Server      -&gt; RDS\nCloud-built, high-performance relational           -&gt; Aurora\nKey-value, single-digit millisecond, serverless    -&gt; DynamoDB\nMicrosecond cache in front of a database           -&gt; ElastiCache\nData warehouse, analytics, petabytes               -&gt; Redshift\nMongoDB-compatible                                 -&gt; DocumentDB\nGraph, relationships between data                  -&gt; Neptune\nAutomatic failover to another AZ                   -&gt; RDS Multi-AZ\nOffload read traffic                               -&gt; Read replica\nMove a database to AWS, keep it online             -&gt; DMS\nConvert schema between different engines           -&gt; Schema Conversion Tool</code></pre>", "toc": [{"id": "managed", "text": "Managed databases and the big split"}, {"id": "rds-aurora", "text": "Amazon RDS and Aurora"}, {"id": "dynamo-cache", "text": "DynamoDB and caching"}, {"id": "special", "text": "Analytics and specialised databases"}, {"id": "migration", "text": "Moving databases: DMS and SCT"}, {"id": "common-traps", "text": "Common traps"}, {"id": "decision-tree", "text": "Decision tree"}]}, {"id": "ch11", "ch": 11, "title": "Chapter 11: Networking and Delivery (VPC, Route 53, CloudFront)", "short": "How do we build roads and deliver fast?", "topic": "Networking and content delivery", "d": 3, "focus": false, "mins": 8, "html": "<p>PulseWire's video traffic is growing, and Meera has a simple demand: \"Readers in Mumbai and Madrid should see our site load fast, and nobody outside the company should be able to touch our database.\" Kabir shrugs: \"Why can't we just put everything on the internet and add a password?\"</p><p>As the new cloud lead, you need to know how AWS draws private rooms, builds doors between them, and then speeds up delivery to readers worldwide. This chapter is the plumbing of the cloud.</p><h3 id=\"s-vpc-basics\">VPC, subnets and gateways</h3><p>Think of a <strong>Virtual Private Cloud (VPC)</strong> as your own fenced-off office building inside AWS. Nobody gets in unless you build a door. Inside the building you create floors called <strong>subnets</strong>.</p><p><strong>Amazon VPC</strong></p><ul><li><strong>What it is:</strong> a logically isolated private network that you define in an AWS Region. You choose the IP address range and how things connect.</li><li><strong>Use it when:</strong> you launch EC2 instances, databases or other resources that need a network.</li><li><strong>Remember for the exam:</strong> a VPC lives in one Region and spans all its Availability Zones; a subnet lives in exactly one Availability Zone. Every account gets a default VPC so beginners can launch things straight away.</li></ul><p>A subnet is <strong>public</strong> if it has a route to the internet, and <strong>private</strong> if it does not. Web servers usually sit in public subnets; databases sit in private ones.</p><div class=\"tw\"><table><thead><tr><th>Piece</th><th>What it does</th><th>Think of it when</th></tr></thead><tbody><tr><td>Internet gateway (IGW)</td><td>The front door of the VPC. Lets resources in public subnets talk to the internet in both directions.</td><td>Public subnets that must be reachable from the internet.</td></tr><tr><td>NAT gateway</td><td>A one-way exit. Lets private resources reach out (for example to download updates) but blocks outsiders from starting a connection in. It sits in a public subnet.</td><td>Private subnets that need outbound internet only.</td></tr><tr><td>Route table</td><td>The set of signposts that says where traffic for each destination goes. Each subnet is linked to one.</td><td>Deciding whether a subnet is public (route to the IGW) or private.</td></tr><tr><td>Security group</td><td>A firewall at the instance level; allow rules only; stateful.</td><td>Controlling who can reach one server.</td></tr><tr><td>Network ACL</td><td>A firewall at the subnet level; allow and deny rules; stateless.</td><td>An extra subnet-wide layer, or blocking a specific address.</td></tr></tbody></table></div><blockquote class=\"tip\">A subnet is public only because its route table points to an internet gateway. The word \"public\" is not a setting you tick; it comes from the route.</blockquote><h3 id=\"s-connect-private\">Connecting privately: endpoints, peering, Transit Gateway</h3><p>Sometimes traffic should never touch the public internet. AWS gives you several ways to link networks and services privately.</p><p><strong>VPC endpoints and AWS PrivateLink</strong></p><ul><li><strong>What it is:</strong> a private doorway from your VPC to an AWS service (or another company's service) without going through the internet gateway or NAT. A <em>gateway endpoint</em> covers S3 and DynamoDB and is free; an <em>interface endpoint</em> is powered by PrivateLink and covers many other services.</li><li><strong>Use it when:</strong> private servers must reach S3 or another service but must not use the internet.</li><li><strong>Remember for the exam:</strong> the keyword is \"keep traffic on the AWS network\" or \"no internet access\".</li></ul><p><strong>VPC peering</strong></p><ul><li><strong>What it is:</strong> a direct private link between two VPCs, in the same or different accounts or Regions.</li><li><strong>Use it when:</strong> you need to connect a small number of VPCs.</li><li><strong>Remember for the exam:</strong> p
