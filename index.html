
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AWS Cert Path — SAA-C03 and CLF-C02 study guides, practice and mock exams</title>
<meta name="description" content="Free, beginner-friendly study paths for AWS certifications: Solutions Architect – Associate (SAA-C03) and Cloud Practitioner (CLF-C02). Lessons, practice questions with every option explained, and timed 65-question mock exams.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FA; --bg2:#FFFFFF; --surface:#FFFFFF; --surface2:#F0F3F7; --sunk:#EBEFF4;
  --line:#E0E5EC; --line2:#C9D1DC; --ink:#111823; --ink2:#2E3A4A; --muted:#5D6878; --label:#2F5DA8;
  --accent:#1F4E99; --accent-ink:#FFFFFF; --accent-soft:#E8EFFA; --link:#1F4E99;
  --hl:#EEF4FC; --hl-line:#8FB0E0; --ready:#EEF8F2; --ready-line:#9ACFB2; --green:#16804F;
  --amber:#A65F00; --amber-soft:#FBEFD9; --ok:#16804F; --ok-soft:#E3F3EA; --bad:#B0342C; --bad-soft:#FBE7E5;
  --d1:#2F6FE0; --d2:#16975F; --d3:#7A4BD8; --d4:#C77A10;
  --shadow:0 6px 18px rgba(31,78,153,.18);
  --display:"Space Grotesk",-apple-system,"Segoe UI",Roboto,sans-serif;
  --sans:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:4px;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#10151C; --bg2:#0B0F14; --surface:#171D26; --surface2:#1C2330; --sunk:#131922;
  --line:#252D39; --line2:#36404F; --ink:#E7ECF2; --ink2:#C3CCD7; --muted:#8E99A8; --label:#8DB3E8;
  --accent:#A8C7F2; --accent-ink:#0D1A2C; --accent-soft:#1A2638; --link:#9DC0F0;
  --hl:#172539; --hl-line:#4A6C99; --ready:#11231C; --ready-line:#2B5C45; --green:#4BD18B;
  --amber:#E9A94B; --amber-soft:#2E2412; --ok:#4BD18B; --ok-soft:#10291D; --bad:#F07A70; --bad-soft:#341716;
  --d1:#4C86F0; --d2:#2DBE7E; --d3:#9B6CF0; --d4:#F0A030;
  --shadow:0 6px 22px rgba(168,199,242,.22); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#10151C; --bg2:#0B0F14; --surface:#171D26; --surface2:#1C2330; --sunk:#131922;
  --line:#252D39; --line2:#36404F; --ink:#E7ECF2; --ink2:#C3CCD7; --muted:#8E99A8; --label:#8DB3E8;
  --accent:#A8C7F2; --accent-ink:#0D1A2C; --accent-soft:#1A2638; --link:#9DC0F0;
  --hl:#172539; --hl-line:#4A6C99; --ready:#11231C; --ready-line:#2B5C45; --green:#4BD18B;
  --amber:#E9A94B; --amber-soft:#2E2412; --ok:#4BD18B; --ok-soft:#10291D; --bad:#F07A70; --bad-soft:#341716;
  --d1:#4C86F0; --d2:#2DBE7E; --d3:#9B6CF0; --d4:#F0A030;
  --shadow:0 6px 22px rgba(168,199,242,.22); color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg2)}
a{color:var(--link);text-decoration-thickness:1px;text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.lbl{font:500 11.5px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--label)}
.lbl.m{color:var(--muted)}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;letter-spacing:-.01em;margin:0;font-weight:600}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg2);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:24px;height:72px;max-width:none}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font:600 18px var(--display);white-space:nowrap}
.logo{font:700 15px/1 var(--display);letter-spacing:-.02em;padding:5px 7px 4px;background:var(--accent);color:var(--accent-ink);transform:skew(-6deg);border-radius:2px}
.certpill{font:500 11.5px var(--mono);letter-spacing:.1em;padding:9px 12px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:10px}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;align-items:center}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 6px;color:var(--ink2);text-decoration:none;font:500 14.5px var(--display);white-space:nowrap;border-bottom:2px solid transparent}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.nav .sep{width:1px;height:16px;background:var(--line2);margin:0 8px}
.tools{display:flex;align-items:center;gap:10px}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;background:transparent;border:1px solid transparent;color:var(--ink2);cursor:pointer;border-radius:var(--r)}
.iconbtn:hover{border-color:var(--line2);color:var(--ink)}
.theme-dark{display:none}
:root[data-theme="dark"] .theme-dark{display:block} :root[data-theme="dark"] .theme-light{display:none}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .theme-dark{display:block} :root:not([data-theme="light"]) .theme-light{display:none} }

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 18px;border-radius:var(--r);border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:600 14px var(--display);text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.light{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn.lg{min-height:48px;padding:0 32px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none;box-shadow:none}

main{display:block;padding-bottom:72px}
.page{padding-top:40px}
.crumb{font:500 11.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
.crumb a{color:var(--muted);text-decoration:none}
.crumb b{color:var(--label);font-weight:500}

/* footer */
footer{background:var(--bg2);border-top:1px solid var(--line)}
.ft{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px;padding:36px 32px;max-width:1240px;margin:0 auto}
.ft .b{font:500 15px var(--display)}
.ft .c{font:500 11px var(--mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-top:6px}
.ft nav{display:flex;flex-wrap:wrap;gap:12px 28px}
.ft nav a{font:500 11.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);text-decoration:none}
.ft nav a:hover{color:var(--ink)}
.ft2{border-top:1px solid var(--line);text-align:center;padding:16px 32px;font:500 11.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* home head */
.jhead{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding:36px 0 28px}
.jhead h1{font-size:clamp(34px,4.6vw,46px);margin:6px 0 6px;letter-spacing:-.02em}
.jhead .sub{font:500 17px var(--display);color:var(--ink2)}

/* journey cards */
.jcards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:relative}
.jcard{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);padding:20px 20px 16px;min-height:228px;color:var(--ink);text-decoration:none}
a.jcard:hover{border-color:var(--line2)}
.jcard .h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.jcard h3{font-size:18px}
.jcard .h svg{color:var(--ink2)}
.jcard p{margin:0 0 12px;color:var(--ink2);font-size:14px;line-height:1.55}
.jcard .stat{font:600 20px var(--display);margin:auto 0 2px}
.jcard .stat small{display:block;font:400 13px var(--sans);color:var(--muted)}
.jcard .f{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.jcard .stat+.f{margin-top:12px}
.jcard.hl{background:var(--hl);border-color:var(--hl-line)}
.jcard.ready{background:var(--ready);border-color:var(--ready-line)}
.jcard.ready .h svg{color:var(--green)}
.jcard.ready .ext{color:var(--green);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;margin-top:auto;padding-bottom:12px}
.jcard.done .h svg{color:var(--green)}
.jcard .arrow{position:absolute;right:-17px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--bg);border:1px solid var(--line2);display:grid;place-items:center;z-index:2;color:var(--ink2)}
.prog{height:3px;background:var(--line);margin:10px 0 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}

/* about */
.about{max-width:860px;padding-top:56px;margin-top:56px;border-top:1px solid var(--line)}
.about h2{font-size:28px;margin:8px 0 18px}
.about h3{font-size:20px;margin:44px 0 14px}
.about p{color:var(--ink2);font-size:16px;line-height:1.7;margin:0 0 14px;max-width:72ch}
.facts{width:100%;border-collapse:collapse;border:1px solid var(--line);background:var(--surface);font-size:14px}
.facts th,.facts td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.facts th{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);width:200px;font-weight:500}
.facts tr:last-child th,.facts tr:last-child td{border-bottom:0}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.bpd{margin:26px 0 0}
.bpd h4{font-size:16px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bpd h4 .sq{width:10px;height:10px;display:inline-block}
.bpd h4 .w{font:500 12px var(--mono);color:var(--muted);font-weight:500;letter-spacing:0}
.bpd a{display:flex;justify-content:space-between;gap:16px;padding:6px 0;color:var(--ink2);text-decoration:none;font-size:14.5px}
.bpd a:hover{color:var(--ink)}
.bpd a span:last-child{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plan article{background:var(--surface);border:1px solid var(--line);padding:18px 20px}
.plan h4{font-size:16px;margin:6px 0 8px}
.plan ul{margin:0;padding-left:18px;color:var(--ink2);font-size:14.5px}
.plan li{margin:4px 0}
.faq{display:grid;gap:12px}
.faq details{background:var(--surface);border:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;padding:20px 22px;font:600 15px var(--display);display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";width:8px;height:8px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);margin-top:4px;transition:transform .15s}
.faq details[open] summary::after{transform:rotate(-135deg);margin-top:8px}
.faq details p{margin:0;padding:0 22px 20px;color:var(--ink2);font-size:15px}

/* shell with curriculum sidebar */
.shell{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:calc(100vh - 72px)}
.shell.collapsed{grid-template-columns:0 minmax(0,1fr)}
.sbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);align-self:start;height:calc(100vh - 72px);background:var(--bg2);border-right:1px solid var(--line);overflow:hidden}
.sbar .in{height:100%;overflow-y:auto;padding:28px 20px 40px 24px;width:288px}
.shell.collapsed .sbar .in{visibility:hidden}
.sbtoggle{position:absolute;right:-14px;top:24px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);background:var(--bg);display:grid;place-items:center;cursor:pointer;z-index:3;color:var(--ink2)}
.sbwrap{position:relative}
.shell.collapsed .sbtoggle svg{transform:rotate(180deg)}
.sp-row{display:flex;justify-content:space-between;font:500 12px var(--mono);color:var(--ink2);margin:14px 0 6px}
.sbar .prog{margin:0 0 28px}
.sbar .ov{display:block;font:600 15px var(--display);color:var(--link);text-decoration:none;margin:14px 0 10px}
.sbar .ov[aria-current="page"]{color:var(--ink)}
.cg{margin:4px 0}
.cg summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:10px 22px 1fr 14px;gap:8px;align-items:start;padding:7px 0;font:600 14.5px/1.35 var(--display);color:var(--ink)}
.cg summary::-webkit-details-marker{display:none}
.cg summary .dot{width:7px;height:7px;border-radius:50%;margin-top:6px}
.cg summary .n{font:500 12px/1.9 var(--mono);color:var(--muted);font-weight:500}
.cg summary .cv{width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);margin-top:6px}
.cg[open] summary .cv{transform:rotate(-135deg);margin-top:9px}
.cg ol{list-style:none;margin:2px 0 10px 14px;padding:0 0 0 10px;border-left:1px solid var(--line)}
.cg li a{display:grid;grid-template-columns:30px 1fr 12px;gap:6px;align-items:start;padding:6px 6px;color:var(--ink2);text-decoration:none;font-size:14px;line-height:1.4}
.cg li a:hover{color:var(--ink)}
.cg li a[aria-current="page"]{color:var(--link);background:var(--accent-soft)}
.cg li a .n{font:500 12px/1.65 var(--mono);color:var(--muted)}
.tick{width:12px;height:12px;border-radius:50%;border:1px solid var(--line2);margin-top:3px}
.tick.on{background:var(--green);border-color:var(--green)}
.mainc{min-width:0;padding:40px 48px 0}
.mainc .inner{max-width:960px}

/* learn overview */
.lhead h1{font-size:clamp(28px,3.4vw,34px);margin-bottom:10px}
.lhead .sub{font-size:17px;color:var(--ink2);margin:0 0 14px}
.lhead .meta{font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-bottom:22px}
.lhead p{color:var(--ink2);max-width:68ch;margin:0 0 36px}
.dcards{display:grid;gap:16px}
.dcard{display:block;background:var(--surface);border:1px solid var(--line);padding:22px;color:var(--ink);text-decoration:none}
.dcard:hover{border-color:var(--line2)}
.dcard .h{display:flex;align-items:center;gap:12px;justify-content:space-between}
.dcard .h .l{display:flex;align-items:center;gap:12px}
.dcard h3{font-size:18px}
.badge{font:600 11.5px var(--mono);padding:3px 6px;color:#fff;letter-spacing:.02em}
.dcard .w{font:500 12px var(--mono);color:var(--ink2)}
.dcard p{margin:10px 0 0;color:var(--ink2);font-size:15px}
.dcard .ls{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:2px}
.dcard .ls a{display:grid;grid-template-columns:36px 1fr auto;gap:10px;padding:6px 0;color:var(--ink2);text-decoration:none;font-size:14.5px}
.dcard .ls a:hover{color:var(--link)}
.dcard .ls .n{font:500 12px/1.9 var(--mono);color:var(--muted)}
.dcard .ls .r{font:500 12px var(--mono);color:var(--muted);display:flex;gap:10px;align-items:center;white-space:nowrap}
.dcard .cnt{font:500 11.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-top:14px}
.ctaband{margin-top:48px;background:var(--hl);border:1px solid var(--hl-line);padding:32px;display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center}
.ctaband h2{font-size:24px;margin-bottom:8px}
.ctaband p{margin:0;color:var(--ink2);max-width:60ch}

/* reader */
.reader{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:48px}
.toc{position:sticky;top:112px;align-self:start;font-size:13.5px;max-height:calc(100vh - 140px);overflow:auto}
.toc .lbl{margin-bottom:12px;display:block}
.toc button{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid var(--line);padding:5px 0 5px 12px;color:var(--muted);cursor:pointer;line-height:1.35}
.toc button:hover{color:var(--ink)}
.toc button.on{border-left-color:var(--accent);color:var(--ink)}
.article{max-width:74ch;min-width:0}
.article h1{font-size:clamp(28px,3.4vw,38px);margin:4px 0 10px;letter-spacing:-.02em}
.article .sub{color:var(--muted);font-size:14px;margin-bottom:30px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.prose{font-size:16.5px;line-height:1.72;color:var(--ink2)}
.prose p{margin:0 0 1.05em}
.prose strong{color:var(--ink);font-weight:600}
.prose h3{font-size:22px;margin:2.2em 0 .7em;color:var(--ink)}
.prose h4{font-size:18px;margin:1.6em 0 .5em;color:var(--ink)}
.prose ul,.prose ol{padding-left:1.3em;margin:0 0 1.1em}
.prose li{margin:.35em 0}
.prose code{font:13.5px var(--mono);background:var(--surface2);padding:1px 5px;color:var(--ink)}
.prose pre{background:var(--bg2);border:1px solid var(--line);padding:16px 18px;overflow-x:auto;margin:0 0 1.3em;font:13px/1.6 var(--mono);color:var(--ink)}
.prose pre code{background:none;padding:0;font-size:inherit}
.prose .tw{overflow-x:auto;margin:0 0 1.4em;border:1px solid var(--line);background:var(--surface)}
.prose table{border-collapse:collapse;font-size:14px;line-height:1.5;min-width:100%}
.prose th,.prose td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.prose th{background:var(--surface2);font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.prose td{color:var(--ink2)}
.prose tr:last-child td{border-bottom:0}
.prose blockquote{margin:0 0 1.3em;padding:14px 18px;border-left:3px solid var(--line2);background:var(--surface)}
.prose blockquote p:last-child{margin-bottom:0}
.prose blockquote.voice{border-left-color:var(--amber);font-style:italic}
.prose blockquote.voice .who{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;font-style:normal;color:var(--amber);margin-right:8px}
.prose blockquote.tip{border-left-color:var(--accent);background:var(--hl);color:var(--ink)}
.focus{display:inline-block;vertical-align:middle;font:500 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--amber);border:1px solid var(--amber);padding:4px 6px;margin-left:8px}
.dtag{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono);color:var(--ink2)}
.dtag i{width:8px;height:8px;display:inline-block}
.lfoot{margin-top:48px;padding-top:24px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.pn a{display:block;padding:14px 16px;border:1px solid var(--line);text-decoration:none;color:var(--ink);background:var(--surface);font:600 15px var(--display)}
.pn a:hover{border-color:var(--line2)}
.pn small{display:block;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.pn .nx{text-align:right;grid-column:2}
.mobile-cur{display:none}

/* question */
.qcard{background:var(--surface);border:1px solid var(--line);padding:24px;margin:0 0 16px}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 16px;font:500 11.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;align-items:center}
.qmeta .dtag{text-transform:none;letter-spacing:0}
.qtext{font-size:16.5px;line-height:1.65;margin:0 0 6px;max-width:74ch;color:var(--ink)}
.qsel{font:600 14px var(--display);margin:10px 0 16px;color:var(--label)}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;line-height:1.55;font-size:15px;color:var(--ink);transition:border-color .12s,background .12s;border-radius:var(--r)}
.opt:not([disabled]):hover{border-color:var(--line2)}
.opt .ltr{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font:500 12px var(--mono);color:var(--muted);margin-top:-2px}
.opt.multi .ltr{border-radius:4px}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .ltr{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .ltr{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .ltr{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.opt .why{display:block;margin-top:6px;font-size:14px;color:var(--ink2)}
.opt .why b{font-weight:600;color:var(--ink)}
.qact{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.verdict{font:600 16px var(--display);display:flex;align-items:center;gap:8px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.reflex{margin-top:14px;padding:12px 14px;background:var(--hl);border-left:3px solid var(--accent);font-size:14.5px;color:var(--ink)}
.reflex b{font-weight:600}
.practice-block{margin-top:56px}
.practice-block h2{font-size:24px;margin:6px 0 6px}

/* generic page head (diagnostic, practice, results) */
.phead{padding:40px 0 24px}
.phead h1{font-size:clamp(30px,4vw,42px);letter-spacing:-.02em}
.phead p{color:var(--ink2);margin:12px 0 0;max-width:66ch;font-size:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
.chip{min-height:34px;padding:0 14px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font:500 13px var(--display);display:inline-flex;align-items:center;gap:8px;color:var(--ink2);border-radius:var(--r)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip i{width:8px;height:8px}
.progress{height:3px;background:var(--line);overflow:hidden;margin:8px 0 20px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.two{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);padding:22px}
.panel h3{font-size:17px;margin-bottom:14px}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);text-align:right}
.bar{height:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%}
.dbars{display:grid;gap:16px}
.dbar .lb{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;margin-bottom:7px;flex-wrap:wrap}
.dbar .lb > span:last-child{font-family:var(--mono);color:var(--muted);white-space:nowrap;font-size:12.5px}
.pill{display:inline-block;font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 7px;border:1px solid currentColor}
.pill.ok{color:var(--ok);background:var(--ok-soft)} .pill.bad{color:var(--bad);background:var(--bad-soft)}
.empty{padding:40px;text-align:center;background:var(--surface);border:1px dashed var(--line2);color:var(--ink2)}

/* mock landing */
.mock{max-width:780px;margin:0 auto;padding-top:40px;text-align:center}
.mock .crumb{text-align:left}
.mock h1{font-size:clamp(44px,7vw,68px);letter-spacing:-.03em;margin:10px 0 22px}
.mock .intro{font-size:18px;line-height:1.65;color:var(--ink2);max-width:540px;margin:0 auto}
.stats{display:flex;justify-content:center;flex-wrap:wrap;gap:16px 40px;margin:40px 0 36px}
.stats b{display:block;font:600 32px/1 var(--display);letter-spacing:-.02em;margin-bottom:10px}
.stats span{font:500 11.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.mock .acts{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-bottom:56px}
.box{text-align:left;background:var(--surface);border:1px solid var(--line);padding:30px 32px;margin-bottom:24px}
.box h2{font-size:20px;margin-bottom:14px}
.box ul{margin:0 0 16px;padding-left:20px;color:var(--ink2);font-size:16px}
.box li{margin:7px 0}
.box p{color:var(--ink2);font-size:14.5px;margin:0 0 12px}
.box.icon{display:grid;grid-template-columns:28px 1fr;gap:10px}
.box.icon svg{color:var(--green);margin-top:2px}
.foot-note{font-size:12.5px;color:var(--ink2);max-width:460px;margin:12px auto 0;line-height:1.5}
table.att{width:100%;border-collapse:collapse;font-size:14px}
table.att th,table.att td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left}
table.att th{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
table.att td.mono{font-family:var(--mono)}

/* exam */
.exam{min-height:100vh;display:flex;flex-direction:column}
.ebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg2);border-bottom:1px solid var(--line)}
.ebar .wrap{display:flex;align-items:center;gap:16px;height:64px}
.ebar .title{font:600 16px var(--display);white-space:nowrap;display:flex;align-items:center;gap:10px}
.ebar .count{font:500 11.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.timer{font:500 17px var(--mono);padding:6px 12px;background:var(--surface);border:1px solid var(--line);min-width:96px;text-align:center}
.timer.low{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.ebar .sp{flex:1}
.ebody{flex:1;padding:32px 0 120px}
.ebody .wrap{max-width:880px}
.efoot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.efoot .wrap{max-width:880px;display:flex;align-items:center;gap:10px;height:66px}
.efoot .sp{flex:1}
.flagbtn[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.grid-nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.grid-nav button{height:40px;border:1px solid var(--line2);background:var(--surface);font:500 12.5px var(--mono);cursor:pointer;position:relative;color:var(--ink2);border-radius:var(--r)}
.grid-nav button.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.grid-nav button.cur{outline:2px solid var(--accent);outline-offset:1px}
.grid-nav button.flg::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted);margin:12px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border:1px solid var(--line2);display:inline-block}
dialog{border:1px solid var(--line2);padding:0;max-width:540px;width:calc(100% - 32px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(5,8,12,.6)}
dialog .db{padding:24px}
dialog h2{font-size:20px;margin-bottom:8px}
dialog .da{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--line)}
.navpanel{margin-top:28px}
.navpanel summary{font:500 11.5px var(--mono);letter-spacing:.12em;text-transform:uppercase}

/* results */
.score{display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:center;background:var(--surface);border:1px solid var(--line);padding:28px}
.score .big{font:600 64px/1 var(--display);letter-spacing:-.03em}
.score .big small{font:500 18px var(--mono);color:var(--muted)}
.scale{position:relative;height:8px;background:var(--line);margin:18px 0 8px}
.scale i{position:absolute;left:0;top:0;bottom:0}
.scale .pm{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.scale-l{position:relative;height:18px;font:500 11.5px var(--mono);color:var(--muted)}
.scale-l span{position:absolute;top:0;white-space:nowrap}
.rv details{background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
.rv summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:14px 18px}
.rv summary::-webkit-details-marker{display:none}
.rv summary .n{font:500 13px var(--mono);color:var(--muted)}
.rv summary .q{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:14.5px;color:var(--ink2)}
.rv details .qcard{border:0;border-top:1px solid var(--line);margin:0}
h2.sec{font-size:22px;margin:44px 0 6px}

@media (max-width:1180px){ .reader{grid-template-columns:minmax(0,1fr)} .toc{display:none} }
@media (max-width:1060px){
  .jcards{grid-template-columns:1fr 1fr;gap:12px}
  .jcard:nth-child(2) .arrow{display:none}
}
@media (max-width:900px){
  .wrap{padding:0 20px}
  .shell,.shell.collapsed{grid-template-columns:minmax(0,1fr)}
  .sbwrap{display:none}
  .mobile-cur{display:block;margin:0 0 24px;background:var(--surface);border:1px solid var(--line)}
  .mobile-cur > summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font:600 14px var(--display)}
  .mobile-cur > summary::-webkit-details-marker{display:none}
  .mobile-cur .in{padding:0 16px 12px}
  .mainc{padding:28px 20px 0}
  .two{grid-template-columns:1fr}
  .plan{grid-template-columns:1fr}
  .score{grid-template-columns:1fr;gap:16px}
  .jhead{flex-direction:column}
}
@media (max-width:640px){
  .top .wrap{gap:4px 10px;flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:4px}
  .top .tools .btn{display:none}
  .nav{order:3;flex-basis:100%;margin:0 -6px}
  .nav .sep{display:none}
  .nav a{padding:8px 6px;font-size:14px}
  .tools{margin-left:auto}
  .jcards{grid-template-columns:1fr}
  .jcard{min-height:0}
  .jcard .arrow{right:50%;top:auto;bottom:-17px;transform:translateX(50%) rotate(90deg)}
  .jcard:nth-child(2) .arrow{display:grid}
  .facts th{width:auto;display:block;border-bottom:0;padding-bottom:0}
  .facts td{display:block}
  .facts tr{display:block;border-bottom:1px solid var(--line)}
  .facts tr td{border-bottom:0}
  .qcard{padding:18px}
  .opt{padding:12px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:28px 12px}
  .box{padding:22px 20px}
  .ctaband{padding:24px}
  .pn{grid-template-columns:1fr}.pn .nx{grid-column:1}
  .ebar .title{display:none}
  .ebar .count{display:none}
  .dcard .ls a{grid-template-columns:32px 1fr}
  .dcard .ls .r{grid-column:2}
  .ft,.ft2{padding-left:20px;padding-right:20px}
}

.certsw{position:relative}
.certsw>summary{list-style:none;cursor:pointer;user-select:none}
.certsw>summary::-webkit-details-marker{display:none}
.certsw .cv{width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);margin-top:-3px}
.certsw[open]>summary{border-color:var(--accent)}
.certmenu{position:absolute;top:calc(100% + 6px);left:0;min-width:300px;background:var(--surface);border:1px solid var(--line2);box-shadow:0 12px 28px rgba(17,24,35,.16);z-index:60;padding:6px}
.certmenu a{display:block;padding:10px 12px;color:var(--ink);text-decoration:none}
.certmenu a:hover{background:var(--surface2)}
.certmenu a[aria-current="true"]{background:var(--accent-soft)}
.certmenu b{display:block;font:500 12px var(--mono);letter-spacing:.1em}
.certmenu span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.certmenu .lbl{padding:6px 12px 4px}
.prose{overflow-wrap:break-word}
.prose img,.prose svg{max-width:100%;height:auto}
.qtext,.opt{overflow-wrap:break-word}
dialog .da{flex-wrap:wrap}

/* responsive: header collapses to two rows before the nav runs out of room */
@media (max-width:1060px){
  .top .wrap{gap:16px}
  .top .tools .btn{display:none}
}
@media (max-width:860px){
  .top .wrap{position:relative;gap:4px 10px;flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:4px}
  .nav{order:3;flex-basis:100%;margin:0 -6px}
  .nav .sep{display:none}
  .nav a{padding:8px 6px;font-size:14px}
  .tools{margin-left:auto}
  .certsw{position:static}
  .certmenu{left:20px;right:20px;top:calc(100% + 4px);min-width:0}
  .shell{min-height:0}
  .top .tools .btn{display:inline-flex}
}
@media (max-width:640px){
  .wrap{padding:0 16px}
  .mainc{padding:24px 16px 0}
  .ft,.ft2{padding-left:16px;padding-right:16px}
  .certmenu{left:16px;right:16px}
  .top .tools .btn{display:none}
  .nav{justify-content:space-between}
  .jhead{padding:24px 0 20px;gap:16px}
  .jhead .btn{width:100%}
  .about{padding-top:40px;margin-top:40px}
  .about h3{margin-top:36px}
  .faq summary{padding:16px}
  .faq details p{padding:0 16px 16px}
  .phead{padding:28px 0 20px}
  .mock{padding-top:28px}
  .mock h1{font-size:40px}
  .mock .intro{font-size:16px}
  .mock .acts .btn{width:100%;white-space:normal;text-align:center}
  .score{padding:20px}
  .score .big{font-size:52px}
  .scale-l{font-size:10.5px}
  .panel{padding:18px}
  .dcard{padding:18px}
  .ctaband .btn{width:100%}
  .prose{font-size:16px}
  .rv summary{grid-template-columns:28px 1fr;gap:8px 10px;padding:12px 14px}
  .rv summary .pill{grid-column:2;justify-self:start}
  .ebar .wrap{gap:8px;height:56px}
  .timer{min-width:0;font-size:15px;padding:5px 8px}
  .ebar .btn.sm{padding:0 10px}
  .efoot .wrap{gap:8px}
  .efoot .btn{padding:0 12px}
  .ebody{padding:20px 0 104px}
  .att th,.att td{padding:10px 8px}
}
@media (max-width:400px){
  .top .bt{display:none}
  .nav a{padding:8px 4px;font-size:13px}
  .ebar .btn.ghost{font-size:0;gap:0}
  .ebar .btn.ghost::before{content:"Exit";font-size:13px}
  .efoot .flagbtn{font-size:0;gap:0}
  .efoot .flagbtn::before{content:"Flag";font-size:14px}
  .efoot .flagbtn[aria-pressed="true"]::before{content:"Flagged"}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<script>
(window.CERT_DATA=window.CERT_DATA||{}).saa=(function(){
const LESSONS=[{"id":"start","ch":null,"title":"How to use this guide","short":"How to use this guide","topic":"","d":0,"focus":false,"mins":3,"html":"<p>You will learn SAA-C03 by building one company’s platform, PulseWire, from a single server to a global, multi-region system. Every AWS service enters the story only when PulseWire hits a problem that needs it, so you learn the decision, not the definition.<\/p>\n<p><strong>The cast<\/strong><\/p>\n<ul>\n<li><strong>Meera<\/strong> — founder and CEO of PulseWire, a digital news and creator-content startup. She speaks in business requirements: “never lose an article”, “Europe is slow”, “the bill doubled”.<\/li>\n<li><strong>Kabir<\/strong> — the only backend engineer at launch. He builds fast and asks “why can’t we just...?”<\/li>\n<li><strong>You<\/strong> — the solutions architect. Every chapter, you turn Meera’s problem into an architecture decision and defend it against Kabir’s simpler option.<\/li>\n<\/ul>\n<p><strong>How every chapter works<\/strong><\/p>\n<ol>\n<li>A problem arrives (traffic, an outage, an audit, a bill).<\/li>\n<li>We list the options, pick one, and say why the others lose.<\/li>\n<li>A diagram shows how the architecture changed.<\/li>\n<li>Failure scenarios test the decision.<\/li>\n<li>A decision tree compresses the chapter into exam reflexes.<\/li>\n<\/ol>\n<p><strong>What the exam weighs<\/strong><\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Domain<\/th>\n<th>Weight<\/th>\n<th>Where it lives in this story<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1. Secure architectures<\/td>\n<td>30%<\/td>\n<td>Ch 2 networking, Ch 3 security, encryption in Ch 5–6<\/td>\n<\/tr>\n<tr>\n<td>2. Resilient architectures<\/td>\n<td>26%<\/td>\n<td>Ch 4 scaling, Ch 7 decoupling, Ch 12 HA, Ch 13 DR<\/td>\n<\/tr>\n<tr>\n<td>3. High-performing architectures<\/td>\n<td>24%<\/td>\n<td>Ch 5 storage, Ch 6 databases, Ch 8 global, Ch 10 data ingestion<\/td>\n<\/tr>\n<tr>\n<td>4. Cost-optimized architectures<\/td>\n<td>20%<\/td>\n<td>Cost callouts in every chapter, Ch 15 full review<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>The exam has 65 questions (50 scored, 15 unscored), scored 100–1,000 with 720 to pass. Scoring is compensatory, so a strong domain can carry a weaker one, but not by much.<\/p>\n<p><strong>Your weak areas get extra depth<\/strong>: cost optimization (Ch 15 plus a cost note on every service), storage selection (Ch 5 is the longest chapter), data ingestion and transformation (Ch 10), high availability and resilience (Ch 12–13). Sections marked <strong>[Focus]<\/strong> are where to slow down.<\/p>\n<p><strong>Reading a service card<\/strong><\/p>\n<p>Key services get a full card with these fields: <em>Problem it solves · Why PulseWire needs it · How it works · Where it sits · Alternatives · Why we chose it · When NOT to use it · Security impact · Scaling impact · Cost drivers · SAA exam clue · Memory rule.<\/em> Supporting services that are mainly tested as “pick the right one from a family” get a comparison table instead, so you compare them side by side the way the exam does.<\/p>\n<blockquote class=\"tip\"><p>Exam habit to build from page one: read the <strong>last sentence<\/strong> of a question first. It tells you the optimization target — <em>most cost-effective<\/em>, <em>least operational overhead<\/em>, <em>highest availability<\/em>, <em>lowest latency<\/em>. Two answers usually work; the target picks the winner.<\/p>\n<\/blockquote>\n","toc":[]},{"id":"prologue","ch":null,"title":"Prologue: Meera’s brief","short":"Meera’s brief","topic":"","d":0,"focus":false,"mins":3,"html":"<p>PulseWire is a news and creator platform: journalists and verified creators publish articles with images and short videos, readers browse, search, comment and get breaking-news alerts, and editors moderate from an admin portal. Before touching AWS, we pin down what “done” means, because every later choice is judged against these numbers.<\/p>\n<blockquote class=\"voice\"><p><span class=\"who\">Meera<\/span> “We launch in India, then the US and Europe within a year. Breaking news is our product — if we’re down during a big story, we lose the readers forever. And we’re a startup, so don’t hand me a bank’s architecture.”<\/p>\n<\/blockquote>\n<h3 id=\"s-requirements\">Requirements<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Area<\/th>\n<th>Requirement<\/th>\n<th>Why it matters later<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Users<\/td>\n<td>Readers (anonymous + registered), creators, editors, admins<\/td>\n<td>Four identity types: Cognito for customers, IAM Identity Center for staff<\/td>\n<\/tr>\n<tr>\n<td>Traffic<\/td>\n<td>Launch: 100 concurrent. Year 1: 10,000. Year 2: 1M monthly actives, 20× spikes during breaking news<\/td>\n<td>Spiky load means elastic, horizontally scaled, queue-buffered design<\/td>\n<\/tr>\n<tr>\n<td>Read/write mix<\/td>\n<td>~95% reads (articles, images), ~5% writes<\/td>\n<td>Caching and CDN pay off enormously<\/td>\n<\/tr>\n<tr>\n<td>Regions<\/td>\n<td>Primary ap-south-1 (Mumbai); later us-east-1 and eu-west-1<\/td>\n<td>Latency routing, multi-region DR<\/td>\n<\/tr>\n<tr>\n<td>Availability<\/td>\n<td>99.9% for reading articles; 99.5% for the creator portal<\/td>\n<td>Multi-AZ everything on the read path<\/td>\n<\/tr>\n<tr>\n<td>Data<\/td>\n<td>Articles + users + comments (relational), media files (500K images/day at scale), clickstream (~50M events/day), audit logs<\/td>\n<td>Mix of RDS/Aurora, S3, Kinesis, a data lake<\/td>\n<\/tr>\n<tr>\n<td>Durability<\/td>\n<td>Never lose a published article or uploaded media<\/td>\n<td>S3, versioning, backups, cross-region copies<\/td>\n<\/tr>\n<tr>\n<td>Recovery<\/td>\n<td>RPO 15 min, RTO 1 hour for the core site<\/td>\n<td>Drives the DR strategy (Ch 13)<\/td>\n<\/tr>\n<tr>\n<td>Security<\/td>\n<td>Encrypt everything, no public databases, least privilege, protect against DDoS and bots<\/td>\n<td>Private subnets, KMS, WAF, Shield<\/td>\n<\/tr>\n<tr>\n<td>Compliance<\/td>\n<td>GDPR for EU readers, India’s DPDP Act, PII must be discoverable and deletable<\/td>\n<td>Macie, KMS, data residency per region<\/td>\n<\/tr>\n<tr>\n<td>Performance<\/td>\n<td>Article page under 1 s globally; search under 300 ms<\/td>\n<td>CloudFront, ElastiCache, OpenSearch<\/td>\n<\/tr>\n<tr>\n<td>Integrations<\/td>\n<td>Payment gateway for subscriptions, wire-agency feeds (SFTP), email/SMS<\/td>\n<td>Transfer Family, SES/SNS, Secrets Manager<\/td>\n<\/tr>\n<tr>\n<td>AI<\/td>\n<td>Auto-tagging, image moderation, translation, text-to-speech for articles<\/td>\n<td>Comprehend, Rekognition, Translate, Polly<\/td>\n<\/tr>\n<tr>\n<td>Budget<\/td>\n<td>Launch under ~$500/month; costs must grow slower than users<\/td>\n<td>Serverless/managed first, Savings Plans once stable<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3 id=\"s-rto-and-rpo-defined-once\">RTO and RPO, defined once<\/h3>\n<ul>\n<li><strong>RPO (Recovery Point Objective)<\/strong>: how much data you can afford to lose, measured backwards from the failure. RPO 15 min means at most 15 minutes of articles can vanish.<\/li>\n<li><strong>RTO (Recovery Time Objective)<\/strong>: how long you can be down. RTO 1 hour means the site must serve again within an hour.<\/li>\n<\/ul>\n<p>Lower RPO and RTO always cost more. That single sentence answers a surprising number of exam questions.<\/p>\n<p><strong>Domain map:<\/strong> this framing underpins all four domains; it is how the exam writes its scenarios.<\/p>\n","toc":[{"id":"requirements","text":"Requirements"},{"id":"rto-and-rpo-defined-once","text":"RTO and RPO, defined once"}]},{"id":"ch1","ch":1,"title":"Chapter 1: One server, one bad night","short":"One server, one bad night","topic":"","d":2,"focus":false,"mins":3,"html":"<p>Kabir ships v1 the way most startups do: one virtual machine running the web app, the API and MySQL, with uploaded images saved to its local disk.<\/p>\n<pre class=\"diagram\"><code>User\n  ↓  (HTTP, public IP)\nOne server: Nginx + App + MySQL + /uploads folder\n<\/code><\/pre>\n<p><strong>Why it works at first:<\/strong> one thing to deploy, one bill, zero network hops, cheap. For 100 users, it is the right answer. Over-engineering a launch is a real failure mode, and the exam’s cost domain rewards you for not doing it.<\/p>\n<h3 id=\"s-the-night-it-broke\">The night it broke<\/h3>\n<p>Three weeks after launch a cricket story goes viral. Traffic jumps 30×. Here is what failed, in order:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>What broke<\/th>\n<th>The underlying problem<\/th>\n<th>AWS answer (later chapter)<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>CPU hit 100%, pages timed out<\/td>\n<td><strong>Vertical limit<\/strong>: one box can only get so big, and resizing needs a reboot<\/td>\n<td>Horizontal scaling with Auto Scaling + load balancer (Ch 4)<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>MySQL and the app fought for the same RAM<\/td>\n<td><strong>Tiers share fate<\/strong>: a busy app starves the database<\/td>\n<td>Separate managed database tier (Ch 6)<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Kabir restarted the server; site down 6 minutes<\/td>\n<td><strong>Single point of failure<\/strong> (SPOF)<\/td>\n<td>Multiple instances across Availability Zones (Ch 2, 12)<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Disk filled with images; uploads failed<\/td>\n<td><strong>Local storage doesn’t scale or survive<\/strong><\/td>\n<td>S3 for media (Ch 5)<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Nobody knew it was down until users tweeted<\/td>\n<td><strong>No monitoring<\/strong><\/td>\n<td>CloudWatch alarms (Ch 9)<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Last backup was a manual dump from 9 days ago<\/td>\n<td><strong>No automated backups<\/strong><\/td>\n<td>RDS automated backups, AWS Backup (Ch 5, 6)<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>MySQL port 3306 was open to the internet<\/td>\n<td><strong>Network exposure<\/strong><\/td>\n<td>VPC, private subnets, security groups (Ch 2)<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>A deploy with a bug took the whole site down<\/td>\n<td><strong>No safe deployment path<\/strong><\/td>\n<td>Immutable AMIs/containers, rolling deploys behind a load balancer (Ch 4)<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"voice\"><p><span class=\"who\">Meera<\/span> “Fix it so this never happens again, and so we can grow 100× without rewriting.”<\/p>\n<\/blockquote>\n<h3 id=\"s-the-three-principles-we-take-forward\">The three principles we take forward<\/h3>\n<ol>\n<li><strong>Remove single points of failure<\/strong> — at least two of everything that matters, in different failure domains (Availability Zones).<\/li>\n<li><strong>Separate tiers<\/strong> so each scales and fails independently: web/app, data, media, async work.<\/li>\n<li><strong>Make servers disposable<\/strong> (stateless). If any server can die without losing data or sessions, you can scale out, replace, and deploy freely. State goes to managed services: sessions to ElastiCache/DynamoDB, files to S3, data to RDS.<\/li>\n<\/ol>\n<h3 id=\"s-failure-scenario-check\">Failure scenario check<\/h3>\n<ul>\n<li><em>“The app stores user sessions in server memory. After adding a second server behind a load balancer, users get logged out randomly. Best fix?”<\/em> → Move sessions to ElastiCache or DynamoDB (stateless app). <strong>Sticky sessions<\/strong> also “fix” it but make the app stateful again: one dead instance logs out all its users, and load spreads unevenly. The exam prefers externalized state.<\/li>\n<\/ul>\n<p><strong>Domains:<\/strong> 2 (resilient, SPOF removal), 3 (scaling).<\/p>\n","toc":[{"id":"the-night-it-broke","text":"The night it broke"},{"id":"the-three-principles-we-take-forward","text":"The three principles we take forward"},{"id":"failure-scenario-check","text":"Failure scenario check"}]},{"id":"ch2","ch":2,"title":"Chapter 2: Building the neighbourhood (AWS foundation and networking)","short":"Building the neighbourhood","topic":"AWS foundation and networking","d":1,"focus":false,"mins":10,"html":"<p>Before moving a single server, we decide <em>where<\/em> things live and <em>who can reach them<\/em>. Networking is where Domain 1 (security) and Domain 2 (resilience) start, and it is heavily tested.<\/p>\n<h3 id=\"s-account-region-availability-zone\">Account, Region, Availability Zone<\/h3>\n<ul>\n<li><strong>AWS account<\/strong>: the hard boundary for billing, permissions and blast radius. PulseWire will end with separate accounts for prod, staging, security/logging and data (Ch 3, Organizations).<\/li>\n<li><strong>Region<\/strong> (e.g. ap-south-1 Mumbai): a geographic area with its own independent set of services. Choose by: data residency/compliance first, then latency to users, service availability, and price (prices differ by region).<\/li>\n<li><strong>Availability Zone (AZ)<\/strong>: one or more data centres with independent power, cooling and networking, connected to the other AZs in the region by low-latency links. <strong>AZs are your unit of high availability.<\/strong> A design that survives “an AZ failure” is the default exam expectation for production.<\/li>\n<li><strong>Edge locations<\/strong>: hundreds of points of presence used by CloudFront, Route 53, Global Accelerator and Shield. They are not where you run servers.<\/li>\n<\/ul>\n<h3 id=\"s-the-target-network\">The target network<\/h3>\n<pre class=\"diagram\"><code>Region ap-south-1 — VPC 10.0.0.0/16\n\n              Internet\n                 │\n          Internet Gateway (IGW)\n                 │\n   ┌──────── AZ-a ────────┐   ┌──────── AZ-b ────────┐\n   │ Public  10.0.0.0/24    │   │ Public  10.0.1.0/24    │\n   │   ALB node, NAT GW-a   │   │   ALB node, NAT GW-b   │\n   │ Private-app 10.0.10/24 │   │ Private-app 10.0.11/24 │\n   │   EC2 / ECS tasks      │   │   EC2 / ECS tasks      │\n   │ Private-db 10.0.20/24  │   │ Private-db 10.0.21/24  │\n   │   RDS primary          │   │   RDS standby          │\n   └────────────────────────┘   └────────────────────────┘\n        Gateway endpoint → S3, DynamoDB (no NAT needed)\n<\/code><\/pre>\n<p>Three tiers × two AZs. Only the load balancer and NAT gateways are reachable from (or reach) the internet directly.<\/p>\n<h3 id=\"s-amazon-vpc\">Amazon VPC<\/h3>\n<ul>\n<li><strong>Problem it solves:<\/strong> Your servers need a private network you control — IP ranges, routing, and who can talk to whom — inside a shared cloud.<\/li>\n<li><strong>Why PulseWire needs it:<\/strong> The database must never be reachable from the internet, and the app servers should only accept traffic from the load balancer.<\/li>\n<li><strong>How it works:<\/strong> A logically isolated network in one Region with a CIDR block (/16 to /28). You carve it into subnets, each pinned to one AZ. AWS reserves 5 IPs in every subnet.<\/li>\n<li><strong>Where it sits:<\/strong> Wraps everything that has a network interface: EC2, RDS, ECS tasks, Lambda (when attached), ElastiCache.<\/li>\n<li><strong>Alternatives:<\/strong> Default VPC (every subnet public — fine for experiments, not production); not using a VPC at all (only possible for fully managed, regional services like S3, DynamoDB, SQS).<\/li>\n<li><strong>Why we chose it:<\/strong> It is the only way to run private compute and databases on AWS.<\/li>\n<li><strong>When NOT to use it:<\/strong> A purely serverless app (API Gateway + Lambda + DynamoDB + S3) needs no custom VPC; attaching Lambda to a VPC then adds NAT cost for no gain.<\/li>\n<li><strong>Security impact:<\/strong> Network segmentation, the base layer of defence in depth. Plan non-overlapping CIDRs now: overlapping ranges block peering and VPN later.<\/li>\n<li><strong>Scaling impact:<\/strong> You can add secondary CIDRs later, but resizing is painful. Start with a /16.<\/li>\n<li><strong>Cost:<\/strong> The VPC itself is free. You pay for NAT gateways, endpoints, public IPv4 addresses, VPN/TGW attachments and cross-AZ data.<\/li>\n<li><strong>SAA exam clue:<\/strong> “isolated network”, “private subnet”, “control inbound and outbound traffic”.<\/li>\n<li><strong>Memory rule:<\/strong> VPC = your fenced plot in one Region; subnets = rooms, each in one AZ.<\/li>\n<\/ul>\n<h3 id=\"s-subnets-route-tables-and-the-internet-gateway\">Subnets, route tables and the Internet Gateway<\/h3>\n<p>A subnet is “public” only because of its <strong>route table<\/strong>: if it has a route <code>0.0.0.0/0 → Internet Gateway<\/code>, it is public. Nothing else makes it public.<\/p>\n<ul>\n<li><strong>Internet Gateway (IGW):<\/strong> one per VPC, horizontally scaled and highly available by AWS, free. It lets resources with public IPs talk to the internet both ways.<\/li>\n<li><strong>Why the ALB is in public subnets:<\/strong> it must receive internet traffic, so its nodes need a route to the IGW.<\/li>\n<li><strong>Why the app servers are private:<\/strong> they only need traffic <em>from the ALB<\/em>. No public IP means no direct attack surface.<\/li>\n<li><strong>Why the database is private, in its own subnets:<\/strong> only the app tier should reach it. Separate DB subnets let you apply a tighter NACL and keep the RDS subnet group clean.<\/li>\n<\/ul>\n<h3 id=\"s-nat-gateway\">NAT Gateway<\/h3>\n<ul>\n<li><strong>Problem it solves:<\/strong> Private instances need <em>outbound<\/em> internet (OS patches, calling the payment gateway API) without being reachable <em>inbound<\/em>.<\/li>\n<li><strong>Why PulseWire needs it:<\/strong> App servers call external news-wire APIs and the payment provider.<\/li>\n<li><strong>How it works:<\/strong> Sits in a public subnet with an Elastic IP. Private subnets route <code>0.0.0.0/0 → NAT GW<\/code>. It translates private source IPs to its public IP; replies come back, unsolicited inbound traffic cannot start.<\/li>\n<li><strong>Where it sits:<\/strong> Public subnet, one per AZ.<\/li>\n<li><strong>Alternatives:<\/strong> NAT instance (an EC2 you manage); VPC endpoints (for AWS services only); egress-only internet gateway (IPv6 only).<\/li>\n<li><strong>Why we chose it:<\/strong> Managed, scales automatically (up to 100 Gbps), no patching. A NAT instance is cheaper but is a SPOF you must patch, scale and fail over yourself, and needs source/destination check disabled.<\/li>\n<li><strong>When NOT to use it:<\/strong> When the only “internet” traffic is to S3 or DynamoDB — use a free gateway endpoint instead.<\/li>\n<li><strong>Security impact:<\/strong> Outbound only. It is not a firewall; filter destinations with AWS Network Firewall if needed.<\/li>\n<li><strong>Scaling impact:<\/strong> A NAT gateway lives in one AZ. <strong>One per AZ<\/strong> for HA, with each private subnet routing to its own AZ’s NAT; a single shared NAT is cheaper but becomes an AZ-level SPOF and adds cross-AZ data charges.<\/li>\n<li><strong>Cost:<\/strong> Hourly charge plus a per-GB processing charge. Large S3 or ECR pulls through NAT are a classic surprise bill.<\/li>\n<li><strong>SAA exam clue:<\/strong> “private subnet instances need to download updates from the internet”, “must not be accessible from the internet”.<\/li>\n<li><strong>Memory rule:<\/strong> NAT = one-way door out; one per AZ for HA.<\/li>\n<\/ul>\n<h3 id=\"s-vpc-endpoints-and-privatelink-focus-cost\">VPC Endpoints and PrivateLink <span class=\"focus\">Focus · cost<\/span><\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Gateway endpoint<\/th>\n<th>Interface endpoint (PrivateLink)<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Services<\/td>\n<td><strong>S3 and DynamoDB only<\/strong><\/td>\n<td>Most AWS services (SQS, KMS, Secrets Manager, ECR, CloudWatch...) and partner/your own services<\/td>\n<\/tr>\n<tr>\n<td>How<\/td>\n<td>Entry in a route table<\/td>\n<td>An ENI with a private IP in your subnet<\/td>\n<\/tr>\n<tr>\n<td>Cost<\/td>\n<td><strong>Free<\/strong><\/td>\n<td>Hourly per AZ + per GB<\/td>\n<\/tr>\n<tr>\n<td>Reach from on-prem / peered VPC<\/td>\n<td>No<\/td>\n<td>Yes<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<ul>\n<li><strong>PulseWire use:<\/strong> App servers upload images to S3 constantly. Through NAT, every GB is charged twice (NAT processing + data). A <strong>gateway endpoint<\/strong> makes S3 traffic private and free. Interface endpoints for Secrets Manager and KMS keep credentials traffic off the internet.<\/li>\n<li><strong>AWS PrivateLink<\/strong> is also how you <strong>expose your own service<\/strong> privately: put it behind a Network Load Balancer, create an endpoint service, and consumers in other VPCs/accounts connect through interface endpoints. It works even with overlapping CIDRs and is one-directional (consumer → provider), unlike peering.<\/li>\n<li><strong>Exam clue:<\/strong> “access S3 from a private subnet without internet” → gateway endpoint. “Expose a service to hundreds of customer VPCs privately” → PrivateLink.<\/li>\n<li><strong>Memory rule:<\/strong> S3/DynamoDB → gateway, free. Everything else → interface, paid.<\/li>\n<\/ul>\n<h3 id=\"s-security-groups-vs-network-acls\">Security Groups vs Network ACLs<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Security Group<\/th>\n<th>Network ACL<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Level<\/td>\n<td>ENI / instance<\/td>\n<td>Subnet<\/td>\n<\/tr>\n<tr>\n<td>State<\/td>\n<td><strong>Stateful<\/strong> — return traffic auto-allowed<\/td>\n<td><strong>Stateless<\/strong> — must allow return traffic (ephemeral ports 1024–65535) explicitly<\/td>\n<\/tr>\n<tr>\n<td>Rules<\/td>\n<td>Allow only<\/td>\n<td>Allow <strong>and deny<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Evaluation<\/td>\n<td>All rules together<\/td>\n<td>Numbered, lowest first, first match wins<\/td>\n<\/tr>\n<tr>\n<td>Can reference<\/td>\n<td>Other security groups<\/td>\n<td>CIDRs only<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>PulseWire chain:<\/strong> <code>sg-alb<\/code> allows 443 from the internet (or only from CloudFront&#39;s managed prefix list) → <code>sg-app<\/code> allows 8080 <strong>from sg-alb<\/strong> → <code>sg-db<\/code> allows 5432 <strong>from sg-app<\/strong>. Referencing SGs instead of IPs means new instances are covered automatically.<\/p>\n<ul>\n<li><strong>When to use a NACL:<\/strong> to <strong>block<\/strong> something — e.g. deny a malicious IP range at the subnet level. Security groups cannot deny.<\/li>\n<li><strong>Exam clue:<\/strong> “block a specific IP address” → NACL (or WAF if it’s HTTP at the edge). “Instance-level, stateful” → SG.<\/li>\n<li><strong>Memory rule:<\/strong> SG = bouncer who remembers your face; NACL = gate list checked both ways.<\/li>\n<\/ul>\n<h3 id=\"s-reaching-private-instances-bastion-vs-session-manager\">Reaching private instances: bastion vs Session Manager<\/h3>\n<p>Kabir wants SSH. A bastion host in a public subnet works but is an attack surface to patch. <strong>AWS Systems Manager Session Manager<\/strong> gives shell access through the SSM agent with IAM auth and full logging, no open port 22, no bastion. The exam prefers it whenever “no inbound ports” or “audit sessions” appears.<\/p>\n<h3 id=\"s-connecting-networks-peering-transit-gateway-vpn-direct-conne\">Connecting networks: peering, Transit Gateway, VPN, Direct Connect<\/h3>\n<p>A year in, PulseWire has a data-science VPC, a shared-services VPC and an office in Gurugram. How do they connect?<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Need<\/th>\n<th>Choose<\/th>\n<th>Key fact<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Two or a few VPCs talk privately<\/td>\n<td><strong>VPC peering<\/strong><\/td>\n<td>Non-transitive (A↔B, B↔C does not give A↔C), no overlapping CIDRs, no per-hour charge<\/td>\n<\/tr>\n<tr>\n<td>Many VPCs + on-prem, hub-and-spoke<\/td>\n<td><strong>Transit Gateway<\/strong><\/td>\n<td>Transitive routing, scales to thousands of VPCs, cross-account via RAM, per-attachment + per-GB cost<\/td>\n<\/tr>\n<tr>\n<td>Office to AWS quickly, encrypted<\/td>\n<td><strong>Site-to-Site VPN<\/strong><\/td>\n<td>IPsec over the internet, up in minutes/hours, ~1.25 Gbps per tunnel, variable latency<\/td>\n<\/tr>\n<tr>\n<td>Consistent, high-bandwidth, private link<\/td>\n<td><strong>Direct Connect (DX)<\/strong><\/td>\n<td>Dedicated line 1/10/100 Gbps; takes weeks to provision; <strong>not encrypted by default<\/strong> (add MACsec or run VPN over DX)<\/td>\n<\/tr>\n<tr>\n<td>Resilient hybrid on a budget<\/td>\n<td><strong>DX primary + VPN backup<\/strong><\/td>\n<td>Classic exam answer for “cost-effective failover for Direct Connect”<\/td>\n<\/tr>\n<tr>\n<td>Individual remote employees<\/td>\n<td><strong>Client VPN<\/strong><\/td>\n<td>OpenVPN-based, per-user<\/td>\n<\/tr>\n<tr>\n<td>Expose one service, not whole networks<\/td>\n<td><strong>PrivateLink<\/strong><\/td>\n<td>See above<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>Exam clues:<\/strong> “quickly” + “encrypted” → VPN. “Consistent network performance”, “large data volumes”, “reduce data transfer cost” → Direct Connect. “Many VPCs, simplify” → Transit Gateway. “Maximum resiliency for DX” → two DX connections at two different DX locations.<\/p>\n<h3 id=\"s-failure-scenarios\">Failure scenarios<\/h3>\n<ol>\n<li><em>Private EC2 cannot reach the internet for updates.<\/em> Check: NAT GW exists <strong>in a public subnet<\/strong>, the private route table points <code>0.0.0.0/0<\/code> to it, and the public subnet routes to the IGW. Wrong answer: &quot;attach an IGW to the private subnet&quot; — that makes it public.<\/li>\n<li><em>AZ-a fails and private instances in AZ-b lose outbound internet.<\/em> They were routing through a single NAT in AZ-a. Fix: one NAT per AZ.<\/li>\n<li><em>Private EC2 needs S3 without internet access, cheapest option.<\/em> Gateway endpoint. Not NAT (costs per GB, uses internet path), not an interface endpoint (works, but costs money).<\/li>\n<li><em>Security group allows the traffic but it still fails.<\/em> Look at the NACL — it is stateless, so outbound ephemeral ports may be blocked.<\/li>\n<li><em>VPC A peers with B, B peers with C; A can’t reach C.<\/em> Peering is non-transitive. Add A↔C peering or move to Transit Gateway.<\/li>\n<\/ol>\n<h3 id=\"s-decision-tree\">Decision tree<\/h3>\n<pre class=\"diagram\"><code>Private resource needs to reach...\n  ├── S3 or DynamoDB → Gateway endpoint (free)\n  ├── Other AWS service privately → Interface endpoint\n  ├── The internet (outbound only) → NAT Gateway (one per AZ)\n  └── Another VPC\n        ├── 1–3 VPCs → Peering\n        ├── Many VPCs / on-prem hub → Transit Gateway\n        └── One service only / overlapping CIDRs → PrivateLink\n\nOn-prem to AWS...\n  ├── Fast to set up, encrypted → Site-to-Site VPN\n  ├── Consistent, high bandwidth → Direct Connect\n  └── Both, resilient and cheap → DX + VPN backup\n\nBlock traffic...\n  ├── Explicit DENY of an IP at subnet → NACL\n  ├── HTTP-layer (SQLi, bots, rate) → WAF\n  └── Allow-list per instance → Security group\n<\/code><\/pre>\n<p><strong>Domains:<\/strong> 1 (network segmentation, external connections), 2 (multi-AZ design), 3 (network topology), 4 (NAT vs endpoints, DX vs VPN cost).<\/p>\n","toc":[{"id":"account-region-availability-zone","text":"Account, Region, Availability Zone"},{"id":"the-target-network","text":"The target network"},{"id":"amazon-vpc","text":"Amazon VPC"},{"id":"subnets-route-tables-and-the-internet-gateway","text":"Subnets, route tables and the Internet Gateway"},{"id":"nat-gateway","text":"NAT Gateway"},{"id":"vpc-endpoints-and-privatelink-focus-cost","text":"VPC Endpoints and PrivateLink"},{"id":"security-groups-vs-network-acls","text":"Security Groups vs Network ACLs"},{"id":"reaching-private-instances-bastion-vs-session-manager","text":"Reaching private instances: bastion vs Session Manager"},{"id":"connecting-networks-peering-transit-gateway-vpn-direct-conne","text":"Connecting networks: peering, Transit Gateway, VPN, Direct Connect"},{"id":"failure-scenarios","text":"Failure scenarios"},{"id":"decision-tree","text":"Decision tree"}]},{"id":"ch3","ch":3,"title":"Chapter 3: Who gets in, and what can they touch? (Security and identity)","short":"Who gets in, and what can they touch?","topic":"Security and identity","d":1,"focus":false,"mins":9,"html":"<p>Security is 30% of the exam, the largest domain. PulseWire has four security questions, and each maps to a different family of services:<\/p>\n<pre class=\"diagram\"><code>1. Who are our STAFF and what can they do in AWS?      → IAM, Identity Center, Organizations\n2. Who are our READERS/CREATORS and how do they log in? → Cognito\n3. How do our SERVERS get permissions and secrets?     → IAM roles, Secrets Manager, KMS\n4. How do we stop and detect ATTACKS?                  → WAF, Shield, GuardDuty, Macie, Inspector...\n<\/code><\/pre>\n<p><strong>Shared responsibility model:<\/strong> AWS secures <em>the cloud<\/em> (hardware, facilities, hypervisor, managed-service internals). You secure what you put <em>in<\/em> the cloud (IAM, data, encryption choices, security groups, OS patches on EC2). The more managed the service, the more AWS takes: on EC2 you patch the OS; on RDS AWS patches the engine; on Lambda you only own code and IAM.<\/p>\n<h3 id=\"s-1-staff-access-iam-roles-and-multiple-accounts\">1. Staff access: IAM, roles and multiple accounts<\/h3>\n<p>Kabir’s first instinct is to create an IAM user with an access key for everyone. Here is how we do it instead:<\/p>\n<ul>\n<li><strong>Root user:<\/strong> enable MFA, delete its access keys, lock it away. Use it only for the handful of tasks that require it.<\/li>\n<li><strong>Policy evaluation:<\/strong> an <strong>explicit Deny always wins<\/strong>, then an explicit Allow, otherwise implicit deny. Memorize this order.<\/li>\n<li><strong>Policy types:<\/strong> identity-based (attached to user/group/role), resource-based (S3 bucket policy, SQS queue policy, KMS key policy — has a <code>Principal<\/code>), permission boundaries (cap what a role <em>can<\/em> be granted), SCPs (cap a whole account).<\/li>\n<li><strong>Least privilege:<\/strong> start narrow, use IAM Access Analyzer to find unused permissions and resources shared outside the account.<\/li>\n<\/ul>\n<p><strong>AWS Organizations + SCPs + Control Tower.<\/strong> PulseWire splits into accounts: Management, Security (GuardDuty/Security Hub admin), Log Archive (CloudTrail), Prod, Staging, Data. <strong>Service Control Policies<\/strong> set the <em>maximum<\/em> permissions in member accounts — e.g. “no one may disable CloudTrail” or “only ap-south-1, us-east-1, eu-west-1 may be used”. SCPs never grant permissions and do not apply to the management account. <strong>Control Tower<\/strong> sets up this whole landing zone with guardrails automatically. Consolidated billing gives one bill and volume discounts across accounts.<\/p>\n<p><strong>IAM Identity Center (successor to AWS SSO)<\/strong> gives editors and engineers one login (federated with Google Workspace, Okta or Active Directory) and maps groups to permission sets in each account. No long-lived IAM users.<\/p>\n<h3 id=\"s-iam-roles-and-sts\">IAM Roles and STS<\/h3>\n<ul>\n<li><strong>Problem it solves:<\/strong> Code and people need AWS permissions without long-lived passwords or access keys that can leak.<\/li>\n<li><strong>Why PulseWire needs it:<\/strong> App servers write to S3 and read from SQS; a Lambda reads DynamoDB; the data team in another account reads the data lake.<\/li>\n<li><strong>How it works:<\/strong> A role is an identity with a policy but no credentials. A trusted entity <em>assumes<\/em> it via <strong>STS<\/strong> and receives temporary credentials (minutes to hours) that rotate automatically. EC2 gets them via an <strong>instance profile<\/strong>; ECS tasks via a <strong>task role<\/strong>; Lambda via its <strong>execution role<\/strong>.<\/li>\n<li><strong>Where it sits:<\/strong> Attached to compute; trust policy says who may assume it.<\/li>\n<li><strong>Alternatives:<\/strong> Access keys in config files or environment variables; IAM users per application.<\/li>\n<li><strong>Why we chose it:<\/strong> Keys in code are the most common real-world AWS breach. Roles have nothing to steal long-term.<\/li>\n<li><strong>When NOT to use it:<\/strong> For your <em>customers<\/em> signing in to your app — that is Cognito’s job.<\/li>\n<li><strong>Security impact:<\/strong> Temporary credentials, auditable in CloudTrail, cross-account access without sharing keys (account B’s role trusts account A).<\/li>\n<li><strong>Scaling impact:<\/strong> One role serves any number of instances.<\/li>\n<li><strong>Cost:<\/strong> Free.<\/li>\n<li><strong>SAA exam clue:<\/strong> “EC2 needs to access S3 securely”, “avoid storing credentials”, “cross-account access”, “temporary credentials”.<\/li>\n<li><strong>Memory rule:<\/strong> Servers wear roles, never carry keys.<\/li>\n<\/ul>\n<h3 id=\"s-2-customer-identity-amazon-cognito\">2. Customer identity: Amazon Cognito<\/h3>\n<ul>\n<li><strong>Problem it solves:<\/strong> Building sign-up, login, password reset, MFA and social login yourself is slow and risky.<\/li>\n<li><strong>Why PulseWire needs it:<\/strong> Millions of readers sign in with email, Google or Apple; creators need MFA.<\/li>\n<li><strong>How it works:<\/strong> <strong>User Pools<\/strong> are the user directory — sign-up/sign-in, hosted UI, social and SAML/OIDC federation, and they issue JWT tokens. <strong>Identity Pools<\/strong> exchange a token (from a User Pool, Google, etc.) for <strong>temporary AWS credentials<\/strong>, so a mobile app can upload directly to S3 with a scoped role.<\/li>\n<li><strong>Where it sits:<\/strong> <code>User → Cognito → JWT → API Gateway/ALB authorizer → app<\/code>. ALB can authenticate users with Cognito natively.<\/li>\n<li><strong>Alternatives:<\/strong> Build your own auth in the app; Auth0/Okta (third party); IAM users (never for customers).<\/li>\n<li><strong>Why we chose it:<\/strong> Managed, scales to millions, integrates with API Gateway and ALB.<\/li>\n<li><strong>When NOT to use it:<\/strong> Workforce/employee access to AWS accounts → IAM Identity Center.<\/li>\n<li><strong>Security impact:<\/strong> No passwords in your database; built-in MFA and compromised-credential protection.<\/li>\n<li><strong>Scaling impact:<\/strong> Fully managed.<\/li>\n<li><strong>Cost:<\/strong> Per monthly active user, with a free tier.<\/li>\n<li><strong>SAA exam clue:<\/strong> “mobile/web app users sign in”, “social identity providers”, “user sign-up”, “temporary credentials for app users to access S3”.<\/li>\n<li><strong>Memory rule:<\/strong> User Pool = <em>who you are<\/em>; Identity Pool = <em>what AWS you can touch<\/em>.<\/li>\n<\/ul>\n<h3 id=\"s-3-data-protection-kms-cloudhsm-secrets-manager-acm\">3. Data protection: KMS, CloudHSM, Secrets Manager, ACM<\/h3>\n<p><strong>AWS KMS<\/strong><\/p>\n<ul>\n<li><strong>Problem it solves:<\/strong> Encrypting data at rest needs keys that are protected, rotated and access-controlled.<\/li>\n<li><strong>Why PulseWire needs it:<\/strong> GDPR and DPDP require encryption of personal data in RDS, S3, EBS and backups.<\/li>\n<li><strong>How it works:<\/strong> <strong>Envelope encryption<\/strong> — KMS keeps the key that encrypts data keys; services encrypt your data with a data key. Key types: AWS owned (invisible, free), AWS managed (<code>aws/s3<\/code>, free, auto-rotated), <strong>customer managed<\/strong> (you control the key policy, rotation and can disable it; ~$1/month each). Every use is logged in CloudTrail. Multi-Region keys let you decrypt the same ciphertext in another region (useful for DR).<\/li>\n<li><strong>Alternatives:<\/strong> CloudHSM; keys stored by the app; client-side encryption.<\/li>\n<li><strong>Why we chose it:<\/strong> Native integration with nearly every AWS service, audit trail, IAM + key policy control.<\/li>\n<li><strong>When NOT to use it:<\/strong> Compliance demands single-tenant HSMs that <em>you<\/em> exclusively control (FIPS 140 Level 3, AWS has no access) → <strong>CloudHSM<\/strong>.<\/li>\n<li><strong>Security impact:<\/strong> A key policy is required; even an admin can’t decrypt without key permission — separation of duties.<\/li>\n<li><strong>Scaling impact:<\/strong> Request-rate quotas exist; very high-volume S3 SSE-KMS can hit them, so enable <strong>S3 Bucket Keys<\/strong> to cut KMS calls.<\/li>\n<li><strong>Cost:<\/strong> Per key per month + per 10K API requests.<\/li>\n<li><strong>SAA exam clue:<\/strong> “encrypt at rest”, “control and audit key usage”, “rotate keys automatically”, “customer managed key”.<\/li>\n<li><strong>Memory rule:<\/strong> KMS holds the master key; data keys do the work.<\/li>\n<\/ul>\n<p><strong>Secrets Manager vs Parameter Store vs ACM<\/strong><\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Need<\/th>\n<th>Service<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>DB password that rotates automatically<\/td>\n<td><strong>Secrets Manager<\/strong><\/td>\n<td>Built-in rotation for RDS/Aurora/Redshift/DocumentDB via Lambda; ~$0.40/secret/month<\/td>\n<\/tr>\n<tr>\n<td>Config values, feature flags, non-rotating secrets, cheap<\/td>\n<td><strong>SSM Parameter Store<\/strong><\/td>\n<td>Standard tier is free; SecureString uses KMS; no native rotation<\/td>\n<\/tr>\n<tr>\n<td>TLS certificates for ALB, CloudFront, API Gateway<\/td>\n<td><strong>ACM<\/strong><\/td>\n<td>Public certs are free and <strong>auto-renew<\/strong>. CloudFront certs must be in <strong>us-east-1<\/strong>. You cannot export ACM public certs onto your own EC2<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>PulseWire flow: <code>App → IAM role → Secrets Manager → DB credentials<\/code>. Rotation every 30 days with zero code change.<\/p>\n<h3 id=\"s-4-protection-and-detection-the-security-service-lineup\">4. Protection and detection: the security service lineup<\/h3>\n<p>The exam’s favourite trick is swapping these. Learn each by the one question it answers:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Service<\/th>\n<th>The question it answers<\/th>\n<th>PulseWire use<\/th>\n<th>Exam trigger words<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>AWS WAF<\/strong><\/td>\n<td>Is this HTTP request malicious?<\/td>\n<td>SQL injection, XSS, bot scraping, rate limits on login, geo-blocking<\/td>\n<td>“SQL injection”, “cross-site scripting”, “rate-based”, “block countries” (on CloudFront, ALB, API Gateway, AppSync, Cognito)<\/td>\n<\/tr>\n<tr>\n<td><strong>Shield Standard<\/strong><\/td>\n<td>Can the network survive a flood?<\/td>\n<td>Free, automatic L3/L4 DDoS protection<\/td>\n<td>Included by default<\/td>\n<\/tr>\n<tr>\n<td><strong>Shield Advanced<\/strong><\/td>\n<td>Can we survive a big DDoS with help and cost protection?<\/td>\n<td>Breaking-news days attract attacks; 24/7 Shield Response Team, DDoS cost protection<\/td>\n<td>“DDoS”, “response team”, “cost protection” (~$3,000/month, org-wide)<\/td>\n<\/tr>\n<tr>\n<td><strong>GuardDuty<\/strong><\/td>\n<td>Is something in our account acting like a threat?<\/td>\n<td>Detects crypto-mining, compromised credentials, calls to known-bad IPs<\/td>\n<td>“intelligent threat detection”, analyses CloudTrail, VPC Flow Logs, DNS logs<\/td>\n<\/tr>\n<tr>\n<td><strong>Macie<\/strong><\/td>\n<td>Where is sensitive data (PII) in S3?<\/td>\n<td>Finds reader emails/phone numbers accidentally exported to a bucket<\/td>\n<td>“PII”, “sensitive data in S3”, “discover”<\/td>\n<\/tr>\n<tr>\n<td><strong>Inspector<\/strong><\/td>\n<td>Do our workloads have known vulnerabilities?<\/td>\n<td>Scans EC2, ECR images and Lambda for CVEs<\/td>\n<td>“vulnerabilities”, “CVE”, “software exposure”<\/td>\n<\/tr>\n<tr>\n<td><strong>Detective<\/strong><\/td>\n<td>Why did this happen, and what else was involved?<\/td>\n<td>Investigate a GuardDuty finding’s root cause<\/td>\n<td>“investigate”, “root cause of security finding”<\/td>\n<\/tr>\n<tr>\n<td><strong>Security Hub<\/strong><\/td>\n<td>What is our overall security posture, in one place?<\/td>\n<td>Aggregates GuardDuty, Inspector, Macie findings + best-practice checks<\/td>\n<td>“central view”, “aggregate findings”, “compliance standards”<\/td>\n<\/tr>\n<tr>\n<td><strong>Firewall Manager<\/strong><\/td>\n<td>Are WAF/Shield/SG rules applied in every account?<\/td>\n<td>Enforce the WAF rule set on every new ALB in the org<\/td>\n<td>“centrally manage firewall rules across accounts”<\/td>\n<\/tr>\n<tr>\n<td><strong>Network Firewall<\/strong><\/td>\n<td>Filter VPC traffic deeply (domains, IPS)?<\/td>\n<td>Restrict outbound traffic to allowed domains only<\/td>\n<td>“stateful inspection”, “intrusion prevention” for VPC traffic<\/td>\n<\/tr>\n<tr>\n<td><strong>CloudHSM<\/strong><\/td>\n<td>Do we need our own dedicated HSM?<\/td>\n<td>Not needed for PulseWire<\/td>\n<td>“single-tenant”, “FIPS 140 Level 3”, “customer has exclusive control”<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>Memory rule:<\/strong> WAF filters, Shield absorbs, GuardDuty watches, Macie reads S3, Inspector scans for CVEs, Detective investigates, Security Hub collects.<\/p>\n<h3 id=\"s-failure-scenarios\">Failure scenarios<\/h3>\n<ol>\n<li><em>Database credentials were committed to GitHub.<\/em> Rotate immediately in Secrets Manager (and change the DB password), revoke any exposed IAM keys, check CloudTrail for misuse, enable GuardDuty. Going forward: Secrets Manager + IAM roles, no static keys.<\/li>\n<li><em>An S3 bucket may contain customer phone numbers.<\/em> Macie. Not GuardDuty (threats, not data classification), not Inspector (vulnerabilities).<\/li>\n<li><em>Login endpoint is hit by credential-stuffing bots.<\/em> WAF rate-based rule + Bot Control managed rules on CloudFront/ALB. Not Shield (volumetric DDoS, not app-layer abuse), not NACL (IPs keep changing).<\/li>\n<li><em>A developer must never be able to delete CloudTrail in any account, even as admin.<\/em> SCP with explicit Deny. IAM policies in the account can’t stop the account’s own admins; SCPs can.<\/li>\n<li><em>A partner account needs read access to one bucket.<\/em> Bucket policy granting the partner’s role, or a cross-account role they assume. Never share access keys.<\/li>\n<\/ol>\n<h3 id=\"s-decision-tree\">Decision tree<\/h3>\n<pre class=\"diagram\"><code>Who needs access?\n  ├── Your app&#39;s end users → Cognito (User Pool; Identity Pool for AWS creds)\n  ├── Employees across many accounts → IAM Identity Center (+ AD/IdP federation)\n  ├── AWS compute → IAM role (instance profile / task role / execution role)\n  └── Another AWS account → Cross-account role via STS AssumeRole\n\nSecret or key?\n  ├── Rotating DB credential → Secrets Manager\n  ├── Plain config, cheap → Parameter Store\n  ├── Encryption key, managed → KMS (customer managed for control)\n  ├── Dedicated HSM, you own it → CloudHSM\n  └── TLS certificate → ACM\n\nThreat?\n  ├── Web exploit / bots → WAF\n  ├── DDoS → Shield (Advanced for big, critical apps)\n  ├── Suspicious account activity → GuardDuty → Detective to investigate\n  ├── PII in S3 → Macie\n  └── Unpatched software → Inspector\n<\/code><\/pre>\n<p><strong>Domains:<\/strong> 1 (all three task statements: secure access, secure workloads, data security controls).<\/p>\n","toc":[{"id":"1-staff-access-iam-roles-and-multiple-accounts","text":"1. Staff access: IAM, roles and multiple accounts"},{"id":"iam-roles-and-sts","text":"IAM Roles and STS"},{"id":"2-customer-identity-amazon-cognito","text":"2. Customer identity: Amazon Cognito"},{"id":"3-data-protection-kms-cloudhsm-secrets-manager-acm","text":"3. Data protection: KMS, CloudHSM, Secrets Manager, ACM"},{"id":"4-protection-and-detection-the-security-service-lineup","text":"4. Protection and detection: the security service lineup"},{"id":"failure-scenarios","text":"Failure scenarios"},{"id":"decision-tree","text":"Decision tree"}]},{"id":"ch4","ch":4,"title":"Chapter 4: Where the code runs (Compute)","short":"W
