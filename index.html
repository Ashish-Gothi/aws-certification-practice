, Fargate, DynamoDB on-demand)\n\nStorage cost?\n  ├── Known decay → S3 lifecycle rules\n  ├── Unknown pattern → Intelligent-Tiering\n  ├── EBS → gp3, delete unattached, archive snapshots\n  └── EFS → lifecycle to IA/Archive\n\nNetwork cost?\n  ├── Private subnet → S3/DynamoDB → Gateway endpoint\n  ├── Global egress → CloudFront\n  ├── Heavy hybrid traffic → Direct Connect\n  └── Non-prod NAT → Single shared NAT (prod: one per AZ)\n\nVisibility?\n  ├── Analyze/forecast → Cost Explorer\n  ├── Alerts → Budgets\n  ├── Granular data → Cost and Usage Report\n  └── Per team → Cost allocation tags\n<\/code><\/pre>\n<p><strong>Domains:<\/strong> 4 (all four task statements: cost-optimized storage, compute, database, network).<\/p>\n","toc":[{"id":"step-1-see-where-the-money-goes","text":"Step 1: see where the money goes"},{"id":"step-2-the-component-by-component-review","text":"Step 2: the component-by-component review"},{"id":"ec2-compute-purchasing-options","text":"EC2/compute purchasing options"},{"id":"data-transfer-the-hidden-bill","text":"Data transfer: the hidden bill"},{"id":"serverless-vs-servers-when-each-is-cheaper","text":"Serverless vs servers: when each is cheaper"},{"id":"failure-scenarios","text":"Failure scenarios"},{"id":"decision-tree","text":"Decision tree"}]},{"id":"epilogue","ch":null,"title":"Epilogue: PulseWire in production","short":"PulseWire in production","topic":"","d":0,"focus":false,"mins":4,"html":"<p>Election night. 4 million readers, three regions, a 25× traffic spike at 08:00, a DDoS attempt at 08:20, and an AZ hiccup in Mumbai at 09:10. Nobody outside the ops channel noticed any of it. Here is the system that made that possible — every box earned its place in a chapter.<\/p>\n<h3 id=\"s-the-final-architecture-primary-region-shown-us-east-1-and-eu\">The final architecture (primary region shown; us-east-1 and eu-west-1 mirror it)<\/h3>\n<pre class=\"diagram\"><code>                                   USERS (India · US · EU)\n                                            │\n                    Route 53  (geolocation for EU, latency for others, failover health checks)\n                                            │\n                    CloudFront  (+ WAF + Shield Advanced, ACM cert, OAC to S3)\n                ┌───────────────────────────────┼────────────────────────────────────┐\n                ▼                           ▼                                    ▼\n        S3 media/static            ALB (public subnets, 3 AZs)        API Gateway (REST, partner API)\n        (lifecycle, CRR)                    │                                    │\n                          ┌──────────────────┼──────────────────┐       Lambda / VPC Link\n                          ▼                  ▼                  ▼\n                 ECS Fargate AZ-a    ECS Fargate AZ-b    ECS Fargate AZ-c     (private app subnets)\n                 article/user/admin services, task roles, images from ECR\n                          │\n      ┌───────────────────┼────────────────────┬─────────────────────┬──────────────────┐\n      ▼                   ▼                    ▼                     ▼                  ▼\n ElastiCache       RDS Proxy → Aurora     DynamoDB             OpenSearch        EventBridge\n (Multi-AZ)        PostgreSQL (writer +   (Global Tables:      (article search)       │\n                   replicas, Global DB)   comments, sessions)                  ┌──────┴──────┐\n                   (private DB subnets)                                         SNS fan-out   Step Functions\n                                                                                  ↓           (Comprehend,\n                                                                              SQS queues       Translate, Polly,\n                                                                                  ↓            Rekognition)\n                                                                         Lambda / Fargate Spot workers\n\n ANALYTICS:  Kinesis Data Streams → Flink (trending) + Firehose → S3 lake → Glue → Lake Formation\n             → Athena / Redshift (zero-ETL from Aurora) → QuickSight\n NETWORK:    VPC 3 tiers × 3 AZs · NAT GW per AZ · gateway endpoints (S3, DynamoDB) ·\n             interface endpoints (Secrets Manager, KMS, ECR, SQS) · TGW to data/shared VPCs ·\n             Site-to-Site VPN + Direct Connect to Gurugram office/Metro\n SECURITY:   Organizations + SCPs + Control Tower · Identity Center (staff) · Cognito (readers) ·\n             IAM roles everywhere · KMS CMKs · Secrets Manager rotation · GuardDuty · Macie ·\n             Inspector · Security Hub · Firewall Manager\n OPERATIONS: CloudWatch (alarms, logs, Synthetics) · X-Ray · CloudTrail org trail · Config rules ·\n             AWS Health → EventBridge · AWS Backup (cross-region, Vault Lock) · CloudFormation\n HYBRID:     Transfer Family (SFTP wire feeds) · DataSync · Storage Gateway · Amazon MQ (Metro CMS)\n<\/code><\/pre>\n<h3 id=\"s-why-every-component-exists-and-what-we-deliberately-left-out\">Why every component exists (and what we deliberately left out)<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Requirement it satisfies<\/th>\n<th>Chapter<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Route 53 geolocation + latency + failover<\/td>\n<td>EU residency, global latency, regional DR<\/td>\n<td>8, 13<\/td>\n<\/tr>\n<tr>\n<td>CloudFront + WAF + Shield Advanced<\/td>\n<td>&lt;1 s pages globally, 95% reads, bot and DDoS protection<\/td>\n<td>3, 8<\/td>\n<\/tr>\n<tr>\n<td>ALB + ECS Fargate across 3 AZs<\/td>\n<td>Stateless, self-healing, survives an AZ, no OS patching<\/td>\n<td>4, 12<\/td>\n<\/tr>\n<tr>\n<td>API Gateway<\/td>\n<td>Partner keys, quotas, throttling<\/td>\n<td>7<\/td>\n<\/tr>\n<tr>\n<td>Aurora Global Database + RDS Proxy<\/td>\n<td>Relational data, read scaling, RPO ~1 s cross-region<\/td>\n<td>6, 13<\/td>\n<\/tr>\n<tr>\n<td>DynamoDB Global Tables<\/td>\n<td>Write-heavy comments and sessions, multi-region writes<\/td>\n<td>6, 8<\/td>\n<\/tr>\n<tr>\n<td>ElastiCache<\/td>\n<td>Sub-ms hot reads, trending ranking<\/td>\n<td>6, 14<\/td>\n<\/tr>\n<tr>\n<td>S3 + lifecycle + CRR + versioning<\/td>\n<td>Durable media at lowest cost, never lose a file, DR<\/td>\n<td>5<\/td>\n<\/tr>\n<tr>\n<td>EventBridge, SNS, SQS, Step Functions<\/td>\n<td>Decoupled publishing, fan-out notifications, AI workflow<\/td>\n<td>7<\/td>\n<\/tr>\n<tr>\n<td>Kinesis, Firehose, Glue, Lake Formation, Athena, Redshift, QuickSight<\/td>\n<td>Analytics without touching production, governed PII<\/td>\n<td>10<\/td>\n<\/tr>\n<tr>\n<td>Cognito / Identity Center / IAM roles / SCPs<\/td>\n<td>Right identity system for each user type, least privilege<\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td>KMS, Secrets Manager, Macie, GuardDuty, Inspector, Security Hub<\/td>\n<td>GDPR/DPDP encryption, PII discovery, threat detection<\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td>CloudWatch, CloudTrail, Config, X-Ray, Health<\/td>\n<td>Know it works, who changed what, compliance drift<\/td>\n<td>9<\/td>\n<\/tr>\n<tr>\n<td>AWS Backup with Vault Lock<\/td>\n<td>Ransomware-proof, cross-region backups<\/td>\n<td>5, 13<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>Left out on purpose:<\/strong> EKS (no Kubernetes requirement), Global Accelerator for the website (CloudFront covers HTTP; used only for the TCP sports feed), CloudHSM (KMS meets compliance), active-active for the creator portal (pilot light meets its RTO), Neptune until the knowledge-graph feature exists, QLDB (end of support). Knowing what <em>not<\/em> to add is part of the architect’s job, and part of the exam’s cost domain.<\/p>\n<h3 id=\"s-the-12-question-design-checklist\">The 12-question design checklist<\/h3>\n<p>Given any business requirement, walk these in order. If you can answer all twelve, you can design and defend the architecture.<\/p>\n<ol>\n<li><strong>Services:<\/strong> What are the workloads (web, API, async, batch, analytics), and which compute model fits each?<\/li>\n<li><strong>Why:<\/strong> Which requirement does each service satisfy? If none, remove it.<\/li>\n<li><strong>Communication:<\/strong> Synchronous (ALB/API Gateway) or asynchronous (SQS/SNS/EventBridge/Kinesis)?<\/li>\n<li><strong>Placement:<\/strong> Which subnets (public/private/DB), which AZs, which regions, edge or origin?<\/li>\n<li><strong>Security:<\/strong> Identity per user type, IAM roles, encryption at rest and in transit, network segmentation, WAF/Shield, secrets.<\/li>\n<li><strong>High availability:<\/strong> Is there any single point of failure? Does every layer span ≥2 AZs?<\/li>\n<li><strong>Scaling:<\/strong> What breaks first at 10×? What’s the scaling metric for each tier?<\/li>\n<li><strong>Monitoring:<\/strong> Which metric and alarm proves it’s healthy? Who did what (CloudTrail)? Is it compliant (Config)?<\/li>\n<li><strong>Recovery:<\/strong> What are RPO and RTO? Which DR strategy meets them at least cost? Are backups cross-region and immutable?<\/li>\n<li><strong>Cost:<\/strong> Purchasing option per workload, storage tiering, data transfer paths, over-engineering check.<\/li>\n<li><strong>Alternatives:<\/strong> What are the two runner-up services for each decision?<\/li>\n<li><strong>Justification:<\/strong> Why does the chosen design beat the alternatives <em>for this requirement<\/em> — operational overhead, cost, performance, resilience?<\/li>\n<\/ol>\n<p><strong>Domains:<\/strong> all four.<\/p>\n","toc":[{"id":"the-final-architecture-primary-region-shown-us-east-1-and-eu","text":"The final architecture (primary region shown; us-east-1 and eu-west-1 mirror it)"},{"id":"why-every-component-exists-and-what-we-deliberately-left-out","text":"Why every component exists (and what we deliberately left out)"},{"id":"the-12-question-design-checklist","text":"The 12-question design checklist"}]},{"id":"appendix","ch":null,"title":"Appendix: Exam reflexes","short":"Exam reflexes","topic":"","d":0,"focus":false,"mins":6,"html":"<p>Use this for the last week of revision. The decision trees from each chapter are the long form; this is the compressed version.<\/p>\n<h3 id=\"s-keyword-service-map\">Keyword → service map<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>When the question says...<\/th>\n<th>Think...<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>“least operational overhead”, “fully managed”<\/td>\n<td>Serverless/managed: Lambda, Fargate, DynamoDB, Aurora Serverless, S3, Glue, Athena<\/td>\n<\/tr>\n<tr>\n<td>“decouple”, “buffer”, “no lost requests during spikes”<\/td>\n<td>SQS<\/td>\n<\/tr>\n<tr>\n<td>“fan-out”, “notify multiple systems”<\/td>\n<td>SNS (→ SQS)<\/td>\n<\/tr>\n<tr>\n<td>“react to events from AWS services/SaaS”, “cron”<\/td>\n<td>EventBridge<\/td>\n<\/tr>\n<tr>\n<td>“orchestrate steps”, “human approval”, “retries”<\/td>\n<td>Step Functions<\/td>\n<\/tr>\n<tr>\n<td>“real-time stream”, “replay”, “multiple consumers”<\/td>\n<td>Kinesis Data Streams<\/td>\n<\/tr>\n<tr>\n<td>“load streaming data into S3/Redshift”, “convert to Parquet”<\/td>\n<td>Data Firehose<\/td>\n<\/tr>\n<tr>\n<td>“session state”, “leaderboard”, “sub-millisecond”<\/td>\n<td>ElastiCache (Redis/Valkey)<\/td>\n<\/tr>\n<tr>\n<td>“microsecond reads from DynamoDB”<\/td>\n<td>DAX<\/td>\n<\/tr>\n<tr>\n<td>“read-heavy relational”, “reporting slows prod”<\/td>\n<td>Read replicas<\/td>\n<\/tr>\n<tr>\n<td>“automatic failover”, “survive AZ failure” (DB)<\/td>\n<td>Multi-AZ<\/td>\n<\/tr>\n<tr>\n<td>“cross-region DB, RPO seconds, RTO ~1 min”<\/td>\n<td>Aurora Global Database<\/td>\n<\/tr>\n<tr>\n<td>“too many DB connections from Lambda”<\/td>\n<td>RDS Proxy<\/td>\n<\/tr>\n<tr>\n<td>“unknown access pattern” (S3)<\/td>\n<td>Intelligent-Tiering<\/td>\n<\/tr>\n<tr>\n<td>“archive, retrieve within 12/48 h, cheapest”<\/td>\n<td>Glacier Deep Archive<\/td>\n<\/tr>\n<tr>\n<td>“re-creatable, infrequent”<\/td>\n<td>S3 One Zone-IA<\/td>\n<\/tr>\n<tr>\n<td>“shared Linux file system”<\/td>\n<td>EFS<\/td>\n<\/tr>\n<tr>\n<td>“Windows, SMB, Active Directory”<\/td>\n<td>FSx for Windows File Server<\/td>\n<\/tr>\n<tr>\n<td>“HPC”, “ML training at high throughput”<\/td>\n<td>FSx for Lustre<\/td>\n<\/tr>\n<tr>\n<td>“on-prem keeps NFS/SMB, data lands in S3”<\/td>\n<td>Storage Gateway (S3 File Gateway)<\/td>\n<\/tr>\n<tr>\n<td>“migrate files online, scheduled”<\/td>\n<td>DataSync<\/td>\n<\/tr>\n<tr>\n<td>“limited bandwidth, hundreds of TB”<\/td>\n<td>Snowball Edge<\/td>\n<\/tr>\n<tr>\n<td>“partners use SFTP”<\/td>\n<td>Transfer Family<\/td>\n<\/tr>\n<tr>\n<td>“lift-and-shift servers”<\/td>\n<td>Application Migration Service<\/td>\n<\/tr>\n<tr>\n<td>“migrate DB with minimal downtime”<\/td>\n<td>DMS (CDC)<\/td>\n<\/tr>\n<tr>\n<td>“private subnet → S3 without internet”<\/td>\n<td>Gateway VPC endpoint<\/td>\n<\/tr>\n<tr>\n<td>“expose service privately to other VPCs/accounts”<\/td>\n<td>PrivateLink (NLB + endpoint service)<\/td>\n<\/tr>\n<tr>\n<td>“many VPCs + on-prem, transitive”<\/td>\n<td>Transit Gateway<\/td>\n<\/tr>\n<tr>\n<td>“quick, encrypted on-prem link”<\/td>\n<td>Site-to-Site VPN<\/td>\n<\/tr>\n<tr>\n<td>“consistent, dedicated bandwidth”<\/td>\n<td>Direct Connect (+ VPN backup)<\/td>\n<\/tr>\n<tr>\n<td>“static IP”, “UDP”, “fast regional failover”<\/td>\n<td>Global Accelerator (or NLB for static IP in one region)<\/td>\n<\/tr>\n<tr>\n<td>“cache static content globally”<\/td>\n<td>CloudFront<\/td>\n<\/tr>\n<tr>\n<td>“route by user location for compliance”<\/td>\n<td>Route 53 geolocation<\/td>\n<\/tr>\n<tr>\n<td>“route by path /api, /images”<\/td>\n<td>ALB<\/td>\n<\/tr>\n<tr>\n<td>“SQL injection”, “XSS”, “rate limit”<\/td>\n<td>WAF<\/td>\n<\/tr>\n<tr>\n<td>“DDoS with response team and cost protection”<\/td>\n<td>Shield Advanced<\/td>\n<\/tr>\n<tr>\n<td>“PII in S3”<\/td>\n<td>Macie<\/td>\n<\/tr>\n<tr>\n<td>“threat detection, compromised instance”<\/td>\n<td>GuardDuty<\/td>\n<\/tr>\n<tr>\n<td>“vulnerabilities, CVEs”<\/td>\n<td>Inspector<\/td>\n<\/tr>\n<tr>\n<td>“who made this API call”<\/td>\n<td>CloudTrail<\/td>\n<\/tr>\n<tr>\n<td>“configuration history / compliance”<\/td>\n<td>AWS Config<\/td>\n<\/tr>\n<tr>\n<td>“memory metric on EC2”<\/td>\n<td>CloudWatch agent<\/td>\n<\/tr>\n<tr>\n<td>“app users sign in, social login”<\/td>\n<td>Cognito<\/td>\n<\/tr>\n<tr>\n<td>“employees, many accounts, SSO”<\/td>\n<td>IAM Identity Center<\/td>\n<\/tr>\n<tr>\n<td>“restrict what any account can do”<\/td>\n<td>SCP (Organizations)<\/td>\n<\/tr>\n<tr>\n<td>“rotate DB credentials automatically”<\/td>\n<td>Secrets Manager<\/td>\n<\/tr>\n<tr>\n<td>“dedicated HSM, FIPS Level 3”<\/td>\n<td>CloudHSM<\/td>\n<\/tr>\n<tr>\n<td>“interruptible, lowest cost”<\/td>\n<td>Spot<\/td>\n<\/tr>\n<tr>\n<td>“steady usage, flexible across services”<\/td>\n<td>Compute Savings Plan<\/td>\n<\/tr>\n<tr>\n<td>“per-socket licensing”<\/td>\n<td>Dedicated Hosts<\/td>\n<\/tr>\n<tr>\n<td>“ad-hoc SQL on S3”<\/td>\n<td>Athena<\/td>\n<\/tr>\n<tr>\n<td>“data warehouse, complex BI”<\/td>\n<td>Redshift<\/td>\n<\/tr>\n<tr>\n<td>“Hadoop/Spark”<\/td>\n<td>EMR<\/td>\n<\/tr>\n<tr>\n<td>“fine-grained data lake permissions”<\/td>\n<td>Lake Formation<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3 id=\"s-mixed-practice-scenarios\">Mixed practice scenarios<\/h3>\n<p>Cover the answers, decide, then check. Each answer says why the tempting alternative is wrong.<\/p>\n<ol>\n<li><strong>A news site’s images are uploaded to EC2 instances behind an ALB. After scaling out, some users can’t see recently uploaded images.<\/strong> → Store uploads in S3 (served via CloudFront). <em>Why not EBS?<\/em> Each instance has its own volume. <em>Why not EFS?<\/em> It works, but S3 is cheaper and integrates with CloudFront; choose EFS only if the app requires a filesystem.<\/li>\n<li><strong>A company must keep financial records for 7 years, untouchable even by administrators, and rarely read.<\/strong> → S3 Glacier Deep Archive with <strong>Object Lock in Compliance mode<\/strong> (or AWS Backup Vault Lock). <em>Why not Governance mode?<\/em> Privileged users can override it.<\/li>\n<li><strong>A Lambda function in a private subnet must call DynamoDB and an external payment API.<\/strong> → Gateway endpoint for DynamoDB; NAT gateway for the external API. <em>Why not only the endpoint?<\/em> Endpoints don’t reach the internet.<\/li>\n<li><strong>An application has an unpredictable workload with long idle periods and needs a relational database with minimal management.<\/strong> → Aurora Serverless v2. <em>Why not provisioned RDS?<\/em> Pays for idle capacity.<\/li>\n<li><strong>Orders must be processed exactly once, in order per customer.<\/strong> → SQS FIFO with <code>MessageGroupId = customerId<\/code>. <em>Why not Kinesis?<\/em> Possible, but FIFO is simpler and matches “exactly once” wording.<\/li>\n<li><strong>Users in Australia report slow loading of a static website hosted in us-east-1 S3.<\/strong> → CloudFront with OAC. <em>Why not Global Accelerator?<\/em> It doesn’t cache content. <em>Why not a second bucket with CRR?<\/em> More cost and complexity than a CDN.<\/li>\n<li><strong>A company needs DR for a critical app with RTO 10 min and RPO 1 min, as cheaply as possible.<\/strong> → Warm standby (Aurora Global Database or cross-region replica + scaled-down fleet + Route 53 failover). <em>Why not pilot light?<\/em> Launching compute from zero risks missing 10 minutes. <em>Why not active-active?<\/em> More than needed.<\/li>\n<li><strong>An analytics team queries 5 TB of CSV logs in S3 with Athena; costs are rising.<\/strong> → Convert to compressed Parquet with Glue, partition by date. <em>Why not Redshift?<\/em> The query volume is ad-hoc; the problem is the format.<\/li>\n<li><strong>A company with 50 AWS accounts wants to prevent anyone from leaving approved regions.<\/strong> → SCP denying actions outside allowed regions. <em>Why not IAM policies?<\/em> They’d need to be maintained in every account and admins could change them.<\/li>\n<li><strong>A security team must find which S3 buckets contain credit card numbers.<\/strong> → Macie. <em>Why not GuardDuty?<\/em> It detects threats, not data types.<\/li>\n<li><strong>EC2 instances in a private subnet can’t download patches; there is a NAT gateway.<\/strong> → Check that the NAT is in a <strong>public<\/strong> subnet and the private subnet&#39;s route table sends <code>0.0.0.0/0<\/code> to it. <em>Why not add an IGW route to the private subnet?<\/em> That makes it public.<\/li>\n<li><strong>A legacy application can’t be modified and runs on a single EC2 instance. Improve its availability.<\/strong> → ASG with min = max = 1 across two AZs (self-healing) and a Route 53 health check, AMI backups. <em>Why not Multi-AZ load balancing?<\/em> The app can’t run as multiple copies.<\/li>\n<li><strong>Nightly image re-processing takes 4 hours, is fault tolerant, and should cost as little as possible.<\/strong> → AWS Batch (or ASG) on Spot. <em>Why not Lambda?<\/em> 15-minute limit per invocation.<\/li>\n<li><strong>A company transfers 50 TB of on-prem file data to Amazon EFS and then needs a weekly incremental sync over a 1 Gbps link.<\/strong> → DataSync. <em>Why not Snowball?<\/em> 50 TB at ~1 Gbps is roughly a week online, and the recurring sync needs an online tool anyway.<\/li>\n<li><strong>Partner apps need two fixed IP addresses for a TCP service running in two regions, with automatic regional failover.<\/strong> → Global Accelerator with NLB endpoints. <em>Why not CloudFront?<\/em> TCP non-HTTP and no static IPs.<\/li>\n<\/ol>\n<h3 id=\"s-final-word\">Final word<\/h3>\n<p>Every exam question is a small version of a PulseWire chapter: a requirement, a constraint, an optimization target, and four plausible answers. Find the constraint first (“must not”, “within 15 minutes”, “no code changes”), then the target (“most cost-effective”, “least operational overhead”), then eliminate answers that break the constraint. What’s left is usually one service, and now you know <em>why<\/em>.<\/p>\n","toc":[{"id":"keyword-service-map","text":"Keyword → service map"},{"id":"mixed-practice-scenarios","text":"Mixed practice scenarios"},{"id":"final-word","text":"Final word"}]}];
const PRACTICE = [
{id:"p1",d:2,ch:1,q:"A news site runs on a single EC2 instance that keeps user login sessions in application memory. The team adds a second instance behind an Application Load Balancer, and users now report being logged out at random. The company wants any instance to be replaceable at any time without affecting users. What should a solutions architect recommend?",
o:["Enable duration-based sticky sessions on the target group so each user keeps returning to one instance.","Store session data in an Amazon ElastiCache cluster that every instance reads from and writes to.","Replace both instances with one larger instance and enable automatic recovery for host failures.","Store session files on an EBS Multi-Attach volume that is mounted by both of the instances."],
a:[1],
w:["Stickiness hides the symptom but keeps state on one instance. When that instance is replaced, its users are logged out, which breaks the stated requirement.","Externalizing session state makes the web tier stateless, so instances can be added, removed or replaced without users noticing.","This reintroduces a single point of failure and removes the ability to scale horizontally.","Multi-Attach works only within one AZ, only for io1/io2, and needs a cluster-aware file system. It is not a session store."],
k:"“Instances must be replaceable” means stateless. Sessions go to ElastiCache or DynamoDB, not stickiness."},

{id:"p2",d:2,ch:1,q:"A startup runs its web app, MySQL database and user uploads on one EC2 instance. Leadership wants to remove single points of failure for the data and the uploads with the least operational overhead. Which TWO actions should the solutions architect take?",
o:["Move the uploaded files to Amazon S3 and have the application read and write them there.","Migrate the database to Amazon RDS for MySQL with a Multi-AZ deployment enabled.","Move to a larger instance type and schedule hourly EBS snapshots with Amazon Data Lifecycle Manager.","Store uploads on instance store volumes, which offer higher throughput than EBS volumes.","Launch a second EC2 instance and configure MySQL replication between the two instances manually."],
a:[0,1],
w:["S3 is durable across multiple AZs and removes local disk as a failure point for media.","RDS Multi-AZ gives a synchronous standby in another AZ with automatic failover, managed by AWS.","Snapshots help recovery but the instance is still a single point of failure, and restore takes time.","Instance store data is lost when the instance stops or fails. It is the opposite of durable.","This works technically but carries heavy operational overhead compared with a managed Multi-AZ database."],
k:"“Least operational overhead” + durability → managed services (S3, RDS Multi-AZ)."},

{id:"p3",d:1,ch:2,q:"Application servers run in private subnets in two Availability Zones. They must download OS patches from the internet but must never accept connections initiated from the internet. The design must keep working if either Availability Zone fails. What should the solutions architect do?",
o:["Deploy one NAT gateway per AZ in public subnets; each private route table targets the NAT gateway in its own AZ.","Deploy one NAT gateway in a single public subnet; every private route table in both AZs targets that one NAT gateway.","Route the private subnets to the internet gateway and deny all inbound traffic in the security groups.","Create an interface VPC endpoint in each AZ and route 0.0.0.0/0 from the private subnets to the endpoints."],
a:[0],
w:["A NAT gateway is zonal. One per AZ, with per-AZ routing, means an AZ failure only affects that AZ’s own instances.","If the AZ holding the single NAT gateway fails, instances in the other AZ lose outbound internet access.","Routing to an internet gateway makes those subnets public, and instances would need public IPs, which violates the requirement.","Interface endpoints reach specific AWS services through PrivateLink. They are not a general internet path."],
k:"NAT gateway is AZ-scoped. HA = one per AZ."},

{id:"p4",d:4,ch:2,q:"EC2 instances in private subnets read several terabytes per day from an Amazon S3 bucket in the same Region. The monthly bill shows high NAT gateway data processing charges. What is the MOST cost-effective way to reduce these charges without exposing the instances?",
o:["Create an interface VPC endpoint for Amazon S3 and update the application to use its DNS name.","Create a gateway VPC endpoint for Amazon S3 and add it to the private subnets’ route tables.","Move the instances to public subnets and give each one a public IP address for direct S3 access.","Enable S3 Transfer Acceleration on the bucket and point the application at the accelerated endpoint."],
a:[1],
w:["An interface endpoint removes NAT charges but adds hourly and per-GB endpoint charges. It works, but it is not the cheapest.","A gateway endpoint for S3 has no hourly or data processing charge and keeps traffic on the AWS network.","This exposes the instances to the internet, which breaks the requirement.","Transfer Acceleration speeds up long-distance uploads and adds cost. It does not help same-Region traffic."],
k:"S3 or DynamoDB from private subnets + “cost” → gateway endpoint (free)."},

{id:"p5",d:1,ch:2,q:"A web server’s security group allows inbound TCP 443 from 0.0.0.0/0. The subnet uses a custom network ACL with one inbound rule allowing TCP 443 from 0.0.0.0/0 and one outbound rule allowing TCP 443 to 0.0.0.0/0. Users report that connections time out. What change fixes this?",
o:["Add an outbound rule to the security group that allows TCP ports 1024–65535 to 0.0.0.0/0.","Add an outbound rule to the network ACL that allows TCP ports 1024–65535 to 0.0.0.0/0.","Add an inbound rule to the network ACL that allows TCP ports 1024–65535 from 0.0.0.0/0.","Replace the security group rules with network ACL rules, because network ACLs are stateful."],
a:[1],
w:["Security groups are stateful, so return traffic is already allowed. The block is in the network ACL.","NACLs are stateless. Responses to clients go to the clients’ ephemeral ports, so the outbound NACL must allow them.","Inbound ephemeral ports matter for responses to connections the server starts, not for responses to clients.","The premise is wrong: network ACLs are stateless and security groups are stateful."],
k:"Stateless NACL + timeouts → missing ephemeral port rule in the return direction."},

{id:"p6",d:1,ch:3,q:"An application on EC2 reads objects from an S3 bucket. Today an access key and secret key are stored in a configuration file on the instance. A security review requires removing long-term credentials from the instance. What is the MOST secure solution?",
o:["Attach an IAM role to the instance through an instance profile and grant the role read access to the bucket.","Store the access keys in AWS Secrets Manager with automatic rotation enabled and fetch them each time the app starts.","Add a bucket policy that allows s3:GetObject when the request comes from the VPC CIDR range.","Pass the access keys to the instance as environment variables through the EC2 user data script."],
a:[0],
w:["The role provides temporary credentials that rotate automatically. Nothing long-lived is stored on the instance.","Better than a file, but the app still uses long-term IAM user keys, which the review wants removed.","The aws:SourceIp condition does not match private IPs on requests through a VPC endpoint, and a network rule is not an identity control.","User data is readable from the instance metadata service, so this simply moves the secret somewhere else."],
k:"EC2/Lambda/ECS calling AWS → IAM role, never stored keys."},

{id:"p7",d:1,ch:3,q:"A company uses AWS Organizations. Compliance requires that no one in the member accounts, including each account’s root user, can launch resources outside ap-south-1 and eu-west-1. What should the solutions architect implement?",
o:["A service control policy on the organization root that denies actions when aws:RequestedRegion is not one of the two approved Regions.","An IAM policy attached to every user, group and role in each member account that denies all actions outside the two approved Regions.","An IAM permissions boundary on all administrator roles in member accounts that allows only the two approved Regions.","An AWS Config rule in each account that detects resources outside approved Regions and terminates them automatically."],
a:[0],
w:["SCPs cap permissions for every principal in member accounts, including the root user, and members cannot remove them.","IAM policies do not apply to the root user, and an admin in the account can detach them.","Permissions boundaries do not apply to the root user and only cover the roles they are attached to.","This detects after the fact rather than preventing, and the resources exist until remediation runs."],
k:"“Including root” + “across accounts” → SCP."},

{id:"p8",d:1,ch:3,q:"An application connects to Amazon RDS for MySQL using a database username and password, and its ORM cannot use token-based authentication. Security requires the password to rotate automatically every 30 days with the least custom code. What should the solutions architect use?",
o:["AWS Secrets Manager with managed rotation configured for the RDS database secret.","SSM Parameter Store SecureString parameters with a scheduled EventBridge rule and a custom Lambda.","AWS KMS customer managed keys with automatic key rotation enabled for every 30 days.","IAM database authentication tokens stored in SSM Parameter Store and refreshed on a daily schedule."],
a:[0],
w:["Secrets Manager has built-in rotation for RDS credentials, so no custom rotation code is needed.","This works but means writing and maintaining your own rotation logic, which the requirement avoids.","KMS key rotation changes encryption key material, not database passwords.","The ORM cannot use tokens, and IAM auth tokens expire after 15 minutes, so storing them makes no sense."],
k:"Rotate DB credentials automatically → Secrets Manager."},

{id:"p9",d:3,ch:4,q:"Each time a creator uploads a video to S3, a transcoding job must run. Jobs are packaged as a container image, need 6 GB of memory and run for 20–40 minutes. Uploads are unpredictable, with long idle periods. Which solution meets the requirements with the LEAST operational overhead?",
o:["An AWS Lambda function built from the container image and triggered by S3 event notifications.","An Amazon EventBridge rule on S3 Object Created events that runs an Amazon ECS task on AWS Fargate.","An EC2 Auto Scaling group of three instances that polls an SQS queue fed by the bucket’s S3 event notifications.","An Elastic Beanstalk web environment that receives the S3 event notifications over HTTPS."],
a:[1],
w:["Lambda has a 15-minute maximum timeout, so 20–40 minute jobs would fail.","Fargate runs the container with no servers to manage, has no 15-minute limit, and costs nothing while idle.","It works, but you manage instances and pay for three of them during idle periods.","A web environment is meant for request/response traffic, and S3 cannot deliver events to an HTTP endpoint directly."],
k:"Over 15 minutes + container + serverless → Fargate."},

{id:"p10",d:2,ch:4,q:"A financial partner integrates with a company’s TCP-based API. The partner’s firewall can only allow-list fixed IP addresses, and the API must handle sudden bursts of millions of requests per second. What should the solutions architect deploy in front of the EC2 targets?",
o:["An Application Load Balancer with an Elastic IP address assigned in each Availability Zone.","A Network Load Balancer with an Elastic IP address assigned to each of its Availability Zone subnets.","An Amazon CloudFront distribution with the existing Application Load Balancer as the origin.","A Gateway Load Balancer that forwards the incoming TCP traffic to the EC2 target group in each AZ."],
a:[1],
w:["ALBs do not support Elastic IPs. Their IP addresses change over time.","NLBs give one static IP (or Elastic IP) per AZ and handle millions of requests per second at layer 4.","CloudFront edge IPs are numerous and change, and CloudFront serves HTTP(S), not raw TCP.","GWLB is for inserting third-party virtual appliances, not for fronting application traffic."],
k:"Static IP / Elastic IP / TCP-UDP / extreme throughput → NLB."},

{id:"p11",d:2,ch:4,q:"An Auto Scaling group runs web servers behind an Application Load Balancer. Sometimes the application process crashes while the instance stays running. The ALB stops sending traffic to it, but the Auto Scaling group never replaces it. What should the solutions architect change?",
o:["Set the Auto Scaling group health check type to ELB so that load balancer health checks are used.","Increase the health check grace period so instances have more time to recover by themselves.","Create a CloudWatch alarm on CPUUtilization that reboots the instance when CPU drops to near zero.","Configure EC2 automatic recovery triggered by the StatusCheckFailed_System metric on each instance."],
a:[0],
w:["By default the group only uses EC2 status checks, which pass while the OS runs. ELB health checks catch application failure.","A longer grace period delays health checks. It does not make the group detect the failure.","Low CPU is not a reliable sign of a crash, and a reboot is not a replacement.","System status checks detect hardware or host problems, not a crashed application process."],
k:"App dead but instance alive → ASG health check type = ELB."},

{id:"p12",d:4,ch:5,q:"Application logs in S3 are queried often for 30 days. After that, auditors access them about once a quarter and need results in milliseconds. Logs must survive the loss of an Availability Zone and are deleted after 365 days. Which lifecycle configuration is MOST cost-effective?",
o:["Transition objects to S3 Standard-IA after 30 days, then expire them after 365 days.","Transition objects to S3 Glacier Instant Retrieval after 30 days, then expire them after 365 days.","Transition objects to S3 Glacier Flexible Retrieval after 30 days, then expire them after 365 days.","Transition objects to S3 One Zone-IA after 30 days, then expire them after 365 days."],
a:[1],
w:["It works, but storage costs more than Glacier Instant Retrieval for data read once a quarter.","Millisecond access, multi-AZ durability and the lowest storage price for data read about once a quarter.","Retrieval takes minutes to hours, which fails the millisecond requirement.","Data is lost if that one AZ fails, which breaks the durability requirement."],
k:"Rare access + milliseconds → Glacier Instant Retrieval. Minutes/hours OK → Flexible. 12+ hours OK → Deep Archive."},

{id:"p13",d:3,ch:5,q:"A content management system runs on Linux EC2 instances in an Auto Scaling group across three Availability Zones. All instances must read and write the same set of files with POSIX permissions, and storage must grow and shrink automatically. Which storage service should be used?",
o:["Amazon EFS file system mounted on every instance using a mount target in each of the AZs.","Amazon EBS io2 volume with Multi-Attach enabled and shared across all of the instances.","Amazon FSx for Windows File Server deployed in a Multi-AZ configuration.","Amazon S3 bucket mounted on each instance using Mountpoint for Amazon S3."],
a:[0],
w:["EFS is a managed NFS file system usable from many AZs at once, with POSIX semantics and elastic capacity.","Multi-Attach is limited to one AZ and needs a cluster-aware file system. It does not scale automatically.","FSx for Windows uses SMB and Windows ACLs, which is the wrong fit for Linux POSIX workloads.","Mountpoint does not support full POSIX behavior such as in-place edits and file locking."],
k:"Shared Linux files across AZs → EFS. Windows/SMB → FSx for Windows."},

{id:"p14",d:1,ch:5,q:"A regulator requires that trade confirmation files in S3 cannot be overwritten or deleted by anyone, including the root user, for 7 years. What should the solutions architect configure?",
o:["S3 Object Lock in governance mode with a default retention period of 7 years.","S3 Object Lock in compliance mode with a default retention period of 7 years.","S3 Versioning with MFA Delete enabled and a lifecycle rule that keeps all noncurrent versions.","A bucket policy that explicitly denies s3:DeleteObject and s3:PutObject for all principals."],
a:[1],
w:["Governance mode can be bypassed by users with s3:BypassGovernanceRetention, so it is not absolute.","In compliance mode nobody, including root, can delete or shorten retention until it expires.","The root user can turn off MFA Delete, and versioning alone does not stop deletions.","A user with sufficient permissions, or the root user, can change or delete the bucket policy."],
k:"WORM that even root can’t bypass → Object Lock compliance mode."},

{id:"p15",d:2,ch:6,q:"A company’s Amazon RDS for PostgreSQL instance serves an OLTP application. Heavy reporting queries slow it down during business hours, and the company also needs automatic failover if the primary’s AZ fails. Which TWO actions meet these requirements?",
o:["Enable a Multi-AZ deployment for the database instance.","Create a read replica and point the reporting tool at the replica endpoint.","Increase the allocated storage so the instance receives more baseline IOPS.","Point the reporting tool at the standby instance of the Multi-AZ deployment.","Put an Amazon ElastiCache cluster in front of the database to absorb writes."],
a:[0,1],
w:["Multi-AZ provides a synchronous standby and automatic failover.","A read replica takes the read-only reporting load off the primary.","More IOPS may help a little but does not separate reporting from OLTP and provides no failover.","In a Multi-AZ instance deployment the standby cannot serve reads.","Caches serve repeated reads. They do not absorb writes or handle ad hoc reporting."],
k:"Multi-AZ = availability. Read replica = read scaling. The exam tests that you know which is which."},

{id:"p16",d:3,ch:6,q:"A gaming leaderboard on Amazon DynamoDB gets millions of reads per second for a small set of hot items. Reads currently take single-digit milliseconds, and the product team needs microsecond read latency with minimal application changes. What should the solutions architect recommend?",
o:["Add a DynamoDB Accelerator (DAX) cluster and point the existing DynamoDB client at the DAX cluster endpoint.","Deploy Amazon ElastiCache for Memcached and add cache-aside logic to every read path in the app.","Convert the table to a DynamoDB global table with replicas in two additional Regions.","Switch the table to provisioned capacity and double the read capacity units allocated."],
a:[0],
w:["DAX is an API-compatible in-memory cache for DynamoDB that gives microsecond reads with minimal code changes.","This can reach microseconds, but it needs significant application changes to manage the cache.","Global tables add multi-Region replication. They do not reduce latency within a Region.","More capacity prevents throttling, but DynamoDB itself still answers in milliseconds."],
k:"DynamoDB + microseconds + minimal changes → DAX."},

{id:"p17",d:2,ch:6,q:"A serverless API uses AWS Lambda functions that connect to an Amazon Aurora MySQL cluster. During traffic spikes, thousands of concurrent invocations open new connections, and the database fails with “too many connections.” What should the solutions architect do?",
o:["Place Amazon RDS Proxy between the functions and the cluster, and connect through the proxy endpoint.","Scale the Aurora writer up to a larger instance class to raise the max_connections setting.","Add two Aurora Replicas and spread the Lambda function connections across the cluster reader endpoint.","Configure reserved concurrency of 10 on the functions to cap the number of open connections."],
a:[0],
w:["RDS Proxy pools and shares connections, which absorbs bursts from short-lived Lambda invocations.","This raises the limit but does not solve unbounded connection churn, and it costs more.","Writes still go to the writer, and the replicas would face the same connection storm.","This caps connections but throttles the API during spikes, hurting availability."],
k:"Lambda + RDS connection exhaustion → RDS Proxy."},

{id:"p18",d:2,ch:7,q:"A payment service processes account events. Events for the same account must be processed exactly once and in the order sent, while different accounts can be processed in parallel. What should the solutions architect use?",
o:["An SQS FIFO queue that uses the account ID as the message group ID.","An SQS standard queue with deduplication logic added to each consumer.","An SNS standard topic with one SQS standard queue subscribed for each account.","A Kinesis data stream with one shard and a single consumer application."],
a:[0],
w:["FIFO preserves order within a message group and deduplicates. Different groups are processed in parallel.","Standard queues give at-least-once delivery with best-effort ordering, so order is not guaranteed.","Standard topics and queues do not guarantee ordering, and one queue per account does not scale.","One shard preserves order but removes parallelism, and Kinesis delivery is at-least-once."],
k:"Order + exactly-once + parallel per key → FIFO with message group ID."},

{id:"p19",d:2,ch:7,q:"When an article is published, three independent services must each process the event: search indexing, push notifications and analytics. Each must work at its own pace, and if one is down for an hour it must catch up without losing events. What should the solutions architect design?",
o:["Publish to an SNS topic that has three subscribed SQS queues, one queue for each service.","Send each event to one SQS queue that all three services poll from at the same time.","Publish to an SNS topic and subscribe each service’s HTTPS endpoint to that topic directly.","Write each event to an Amazon ElastiCache for Redis list that all three services read from."],
a:[0],
w:["SNS fan-out delivers a copy to each queue, and each queue buffers events until its consumer catches up.","Consumers would compete for messages, so each event reaches only one service.","SNS retries HTTPS deliveries for a limited time. An hour-long outage risks losing events.","A cache is not a durable message buffer, and coordinating three readers is custom work."],
k:"One event, many independent consumers, durable → SNS + SQS fan-out."},

{id:"p20",d:2,ch:7,q:"A worker fleet consumes an SQS standard queue. A few malformed messages always fail processing, return to the queue and are retried indefinitely, wasting capacity and delaying good messages. What should the solutions architect configure?",
o:["A redrive policy on the queue that moves messages to a dead-letter queue after a set maxReceiveCount.","A longer visibility timeout on the queue so that failed messages stay hidden from consumers for more time.","Long polling on the queue by setting ReceiveMessageWaitTimeSeconds to 20 seconds.","A delay queue setting so that every new message waits 15 minutes before it becomes visible."],
a:[0],
w:["After the set number of failed receives, messages move to a DLQ for inspection and stop blocking the queue.","They would still be retried forever, just less often.","Long polling reduces empty responses and cost. It does nothing about poison messages.","Delaying all messages slows everything and does not isolate the bad ones."],
k:"Poison messages → DLQ with maxReceiveCount."},

{id:"p21",d:3,ch:8,q:"An application runs in us-east-1 and eu-west-1. Users must be sent to the Region that gives them the lowest network latency, and traffic must automatically move to the other Region if one becomes unhealthy. Which Route 53 configuration meets the requirements?",
o:["Latency-based routing records for both Regions, each associated with a health check.","Geolocation routing records that map European countries to eu-west-1 and the rest to us-east-1.","Weighted routing records with a 50/50 split between the two Regions and no health checks.","Simple routing with a multivalue answer that returns both Regions’ IP addresses to clients."],
a:[0],
w:["Latency routing picks the lowest-latency healthy Region. Health checks remove a failing Region from answers.","Geography is not the same as latency, and failover needs health checks plus a default record.","An even split ignores latency, and without health checks users are still sent to a failed Region.","Simple routing has no health checks. Multivalue answer routing is a different policy."],
k:"“Lowest latency” → latency routing. “Legal/content by country” → geolocation."},

{id:"p22",d:1,ch:8,q:"Static assets are stored in a private S3 bucket and served globally through Amazon CloudFront. Security requires that the objects can be fetched only through CloudFront and never directly from S3. What should the solutions architect configure?",
o:["CloudFront origin access control, with a bucket policy that allows only that distribution to read objects.","Public read access on the bucket, with a bucket policy that checks for the distribution’s custom Referer header.","Presigned S3 URLs generated by a Lambda function and returned to clients on every page load.","The S3 static website endpoint as the origin, with an origin access identity attached to it."],
a:[0],
w:["OAC signs requests from CloudFront, and the bucket policy allows only that distribution, so direct access is denied.","A Referer header is easy to forge, and a public bucket still allows direct access.","Presigned URLs give direct S3 access, which is exactly what is forbidden, and they bypass the CDN.","OAI and OAC do not work with website endpoints, which must be public."],
k:"CloudFront → private S3 → OAC + bucket policy."},

{id:"p23",d:3,ch:8,q:"A multiplayer game uses UDP and runs in three Regions. Players’ firewalls need a small set of fixed IP addresses, and if a Region fails, players must be redirected in seconds without waiting for DNS caches to expire. What should the solutions architect use?",
o:["AWS Global Accelerator with an endpoint group in each Region placed in front of the game servers there.","Amazon CloudFront with an origin group that fails over automatically between the three Regions.","Route 53 failover routing with health checks and a 10-second TTL on each record.","A Network Load Balancer in each Region with cross-zone load balancing enabled."],
a:[0],
w:["Global Accelerator gives two static anycast IPs, supports UDP and fails over at the network layer within seconds.","CloudFront handles HTTP(S), not UDP game traffic, and its IP addresses are not fixed.","DNS failover depends on clients honouring TTLs, and many cache records longer.","NLBs are regional. They do not give global static IPs or cross-Region failover."],
k:"Static anycast IPs + UDP/TCP + fast regional failover → Global Accelerator."},

{id:"p24",d:1,ch:9,q:"A production security group was deleted last week and caused an outage. The security team must identify which IAM principal made the change, from which IP address and at what time. Which service provides this information?",
o:["AWS CloudTrail event history filtered for the DeleteSecurityGroup API call.","VPC Flow Logs for the affected subnets, filtered by the security group ID.","Amazon CloudWatch Logs collected from the instances by the unified CloudWatch agent.","AWS Trusted Advisor security checks for the account and Region involved."],
a:[0],
w:["CloudTrail records each API call with the caller identity, source IP and timestamp.","Flow logs record network traffic metadata, not management API calls.","Instance logs contain OS and application events, not AWS API activity.","Trusted Advisor gives best-practice checks, not an audit history of who did what."],
k:"“Who did what, when” → CloudTrail. “What changed in config” → Config."},

{id:"p25",d:2,ch:9,q:"Operations wants a CloudWatch alarm when memory utilization on EC2 Linux instances goes above 85%. The metric does not appear in CloudWatch. What should the solutions architect do?",
o:["Install the CloudWatch agent on the instances and configure it to publish memory metrics.","Enable detailed monitoring on the instances so that all of their metrics are published every minute.","Enable EC2 status checks and alarm on StatusCheckFailed_Instance instead of memory.","Install the AWS X-Ray daemon on the instances and use its memory traces for the alarm."],
a:[0],
w:["Memory is an OS-level metric. The CloudWatch agent collects it and publishes it as a custom metric.","Detailed monitoring raises the frequency of default metrics but still excludes memory.","Status checks measure reachability, not memory, so they do not meet the requirement.","X-Ray traces requests through applications. It does not publish OS memory metrics."],
k:"Memory, disk-space utilization → CloudWatch agent."},

{id:"p26",d:1,ch:9,q:"A company must detect any S3 bucket that becomes publicly readable in its accounts and automatically remove that access within minutes, with an audit history of each bucket’s compliance over time. What should the solutions architect implement?",
o:["The AWS Config managed rule s3-bucket-public-read-prohibited with an automatic SSM Automation remediation.","Amazon GuardDuty S3 Protection, sending findings to AWS Security Hub for the security team to review.","Amazon Inspector with continuous scanning enabled for every S3 bucket in each account.","CloudTrail Insights enabled on the organization trail to flag unusual s3:PutBucketAcl and s3:PutBucketPolicy API activity."],
a:[0],
w:["Config evaluates bucket configuration continuously, keeps a compliance timeline and can remediate automatically.","GuardDuty detects suspicious activity, not configuration drift, and this option has no automatic fix.","Inspector scans EC2, ECR images and Lambda for vulnerabilities, not S3 bucket policies.","Insights flags unusual API volume. It does not evaluate configuration or remediate."],
k:"Configuration compliance + history + auto-fix → AWS Config rules with remediation."},

{id:"p27",d:3,ch:10,q:"A website produces about 50 million clickstream events a day. The analytics team wants the events in S3 as Apache Parquet files within a few minutes of arrival, with no servers or consumer code to manage. What should the solutions architect use?",
o:["Amazon Data Firehose with record format conversion to Parquet using an AWS Glue table schema.","Kinesis Data Streams with a consumer application on EC2 that writes Parquet files to S3.","An SQS queue with a Lambda function that batches the messages and writes the Parquet files to the S3 bucket.","Amazon MSK with Kafka Connect workers running on EC2 that write the topics to S3 as Parquet."],
a:[0],
w:["Firehose is fully managed, buffers for near real-time delivery and converts JSON to Parquet natively.","It works but means managing consumer code and instances.","This is custom batching and conversion code to build and maintain.","Running Kafka and Connect workers is heavy operational overhead for this need."],
k:"“Deliver to S3/Redshift/OpenSearch, no code, near real-time” → Firehose."},

{id:"p28",d:3,ch:10,q:"Several independent applications must read the same stream of order events, each at its own pace, and must be able to replay the last 7 days of events. Ordering per order ID must be preserved. What should the solutions architect use?",
o:["Kinesis Data Streams with retention extended to 7 days, using the order ID as partition key.","Amazon Data Firehose delivery streams, with a separate delivery stream for each application.","An SQS FIFO queue with a 7-day retention period, using the order ID as the message group ID.","An SNS FIFO topic that fans out to each application, using the order ID as the message group ID."],
a:[0],
w:["Records stay available for replay during retention, and many consumers read independently with order kept per partition key.","Firehose delivers to destinations. Consumers cannot replay or read it.","Messages are deleted once consumed, so several applications cannot each read every message.","SNS does not store messages for replay. Delivery is push-only."],
k:"Multiple consumers + replay → Kinesis Data Streams (or MSK)."},

{id:"p29",d:4,ch:10,q:"Analysts run SQL queries a few times a week on 20 TB of historical data in S3. Queries can take minutes, and the company wants no infrastructure to manage and no cost while queries are not running. Which solution is MOST cost-effective?",
o:["Query the data in place with Amazon Athena after converting the files to partitioned Parquet format.","Load the data into a provisioned Amazon Redshift cluster that keeps running all month long.","Run an Amazon EMR cluster with Presto that is kept running for analysts to use.","Import the data into Amazon RDS for PostgreSQL and run the queries against it."],
a:[0],
w:["Athena is serverless and charges per data scanned. Parquet and partitioning cut the scan size.","A provisioned cluster bills by the hour even when no one is querying.","An always-on cluster bills continuously and needs cluster management.","RDS is the wrong engine for 20 TB of analytics and bills continuously."],
k:"Occasional SQL on S3, serverless → Athena."},

{id:"p30",d:3,ch:11,q:"A company must move 80 TB from its data center to Amazon S3 within 10 days. Its 1 Gbps internet link averages 50% available bandwidth, and a new Direct Connect connection would take several weeks to provision. What should the solutions architect recommend?",
o:["Order AWS Snowball Edge Storage Optimized devices, copy the data and ship them to AWS.","Use AWS DataSync over the existing internet link with bandwidth throttling disabled.","Order a 10 Gbps AWS Direct Connect connection and transfer the data once it is live.","Enable S3 Transfer Acceleration and upload in parallel using multipart uploads."],
a:[0],
w:["Offline transfer avoids the network limit. Devices typically arrive, load and return within the window.","At an effective 500 Mbps, 80 TB takes about 15 days, longer than the deadline.","Provisioning takes weeks, so the deadline would be missed.","Acceleration cannot exceed the 1 Gbps link, so the bandwidth maths still fails."],
k:"Do the maths: TB × 8 ÷ effective Gbps. If it exceeds the deadline → Snowball."},

{id:"p31",d:2,ch:11,q:"A company is migrating an on-premises Oracle database to Amazon Aurora PostgreSQL. The application can tolerate only a few minutes of downtime during cutover. Which approach should the solutions architect use?",
o:["Convert the schema with AWS SCT, then use AWS DMS with a full load plus ongoing change data capture.","Use AWS DMS alone with a full load task, then stop the application during the whole copy.","Export with Oracle Data Pump and import the dump file into Aurora PostgreSQL directly.","Copy the Oracle database files to S3 with Snowball Edge and restore them on the new Aurora cluster."],
a:[0],
w:["SCT handles the heterogeneous schema conversion. DMS CDC keeps the target in sync until a short cutover.","DMS does not convert the schema, and stopping the app for the full copy means long downtime.","Data Pump output cannot be imported into PostgreSQL.","Oracle data files cannot be restored into Aurora PostgreSQL."],
k:"Different engines → SCT + DMS. Minimal downtime → CDC."},

{id:"p32",d:3,ch:11,q:"A company needs to copy files nightly from an on-premises NFS server to Amazon EFS. Transfers must be scheduled, validate data integrity and use as much bandwidth as is available, with minimal scripting. What should the solutions architect use?",
o:["AWS DataSync with an agent on premises and a scheduled task that targets the EFS file system.","AWS Storage Gateway S3 File Gateway that writes the files to the EFS file system each night.","AWS Transfer Family with an SFTP server that is backed by the EFS file system.","An EC2 instance in the VPC running a nightly rsync cron job over an AWS Site-to-Site VPN connection."],
a:[0],
w:["DataSync is built for scheduled, integrity-checked online transfers to S3, EFS and FSx.","File Gateway stores data in S3, not EFS.","Transfer Family accepts SFTP uploads but does not schedule or pull from an NFS source.","It works, but it means custom scripts, no built-in integrity validation and more to maintain."],
k:"Scheduled online copy NFS/SMB → S3/EFS/FSx → DataSync."},

{id:"p33",d:2,ch:12,q:"A stateless application needs at least 4 running instances at all times to handle its load, including during the loss of a single Availability Zone. The Region has three AZs. Which Auto Scaling group configuration is MOST cost-effective?",
o:["Use three AZs with a minimum of 6 instances, so that each AZ runs 2 instances.","Use two AZs with a minimum of 4 instances, so that each AZ runs 2 instances.","Use two AZs with a minimum of 8 instances, so that each AZ runs 4 instances.","Use two AZs with a minimum of 4 and a policy that adds instances after a failure."],
a:[0],
w:["Losing one AZ leaves 4 instances, so capacity holds with only 2 extra instances.","Losing one AZ leaves 2 instances, which is below the required 4.","This meets the requirement but needs 8 instances instead of 6.","Capacity drops below 4 until new instances launch and become healthy."],
k:"Static stability: N needed, k AZs → N/(k−1) per AZ. More AZs = less overprovisioning."},

{id:"p34",d:2,ch:12,q:"After an RDS Multi-AZ failover test, the application could not reconnect to the database until engineers updated its configuration. The application stored the database’s IP address in a config file. What should the solutions architect recommend?",
o:["Configure the application to connect through the RDS instance’s DNS endpoint name instead of the IP.","Assign an Elastic IP address to the RDS instance and connect to that address.","Put a Network Load Balancer in front of the database and connect to its static IP address.","Create a Route 53 A record containing the primary IP and update it after failover."],
a:[0],
w:["Failover updates the endpoint’s DNS to point at the new primary, so clients reconnect automatically.","RDS instances cannot be given Elastic IPs.","This adds complexity and needs target updates after failover anyway.","This puts the same manual step back in place."],
k:"Always connect to RDS by endpoint name, never by IP."},

{id:"p35",d:2,ch:12,q:"A licensed legacy application runs on a single EC2 instance and cannot be clustered. If the underlying host fails, the instance must come back automatically with the same instance ID, private IP and attached EBS volumes. What should the solutions architect configure?",
o:["A CloudWatch alarm on StatusCheckFailed_System that runs the EC2 recover action.","An Auto Scaling group with a minimum, maximum and desired capacity of 1 instance.","Hourly EBS snapshots with Amazon Data Lifecycle Manager and a documented restore runbook.","A spread placement group, so the instance is placed on hardware isolated from others."],
a:[0],
w:["Recovery moves the instance to healthy hardware and keeps its ID, private IP, EBS volumes and metadata.","The group replaces the instance with a new one that has a new ID and IP.","Restoring from a snapshot is manual and slow and produces a new instance.","Placement reduces correlated failure but does not recover a failed instance."],
k:"Same instance ID/IP after host failure → EC2 recover action."},

{id:"p36",d:2,ch:13,q:"A news platform in ap-south-1 needs a disaster recovery plan in another Region with an RPO of 15 minutes and an RTO of 1 hour. The company wants the lowest cost that meets both targets. Which strategy should the solutions architect choose?",
o:["Backup and restore, using AWS Backup to copy daily snapshots to the DR Region.","Pilot light, with a cross-Region database replica and AMIs ready for app servers.","Warm standby, with a scaled-down copy of the full application stack running in the DR Region.","Multi-site active-active, with full capacity serving traffic from both Regions."],
a:[1],
w:["Daily snapshots give an RPO of up to 24 hours, and a full restore may exceed the RTO.","Continuous replication meets the RPO, and launching app servers from AMIs fits the 1-hour RTO at low cost.","This meets the targets but costs more because the whole stack runs all the time.","This gives near-zero RPO and RTO at the highest cost, more than the targets need."],
k:"Pick the cheapest DR tier that meets both RPO and RTO."},

{id:"p37",d:2,ch:13,q:"A trading application uses Amazon Aurora MySQL. It needs a cross-Region DR copy with an RPO measured in seconds and recovery in under a minute, plus low-latency reads for users in the second Region. What should the solutions architect use?",
o:["Amazon Aurora Global Database with a secondary cluster in the second Region.","A cross-Region Aurora read replica created from a binary-log replication setup.","Automated Aurora snapshots copied to the second Region every hour.","AWS DMS with ongoing replication from the primary to a cluster in the second Region."],
a:[0],
w:["Storage-level replication typically under a second, fast promotion and local read replicas in the secondary Region.","Binlog replication has higher lag and slower, more manual promotion.","Hourly snapshots mean up to an hour of data loss and a slow restore.","DMS adds lag and operational work. It is not designed for DR failover."],
k:"Aurora + cross-Region + seconds → Aurora Global Database."},

{id:"p38",d:1,ch:13,q:"After a ransomware incident at a peer company, leadership requires that backups of EC2, EBS and RDS cannot be deleted by anyone, even with compromised administrator credentials, during a 35-day retention period. What should the solutions architect implement?",
o:["AWS Backup plans with copies to a separate account’s vault that has Vault Lock in compliance mode.","EBS and RDS snapshots tagged “do-not-delete,” with an IAM policy that denies deletion by tag.","Amazon Data Lifecycle Manager policies that create snapshots daily and copy them to a second Region.","S3 Cross-Region Replication of exported snapshot files to a bucket with versioning enabled."],
a:[0],
w:["Vault Lock in compliance mode makes recovery points immutable. A separate account limits the impact of compromise.","An administrator can change the tag or the IAM policy.","Copies in another Region can still be deleted by a compromised administrator.","Versioning alone does not prevent deletion, and exporting snapshots to S3 is not how these backups work."],
k:"Immutable backups → AWS Backup Vault Lock (compliance mode), ideally cross-account."},

{id:"p39",d:3,ch:14,q:"Every weekday at 9:00 AM, traffic to an application rises sharply within 5 minutes as staff log in. Target tracking scaling reacts too late, and users see slow responses for the first 15 minutes. What should the solutions architect do?",
o:["Add a scheduled scaling action that raises the group’s minimum capacity at 8:45 AM on weekdays.","Lower the target tracking CPU target from 60% to 30% so that scale-out begins much earlier in the morning.","Replace target tracking with step scaling policies that add instances in large increments.","Reduce the default instance warmup to zero so new instances join the group immediately."],
a:[0],
w:["For a known, recurring spike, adding capacity before it arrives removes the lag.","This runs more capacity all day and still reacts after the spike starts.","This still reacts after load arrives, so the gap is shorter but remains.","Instances still need time to boot. This only distorts the scaling metrics."],
k:"Predictable spike → scheduled (or predictive) scaling."},

{id:"p40",d:3,ch:14,q:"A news site’s database is 95% reads, and most of those reads fetch the same few thousand popular articles. The RDS instance is at 80% CPU during peaks. Which solution improves performance MOST cost-effectively?",
o:["Add Amazon ElastiCache and use a cache-aside pattern with a TTL for article reads.","Scale the RDS instance up to the next larger instance class within the same family.","Convert the instance to a Multi-AZ deployment so reads are shared with the standby.","Move the database storage to Provisioned IOPS SSD volumes with a higher IOPS setting."],
a:[0],
w:["Repeated reads of hot items are served from memory, offloading most of the database load cheaply.","This raises cost and only delays the problem as traffic grows.","The standby of a Multi-AZ instance does not serve reads.","CPU is the bottleneck, not I/O, and repeated reads are better cached."],
k:"Read-heavy + same items repeatedly → cache."},

{id:"p41",d:3,ch:14,q:"An Auto Scaling group of workers processes messages from an SQS queue. Each instance can handle 100 messages per minute, and the queue backlog varies widely during the day. Which scaling approach keeps processing latency steady?",
o:["Target tracking on a custom backlog-per-instance metric derived from ApproximateNumberOfMessagesVisible.","Target tracking on the group’s average CPUUtilization metric with a target value of 50%.","Scheduled scaling actions based on the backlog seen at the same hour of the same weekday in the previous week.","Step scaling based only on the queue’s ApproximateAgeOfOldestMessage CloudWatch metric."],
a:[0],
w:["Dividing the backlog by running instances and tracking the acceptable target scales directly with the work waiting.","CPU may not reflect queue depth, especially for I/O-bound workers.","Last week’s pattern does not match a backlog that varies widely.","Age is a lagging signal, and on its own it ignores the fleet size."],
k:"SQS workers → scale on backlog per instance."},

{id:"p42",d:4,ch:15,q:"A company runs a steady baseline of compute 24/7 across EC2 instances of several families, Amazon ECS on Fargate and AWS Lambda. It expects to change instance families and Regions over the next 3 years. Which purchasing option saves the most while keeping this flexibility?",
o:["Compute Savings Plans that cover the steady hourly baseline spend.","EC2 Instance Savings Plans for each instance family that is in use.","Standard Reserved Instances bought for the current instance types.","Spot Instances for the baseline, with On-Demand capacity as a fallback."],
a:[0],
w:["They apply across instance families, sizes, Regions, Fargate and Lambda automatically.","These are locked to one family in one Region and do not cover Fargate or Lambda.","Standard RIs are tied to instance attributes and do not cover Fargate or Lambda.","Spot can be interrupted, which does not fit a steady baseline that must run."],
k:"Flexibility across family/Region/Fargate/Lambda → Compute Savings Plans."},

{id:"p43",d:4,ch:15,q:"A media company runs nightly video-encoding batch jobs. Jobs can be stopped and restarted from checkpoints, finish anywhere within an 8-hour window, and can use many different instance types. Which option is MOST cost-effective?",
o:["Spot Instances across several instance types and AZs, using the capacity-optimized allocation strategy for the fleet.","On-Demand Instances in an Auto Scaling group that scales out and in based on the size of the job queue.","Compute Savings Plans covering the full nightly capacity used by the encoding jobs.","Dedicated Hosts reserved for the encoding fleet to reduce per-instance licensing costs."],
a:[0],
w:["Interruptible, flexible and checkpointed work fits Spot. Diversification and capacity-optimized allocation reduce interruptions.","This works but costs several times more than Spot.","A Savings Plan commits spend for 24 hours a day, but the work runs only part of the night.","Dedicated Hosts are for licensing or compliance needs, not lowest cost."],
k:"Interruptible + flexible → Spot, diversified."},

{id:"p44",d:4,ch:15,q:"A website serves large images directly from S3 to users worldwide. The images change rarely, and data transfer out is now the largest line on the bill. What should the solutions architect do to reduce cost?",
o:["Serve the images through Amazon CloudFront with long cache TTLs on the image paths.","Enable S3 Transfer Acceleration on the bucket and use the accelerated endpoint.","Enable Requester Pays on the bucket so users are charged for their own downloads.","Move the images to S3 Intelligent-Tiering so storage costs drop automatically."],
a:[0],
w:["CloudFront’s per-GB rate is lower than S3 internet egress, S3 to CloudFront transfer is free and caching cuts origin requests.","Acceleration speeds up transfers and adds cost.","Requester Pays needs authenticated AWS requesters, which public website visitors are not.","This reduces storage cost, not data transfer cost."],
k:"High egress for repeated content → CloudFront."},

{id:"p45",d:4,ch:15,q:"A data platform stores millions of objects larger than 1 MB in S3. Access patterns are unknown and change often: some datasets go cold for months and then suddenly become hot again. Retrieval must always be immediate. Which storage class minimizes cost with no operational effort?",
o:["S3 Intelligent-Tiering, using its frequent, infrequent and archive instant access tiers.","S3 Standard-IA, with a lifecycle rule that moves objects back to S3 Standard whenever they are accessed.","S3 Standard for all objects, reviewed with S3 Storage Lens on a quarterly basis.","S3 Glacier Instant Retrieval for all objects, so storage stays at the lowest price."],
a:[0],
w:["It moves objects between tiers automatically based on access, with no retrieval fees and immediate access.","Lifecycle rules cannot move objects back to Standard on access, and IA adds retrieval fees.","Hot and cold data are all billed at the highest storage price, and reviews take manual work.","Retrieval fees on suddenly hot data can exceed the storage savings."],
k:"Unknown/changing access → Intelligent-Tiering."}
];
const DIAGNOSTIC_IDS = ["p1","p3","p6","p9","p12","p15","p18","p27","p36","p42"];

const MOCK1 = [
// ---------- Domain 1: Secure architectures (20) ----------
{id:"m1",d:1,ch:3,q:"Developers in a sandbox account must be able to create IAM roles for their own Lambda functions. The security team must ensure developers can never create a role with more permissions than an approved set, even if they attach AdministratorAccess to it. Which solution meets these requirements with the LEAST ongoing effort?",
o:["Allow iam:CreateRole only when the iam:PermissionsBoundary condition key equals an approved boundary policy ARN.","Attach a service control policy to the sandbox account that denies every iam:* action for all developer principals.","Deploy an AWS Config rule that flags roles with administrator access and sends the findings to the security team.","Run IAM Access Analyzer policy validation in the deployment pipeline and block templates with broad permissions."],
a:[0],
w:["Requiring a permissions boundary on created roles caps their effective permissions at the boundary, whatever policies are attached.","This stops developers from creating any roles, which breaks the requirement.","This only detects after the fact. Overly permissive roles exist until someone acts.","Developers can bypass the pipeline and call IAM directly, so this is not enforced."],
k:"Delegated role creation with a ceiling → permissions boundary."},

{id:"m2",d:1,ch:3,q:"A Lambda function in Account A must write objects to an S3 bucket in Account B. The bucket uses SSE-KMS with a customer managed key that lives in Account B. The function’s execution role already has an identity policy allowing s3:PutObject and kms:GenerateDataKey on those resources. Which TWO additional changes are required?",
o:["Add a statement to the bucket policy in Account B that allows s3:PutObject for the Account A role.","Add a statement to the KMS key policy in Account B that allows the Account A role to use the key.","Add an S3 ACL grant of bucket-owner-full-control to every object the function uploads.","Create a replica of the KMS key in Account A and change the function to use the replica key.","Create an IAM user in Account B and store its access keys in the function’s environment."],
a:[0,1],
w:["Cross-account access needs the resource owner’s permission, which is the bucket policy.","Using a key from another account needs the key policy in the owning account to allow the external principal.","ACLs are disabled by default with Object Ownership set to bucket owner enforced. They are not what is missing.","Multi-Region replica keys are for other Regions in the same account. They cannot move a key to another account.","Long-term keys are an anti-pattern, and the role-based cross-account setup already works."],
k:"Cross-account = both sides allow. For SSE-KMS, the key policy is the second door."},

{id:"m3",d:1,ch:3,q:"A public web application behind an Application Load Balancer is seeing SQL injection attempts and bursts of thousands of requests per minute from individual bot IP addresses. The company wants managed protection that can be tuned without changing application code. What should the solutions architect implement?",
o:["An AWS WAF web ACL on the ALB with the AWS managed SQL database rule group and a rate-based rule.","AWS Shield Advanced enabled for the ALB, with the Shield Response Team engaged for each new incident.","Security group rules on the ALB that deny traffic from the bot IP addresses as they are discovered.","Network ACL deny rules on the public subnets that block each bot IP address as it appears in logs."],
a:[0],
w:["WAF inspects layer 7 requests. Managed rules block SQLi patterns, and rate-based rules throttle per-IP floods.","Shield Advanced targets DDoS. It does not include SQL injection filtering by itself.","Security groups only support allow rules, so they cannot deny specific IPs.","NACLs have small rule limits, need manual updates and cannot inspect SQL injection."],
k:"Layer 7 attacks (SQLi, XSS, bots, rate limiting) → WAF."},

{id:"m4",d:1,ch:5,q:"A company has 40 AWS accounts. Compliance must know which S3 buckets contain personal data such as passport numbers and national ID numbers, and wants findings centralized in one security account with minimal setup in each account. What should the solutions architect use?",
o:["Amazon Macie with a delegated administrator account and automated sensitive data discovery enabled.","Amazon GuardDuty with S3 Protection enabled in every account and findings sent to a central account.","Amazon Inspector with a delegated administrator account scanning S3 buckets across the organization.","An AWS Config conformance pack deployed with StackSets that checks bucket encryption settings."],
a:[0],
w:["Macie discovers sensitive data inside S3 objects and manages member accounts from a delegated administrator.","GuardDuty detects threats and suspicious access, not personal data in object contents.","Inspector scans compute workloads for vulnerabilities. It does not inspect S3 object contents.","Encryption settings say nothing about whether objects contain personal data."],
k:"Find PII in S3 → Macie."},

{id:"m5",d:1,ch:3,q:"A mobile app lets users sign in with Google or Apple. Each user must upload photos directly to S3, only under their own prefix, without the uploads passing through any company server and without the company running a service that issues upload URLs. What should the solutions architect do?",
o:["Use a Cognito user pool for sign-in and an identity pool whose role allows access to a prefix built from the identity ID variable.","Use a Cognito user pool for sign-in and have the app send the user pool’s ID token in the Authorization header of each S3 upload request.","Create an IAM user for each mobile customer at sign-up and store that user’s access keys in the app’s secure storage.","Use IAM Identity Center with Google and Apple as identity sources and give every customer a shared permission set."],
a:[0],
w:["Identity pools exchange the sign-in for temporary AWS credentials, and a policy variable restricts each user to their own prefix.","S3 does not accept Cognito JWTs as request authentication.","Long-term keys in a mobile app are insecure, and IAM users do not scale to customers.","Identity Center is for workforce access to AWS accounts, not app customers."],
k:"App users need AWS credentials directly → Cognito identity pool."},

{id:"m6",d:1,ch:6,q:"An existing Amazon RDS for MySQL instance was created without encryption at rest. A new policy requires encryption with a customer managed KMS key. Which approach meets the requirement?",
o:["Take a snapshot, copy it with encryption enabled using the key, then restore a new instance from the copy.","Modify the existing DB instance, turn on storage encryption and apply the change in the next maintenance window.","Create an encrypted read replica from the unencrypted instance, then promote the replica to a standalone instance.","Turn on EBS encryption by default in the Region so that the existing instance’s storage becomes encrypted."],
a:[0],
w:["Encryption cannot be enabled in place. Copying a snapshot with encryption and restoring it is the supported path.","RDS does not allow turning on encryption for an existing unencrypted instance.","A read replica of an unencrypted instance cannot be encrypted.","Default EBS encryption affects new EBS volumes only and does not apply to RDS storage."],
k:"Encrypt existing RDS → snapshot, encrypted copy, restore."},

{id:"m7",d:1,ch:2,q:"EC2 instances in private subnets with no NAT gateway must send messages to Amazon SQS and read secrets from AWS Secrets Manager. Compliance forbids any route to the internet. Which TWO actions should the solutions architect take?",
o:["Create an interface VPC endpoint for Amazon SQS with private DNS enabled.","Create an interface VPC endpoint for AWS Secrets Manager with private DNS enabled.","Create a gateway VPC endpoint for Amazon SQS and add it to the private route tables.","Add a NAT gateway with a security group that allows traffic only to AWS service IP ranges.","Peer the VPC with the AWS service VPC that hosts the SQS and Secrets Manager endpoints."],
a:[0,1],
w:["An interface endpoint reaches SQS privately. Private DNS keeps the default SDK endpoint names working.","The same applies to Secrets Manager.","Gateway endpoints exist only for S3 and DynamoDB.","A NAT gateway is an internet path, and NAT gateways do not use security groups.","You cannot peer with AWS service VPCs. PrivateLink endpoints are the mechanism."],
k:"Private access to AWS APIs: gateway endpoint for S3/DynamoDB, interface endpoint for everything else."},

{id:"m8",d:1,ch:3,q:"A payments company must store encryption keys in single-tenant hardware security modules that it alone controls. AWS must have no ability to access or use the key material, and the company must manage HSM users itself. What should the solutions architect use?",
o:["AWS CloudHSM clusters, with the company itself managing the HSM crypto users and the keys.","AWS KMS customer managed keys, with automatic annual key rotation turned on.","AWS KMS customer managed keys that are created from your own imported key material.","Amazon S3 server-side encryption with Amazon S3 managed keys on every bucket."],
a:[0],
w:["CloudHSM gives dedicated single-tenant HSMs where the customer exclusively controls users and keys.","KMS runs on shared, AWS-managed HSMs, so tenancy and control do not meet the requirement.","Imported material still lives in AWS-managed multi-tenant KMS HSMs.","AWS fully manages these keys."],
k:"Single-tenant HSM, customer-exclusive control → CloudHSM."},
