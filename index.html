e) + health checks.<\/li>\n<li><strong>SAA exam clue:<\/strong> “route users to the closest region”, “failover to secondary region”, “route based on user location for compliance”, “send 10% of traffic”.<\/li>\n<li><strong>Memory rule:<\/strong> Latency = fastest, Geolocation = legal, Weighted = experiments, Failover = DR.<\/li>\n<\/ul>\n<h3 id=\"s-amazon-cloudfront\">Amazon CloudFront<\/h3>\n<ul>\n<li><strong>Problem it solves:<\/strong> Static and cacheable content should be served from near the user, not from the origin every time.<\/li>\n<li><strong>Why PulseWire needs it:<\/strong> 95% of requests are reads of images, JS, CSS and article pages. Caching them at 600+ edge locations cuts latency and origin load dramatically.<\/li>\n<li><strong>How it works:<\/strong> A CDN in front of <strong>origins<\/strong> (S3 bucket, ALB, API Gateway, any HTTP server). <strong>Cache behaviors<\/strong> per path: <code>/static/*<\/code> and <code>/media/*<\/code> cached for days; <code>/api/*<\/code> cached for seconds or not at all, forwarding auth headers. <strong>Origin Access Control (OAC)<\/strong> lets only CloudFront read the private S3 bucket. <strong>Signed URLs/cookies<\/strong> protect premium (subscriber-only) video. <strong>Origin groups<\/strong> fail over to a second origin (e.g. the eu-west-1 bucket) on errors. Edge compute: <strong>CloudFront Functions<\/strong> (lightweight header/URL rewrites, sub-ms) and <strong>Lambda@Edge<\/strong> (heavier logic, network calls). <strong>Geo restriction<\/strong> blocks countries for licensing.<\/li>\n<li><strong>Where it sits:<\/strong> <code>Route 53 → CloudFront (+WAF, Shield) → ALB / S3 / API Gateway<\/code>.<\/li>\n<li><strong>Alternatives:<\/strong> Serving directly from S3/ALB; Global Accelerator; third-party CDNs.<\/li>\n<li><strong>Why we chose it:<\/strong> Biggest latency win per dollar, absorbs breaking-news spikes, integrates WAF and Shield at the edge, and data out from CloudFront is generally cheaper than data out from EC2/S3 directly.<\/li>\n<li><strong>When NOT to use it:<\/strong> Non-HTTP protocols (UDP game traffic, MQTT) or when you need static IPs → Global Accelerator.<\/li>\n<li><strong>Security impact:<\/strong> TLS at the edge (ACM cert in us-east-1), WAF, Shield, OAC (bucket stays private), restrict ALB to CloudFront only (managed prefix list or a secret custom header).<\/li>\n<li><strong>Scaling impact:<\/strong> Cache hit ratio is everything: a 95% hit ratio means the origin sees 1/20th of traffic. Use cache policies that exclude unnecessary headers/cookies/query strings from the cache key.<\/li>\n<li><strong>Cost:<\/strong> Data transfer out + requests by region. <strong>Price classes<\/strong> exclude expensive regions if you don’t need them. <strong>Invalidations<\/strong> cost beyond a free quota — prefer <strong>versioned file names<\/strong> (<code>app.v42.js<\/code>).<\/li>\n<li><strong>SAA exam clue:<\/strong> “static content”, “global users”, “reduce latency”, “cache at edge”, “reduce load on origin”, “restrict S3 access to CloudFront only”, “premium content with signed URLs”.<\/li>\n<li><strong>Memory rule:<\/strong> CloudFront = copies of your content parked near every reader.<\/li>\n<\/ul>\n<h3 id=\"s-aws-global-accelerator\">AWS Global Accelerator<\/h3>\n<ul>\n<li><strong>Problem it solves:<\/strong> Dynamic, non-cacheable or non-HTTP traffic still suffers from the public internet’s unpredictable routing; DNS-based failover is slowed by caching.<\/li>\n<li><strong>Why PulseWire would use it:<\/strong> The live sports-score feed for partner apps is TCP, needs <strong>two static IPs<\/strong> partners can allow-list, and must fail over between regions in seconds.<\/li>\n<li><strong>How it works:<\/strong> Gives you <strong>2 static anycast IPs<\/strong>. Users enter AWS’s backbone at the nearest edge and are routed to the best healthy regional endpoint (ALB, NLB, EC2, Elastic IP). Health-checked failover in seconds, with no DNS TTL involved. Traffic dials let you shift load between regions. <strong>No caching.<\/strong><\/li>\n<li><strong>SAA exam clue:<\/strong> “static IP”, “UDP”, “gaming”, “VoIP”, “improve performance for non-HTTP”, “fast regional failover”, “allow-list IP addresses”.<\/li>\n<li><strong>Memory rule:<\/strong> Global Accelerator = a private highway from the user’s doorstep to your region; nothing is cached on it.<\/li>\n<\/ul>\n<h3 id=\"s-the-two-comparisons-the-exam-loves\">The two comparisons the exam loves<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>CloudFront<\/th>\n<th>Global Accelerator<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Caches content?<\/td>\n<td><strong>Yes<\/strong><\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td>Protocols<\/td>\n<td>HTTP/HTTPS (WebSocket)<\/td>\n<td><strong>TCP and UDP<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Entry point<\/td>\n<td>DNS name (IPs vary)<\/td>\n<td><strong>2 static anycast IPs<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Best for<\/td>\n<td>Static/cacheable web content, APIs over HTTP<\/td>\n<td>Gaming, VoIP, IoT, non-HTTP, static IP needs, fast multi-region failover<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Route 53<\/th>\n<th>CloudFront<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Layer<\/td>\n<td>DNS: answers <em>where<\/em> to go<\/td>\n<td>CDN: <em>serves<\/em> content from the edge<\/td>\n<\/tr>\n<tr>\n<td>Moves data?<\/td>\n<td>No, returns an IP<\/td>\n<td>Yes, caches and delivers bytes<\/td>\n<\/tr>\n<tr>\n<td>Together<\/td>\n<td>Route 53 alias <code>pulsewire.com<\/code> → the CloudFront distribution → origins<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3 id=\"s-pulsewires-global-architecture\">PulseWire’s global architecture<\/h3>\n<pre class=\"diagram\"><code>                         Users (India, US, EU)\n                                 │\n                Route 53: geolocation (EU → eu-west-1) + latency (others)\n                                 │\n                    CloudFront (+ WAF + Shield Advanced)\n          ┌──────────────────────┼──────────────────────┐\n          ▼                       ▼                      ▼\n   ap-south-1 (primary)    us-east-1               eu-west-1\n   ALB → ECS               ALB → ECS               ALB → ECS\n   Aurora writer           Aurora Global reader    Aurora Global reader (EU-only tables separate)\n   DynamoDB Global Table ◀───── replicas ─────▶ DynamoDB Global Table\n   S3 media ──CRR──▶ S3 (us)            S3 media (eu) ◀──CRR──\n<\/code><\/pre>\n<p>Reads are served locally in each region. Writes to articles go to the Mumbai writer (Aurora Global Database <strong>write forwarding<\/strong> lets secondary regions accept writes and forward them). Comments and sessions are written locally to DynamoDB Global Tables (multi-active). EU readers’ personal data lives in EU-only tables and buckets that aren’t replicated out.<\/p>\n<h3 id=\"s-failure-scenarios\">Failure scenarios<\/h3>\n<ol>\n<li><em>Users in Europe see high latency for images and pages.<\/em> CloudFront first (cheapest, biggest win). Only add an EU region if dynamic requests are also slow or residency requires it.<\/li>\n<li><em>A gaming/live-feed partner needs static IPs and UDP.<\/em> Global Accelerator. CloudFront doesn’t do UDP or static IPs.<\/li>\n<li><em>Must route German users to EU servers for compliance.<\/em> Route 53 geolocation. Not latency routing — latency could legally send them elsewhere.<\/li>\n<li><em>The S3 bucket must not be publicly accessible but content is served globally.<\/em> CloudFront with Origin Access Control, bucket policy allowing only the distribution, Block Public Access on.<\/li>\n<li><em>Deploying a risky new version.<\/em> Route 53 weighted records (5% → new stack) or ALB weighted target groups, then increase.<\/li>\n<li><em>Region fails; users still hit it for minutes.<\/em> DNS TTL and client caching. Use short TTLs with health checks, or Global Accelerator for near-instant failover.<\/li>\n<\/ol>\n<h3 id=\"s-decision-tree\">Decision tree<\/h3>\n<pre class=\"diagram\"><code>Global users slow?\n  ├── HTTP content (static or cacheable) → CloudFront\n  ├── TCP/UDP, static IPs, fast failover → Global Accelerator\n  └── Dynamic + data needed locally → Multi-region + Route 53 latency routing\n\nRoute 53 policy?\n  ├── Lowest latency → Latency\n  ├── User&#39;s country/continent (compliance, localization) → Geolocation\n  ├── Shift traffic by distance with bias → Geoproximity\n  ├── Percentage split (canary, blue/green) → Weighted\n  ├── Active-passive DR → Failover (+ health checks)\n  └── Several healthy IPs returned → Multivalue\n<\/code><\/pre>\n<p><strong>Domains:<\/strong> 2 (global infrastructure, failover), 3 (edge networking, network topology), 4 (CDN reduces origin and transfer cost).<\/p>\n","toc":[{"id":"amazon-route-53","text":"Amazon Route 53"},{"id":"amazon-cloudfront","text":"Amazon CloudFront"},{"id":"aws-global-accelerator","text":"AWS Global Accelerator"},{"id":"the-two-comparisons-the-exam-loves","text":"The two comparisons the exam loves"},{"id":"pulsewires-global-architecture","text":"PulseWire&#39;s global architecture"},{"id":"failure-scenarios","text":"Failure scenarios"},{"id":"decision-tree","text":"Decision tree"}]},{"id":"ch9","ch":9,"title":"Chapter 9: How do we know it’s working? (Monitoring and auditing)","short":"How do we know it’s working?","topic":"Monitoring and auditing","d":1,"focus":false,"mins":5,"html":"<p>In Chapter 1, PulseWire learned about its outage from Twitter. Now the platform spans three regions and forty services, and Meera asks four different questions. Each has its own service:<\/p>\n<pre class=\"diagram\"><code>&quot;Is the site healthy right now?&quot;          → CloudWatch   (what is happening)\n&quot;Who deleted the production bucket?&quot;      → CloudTrail   (who did what, when, from where)\n&quot;Is our config still compliant?&quot;          → AWS Config   (what changed, is it allowed)\n&quot;Is it us, or is AWS having a problem?&quot;   → AWS Health   (AWS-side events affecting you)\n&quot;Which microservice made checkout slow?&quot; → X-Ray        (where time is spent across services)\n<\/code><\/pre>\n<h3 id=\"s-amazon-cloudwatch\">Amazon CloudWatch<\/h3>\n<ul>\n<li><strong>Problem it solves:<\/strong> You need metrics, logs and alerts for everything in one place, with automatic actions.<\/li>\n<li><strong>Why PulseWire needs it:<\/strong> Alert on errors and latency before readers notice; drive Auto Scaling; keep logs searchable.<\/li>\n<li><strong>How it works:<\/strong><ul>\n<li><strong>Metrics<\/strong>: AWS services publish automatically (EC2 basic every 5 min, detailed 1 min). <strong>Memory and disk usage are NOT default EC2 metrics<\/strong> — install the <strong>CloudWatch agent<\/strong> (classic exam trap). Custom metrics (e.g. <code>ArticlesPublished<\/code>) down to 1-second resolution.<\/li>\n<li><strong>Logs<\/strong>: log groups with retention settings; <strong>metric filters<\/strong> turn log patterns into metrics (count of <code>PaymentFailed<\/code>); <strong>Logs Insights<\/strong> queries; <strong>subscription filters<\/strong> stream logs to Lambda, Kinesis/Firehose or OpenSearch; export to S3 for cheap long-term storage.<\/li>\n<li><strong>Alarms<\/strong>: on any metric → SNS notification, Auto Scaling action, <strong>EC2 action<\/strong> (stop, terminate, reboot, <strong>recover<\/strong> onto healthy hardware), Systems Manager action. <strong>Composite alarms<\/strong> combine conditions to reduce noise.<\/li>\n<li><strong>Synthetics canaries<\/strong> test the user journey every minute; <strong>Container Insights<\/strong> and <strong>Application Signals<\/strong> cover ECS/EKS and service-level health; dashboards can span regions and accounts.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Alternatives:<\/strong> Amazon Managed Service for Prometheus + Managed Grafana (for teams on that ecosystem), third-party APM.<\/li>\n<li><strong>When NOT to use it:<\/strong> Auditing <em>who<\/em> made an API call (CloudTrail).<\/li>\n<li><strong>Cost:<\/strong> Custom metrics, alarms, API calls, log ingestion and storage. Log ingestion is the usual surprise — set retention and avoid debug-level logs in production.<\/li>\n<li><strong>SAA exam clue:<\/strong> “monitor”, “metrics”, “alarm”, “trigger scaling”, “memory utilization” (agent), “centralize logs”.<\/li>\n<li><strong>Memory rule:<\/strong> CloudWatch = the heart-rate monitor and the alarm bell.<\/li>\n<\/ul>\n<h3 id=\"s-aws-cloudtrail\">AWS CloudTrail<\/h3>\n<ul>\n<li><strong>Problem it solves:<\/strong> Every action in AWS is an API call; you must know who made it, when, from where, and whether it succeeded.<\/li>\n<li><strong>How it works:<\/strong> <strong>Event history<\/strong> shows 90 days of management events for free. A <strong>trail<\/strong> delivers events to S3 (and optionally CloudWatch Logs) for long-term retention. <strong>Organization trail<\/strong> covers every account into the Log Archive account. <strong>Data events<\/strong> (S3 object-level reads/writes, Lambda invokes) are opt-in and billed. <strong>Log file integrity validation<\/strong> proves logs weren’t altered. <strong>CloudTrail Insights<\/strong> flags unusual API activity (e.g. a burst of <code>TerminateInstances<\/code>).<\/li>\n<li><strong>PulseWire setup:<\/strong> Org trail → S3 bucket in the Log Archive account with Object Lock, an SCP preventing anyone from stopping it.<\/li>\n<li><strong>SAA exam clue:<\/strong> “audit”, “who made the change”, “API activity”, “governance”, “forensics”.<\/li>\n<li><strong>Memory rule:<\/strong> CloudTrail = the CCTV recording of every API call.<\/li>\n<\/ul>\n<h3 id=\"s-aws-config\">AWS Config<\/h3>\n<ul>\n<li><strong>Problem it solves:<\/strong> You need a history of how each resource was configured, and continuous checks that configurations follow rules.<\/li>\n<li><strong>How it works:<\/strong> Records configuration items and their relationships over time. <strong>Config rules<\/strong> (managed or custom) evaluate compliance: “S3 buckets must block public access”, “EBS volumes must be encrypted”, “SSH not open to 0.0.0.0/0”. <strong>Conformance packs<\/strong> bundle rules (e.g. a CIS benchmark). <strong>Auto-remediation<\/strong> runs Systems Manager Automation documents. An <strong>aggregator<\/strong> gives a multi-account, multi-region view.<\/li>\n<li><strong>SAA exam clue:<\/strong> “configuration history”, “compliance of resource configurations”, “detect and remediate non-compliant resources”, “what did this security group look like last Tuesday?”.<\/li>\n<li><strong>Memory rule:<\/strong> Config = the before-and-after photos of every resource, plus a rule book.<\/li>\n<\/ul>\n<h3 id=\"s-aws-health-dashboard-and-x-ray\">AWS Health Dashboard and X-Ray<\/h3>\n<ul>\n<li><strong>AWS Health Dashboard<\/strong> (formerly Personal Health Dashboard): AWS-side issues and scheduled events <em>affecting your resources<\/em> — e.g. “EC2 instance i-123 is scheduled for retirement”, or a regional service degradation. Health events flow to EventBridge for automation. Exam clue: “be notified of AWS maintenance or service issues affecting our account”.<\/li>\n<li><strong>AWS X-Ray<\/strong>: distributed tracing across API Gateway, Lambda, ECS and downstream calls; shows a service map and where latency or errors originate. Exam clue: “trace requests across microservices”, “identify performance bottlenecks”, “workload visibility”.<\/li>\n<\/ul>\n<h3 id=\"s-alerts-that-fix-things-automated-actions\">Alerts that fix things: automated actions<\/h3>\n<pre class=\"diagram\"><code>1. ALB 5xx rate &gt; 2% for 3 min     → CloudWatch alarm → SNS → on-call (+ ChatOps)\n2. EC2 system status check failed  → CloudWatch alarm → EC2 &quot;recover&quot; action (same IP, same volumes)\n3. SQS backlog per task &gt; 100      → target-tracking → ECS service scales out\n4. Config: bucket became public    → Config rule NON_COMPLIANT → SSM Automation → re-enable Block Public Access\n5. GuardDuty: instance mining crypto → EventBridge rule → Lambda swaps its SG to &quot;quarantine&quot;, snapshots EBS, alerts security\n6. AWS Health: scheduled instance retirement → EventBridge → ticket + automated instance refresh\n7. CloudTrail: root user login       → EventBridge → SNS page to security team\n<\/code><\/pre>\n<h3 id=\"s-failure-scenarios\">Failure scenarios<\/h3>\n<ol>\n<li><em>A production security group was opened to the world last night; who did it?<\/em> CloudTrail (<code>AuthorizeSecurityGroupIngress<\/code> event, user identity, source IP). Config shows <em>what<\/em> the rule looked like before and after; CloudTrail shows <em>who<\/em>.<\/li>\n<li><em>EC2 memory usage needs to trigger scaling.<\/em> Install the CloudWatch agent to publish memory as a custom metric; then scale on it.<\/li>\n<li><em>Auditors need proof logs weren’t tampered with.<\/em> CloudTrail log file integrity validation + S3 Object Lock in a separate account.<\/li>\n<li><em>Ensure every new EBS volume is encrypted across 30 accounts.<\/em> Enable EBS default encryption, detect with an AWS Config rule via an aggregator, enforce with an SCP denying unencrypted <code>CreateVolume<\/code>.<\/li>\n<li><em>Latency spikes only on checkout.<\/em> X-Ray traces show the payment-provider call taking 2 s — add a timeout, retry with backoff, and make it async if possible.<\/li>\n<\/ol>\n<h3 id=\"s-decision-tree\">Decision tree<\/h3>\n<pre class=\"diagram\"><code>Need to know...\n  ├── Performance/health now, alarms, scaling triggers → CloudWatch\n  ├── Who did what (API calls) → CloudTrail\n  ├── How a resource was configured / is it compliant → AWS Config\n  ├── Is AWS itself having an issue affecting me → AWS Health Dashboard\n  ├── Where latency is across microservices → X-Ray\n  └── Threats in account activity → GuardDuty (Ch 3)\n<\/code><\/pre>\n<p><strong>Domains:<\/strong> 1 (auditing, governance), 2 (workload visibility, automation for infrastructure integrity, metrics for HA).<\/p>\n","toc":[{"id":"amazon-cloudwatch","text":"Amazon CloudWatch"},{"id":"aws-cloudtrail","text":"AWS CloudTrail"},{"id":"aws-config","text":"AWS Config"},{"id":"aws-health-dashboard-and-x-ray","text":"AWS Health Dashboard and X-Ray"},{"id":"alerts-that-fix-things-automated-actions","text":"Alerts that fix things: automated actions"},{"id":"failure-scenarios","text":"Failure scenarios"},{"id":"decision-tree","text":"Decision tree"}]},{"id":"ch10","ch":10,"title":"Chapter 10: 50 million events a day (Data ingestion and analytics)","short":"50 million events a day","topic":"Data ingestion and analytics","d":3,"focus":true,"mins":9,"html":"<p>Meera’s board wants answers the production database can’t give without falling over: <em>Which stories keep readers longest? Which topics convert free readers to subscribers? What’s trending in the last five minutes?<\/em> PulseWire now generates ~50M clickstream events a day, plus logs, article data, ad data from SaaS tools and payment records.<\/p>\n<p>The exam tests this through Task Statement 3.5: pick the right ingestion pattern, transformation service, storage format and query engine. The key insight: <strong>separate real-time from batch, store everything once in S3, and query it with the cheapest engine that meets the latency need.<\/strong><\/p>\n<h3 id=\"s-step-1-name-the-ingestion-pattern\">Step 1: name the ingestion pattern<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Pattern<\/th>\n<th>Latency need<\/th>\n<th>PulseWire source<\/th>\n<th>Service<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Real-time streaming (ms–s), custom processing, replay<\/td>\n<td>Seconds<\/td>\n<td>Clickstream for “Trending now”<\/td>\n<td><strong>Kinesis Data Streams<\/strong> (+ Lambda or Managed Service for Apache Flink)<\/td>\n<\/tr>\n<tr>\n<td>Near real-time delivery into storage, no code<\/td>\n<td>~1 minute<\/td>\n<td>Clickstream archive into the lake<\/td>\n<td><strong>Amazon Data Firehose<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Change data capture from databases<\/td>\n<td>Minutes<\/td>\n<td>Aurora articles/subscriptions<\/td>\n<td><strong>DMS (CDC)<\/strong> or <strong>Aurora zero-ETL integration with Redshift<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Scheduled batch from SaaS apps<\/td>\n<td>Hourly/daily<\/td>\n<td>Google Analytics, Salesforce, Zendesk<\/td>\n<td><strong>Amazon AppFlow<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Bulk file transfer<\/td>\n<td>Daily / one-off<\/td>\n<td>Photo-agency archive, partner CSV drops<\/td>\n<td><strong>DataSync<\/strong>, <strong>Transfer Family<\/strong>, <strong>Snowball<\/strong> (Ch 5)<\/td>\n<\/tr>\n<tr>\n<td>Logs<\/td>\n<td>Seconds–minutes<\/td>\n<td>App and CloudFront logs<\/td>\n<td>CloudWatch Logs subscription → Firehose → S3 / OpenSearch<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3 id=\"s-kinesis-data-streams-vs-data-firehose-the-most-confused-pair\">Kinesis Data Streams vs Data Firehose (the most-confused pair)<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Kinesis Data Streams<\/th>\n<th>Amazon Data Firehose<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Job<\/td>\n<td>Durable, ordered, replayable stream that <em>your<\/em> consumers read<\/td>\n<td>Managed pipe that <em>delivers<\/em> data to a destination<\/td>\n<\/tr>\n<tr>\n<td>Latency<\/td>\n<td>Real-time (~200 ms)<\/td>\n<td>Near real-time (buffered by size/time)<\/td>\n<\/tr>\n<tr>\n<td>Consumers<\/td>\n<td>Many custom ones (Lambda, KCL apps, Flink), each reading independently<\/td>\n<td>None to write; destinations: S3, Redshift, OpenSearch, Splunk, HTTP endpoints<\/td>\n<\/tr>\n<tr>\n<td>Replay<\/td>\n<td>Yes (retention 24 h up to 365 days)<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td>Capacity<\/td>\n<td>Shards (provisioned) or <strong>on-demand<\/strong> mode<\/td>\n<td>Fully automatic<\/td>\n<\/tr>\n<tr>\n<td>Transform<\/td>\n<td>In your consumer code<\/td>\n<td>Built-in: Lambda transform, <strong>JSON → Parquet/ORC conversion<\/strong>, compression, dynamic partitioning<\/td>\n<\/tr>\n<tr>\n<td>Exam clue<\/td>\n<td>“real-time”, “multiple consumers”, “replay”, “custom processing”, “ordering”<\/td>\n<td>“load into S3/Redshift/OpenSearch”, “near real-time”, “minimal operational overhead”, “convert to Parquet”<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>A common combination (and PulseWire’s): <strong>Data Streams → Firehose<\/strong> gets both real-time consumers <em>and<\/em> effortless delivery to the lake.<\/p>\n<h3 id=\"s-the-data-lake-on-s3\">The data lake on S3<\/h3>\n<pre class=\"diagram\"><code>s3://pulsewire-lake/\n  raw/         clickstream/dt=2026-10-23/hr=14/...json.gz   (as received, immutable)\n  curated/     clickstream/dt=2026-10-23/...parquet         (cleaned, deduplicated, typed)\n  analytics/   daily_engagement/, subscriber_funnel/        (aggregated, business-ready)\n<\/code><\/pre>\n<p>Why S3 is the lake: cheapest durable storage, any engine can read it (Athena, Redshift Spectrum, EMR, Glue, SageMaker), and lifecycle rules tier old partitions to cheaper classes.<\/p>\n<p><strong>Formats decide cost.<\/strong> Athena charges by data scanned. A query over 1 TB of raw CSV costs ~$5. The same data as <strong>compressed, columnar Parquet partitioned by date<\/strong>, querying one day and three columns, might scan ~10 GB and cost ~$0.05. Transforming “.csv to .parquet” is called out by name in the exam guide.<\/p>\n<h3 id=\"s-aws-glue\">AWS Glue<\/h3>\n<ul>\n<li><strong>Problem it solves:<\/strong> Data arrives in many formats; you need a catalog of what exists and serverless jobs that clean and convert it.<\/li>\n<li><strong>Why PulseWire needs it:<\/strong> Clickstream JSON must become deduplicated Parquet; Athena and Redshift need table definitions.<\/li>\n<li><strong>How it works:<\/strong> <strong>Glue Data Catalog<\/strong> = central metadata store (tables, schemas, partitions) used by Athena, Redshift Spectrum, EMR and Lake Formation. <strong>Crawlers<\/strong> scan S3 and infer schemas/partitions. <strong>Glue ETL jobs<\/strong> run serverless Spark (or Python) with <strong>job bookmarks<\/strong> to process only new data. <strong>Glue DataBrew<\/strong> offers visual, no-code data prep. Triggers/workflows schedule jobs.<\/li>\n<li><strong>Alternatives:<\/strong> EMR (more control, big custom Spark/Hadoop), Lambda (small transforms), Firehose’s built-in conversion (simple format change only).<\/li>\n<li><strong>Why we chose it:<\/strong> Serverless ETL with a shared catalog — no clusters to run.<\/li>\n<li><strong>When NOT to use it:<\/strong> Huge, long-running, highly tuned Spark/Hadoop workloads or existing Hadoop ecosystems → EMR.<\/li>\n<li><strong>Cost:<\/strong> Per DPU-hour for jobs/crawlers; catalog storage and requests.<\/li>\n<li><strong>SAA exam clue:<\/strong> “ETL”, “serverless”, “discover schema”, “data catalog”, “convert CSV to Parquet”.<\/li>\n<li><strong>Memory rule:<\/strong> Glue = the librarian (catalog) and the cleaner (ETL).<\/li>\n<\/ul>\n<h3 id=\"s-lake-formation-athena-redshift-emr-opensearch-quicksight\">Lake Formation, Athena, Redshift, EMR, OpenSearch, QuickSight<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Service<\/th>\n<th>Problem it solves<\/th>\n<th>PulseWire use<\/th>\n<th>Choose over alternatives when<\/th>\n<th>Exam clue<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Lake Formation<\/strong><\/td>\n<td>Governing who sees what in the lake<\/td>\n<td>Ad team sees engagement but <strong>not<\/strong> reader emails (column-level); EU analysts see only EU rows (row-level); share tables with the data account<\/td>\n<td>You need fine-grained (table/column/row/cell) permissions and central governance over S3 + Glue Catalog; IAM/bucket policies are too coarse<\/td>\n<td>“build and secure a data lake”, “column-level access”, “centrally manage permissions”<\/td>\n<\/tr>\n<tr>\n<td><strong>Athena<\/strong><\/td>\n<td>Ad-hoc SQL on S3 without infrastructure<\/td>\n<td>Editors explore “which headlines got most clicks last week”<\/td>\n<td>Queries are intermittent/ad-hoc; pay per TB scanned, zero idle cost<\/td>\n<td>“serverless SQL on S3”, “ad-hoc”, “query logs in S3”, “no infrastructure”<\/td>\n<\/tr>\n<tr>\n<td><strong>Redshift<\/strong><\/td>\n<td>Fast, repeated complex SQL over large structured data with many concurrent users<\/td>\n<td>Board dashboards, subscriber funnel, joins of payments × engagement<\/td>\n<td>Heavy, frequent BI on structured data; Athena gets slow/costly for constant workloads<\/td>\n<td>“data warehouse”, “OLAP”, “complex analytical queries”, “petabyte”, “columnar”<\/td>\n<\/tr>\n<tr>\n<td><strong>Redshift Spectrum / Serverless<\/strong><\/td>\n<td>Query S3 from Redshift / warehouse without cluster management<\/td>\n<td>Join warehouse tables with raw lake data<\/td>\n<td>Mixed lake + warehouse queries; spiky BI (Serverless)<\/td>\n<td>“query S3 data from Redshift”<\/td>\n<\/tr>\n<tr>\n<td><strong>EMR<\/strong><\/td>\n<td>Managed Hadoop/Spark/Hive/Presto clusters (on EC2 with Spot, on EKS, or Serverless)<\/td>\n<td>Large ML feature engineering over two years of clickstream<\/td>\n<td>Big custom Spark jobs, existing Hadoop code, need framework control<\/td>\n<td>“Hadoop”, “Spark”, “big data processing”, “petabyte-scale”, “use Spot for task nodes”<\/td>\n<\/tr>\n<tr>\n<td><strong>OpenSearch<\/strong><\/td>\n<td>Full-text search and log analytics with dashboards<\/td>\n<td>Article search; ops log exploration<\/td>\n<td>Search relevance, log analytics, near-real-time dashboards<\/td>\n<td>“search”, “log analytics”, “Kibana/OpenSearch Dashboards”<\/td>\n<\/tr>\n<tr>\n<td><strong>QuickSight<\/strong><\/td>\n<td>BI dashboards for business users<\/td>\n<td>Meera’s daily dashboard, embedded creator analytics<\/td>\n<td>Serverless BI, per-user pricing, SPICE in-memory engine, ML insights<\/td>\n<td>“visualize”, “dashboards”, “business intelligence”<\/td>\n<\/tr>\n<tr>\n<td><strong>AppFlow<\/strong><\/td>\n<td>Pulling data from SaaS apps securely<\/td>\n<td>Salesforce/Google Analytics → S3<\/td>\n<td>SaaS source, no custom code<\/td>\n<td>“ingest from Salesforce/SaaS”<\/td>\n<\/tr>\n<tr>\n<td><strong>Data Exchange<\/strong><\/td>\n<td>Subscribing to third-party datasets<\/td>\n<td>Licensed demographic/market data<\/td>\n<td>Buying external data<\/td>\n<td>“third-party data”<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>Athena vs Redshift in one line:<\/strong> Athena for occasional questions on lake data; Redshift for constant, heavy, concurrent BI.<\/p>\n<h3 id=\"s-pulsewires-analytics-architecture\">PulseWire’s analytics architecture<\/h3>\n<pre class=\"diagram\"><code>REAL-TIME PATH\nWeb/App events → API → Kinesis Data Streams (on-demand)\n                          ├── Managed Flink: 5-min trending window → ElastiCache sorted set → &quot;Trending now&quot;\n                          └── Data Firehose → S3 raw/ (Parquet, partitioned dt/hr, compressed)\n\nBATCH PATH\nAurora ── zero-ETL ──▶ Redshift          SaaS ── AppFlow ──▶ S3 raw/\nGlue crawler → Data Catalog       Glue ETL (nightly) → S3 curated/ → analytics/\n\nGOVERNANCE + CONSUMPTION\nLake Formation permissions (column/row level)\n   ├── Athena (ad-hoc, editors)\n   ├── Redshift + Spectrum (BI, heavy joins) → QuickSight dashboards\n   ├── EMR Serverless (ML features) → SageMaker\n   └── OpenSearch (logs via CloudWatch → Firehose)\n<\/code><\/pre>\n<h3 id=\"s-where-ai-services-fit-task-2-2-names-them\">Where AI services fit (Task 2.2 names them)<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Need at PulseWire<\/th>\n<th>Service<\/th>\n<th>Exam clue<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Extract entities, key phrases, sentiment from articles<\/td>\n<td><strong>Comprehend<\/strong><\/td>\n<td>“natural language”, “sentiment”, “entities”, “PII detection in text”<\/td>\n<\/tr>\n<tr>\n<td>Moderate uploaded images, detect faces/celebrities<\/td>\n<td><strong>Rekognition<\/strong><\/td>\n<td>“image/video analysis”, “content moderation”<\/td>\n<\/tr>\n<tr>\n<td>Hindi ↔ English translation<\/td>\n<td><strong>Translate<\/strong><\/td>\n<td>“translate”<\/td>\n<\/tr>\n<tr>\n<td>Listen-to-article audio<\/td>\n<td><strong>Polly<\/strong><\/td>\n<td>“text to speech”<\/td>\n<\/tr>\n<tr>\n<td>Transcribe video interviews<\/td>\n<td><strong>Transcribe<\/strong><\/td>\n<td>“speech to text”<\/td>\n<\/tr>\n<tr>\n<td>Extract text and tables from scanned press releases<\/td>\n<td><strong>Textract<\/strong><\/td>\n<td>“extract text from documents/forms” (beyond plain OCR)<\/td>\n<\/tr>\n<tr>\n<td>Enterprise search over the archive with natural-language questions<\/td>\n<td><strong>Kendra<\/strong><\/td>\n<td>“intelligent search”<\/td>\n<\/tr>\n<tr>\n<td>Chatbot for subscriber support<\/td>\n<td><strong>Lex<\/strong><\/td>\n<td>“conversational interface”<\/td>\n<\/tr>\n<tr>\n<td>Subscription demand forecast<\/td>\n<td><strong>Forecast<\/strong><\/td>\n<td>“time-series forecasting” (note: AWS stopped new-customer onboarding for Forecast; SageMaker Canvas is the successor)<\/td>\n<\/tr>\n<tr>\n<td>Payment fraud scoring<\/td>\n<td><strong>Fraud Detector<\/strong><\/td>\n<td>“online fraud”<\/td>\n<\/tr>\n<tr>\n<td>Custom recommendation model<\/td>\n<td><strong>SageMaker<\/strong><\/td>\n<td>“build, train, deploy custom ML models”<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3 id=\"s-failure-scenarios\">Failure scenarios<\/h3>\n<ol>\n<li><em>Clickstream must be stored in S3 as Parquet with the least operational overhead.<\/em> Firehose with record format conversion. Not Data Streams + custom consumer (more work), not EC2 scripts.<\/li>\n<li><em>Three independent applications must process the same real-time stream and be able to reprocess the last 7 days.<\/em> Kinesis Data Streams with 7-day retention. Not SQS (one consumer group, no replay), not Firehose (no replay).<\/li>\n<li><em>Athena bills are high.<\/em> Convert to Parquet/ORC, compress, partition by date, select only needed columns, use the Glue catalog’s partition projection.<\/li>\n<li><em>Analysts must not see subscribers’ email addresses in the lake.<\/em> Lake Formation column-level permissions (or Glue job to mask/tokenize PII; Macie to find PII in the first place).<\/li>\n<li><em>Nightly ETL is an EC2 cron running pandas, often failing.<\/em> Glue ETL job with bookmarks, triggered on schedule — serverless, retried, catalogued.<\/li>\n<li><em>Business wants daily dashboards over 3 TB of joined structured data with 50 concurrent users.<\/em> Redshift (with QuickSight). Athena would work but slower and costlier at that constant concurrency.<\/li>\n<\/ol>\n<h3 id=\"s-decision-tree\">Decision tree<\/h3>\n<pre class=\"diagram\"><code>Ingest...\n  ├── Real-time, custom consumers, replay → Kinesis Data Streams\n  ├── Stream → S3/Redshift/OpenSearch, no code → Data Firehose\n  ├── Existing Kafka → MSK\n  ├── Database changes → DMS CDC / zero-ETL\n  ├── SaaS data → AppFlow\n  └── Files from on-prem → DataSync / Transfer Family / Snowball\n\nTransform...\n  ├── Serverless ETL + catalog → Glue\n  ├── No-code data prep → Glue DataBrew\n  ├── Big custom Spark/Hadoop → EMR\n  └── Real-time stream analytics → Managed Service for Apache Flink\n\nQuery / show...\n  ├── Ad-hoc SQL on S3 → Athena\n  ├── Heavy recurring BI on structured data → Redshift\n  ├── Search / log analytics → OpenSearch\n  └── Dashboards → QuickSight\n\nGovern → Lake Formation (+ Glue Data Catalog)\n<\/code><\/pre>\n<p><strong>Domains:<\/strong> 3 (Task 3.5 high-performing data ingestion and transformation — entirely), 1 (securing the data lake), 4 (columnar formats and partitions cut query cost).<\/p>\n","toc":[{"id":"step-1-name-the-ingestion-pattern","text":"Step 1: name the ingestion pattern"},{"id":"kinesis-data-streams-vs-data-firehose-the-most-confused-pair","text":"Kinesis Data Streams vs Data Firehose (the most-confused pair)"},{"id":"the-data-lake-on-s3","text":"The data lake on S3"},{"id":"aws-glue","text":"AWS Glue"},{"id":"lake-formation-athena-redshift-emr-opensearch-quicksight","text":"Lake Formation, Athena, Redshift, EMR, OpenSearch, QuickSight"},{"id":"pulsewires-analytics-architecture","text":"PulseWire&#39;s analytics architecture"},{"id":"where-ai-services-fit-task-2-2-names-them","text":"Where AI services fit (Task 2.2 names them)"},{"id":"failure-scenarios","text":"Failure scenarios"},{"id":"decision-tree","text":"Decision tree"}]},{"id":"ch11","ch":11,"title":"Chapter 11: The acquisition (Migration)","short":"The acquisition","topic":"Migration","d":3,"focus":false,"mins":6,"html":"<p>PulseWire buys <strong>Metro Magazine<\/strong>, a 30-year-old publisher running entirely in a Delhi data centre. Their lease ends in four months.<\/p>\n<blockquote class=\"voice\"><p><span class=\"who\">Meera<\/span> “Move them into AWS. Their site can’t be down for more than an hour at cutover, and we can’t lose a single photo.”<\/p>\n<\/blockquote>\n<h3 id=\"s-what-metro-has\">What Metro has<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Asset<\/th>\n<th>Size / detail<\/th>\n<th>Constraint<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Photo archive on a NAS (NFS/SMB)<\/td>\n<td>20 TB, still being added to daily<\/td>\n<td>Keep metadata, verify integrity<\/td>\n<\/tr>\n<tr>\n<td>Video archive on tape and disk<\/td>\n<td>300 TB, rarely accessed<\/td>\n<td>Very cold; must be retained 10 years<\/td>\n<\/tr>\n<tr>\n<td>Oracle database<\/td>\n<td>5 TB, subscriptions and articles<\/td>\n<td><strong>Minimal downtime<\/strong>; licence renewal is expensive<\/td>\n<\/tr>\n<tr>\n<td>Legacy Java CMS on 12 VMware VMs<\/td>\n<td>Uses ActiveMQ (JMS)<\/td>\n<td>Team can’t rewrite it in four months<\/td>\n<\/tr>\n<tr>\n<td>Wire-agency feeds<\/td>\n<td>Agencies push via SFTP<\/td>\n<td>Agencies won’t change their process<\/td>\n<\/tr>\n<tr>\n<td>Network<\/td>\n<td>500 Mbps internet link<\/td>\n<td>Shared with office traffic<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3 id=\"s-first-is-the-network-enough-do-the-maths\">First: is the network enough? (do the maths)<\/h3>\n<p>Usable ~400 Mbps ≈ 4.3 TB/day.<\/p>\n<ul>\n<li>20 TB photos → ~5 days over the network. <strong>Online is fine<\/strong> → DataSync.<\/li>\n<li>5 TB database → ~1.2 days initial load, then only changes. <strong>Online is fine<\/strong> → DMS with CDC.<\/li>\n<li>300 TB video → ~70 days, saturating the office link. <strong>Too slow<\/strong> → Snowball Edge devices (offline).<\/li>\n<\/ul>\n<p>This calculation is exactly what the exam wants: when the network transfer time exceeds the deadline or would starve production traffic, ship devices.<\/p>\n<h3 id=\"s-the-strategy-for-each-workload-the-7-rs\">The strategy for each workload (the 7 Rs)<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>R<\/th>\n<th>Meaning<\/th>\n<th>Metro example<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Retire<\/td>\n<td>Turn it off<\/td>\n<td>Old intranet nobody uses<\/td>\n<\/tr>\n<tr>\n<td>Retain<\/td>\n<td>Keep on-prem for now<\/td>\n<td>Printing-press controller<\/td>\n<\/tr>\n<tr>\n<td><strong>Rehost<\/strong> (lift and shift)<\/td>\n<td>Move VMs as-is<\/td>\n<td>Java CMS → EC2 via <strong>Application Migration Service (MGN)<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Relocate<\/td>\n<td>Move the hypervisor platform<\/td>\n<td>Alternative: <strong>VMware Cloud on AWS<\/strong> if they wanted to keep VMware tooling<\/td>\n<\/tr>\n<tr>\n<td><strong>Replatform<\/strong><\/td>\n<td>Small changes for managed services<\/td>\n<td>ActiveMQ → <strong>Amazon MQ<\/strong>; NAS → S3<\/td>\n<\/tr>\n<tr>\n<td>Repurchase<\/td>\n<td>Switch to SaaS<\/td>\n<td>Their email server → a SaaS suite<\/td>\n<\/tr>\n<tr>\n<td><strong>Refactor<\/strong><\/td>\n<td>Re-architect<\/td>\n<td>Oracle → <strong>Aurora PostgreSQL<\/strong> (later phase, to drop Oracle licensing)<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3 id=\"s-the-migration-services-each-placed\">The migration services, each placed<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Service<\/th>\n<th>Job<\/th>\n<th>Metro use<\/th>\n<th>Exam clue<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Migration Hub<\/strong><\/td>\n<td>Single place to track migration progress across tools<\/td>\n<td>Program dashboard<\/td>\n<td>“track the progress of migrations”<\/td>\n<\/tr>\n<tr>\n<td><strong>Application Discovery Service<\/strong><\/td>\n<td>Inventory servers, dependencies, utilization (agent or agentless for VMware)<\/td>\n<td>Find what talks to what before moving<\/td>\n<td>“discover on-premises servers and dependencies”<\/td>\n<\/tr>\n<tr>\n<td><strong>Application Migration Service (MGN)<\/strong><\/td>\n<td>Continuous block-level replication of servers to AWS, test, then cutover in minutes (successor to Server Migration Service)<\/td>\n<td>12 CMS VMs → EC2<\/td>\n<td>“lift-and-shift”, “rehost with minimal downtime”, “migrate servers”<\/td>\n<\/tr>\n<tr>\n<td><strong>DMS<\/strong><\/td>\n<td>Migrate databases: full load + <strong>ongoing replication (CDC)<\/strong>; source stays live<\/td>\n<td>Oracle → RDS for Oracle now; later Oracle → Aurora PostgreSQL<\/td>\n<td>“migrate database with minimal downtime”, “continuous replication”<\/td>\n<\/tr>\n<tr>\n<td><strong>Schema Conversion Tool / DMS Schema Conversion<\/strong><\/td>\n<td>Converts schema and code between engines<\/td>\n<td>Needed only for the heterogeneous Oracle → PostgreSQL step<\/td>\n<td>“heterogeneous migration” (different engines)<\/td>\n<\/tr>\n<tr>\n<td><strong>DataSync<\/strong><\/td>\n<td>Online, accelerated, verified file transfer with metadata<\/td>\n<td>NAS → S3, then incremental syncs until cutover<\/td>\n<td>“migrate file shares over the network”, “schedule incremental transfers”<\/td>\n<\/tr>\n<tr>\n<td><strong>Snowball Edge<\/strong><\/td>\n<td>Offline device transfer (and edge compute)<\/td>\n<td>300 TB video → S3 → lifecycle straight to Glacier Deep Archive<\/td>\n<td>“limited bandwidth”, “hundreds of TB”, “weeks over the network”<\/td>\n<\/tr>\n<tr>\n<td><strong>Storage Gateway<\/strong><\/td>\n<td>Hybrid bridge during transition<\/td>\n<td>S3 File Gateway lets office editors keep using a file share that lands in S3<\/td>\n<td>“on-prem apps keep using NFS/SMB but store in AWS”<\/td>\n<\/tr>\n<tr>\n<td><strong>Transfer Family<\/strong><\/td>\n<td>Managed SFTP into S3<\/td>\n<td>Agencies keep sending SFTP, now to AWS<\/td>\n<td>“partners use SFTP, no server management”<\/td>\n<\/tr>\n<tr>\n<td><strong>Site-to-Site VPN<\/strong> → <strong>Direct Connect<\/strong><\/td>\n<td>Connectivity<\/td>\n<td>VPN on day 1 (live in hours); DX ordered for the long term (weeks to provision)<\/td>\n<td>“immediately” → VPN; “consistent bandwidth” → DX<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>Homogeneous vs heterogeneous:<\/strong> Oracle → RDS Oracle is homogeneous (same engine, DMS alone or native tools). Oracle → Aurora PostgreSQL is heterogeneous (needs schema conversion first, then DMS). The exam names both.<\/p>\n<h3 id=\"s-the-plan\">The plan<\/h3>\n<pre class=\"diagram\"><code>Week 1     VPN up. Discovery Service maps dependencies. Order Snowball Edge devices. Order Direct Connect.\nWeek 2–3   DataSync: NAS → S3 (photos), then daily incremental syncs.\n           MGN agents on 12 VMs → continuous replication to staging subnet.\n           DMS: Oracle full load → RDS for Oracle (Multi-AZ), then CDC keeps it in sync.\nWeek 3–6   Snowball Edge: 300 TB video → ship → S3 → Glacier Deep Archive.\n           Amazon MQ (ActiveMQ) replaces on-prem broker; CMS config points to it.\n           Transfer Family SFTP endpoint; agencies switch hostname only.\nWeek 7     Test cutover with MGN test instances. Fix issues.\nCutover    (Sunday 02:00, &lt; 1 hour):\n           freeze writes → final DataSync pass → DMS CDC catches up (seconds) →\n           MGN cutover launches EC2 → Route 53 record flips → smoke test → done.\nPhase 2    Refactor Oracle → Aurora PostgreSQL (SCT + DMS), retire Oracle licences.\n<\/code><\/pre>\n<p>Downtime is minutes because every large dataset was already copied and kept in sync <strong>before<\/strong> cutover. That’s the core idea behind every “minimal downtime migration” question.<\/p>\n<h3 id=\"s-failure-scenarios\">Failure scenarios<\/h3>\n<ol>\n<li><em>Company must move 80 TB in one week over a 100 Mbps link.<\/em> 100 Mbps ≈ 1 TB/day → 80 days. Snowball Edge.<\/li>\n<li><em>Migrate a MySQL database to RDS with near-zero downtime.<\/em> DMS full load + CDC (or native replication), then cut over. Not “take a dump and restore” (downtime equals the restore time).<\/li>\n<li><em>Migrate Microsoft SQL Server to Aurora PostgreSQL.<\/em> Heterogeneous: schema conversion + DMS.<\/li>\n<li><em>On-prem app must keep writing to a local NFS share but data should land in S3.<\/em> Storage Gateway S3 File Gateway.<\/li>\n<li><em>Ongoing nightly sync of on-prem files to EFS, with verification.<\/em> DataSync (scheduled task).<\/li>\n<li><em>Rehost 200 VMs with minimal changes and short cutover.<\/em> Application Migration Service.<\/li>\n<\/ol>\n<h3 id=\"s-decision-tree\">Decision tree<\/h3>\n<pre class=\"diagram\"><code>Migrating...\n  ├── Servers / VMs as-is → Application Migration Service (MGN)\n  │       (keep VMware tooling → VMware Cloud on AWS)\n  ├── Database\n  │     ├── Same engine → DMS (or native replication)\n  │     ├── Different engine → Schema conversion + DMS\n  │     └── Minimal downtime → DMS with CDC\n  ├── Files\n  │     ├── Network OK → DataSync\n  │     ├── Network too slow / huge → Snowball Edge\n  │     └── Keep using on-prem share, store in AWS → Storage Gateway\n  ├── Partners using SFTP/FTP → Transfer Family\n  ├── Message broker (JMS/AMQP) → Amazon MQ\n  └── Connectivity: now → VPN; long-term consistent → Direct Connect\nTrack it all → Migration Hub; discover first → Application Discovery Service\n<\/code><\/pre>\n<p><strong>Domains:<\/strong> 3 (data transfer solutions, database engine migrations), 4 (lowest-cost transfer method, licensing), 1 (secure hybrid connectivity).<\/p>\n","toc":[{"id":"what-metro-has","text":"What Metro has"},{"id":"first-is-the-network-enough-do-the-maths","text":"First: is the network enough? (do the maths)"},{"id":"the-strategy-for-each-workload-the-7-rs","text":"The strategy for each workload (the 7 Rs)"},{"id":"the-migration-services-each-placed","text":"The migration services, each placed"},{"id":"the-plan","text":"The plan"},{"id":"failure-scenarios","text":"Failure scenarios"},{"id":"decision-tree","text":"Decision tree"}]},{"id":"ch12","ch":12,"title":"Chapter 12: Game day (High availability)","short":"Game day","topic":"High availability","d":2,"focus":true,"mins":6,"html":"<p>Before the general election coverage, you run a <strong>game day<\/strong>: deliberately break PulseWire, one layer at a time, and watch what happens. Each failure is bigger than the last. For each, ask three questions: <em>What fails? What notices? What replaces it?<\/em><\/p>\n<p><strong>Vocabulary:<\/strong> <em>High availability<\/em> = the system stays up with brief disruption (seconds–minutes) when a component fails. <em>Fault tolerance<\/em> = no disruption at all (redundant capacity is already running). <em>Disaster recovery<\/em> = getting back after a large-scale event like a region loss (Ch 13).<\/p>\n<h3 id=\"s-break-1-an-instance-dies\">Break 1: an instance dies<\/h3>\n<pre class=\"diagram\"><code>Before: ALB → [task-a1, task-a2 (AZ-a)] [task-b1, task-b2 (AZ-b)] [task-c1, task-c2 (AZ-c)]\nKill task-a1.\n<\/code><\/pre>\n<ul>\n<li><strong>Notices:<\/strong> ALB health check fails (e.g. 2 failures × 10 s); ECS service/ASG health checks.<\/li>\n<li><strong>Replaces:<\/strong> ALB stops routing to it within seconds; ECS (or the ASG) launches a replacement.<\/li>\n<li><strong>User impact:<\/strong> In-flight requests on that task may fail once; clients retry. Nobody is logged out because sessions live in ElastiCache/DynamoDB.<\/li>\n<li><strong>What makes this work:<\/strong> stateless app, ≥2 instances, ELB health checks wired into the ASG.<\/li>\n<li><strong>Legacy twist:<\/strong> Metro’s CMS can only run as <em>one<\/em> instance. Use an ASG with min = max = 1 across two AZs (self-healing), or a CloudWatch alarm with the EC2 <strong>recover<\/strong> action, plus an Elastic IP or Route 53 health check. Not fully HA, but self-healing without app changes — an explicit exam skill (“improve reliability of legacy applications when changes aren’t possible”).<\/li>\n<\/ul>\n<h3 id=\"s-break-2-a-whole-availability-zone-fails\">Break 2: a whole Availability Zone fails<\/h3>\n<ul>\n<li><strong>Load balancer:<\/strong> ALB nodes in AZ-b and AZ-c keep serving; health checks mark AZ-a targets unhealthy.<\/li>\n<li><strong>Compute:<\/strong> 4 of 6 tasks remain. The ASG/ECS launches replacements in the healthy AZs.<\/li>\n<li><strong>Capacity planning (static stability):<\/strong> if the site needs 6 tasks at peak, running 6 across 3 AZs leaves 4 during an AZ loss — 33% short until scaling catches up. For critical paths, <strong>over-provision so the survivors can carry peak<\/strong>: 9 tasks (3 per AZ), or 2 AZs × 6. This is the cost of fault tolerance versus high availability, and exam questions test it with numbers.<\/li>\n<li><strong>NAT:<\/strong> if AZ-b and AZ-c routed through AZ-a’s NAT gateway, their outbound calls break. <strong>One NAT per AZ.<\/strong><\/li>\n<li><strong>Database:<\/strong> RDS Multi-AZ fails over to the standby in another AZ (~1–2 min); Aurora promotes a replica (typically &lt; 30 s). RDS Proxy holds connections during failover.<\/li>\n<li><strong>Cache:<\/strong> ElastiCache (Redis/Valkey) with replicas in other AZs and <strong>Multi-AZ auto-failover<\/strong> promotes a replica.<\/li>\n<li><strong>Storage:<\/strong> S3, DynamoDB, SQS, SNS, Lambda and EFS (Standard) are <strong>regional, multi-AZ by design<\/strong> — nothing to do. EBS volumes in AZ-a are unavailable: snapshots are the recovery path.<\/li>\n<\/ul>\n<h3 id=\"s-break-3-the-database-fails-or-overloads\">Break 3: the database fails or overloads<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Failure<\/th>\n<th>Protection<\/th>\n<th>Recovery<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Primary instance crash<\/td>\n<td>Multi-AZ / Aurora replicas<\/td>\n<td>Automatic failover<\/td>\n<\/tr>\n<tr>\n<td>Data corruption or bad deploy deleting rows<\/td>\n<td>Automated backups + PITR, Aurora Backtrack<\/td>\n<td>Restore to a point before the event (new instance)<\/td>\n<\/tr>\n<tr>\n<td>Read overload<\/td>\n<td>Read replicas, ElastiCache, CloudFront<\/td>\n<td>Scale reads horizontally<\/td>\n<\/tr>\n<tr>\n<td>Connection storm (Lambda)<\/td>\n<td>RDS Proxy, reserved concurrency<\/td>\n<td>Pooled connections<\/td>\n<\/tr>\n<tr>\n<td>Write overload<\/td>\n<td>Bigger instance, SQS buffer in front of writes, move hot data to DynamoDB<\/td>\n<td>Decouple and choose the right store<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>Remember: <strong>Multi-AZ protects against infrastructure failure, not against bad data.<\/strong> A <code>DELETE<\/code> replicates to the standby instantly. Backups protect against bad data.<\/p>\n<h3 id=\"s-break-4-a-whole-region-becomes-unavailable\">Break 4: a whole Region becomes unavailable<\/h3>\n<p>Multi-AZ doesn’t help; everything in ap-south-1 is gone. This needs a second region and is the subject of Chapter 13. The building blocks:<\/p>\n<ul>\n<li><strong>Data copied out continuously:<\/strong> S3 Cross-Region Replication, Aurora Global Database, DynamoDB Global Tables, AWS Backup cross-region copies, ECR replication, KMS multi-Region keys.<\/li>\n<li><strong>Infrastructure defined as code:<\/strong> CloudFormation templates so the secondary region can be created or scaled identically (<strong>immutable infrastructure<\/strong>).<\/li>\n<li><strong>Traffic switch:<\/strong> Route 53 failover routing with health checks, or Global Accelerator.<\/li>\n<li><strong>Service quotas in the standby region:<\/strong> raise EC2/Lambda/ECS limits <em>in advance<\/em> — a DR region that can’t launch enough instances because of default quotas is a classic hidden failure, named in the exam guide.<\/li>\n<\/ul>\n<h3 id=\"s-the-ha-checklist-for-every-layer\">The HA checklist for every layer<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Layer<\/th>\n<th>Single-AZ risk<\/th>\n<th>HA design<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>DNS<\/td>\n<td>—<\/td>\n<td>Route 53 (100% SLA), health checks<\/td>\n<\/tr>\n<tr>\n<td>Edge<\/td>\n<td>—<\/td>\n<td>CloudFront + origin failover groups<\/td>\n<\/tr>\n<tr>\n<td>Load balancer<\/td>\n<td>Single subnet<\/td>\n<td>ALB/NLB across ≥2 AZs<\/td>\n<\/tr>\n<tr>\n<td>Compute<\/td>\n<td>One instance<\/td>\n<td>ASG/ECS across ≥2 AZs, min ≥ 2, ELB health checks<\/td>\n<\/tr>\n<tr>\n<td>Outbound internet<\/td>\n<td>One NAT<\/td>\n<td>NAT gateway per AZ<\/td>\n<\/tr>\n<tr>\n<td>Relational DB<\/td>\n<td>Single-AZ RDS<\/td>\n<td>Multi-AZ RDS or Aurora with replicas in other AZs<\/td>\n<\/tr>\n<tr>\n<td>Cache<\/td>\n<td>Single node<\/td>\n<td>Redis/Valkey with replicas, Multi-AZ auto-failover<\/td>\n<\/tr>\n<tr>\n<td>Files<\/td>\n<td>EBS on one instance<\/td>\n<td>EFS (multi-AZ) or FSx Multi-AZ<\/td>\n<\/tr>\n<tr>\n<td>Queues/objects/NoSQL<\/td>\n<td>—<\/td>\n<td>SQS, S3, DynamoDB are multi-AZ by default<\/td>\n<\/tr>\n<tr>\n<td>Secrets/keys<\/td>\n<td>—<\/td>\n<td>Regional managed services<\/td>\n<\/tr>\n<tr>\n<td>Region<\/td>\n<td>Everything<\/td>\n<td>Second region + replication + Route 53 failover (Ch 13)<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3 id=\"s-failure-scenarios-exam-style\">Failure scenarios (exam style)<\/h3>\n<ol>\n<li><em>An application runs on two EC2 instances in one AZ behind an ALB. Requirement: survive an AZ failure.<\/em> Spread the ASG across at least two AZs (and the ALB’s subnets). Not “add more instances in the same AZ”.<\/li>\n<li><em>App needs 4 instances minimum at all times, even if one AZ fails, at least cost.<\/em> 3 AZs × 2 instances = 6 (losing one AZ leaves 4). 2 AZs would need 4 each = 8. The 3-AZ layout is cheaper.<\/li>\n<li><em>Reads still succeed but writes fail for 90 seconds during RDS maintenance.<\/em> Expected Multi-AZ failover; use Aurora for faster failover and RDS Proxy to reduce impact.<\/li>\n<li><em>A legacy app can’t be modified and runs on one instance.<\/em> ASG min/max 1 across AZs, or CloudWatch recover action; Route 53 health check; regular AMI/snapshots.<\/li>\n<li><em>A web tier stores uploaded files on the instance’s EBS; scaling out breaks downloads.<\/em> Move uploads to S3 (or EFS if a filesystem is required).<\/li>\n<\/ol>\n<h3 id=\"s-decision-tree\">Decision tree<\/h3>\n<pre class=\"diagram\"><code>What can fail?\n  ├── Instance → ASG/ECS (min ≥ 2) + ELB health checks, stateless app\n  ├── AZ → Everything spread across ≥ 2 AZs; NAT per AZ; size survivors for peak\n  ├── Database\n  │     ├── Hardware/AZ → Multi-AZ / Aurora replicas\n  │     ├── Bad data → Backups + PITR / Backtrack\n  │     └── Overload → Replicas, cache, RDS Proxy, SQS buffer\n  ├── Region → Cross-region replication + IaC + Route 53 failover (Ch 13)\n  └── Legacy single instance → ASG 1/1 or EC2 recover + health checks\n<\/code><\/pre>\n<p><strong>Domains:<\/strong> 2 (Task 2.2 — highly available and fault-tolerant architectures, almost entirely), 3 (database replication).<\/p>\n","toc":[{"id":"break-1-an-instance-dies","text":"Break 1: an instance dies"},{"id":"break-2-a-whole-availability-zone-fails","text":"Break 2: a whole Availability Zone fails"},{"id":"break-3-the-database-fails-or-overloads","text":"Break 3: the database fails or overloads"},{"id":"break-4-a-whole-region-becomes-unavailable","text":"Break 4: a whole Region becomes unavailable"},{"id":"the-ha-checklist-for-every-layer","text":"The HA checklist for every layer"},{"id":"failure-scenarios-exam-style","text":"Failure scenarios (exam style)"},{"id":"decision-tree","text":"Decision tree"}]},{"id":"ch13","ch":13,"title":"Chapter 13: When Mumbai goes dark (Disaster recovery)","short":"When Mumbai goes dark","topic":"Disaster recovery","d":2,"focus":true,"mins":6,"html":"<p>Game day ended with the question nobody wanted: <em>what if the whole ap-south-1 region is unavailable for six hours on election night?<\/em> Meera’s numbers from the Prologue — <strong>RPO 15 minutes, RTO 1 hour<\/strong> — now decide how much we spend.<\/p>\n<h3 id=\"s-the-four-strategies-from-cheapest-to-fastest\">The four strategies, from cheapest to fastest<\/h3>\n<pre class=\"diagram\"><code> Cost  ↑                                               ● Multi-site active/active\n       │                                    ● Warm standby\n       │                       ● Pilot light\n       │        ● Backup &amp; restore\n       └───────────────────────────────────────────────→ RTO/RPO get smaller\n<\/code><\/pre>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Strategy<\/th>\n<th>What runs in the DR region<\/th>\n<th>RPO<\/th>\n<th>RTO<\/th>\n<th>Cost<\/th>\n<th>Complexity<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Backup &amp; restore<\/strong><\/td>\n<td>Nothing; only backups/snapshots copied there<\/td>\n<td>Hours (time since last backup)<\/td>\n<td>Hours to a day (rebuild everything)<\/td>\n<td>Lowest<\/td>\n<td>Low<\/td>\n<\/tr>\n<tr>\n<td><strong>Pilot light<\/strong><\/td>\n<td>Core data live and replicating (DB replica, S3 CRR); app servers <strong>off<\/strong> (AMIs/templates ready)<\/td>\n<td>Seconds to minutes<\/td>\n<td>Tens of minutes (launch and scale compute)<\/td>\n<td>Low–medium<\/td>\n<td>Medium<\/td>\n<\/tr>\n<tr>\n<td><strong>Warm standby<\/strong><\/td>\n<td>A <strong>scaled-down but fully working<\/strong> copy of the whole stack, taking little or no traffic<\/td>\n<td>Seconds to minutes<\/td>\n<td>Minutes (scale up + switch traffic)<\/td>\n<td>Medium–high<\/td>\n<td>Medium–high<\/td>\n<\/tr>\n<tr>\n<td><strong>Multi-site / active-active<\/strong><\/td>\n<td>Full-scale stack serving live traffic in both regions<\/td>\n<td>Near zero<\/td>\n<td>Near zero (traffic already flowing)<\/td>\n<td>Highest (≈2×)<\/td>\n<td>High (data conflicts, global writes)<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>How to tell pilot light from warm standby in a question:<\/strong> pilot light = data is live, <strong>compute is not running<\/strong>. Warm standby = everything runs, just <strong>smaller<\/strong>. If the wording says “a minimal version of the environment is always running”, that’s warm standby.<\/p>\n<h3 id=\"s-building-each-strategy-with-aws-services\">Building each strategy with AWS services<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Strategy<\/th>\n<th>Data replication<\/th>\n<th>Compute readiness<\/th>\n<th>Traffic switch<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Backup &amp; restore<\/td>\n<td>AWS Backup cross-region copy, EBS/RDS snapshot copy, S3 CRR<\/td>\n<td>CloudFormation templates, AMIs copied cross-region<\/td>\n<td>Route 53 record change after restore<\/td>\n<\/tr>\n<tr>\n<td>Pilot light<\/td>\n<td>Aurora Global Database or cross-region read replica; DynamoDB Global Tables; S3 CRR<\/td>\n<td>AMIs + launch templates; ASG at 0 or ECS service at 0 tasks<\/td>\n<td>Route 53 failover routing + health checks<\/td>\n<\/tr>\n<tr>\n<td>Warm standby<\/td>\n<td>Same as pilot light<\/td>\n<td>ASG/ECS running at minimum size, scaled up on failover<\/td>\n<td>Route 53 failover (or weighted 100/0)<\/td>\n<\/tr>\n<tr>\n<td>Active-active<\/td>\n<td>DynamoDB Global Tables (multi-writer), Aurora Global Database with write forwarding, S3 CRR (bi-directional)<\/td>\n<td>Full ASG/ECS in each region<\/td>\n<td>Route 53 latency/geolocation routing, or Global Accelerator<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>AWS Elastic Disaster Recovery (DRS)<\/strong> replicates servers block-by-block into a low-cost staging area and launches them in minutes — an easy pilot-light-style option for servers you can’t re-architect (Metro’s legacy CMS).<\/p>\n<h3 id=\"s-pulsewires-decision-different-tiers-different-strategies\">PulseWire’s decision: different tiers, different strategies<\/h3>\n<p>Applying one strategy to everything wastes money. We tier by business impact:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Tier<\/th>\n<th>Workload<\/th>\n<th>Requirement<\/th>\n<th>Strategy chosen<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>Reading articles (the product)<\/td>\n<td>RTO minutes, RPO ~0<\/td>\n<td><strong>Active-active<\/strong> for reads<\/td>\n<td>Already multi-region from Ch 8: CloudFront + latency routing to three regions<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>Publishing / writes<\/td>\n<td>RPO 15 min, RTO 1 h<\/td>\n<td><strong>Warm standby<\/strong><\/td>\n<td>Aurora Global Database (RPO ~1 s, promote in ~1 min); scaled-down ECS in us-east-1 scales out<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Creator portal<\/td>\n<td>RPO 15 min, RTO 4 h<\/td>\n<td><strong>Pilot light<\/strong><\/td>\n<td>Data already replicated; ECS service at 0 tasks, scaled up by runbook<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Internal reporting, batch jobs<\/td>\n<td>RPO 24 h, RTO 24 h<\/td>\n<td><strong>Backup &amp; restore<\/strong><\/td>\n<td>AWS Backup cross-region copies; rebuild from CloudFormation<\/td>\n<\/tr>\n<tr>\n<td>—<\/td>\n<td>Metro legacy CMS<\/td>\n<td>RPO 15 min, RTO 2 h<\/td>\n<td><strong>Elastic Disaster Recovery<\/strong><\/td>\n<td>No re-architecture possible<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>The failover runbook is automated (Step Functions or Systems Manager Automation): promote Aurora secondary → scale ECS in us-east-1 → Route 53 health checks shift traffic → alert. And it’s <strong>tested quarterly<\/strong> — an untested DR plan is a hope, not a plan.<\/p>\n<h3 id=\"s-exam-scenarios-decide-before-reading-the-answer\">Exam scenarios: decide before reading the answer<\/h3>\n<p><strong>Scenario A.<\/strong> A company’s internal HR app can tolerate 24 hours of downtime and 12 hours of data loss. They want the lowest cost DR. Which strategy?<\/p>\n<p><strong>Scenario B.<\/strong> An e-commerce company needs RTO under 15 minutes and RPO under 1 minute for its relational database tier, at a reasonable cost. A minimal version of the full environment may run in the DR region. Which strategy and which database feature?<\/p>\n<p><strong>Scenario C.<\/strong> A trading platform cannot tolerate any downtime or data loss and serves users on two continents. Which strategy?<\/p>\n<p><strong>Scenario D.<\/strong> A company has critical data replicated to a second region, but its application servers there are not running. Recovery takes ~45 minutes. What is this called, and what would cut RTO to under 10 minutes?<\/p>\n<p>Answers:<\/p>\n<ul>\n<li><strong>A → Backup &amp; restore.<\/strong> Anything more is overspending against a 24 h RTO.<\/li>\n<li><strong>B → Warm standby with Aurora Global Database<\/strong> (RPO ~1 s, managed failover ~1 min). Pilot light could miss 15 min if compute has to launch from zero; active-active overshoots “reasonable cost”.<\/li>\n<li><strong>C → Multi-site active-active<\/strong> with DynamoDB Global Tables or Aurora Global Database, Route 53 latency routing or Global Accelerator.<\/li>\n<li><strong>D → Pilot light.<\/strong> Move to warm standby (keep a minimal fleet running) to cut RTO.<\/li>\n<\/ul>\n<h3 id=\"s-failure-scenarios\">Failure scenarios<\/h3>\n<ol>\n<li><em>DR test fails because the DR region can only launch 20 instances.<\/em> Service quotas weren’t raised in the standby region. Raise them in advance; check with Service Quotas and Trusted Advisor.<\/li>\n<li><em>Failover worked but the app couldn’t decrypt data.<\/em> KMS keys are regional. Use <strong>multi-Region keys<\/strong> or re-encrypt with a key in the DR region when copying snapshots.<\/li>\n<li><em>Backups were in the same account that was compromised and deleted.<\/em> Cross-account backup copies with Vault Lock.<\/li>\n<li><em>Traffic kept going to the failed region for 10 minutes.<\/em> Long DNS TTLs; lower them for failover records, or use Global Accelerator.<\/li>\n<\/ol>\n<h3 id=\"s-decision-tree\">Decision tree<\/h3>\n<pre class=\"diagram\"><code>Given RTO and RPO...\n  ├── Hours–day, lowest cost → Backup &amp; restore\n  ├── Data must be current, compute can start later (tens of min) → Pilot light\n  ├── Minutes, minimal environment always running → Warm standby\n  └── Near zero, global users → Multi-site active-active\n\nData replication tool...\n  ├── Relational, RPO ~1 s, fast promote → Aurora Global Database\n  ├── Relational, simpler → Cross-region read replica (manual promote)\n  ├── NoSQL, multi-writer → DynamoDB Global Tables\n  ├── Objects → S3 CRR (+ RTC for 15-min SLA)\n  ├── Everything, scheduled → AWS Backup cross-region/cross-account\n  └── Servers you can&#39;t change → Elastic Disaster Recovery\n<\/code><\/pre>\n<p><strong>Domains:<\/strong> 2 (DR strategies, RPO/RTO, failover — Task 2.2), 1 (backup protection and encryption keys), 4 (choosing the cheapest strategy that meets the objective).<\/p>\n","toc":[{"id":"the-four-strategies-from-cheapest-to-fastest","text":"The four strategies, from cheapest to fastest"},{"id":"building-each-strategy-with-aws-services","text":"Building each strategy with AWS services"},{"id":"pulsewires-decision-different-tiers-different-strategies","text":"PulseWire&#39;s decision: different tiers, different strategies"},{"id":"exam-scenarios-decide-before-reading-the-answer","text":"Exam scenarios: decide before reading the answer"},{"id":"failure-scenarios","text":"Failure scenarios"},{"id":"decision-tree","text":"Decision tree"}]},{"id":"ch14","ch":14,"title":"Chapter 14: From 100 users to the world (Scaling)","short":"From 100 users to the world","topic":"Scaling","d":3,"focus":false,"mins":4,"html":"<p>This chapter replays PulseWire’s growth as one continuous story so you can see the order in which things break. On the exam, “what should the architect do <em>first<\/em>?” usually means “fix the current bottleneck, cheapest effective way”.<\/p>\n<h3 id=\"s-stage-1-100-users\">Stage 1 — 100 users<\/h3>\n<pre class=\"diagram\"><code>User → single EC2 (app) → RDS single-AZ        S3 for images\n<\/code><\/pre>\n<ul>\n<li><strong>What breaks first:<\/strong> nothing yet. The risk is availability, not scale.<\/li>\n<li><strong>Do:<\/strong> keep it simple; separate the database into RDS and images into S3 from day one (cheap, prevents a painful migration later). <strong>Vertical scaling<\/strong> (a bigger instance) is fine at this size.<\/li>\n<\/ul>\n<h3 id=\"s-stage-2-10-000-users\">Stage 2 — 10,000 users<\/h3>\n<pre class=\"diagram\"><code>User → CloudFront → ALB → ASG (2–6 EC2, 2 AZs) → RDS Multi-AZ\n                       └→ S3 (static + media)       ElastiCache (sessions)\n<\/code><\/pre>\n<ul>\n<li><strong>What breaks first:<\/strong> the single app server’s CPU, then database reads.<\/li>\n<li><strong>Fixes, in order:<\/strong><ol>\n<li><strong>Horizontal scaling<\/strong>: stateless app (sessions → ElastiCache), ASG + ALB across 2 AZs, target tracking on CPU or requests per target.<\/li>\n<li><strong>CloudFront<\/strong> in front of static assets and images: offloads most requests instantly.<\/li>\n<li><strong>Multi-AZ RDS<\/strong> for availability (not for scale).<\/li>\n<\/ol>\n<\/li>\n<li><strong>Vertical vs horizontal:<\/strong> vertical is simple but has a ceiling and needs a restart; horizontal needs stateless design but is unlimited and adds fault tolerance. The exam prefers horizontal for web tiers, vertical for a database’s write capacity.<\/li>\n<\/ul>\n<h3 id=\"s-stage-3-1-million-users-20-breaking-news-spikes\">Stage 3 — 1 million users, 20× breaking-news spikes<\/h3>\n<pre class=\"diagram\"><code>User → Route 53 → CloudFront (+WAF) → ALB → ECS Fargate (3 AZs, auto scaling)\n                                    │         ├→ ElastiCache (hot articles, trending)\n                                    │         ├→ Aurora (writer + replicas) via RDS Proxy\n                                    │         └→ DynamoDB (comments, reactions, sessions)\n                                    └→ API Gateway → Lambda (partner API)\n         Publish → EventBridge → SQS/SNS → workers (scale on queue depth)\n<\/code><\/pre>\n<ul>\n<li><strong>What breaks first:<\/strong> database reads, then database connections, then synchronous work during spikes, then writes on hot items.<\/li>\n<li><strong>Fixes:<\/strong><ol>\n<li><strong>Caching layers<\/strong>: CloudFront (edge) → ElastiCache (app) → DAX (DynamoDB). Every cache hit is a database query you didn’t pay for.<\/li>\n<li><strong>Read replicas<\/strong> (Aurora up to 15, reader endpoint with replica auto scaling).<\/li>\n<li><strong>RDS Proxy<\/strong> for connection storms from containers/Lambda.<\/li>\n<li><strong>Queue-based load leveling<\/strong>: SQS absorbs the spike; workers scale on backlog per task. The API stays fast.<\/li>\n<li><strong>Move write-heavy, simple-access data to DynamoDB<\/strong> (on-demand capacity handles unpredictable spikes; shard hot keys).<\/li>\n<li><strong>Serverless where load is spiky<\/strong>: Lambda and API Gateway scale per request with zero idle cost.<\/li>\n<li><strong>Scheduled/predictive scaling<\/strong> before known events (election results at 08:00).<\/li>\n<\/ol>\n<\/li>\n<\/ul>\n<h3 id=\"s-stage-4-global-traffic\">Stage 4 — Global traffic<\/h3>\n<ul>\n<li><strong>What breaks first:<\/strong> latency for distant users, then the single-region blast radius, then data-residency rules.<\/li>\n<li><strong>Fixes:<\/strong> CloudFront everywhere; Route 53 latency + geolocation routing; regional stacks; Aurora Global Database (reads local, writes forwarded); DynamoDB Global Tables (local writes); S3 CRR; Global Accelerator for TCP/UDP feeds.<\/li>\n<\/ul>\n<h3 id=\"s-the-scaling-toolkit-by-layer\">The scaling toolkit by layer<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Layer<\/th>\n<th>Scale reads<\/th>\n<th>Scale writes<\/th>\n<th>Absorb spikes<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Edge<\/td>\n<td>CloudFront caching<\/td>\n<td>—<\/td>\n<td>Shield, WAF rate limits<\/td>\n<\/tr>\n<tr>\n<td>Compute<\/td>\n<td>ASG / ECS service auto scaling, Lambda concurrency<\/td>\n<td>Same<\/td>\n<td>Queue in front, predictive scaling, warm pools<\/td>\n<\/tr>\n<tr>\n<td>Relational DB<\/td>\n<td>Read replicas, ElastiCache, RDS Proxy<\/td>\n<td>Bigger instance, Aurora, buffer writes in SQS<\/td>\n<td>Aurora Serverless v2<\/td>\n<\/tr>\n<tr>\n<td>NoSQL<\/td>\n<td>DAX, GSIs<\/td>\n<td>Partition key design, on-demand capacity<\/td>\n<td>On-demand mode<\/td>\n<\/tr>\n<tr>\n<td>Async<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>SQS, Kinesis (shards / on-demand)<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3 id=\"s-scaling-metrics-that-matter-exam-favourites\">Scaling metrics that matter (exam favourites)<\/h3>\n<ul>\n<li>Web tier: <strong>ALB RequestCountPerTarget<\/strong> or CPU (target tracking).<\/li>\n<li>Worker tier: <strong>SQS backlog per instance<\/strong> (<code>ApproximateNumberOfMessagesVisible<\/code> ÷ instances), not CPU.<\/li>\n<li>Kinesis: <strong>IteratorAge<\/strong> rising = consumers falling behind.<\/li>\n<li>DynamoDB: <strong>ThrottledRequests<\/strong> = capacity or hot-partition problem.<\/li>\n<li>Lambda: <strong>Throttles<\/strong> and <strong>ConcurrentExecutions<\/strong> vs quota.<\/li>\n<\/ul>\n<h3 id=\"s-failure-scenarios\">Failure scenarios<\/h3>\n<ol>\n<li><em>Traffic spikes every weekday at 9:00; instances take 5 minutes to warm up; users see errors until 9:06.<\/em> Scheduled scaling at 8:50 (or predictive scaling), plus a pre-baked AMI.<\/li>\n<li><em>Orders arrive faster than the processing tier can handle during sales, and some are lost.<\/em> Put SQS between the web tier and processors; scale processors on queue depth.<\/li>\n<li><em>The database CPU is at 90% from repeated identical queries for the home page.<\/em> ElastiCache (lazy loading with TTL) before scaling the database.<\/li>\n<li><em>DynamoDB throttles despite plenty of total capacity.<\/em> Hot partition; redesign the partition key or shard writes.<\/li>\n<li><em>A read replica shows stale data for a just-posted comment.<\/em> Asynchronous replication lag — read-your-writes from the primary for that user, or accept eventual consistency.<\/li>\n<\/ol>\n<h3 id=\"s-decision-tree\">Decision tree<\/h3>\n<pre class=\"diagram\"><code>What&#39;s the bottleneck?\n  ├── App CPU / requests → Horizontal: stateless + ASG/ECS + ALB\n  ├── Static content / global latency → CloudFront\n  ├── DB reads → Cache (ElastiCache/DAX) → read replicas\n  ├── DB connections → RDS Proxy\n  ├── DB writes → Scale up / Aurora / SQS buffer / DynamoDB\n  ├── Spiky background work → SQS + workers scaled on backlog, or Lambda\n  ├── Predictable peaks → Scheduled / predictive scaling\n  └── Distant users / residency → Multi-region + Route 53\n<\/code><\/pre>\n<p><strong>Domains:<\/strong> 2 (horizontal vs vertical, loosely coupled scaling), 3 (elastic compute, caching, database performance).<\/p>\n","toc":[{"id":"stage-1-100-users","text":"Stage 1 — 100 users"},{"id":"stage-2-10-000-users","text":"Stage 2 — 10,000 users"},{"id":"stage-3-1-million-users-20-breaking-news-spikes","text":"Stage 3 — 1 million users, 20× breaking-news spikes"},{"id":"stage-4-global-traffic","text":"Stage 4 — Global traffic"},{"id":"the-scaling-toolkit-by-layer","text":"The scaling toolkit by layer"},{"id":"scaling-metrics-that-matter-exam-favourites","text":"Scaling metrics that matter (exam favourites)"},{"id":"failure-scenarios","text":"Failure scenarios"},{"id":"decision-tree","text":"Decision tree"}]},{"id":"ch15","ch":15,"title":"Chapter 15: The bill (Cost optimization)","short":"The bill","topic":"Cost optimization","d":4,"focus":true,"mins":8,"html":"<p>Two years in, the AWS bill is 10× what it was, while users grew 50×. Good, but the CFO asks for 30% off <strong>without breaking any requirement from the Prologue<\/strong>. That last clause is how the exam works too: the cheapest answer that fails a stated requirement (availability, RPO, latency) is wrong.<\/p>\n<blockquote class=\"voice\"><p><span class=\"who\">Meera<\/span> “Cut the waste. Don’t cut the reliability.”<\/p>\n<\/blockquote>\n<h3 id=\"s-step-1-see-where-the-money-goes\">Step 1: see where the money goes<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Tool<\/th>\n<th>What it answers<\/th>\n<th>Exam clue<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Cost Explorer<\/strong><\/td>\n<td>Where is spend going, trends, forecasts, RI/Savings Plan recommendations<\/td>\n<td>“visualize and analyze costs”, “forecast”<\/td>\n<\/tr>\n<tr>\n<td><strong>AWS Budgets<\/strong><\/td>\n<td>Alert (or act) when spend or usage crosses a threshold<\/td>\n<td>“notify when cost exceeds”, “budget alerts”<\/td>\n<\/tr>\n<tr>\n<td><strong>Cost and Usage Report (Data Exports)<\/strong><\/td>\n<td>Most granular line-item billing data, delivered to S3, queried with Athena/QuickSight<\/td>\n<td>“most detailed billing data”, “hourly line items”<\/td>\n<\/tr>\n<tr>\n<td><strong>Cost allocation tags<\/strong><\/td>\n<td>Spend per team/product/environment (<code>project=pulsewire<\/code>, <code>env=prod<\/code>)<\/td>\n<td>“chargeback”, “cost per department”<\/td>\n<\/tr>\n<tr>\n<td><strong>Organizations consolidated billing<\/strong><\/td>\n<td>One bill, shared volume discounts and Savings Plans across accounts<\/td>\n<td>“multiple accounts, single payment”<\/td>\n<\/tr>\n<tr>\n<td><strong>Cost Anomaly Detection<\/strong><\/td>\n<td>ML alerts on unusual spend spikes<\/td>\n<td>“detect unexpected cost increases”<\/td>\n<\/tr>\n<tr>\n<td><strong>Compute Optimizer<\/strong><\/td>\n<td>Right-sizing recommendations for EC2, ASG, EBS, Lambda, ECS on Fargate<\/td>\n<td>“right-size”, “over-provisioned instances”<\/td>\n<\/tr>\n<tr>\n<td><strong>Trusted Advisor<\/strong><\/td>\n<td>Checks for idle resources, underused instances, unattached EBS, plus security/quota checks<\/td>\n<td>“idle load balancers”, “best-practice checks”<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3 id=\"s-step-2-the-component-by-component-review\">Step 2: the component-by-component review<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Finding<\/th>\n<th>Action<\/th>\n<th>Requirement still met?<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>ECS Fargate (steady base load)<\/td>\n<td>Paying On-Demand 24/7 for a predictable baseline<\/td>\n<td><strong>Compute Savings Plan<\/strong> for the baseline (applies across EC2, Fargate, Lambda, any region)<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>Image/video workers<\/td>\n<td>Interruptible, retryable<\/td>\n<td><strong>Fargate Spot / EC2 Spot<\/strong> via SQS workers and Batch<\/td>\n<td>Yes — SQS retries interrupted jobs<\/td>\n<\/tr>\n<tr>\n<td>EC2 (legacy CMS)<\/td>\n<td>40% average CPU on an m5.2xlarge<\/td>\n<td>Right-size with Compute Optimizer; move to <strong>Graviton<\/strong> where supported<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>Staging/dev environments<\/td>\n<td>Running 168 h/week, used ~50<\/td>\n<td>Stop nights/weekends (Instance Scheduler), Aurora Serverless v2 for dev DBs<\/td>\n<td>Yes (non-prod)<\/td>\n<\/tr>\n<tr>\n<td>Aurora production<\/td>\n<td>Steady writer + replicas<\/td>\n<td><strong>Reserved Instances<\/strong> for RDS/Aurora (1- or 3-year); replica auto scaling for peaks<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>DynamoDB comments<\/td>\n<td>On-Demand, now steady and predictable<\/td>\n<td>Switch to <strong>provisioned + auto scaling<\/strong> (+ reserved capacity)<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>NAT gateways<\/td>\n<td>Terabytes of S3 and ECR traffic through NAT<\/td>\n<td><strong>Gateway endpoint<\/strong> for S3/DynamoDB; interface endpoints for ECR where volume justifies<\/td>\n<td>Yes, and more private<\/td>\n<\/tr>\n<tr>\n<td>Cross-AZ traffic<\/td>\n<td>Chatty services calling across AZs<\/td>\n<td>Keep chatty calls AZ-local where possible; accept cross-AZ for HA paths<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>Origin data transfer out<\/td>\n<td>Images served from the ALB/S3 directly to some clients<\/td>\n<td>Serve everything via <strong>CloudFront<\/strong> (better cache hit ratio, cheaper egress)<\/td>\n<td>Yes, faster<\/td>\n<\/tr>\n<tr>\n<td>S3 media<\/td>\n<td>All objects in Standard forever<\/td>\n<td><strong>Lifecycle rules<\/strong> (Ch 5) + Intelligent-Tiering for unpredictable buckets; abort incomplete multipart uploads<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>EBS<\/td>\n<td>gp2 volumes, unattached volumes, years of snapshots<\/td>\n<td>Migrate <strong>gp2 → gp3<\/strong>, delete unattached, snapshot archive tier<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>CloudWatch Logs<\/td>\n<td>Debug logs, retention “never expire”<\/td>\n<td>Set retention, export old logs to S3 + Glacier<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>Shield Advanced on every account<\/td>\n<td>Org-wide, one fee<\/td>\n<td>Keep: breaking-news DDoS risk justifies it<\/td>\n<td>Justified<\/td>\n<\/tr>\n<tr>\n<td>Active-active for the creator portal<\/td>\n<td>Proposed by an engineer<\/td>\n<td>Reject: pilot light meets its 4 h RTO (Ch 13)<\/td>\n<td>Avoided over-engineering<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3 id=\"s-ec2-compute-purchasing-options\">EC2/compute purchasing options<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>Discount vs On-Demand<\/th>\n<th>Commitment<\/th>\n<th>Flexibility<\/th>\n<th>Best for<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>On-Demand<\/strong><\/td>\n<td>None<\/td>\n<td>None<\/td>\n<td>Total<\/td>\n<td>Spiky, short-term, unknown workloads<\/td>\n<\/tr>\n<tr>\n<td><strong>Compute Savings Plan<\/strong><\/td>\n<td>Up to ~66%<\/td>\n<td>$/hour for 1 or 3 years<\/td>\n<td>Any instance family, size, region, OS; also Fargate and Lambda<\/td>\n<td>Steady baseline with changing technology<\/td>\n<\/tr>\n<tr>\n<td><strong>EC2 Instance Savings Plan<\/strong><\/td>\n<td>Up to ~72%<\/td>\n<td>$/hour, 1 or 3 years<\/td>\n<td>One instance family in one region (size/OS flexible)<\/td>\n<td>Stable family/region<\/td>\n<\/tr>\n<tr>\n<td><strong>Standard Reserved Instance<\/strong><\/td>\n<td>Up to ~72%<\/td>\n<td>1 or 3 years, specific attributes<\/td>\n<td>Can be sold on the RI Marketplace; can be zonal (capacity reservation)<\/td>\n<td>Steady, known workloads; also the only option for RDS/ElastiCache/Redshift/OpenSearch discounts<\/td>\n<\/tr>\n<tr>\n<td><strong>Convertible RI<\/strong><\/td>\n<td>Up to ~66%<\/td>\n<td>1 or 3 years<\/td>\n<td>Can exchange for other families/OS<\/td>\n<td>Steady but may change<\/td>\n<\/tr>\n<tr>\n<td><strong>Spot<\/strong><\/td>\n<td>Up to ~90%<\/td>\n<td>None; 2-minute interruption notice<\/td>\n<td>Interruptible<\/td>\n<td>Batch, CI, stateless workers, big data, containers — <strong>never<\/strong> a single-instance database<\/td>\n<\/tr>\n<tr>\n<td><strong>Dedicated Host<\/strong><\/td>\n<td>Varies<\/td>\n<td>On-Demand or reserved<\/td>\n<td>Whole physical server, visible sockets/cores<\/td>\n<td><strong>Bring-your-own-license<\/strong> (per-socket/per-core), compliance<\/td>\n<\/tr>\n<tr>\n<td><strong>Dedicated Instance<\/strong><\/td>\n<td>Varies<\/td>\n<td>—<\/td>\n<td>Hardware not shared with other customers<\/td>\n<td>Isolation requirements without host-level control<\/td>\n<\/tr>\n<tr>\n<td><strong>On-Demand Capacity Reservation<\/strong><\/td>\n<td>None by itself (combine with Savings Plans)<\/td>\n<td>None<\/td>\n<td>Reserves capacity in a specific AZ<\/td>\n<td>Guaranteed capacity for DR or events<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>Spot done right:<\/strong> run Spot inside an ASG or ECS capacity provider with a <strong>mixed instances policy<\/strong> (On-Demand base + Spot above it), diversify across many instance types and AZs, use the <strong>capacity-optimized<\/strong> allocation strategy, and make work checkpointed or idempote
